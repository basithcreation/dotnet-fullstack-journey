<style>
/* Layout: a study notebook. Chapter list on the left (a drawer on phones), one reading column on the right.

  --bad: #b8342d;

  --warn-soft: #fbf0d9;
  --type: #1f6fb2;

}

    --accent: #a594ff; --accent-ink: #11131d; --accent-soft: #252046; --highlight: #3a3418;
    --ok: #5fd39a; --ok-soft: #173326; --bad: #ff8a80; --bad-soft: #3a1d1c; --warn: #e8b85a; --warn-soft: #3a2e14;
    --type: #7fb8f0; --code-bg: #1d2031; --term-bg: #0b0d16; --term-fg: #e6e8f2; --term-dim: #8a90ac;
    --term-bad: #ff8a80; --term-ok: #7be0a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11131d; --sheet: #171a27; --ink: #e6e8f2; --muted: #9aa0bc; --line: #2a2e44;
  --accent: #a594ff; --accent-ink: #11131d; --accent-soft: #252046; --highlight: #3a3418;

<header class="topbar">
  <button class="btn menu-btn" id="menuBtn" aria-controls="toc" aria-expanded="false">Chapters</button>
  <a class="brand" href="#home">Flutter <span>→</span> .NET</a>
  <span class="day-chip" id="dayChip"></span>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Chapters"></nav>
  <main id="main"><div class="column" id="view"></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const CHAPTERS = /*__CHAPTERS__*/[];
const JOURNEY = /*__JOURNEY__*/{};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hashFor = (id) => "ch-" + id.replace(".", "-");
const hex7 = () => Array.from({ length: 7 }, () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");

/* ---------------- navigation ---------------- */
function renderToc(activeId) {
  const byPhase = groupByPhase();
  let html = '<a class="home-link" href="#home"' + (activeId ? "" : ' aria-current="page"') + ">Home: my progress</a>";
  for (const [phase, list] of byPhase) {
    html += "<h3>Phase " + phase + ": " + esc(list[0].phaseName) + "</h3>";
    for (const ch of list) {
      html += '<a href="#' + hashFor(ch.id) + '"' + (ch.id === activeId ? ' aria-current="page"' : "") +
        '><span class="num">' + ch.id + "</span><span>" + esc(ch.title) + "</span></a>";
    }
  }
  $("#toc").innerHTML = html;
}

function groupByPhase() {
  const map = new Map();
  for (const ch of CHAPTERS) {
    if (!map.has(ch.phase)) map.set(ch.phase, []);
    map.get(ch.phase).push(ch);
  }
  return map;
}

function route() {
  const h = location.hash.slice(1);
  const ch = h.startsWith("ch-") ? CHAPTERS.find((c) => hashFor(c.id) === h) : null;
  if (ch) renderChapter(ch); else renderHome();
  closeMenu();
  window.scrollTo(0, 0);
  try { localStorage.setItem("lastView", h); } catch (e) {}
}

function scoreClass(score, max) {
  const r = score / max;
  return r >= 0.7 ? "score-high" : r >= 0.5 ? "score-mid" : "score-low";
}

function quizChart(quizzes) {
  const W = 640, H = 240, left = 34, right = 10, top = 14, bottom = 58;
  const plotW = W - left - right, plotH = H - top - bottom;
  const slot = plotW / quizzes.length, barW = Math.min(36, slot * 0.6);
  const y = (v) => top + plotH - (v / 5) * plotH;
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Quiz scores by day">';
  for (let t = 0; t <= 5; t++) {
    svg += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (left - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">' + t + "</text>";
  }
  let prevDay = null;
  quizzes.forEach((q, i) => {
    const cx = left + slot * i + slot / 2;
    const color = q.score / q.max >= 0.7 ? "var(--ok)" : q.score / q.max >= 0.5 ? "var(--warn)" : "var(--bad)";
    svg += '<rect x="' + (cx - barW / 2) + '" y="' + y(q.score) + '" width="' + barW + '" height="' + (y(0) - y(q.score)) + '" rx="4" fill="' + color + '"><title>' + esc(q.name) + ": " + q.score + "/5</title></rect>" +
      '<text x="' + cx + '" y="' + (y(q.score) - 5) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono, monospace">' + q.score + "</text>";
    if (q.day !== prevDay) {
      svg += '<text x="' + cx + '" y="' + (H - bottom + 18) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">Day ' + q.day + "</text>";
      prevDay = q.day;
    }
    const short = q.name.replace(/ quiz$/i, "");
    svg += '<text x="' + cx + '" y="' + (H - bottom + 34) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Bricolage Grotesque, sans-serif">' + esc(short.length > 14 ? short.slice(0, 13) + "…" : short) + "</text>";
  });
  return svg + "</svg>";
}

const SECTION_KIND = { "🧸": "lkg", "💻": "real", "🎯": "dart", "🧪": "examples", "🐞": "errors", "🏢": "team", "📋": "summary", "📝": "quiz" };

function renderChapter(ch) {
  renderToc(ch.id);
  const view = $("#view");
  const body = window.marked ? marked.parse(ch.md.replace(/^# .+\n/, "")) : "<pre>" + esc(ch.md) + "</pre>";
  view.innerHTML = '<article class="chapter"><header class="chapter-head"><span class="eyebrow">Chapter ' + ch.id +
    " · Phase " + ch.phase + ": " + esc(ch.phaseName) + "</span><h1>" + esc(ch.title) + "</h1></header><div class=\"chapter-body\"></div></article>";
  const holder = $(".chapter-body", view);
  holder.innerHTML = body;

  // the "> Learned: ..." line right under the title
  const first = holder.firstElementChild;
  if (first && first.tagName === "BLOCKQUOTE") first.classList.add("meta");

  // wrap each h2 and what follows it in a <section>
  let current = null;
  for (const node of [...holder.childNodes]) {
    if (node.nodeType === 1 && node.tagName === "H2") {
      current = document.createElement("section");
      const kind = SECTION_KIND[[...node.textContent.trim()][0]];
      if (kind) current.className = kind;
      holder.insertBefore(current, node);
    }
    if (current) current.appendChild(node);
  }

  holder.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });

  holder.querySelectorAll("pre code").forEach((el) => {
    const lang = ((el.className.match(/language-(\w+)/) || [])[1] || "").toLowerCase();
    if (window.hljs && lang && hljs.getLanguage(lang)) hljs.highlightElement(el);
  });

  holder.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (/\.md(#.*)?$/.test(href)) {
      const name = href.split("/").pop().replace(/#.*$/, "");
      const target = CHAPTERS.find((c) => c.file.endsWith(name));
      if (target) a.setAttribute("href", "#" + hashFor(target.id));
    } else if (/^https?:/.test(href)) {
      a.target = "_blank";
      a.rel = "noopener";
    }
  });

  // 🎬 notes become playable animations
  let n = 0;
  holder.querySelectorAll("p").forEach((p) => {
    if (!p.textContent.trim().startsWith("🎬")) return;
    const make = (WIDGETS[ch.id] || [])[n++];
    const fig = document.createElement("figure");
    fig.className = "anim";
    fig.innerHTML = '<div class="anim-tag">🎬 ' + (make ? "Try it" : "Animation idea") + '</div><div class="anim-stage"></div>' +
      "<figcaption>" + p.innerHTML.replace(/^🎬\s*<strong>Animation idea:<\/strong>\s*/, "") + "</figcaption>";
    p.replaceWith(fig);
    const stage = $(".anim-stage", fig);
    if (make) make(stage); else stage.remove();
  });

  const i = CHAPTERS.indexOf(ch);
  const prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  const pager = document.createElement("nav");
  pager.className = "pager";
  pager.innerHTML =
    (prev ? '<a href="#' + hashFor(prev.id) + '"><small>← Chapter ' + prev.id + "</small><b>" + esc(prev.title) + "</b></a>" : "<span></span>") +
    (next ? '<a class="next" href="#' + hashFor(next.id) + '"><small>Chapter ' + next.id + " →</small><b>" + esc(next.title) + "</b></a>" : "");
  $(".chapter", view).appendChild(pager);
}

function lapCounter(stage) {
  let start, op, end, inc, i, phase, laps, checks, out, done;
  stage.innerHTML =
    '<div class="control"><label for="lc-s">Start</label><input id="lc-s" type="range" min="0" max="5" value="1"><output></output></div>' +
    '<div class="control"><label for="lc-e">End</label><input id="lc-e" type="range" min="1" max="8" value="5"><output></output>' +
    '<label class="check"><input id="lc-o" type="checkbox" checked> use <b>&lt;=</b> (off: <b>&lt;</b>)</label></div>' +
    '<div class="control"><label for="lc-k">Step</label><input id="lc-k" type="range" min="1" max="3" value="1"><output></output></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next step</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const s = $("#lc-s", stage), e = $("#lc-e", stage), o = $("#lc-o", stage), k = $("#lc-k", stage);
  const code = $(".codebox", stage), track = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  const pass = () => (op === "<=" ? i <= end : i < end);
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    code.innerHTML =
      "for (" + L("init", "int i = " + start) + "; " + L("check", "i " + op.replace("<", "&lt;") + " " + end) + "; " +
      L("step", inc === 1 ? "i++" : "i += " + inc) + ")\n{\n" + L("body", '    Console.WriteLine($"Lap {i}");') + "\n}";
  }
  function drawTrack() {
    track.innerHTML = "<div><small>Laps</small><span>" + ("🏃".repeat(laps) || "<small>none yet</small>") + "</span></div>" +
      "<div><small>i</small><span><small>" + (phase === "init" ? "–" : i) + "</small></span></div>" +
      "<div><small>Checks</small><span><small>" + checks + "</small></span></div>";
  }
  function reset() {
    start = +s.value; end = +e.value; inc = +k.value; op = o.checked ? "<=" : "<";
    s.nextElementSibling.textContent = start; e.nextElementSibling.textContent = end; k.nextElementSibling.textContent = inc;
    phase = "init"; laps = 0; checks = 0; out = []; done = false;
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode(); drawTrack();
    say("", "Press Next step. Watch the order: initializer, condition, body, iterator.");
  }
  function step() {
    if (done) return;
    if (phase === "init") {
      i = start; phase = "check"; drawCode("init");
      say("", "① Initializer: i = " + i + ". This runs only once.");
    } else if (phase === "check") {
      checks++; drawCode("check");
      if (pass()) { phase = "body"; say("good", "② Condition: " + i + " " + op + " " + end + " is true, so the body runs."); }
      else {
        done = true;
        say("warn", "② Condition: " + i + " " + op + " " + end + " is false, so the loop exits. " + laps + " lap" + (laps === 1 ? "" : "s") + ", " + checks + " checks: always one check more than laps." +
          (op === "<" ? " Tick <= to include " + end + " (off-by-one)." : ""));
      }
    } else if (phase === "body") {
      laps++; out.push("Lap " + i); phase = "step"; drawCode("body");
      say("good", "Body: prints Lap " + i + ". The body uses i BEFORE the iterator changes it.");
    } else {
      i += inc; phase = "check"; drawCode("step");
      say("", "③ Iterator: i is now " + i + ". Back to the condition.");
    }
    drawTrack();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 100) step(); }
    if (a === "reset") reset();
  });
  [s, e, k].forEach((x) => x.addEventListener("input", reset));
  o.addEventListener("change", reset);
  reset();
}

function piggyBank(stage) {
  let inside, plusOne, i, total, out, done, coins;
  stage.innerHTML =
    '<div class="control"><label class="check"><input id="pb-in" type="checkbox"> move <b>int total = 0;</b> inside the loop</label>' +
    '<label class="check"><input id="pb-one" type="checkbox"> <b>total += 1</b> instead of <b>+= i</b></label></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next iteration</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const inBox = $("#pb-in", stage), oneBox = $("#pb-one", stage);
  const code = $(".codebox", stage), bank = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    const add = plusOne ? "total += 1;" : "total += i;";
    code.innerHTML = [
      inside ? null : L("decl", "int total = 0;"),
      "for (int i = 1; i &lt;= 4; i++)",
      "{",
      inside ? L("decl", "    int total = 0;") : null,
      L("body", "    " + add),
      "}",
      L("print", 'Console.WriteLine($"Total: {total}");'),
    ].filter((x) => x !== null).join("\n");
  }
  function drawBank() {
    bank.innerHTML = "<div><small>Coins in</small><span>" + (coins.map((c) => "🪙" + c).join(" ") || "<small>empty</small>") + "</span></div>" +
      "<div><small>Bank</small><span>🐷 <small>total = " + total + "</small></span></div>";
  }
  function reset() {
    inside = inBox.checked; plusOne = oneBox.checked;
    i = 1; total = 0; out = []; done = false; coins = [];
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode("decl"); drawBank();
    say(inside ? "warn" : "", inside
      ? "The piggy bank is now born INSIDE the loop. (Real C# won't even build this. Step through to see why.)"
      : "The piggy bank (accumulator) is ready BEFORE the loop. Press Next iteration.");
  }
  function step() {
    if (done) return;
    if (i <= 4) {
      if (inside) { total = 0; coins = []; }
      const coin = plusOne ? 1 : i;
      coins.push(coin); total += coin;
      drawCode("body");
      say(inside ? "warn" : "good", inside
        ? "i = " + i + ": a NEW empty piggy bank, then +" + coin + ", so total = " + total + ". It resets every iteration and can never grow."
        : "i = " + i + ": old total " + (total - coin) + " + " + coin + " = " + total + "." + (plusOne ? " Adding 1 only counts the iterations." : ""));
      i++;
    } else {
      done = true; drawCode("print");
      if (inside) {
        term.innerHTML = '<span class="bad">error CS0103: The name \'total\' does not exist in the current context</span>';
        say("bad", "total died at the } of the loop, so the print line can't see it. Two reasons, one rule: declare the accumulator BEFORE the loop.");
      } else {
        out.push("Total: " + total);
        term.textContent = out.join("\n");
        say(plusOne ? "warn" : "good", plusOne
          ? "Total: 4. With += 1 the bank counted the laps instead of summing 1 + 2 + 3 + 4. Use += i."
          : "Total: 10. Declared before, updated inside, printed after.");
      }
    }
    drawBank();
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 20) step(); }
    if (a === "reset") reset();
  });
  inBox.addEventListener("change", reset);
  oneBox.addEventListener("change", reset);
  reset();
}

function sdkPipeline(stage) {
  const steps = [
    { zone: 0, text: "You write C# in Program.cs. Right now it's only text." },
    { zone: 1, text: "dotnet build: the SDK's compiler turns your code into an app file (.dll). Only developers need the SDK." },
    { zone: 2, text: "The user runs the app. The CLR (runtime) is the engine that makes it run. Users only need the runtime." },
  ];
  let i = 0;
  stage.innerHTML =
    '<div class="zones three">' +
    '<div class="zone"><h5>You<small>developer</small></h5><div class="item">Program.cs</div></div>' +
    '<div class="zone"><h5>SDK<small>toolbox</small></h5><div class="item">dotnet build</div><div class="item">→ app.dll</div></div>' +
    '<div class="zone"><h5>CLR<small>engine</small></h5><div class="item">runs app.dll</div><div class="item">for the user</div></div>' +
    '</div><div class="verdict"></div><div class="btn-row"><button class="btn primary">Next step</button></div>';
  const zones = stage.querySelectorAll(".zone"), verdict = $(".verdict", stage), btn = $(".btn", stage);
  const show = () => {
    zones.forEach((z, k) => z.classList.toggle("active", k === steps[i].zone));
    verdict.textContent = "Step " + (i + 1) + " of 3: " + steps[i].text;
    btn.textContent = i === steps.length - 1 ? "Start again" : "Next step";
  };
  btn.addEventListener("click", () => { i = (i + 1) % steps.length; show(); });
  show();
}

function cookieDivision(stage) {
  stage.innerHTML =
    '<div class="control"><label for="ck-c">Cookies</label><input id="ck-c" type="range" min="0" max="20" value="10"><output></output></div>' +
    '<div class="control"><label for="ck-k">Kids</label><input id="ck-k" type="range" min="1" max="6" value="3"><output></output></div>' +
    '<div class="cookies"></div><div class="term"></div>';
  const c = $("#ck-c", stage), k = $("#ck-k", stage), box = $(".cookies", stage), term = $(".term", stage);
  const draw = () => {
    const cookies = +c.value, kids = +k.value, each = Math.floor(cookies / kids), left = cookies % kids;
    c.nextElementSibling.textContent = cookies;
    k.nextElementSibling.textContent = kids;
    let html = "";
    for (let i = 1; i <= kids; i++) html += "<div><small>Kid " + i + "</small><span>" + ("🍪".repeat(each) || "<small>none</small>") + "</span></div>";
    html += "<div><small>Plate</small><span>" + ("🍪".repeat(left) || "<small>empty</small>") + "</span></div>";
    box.innerHTML = html;
    const dart = cookies / kids;
    term.innerHTML =
      "int each = " + cookies + " / " + kids + ";   <span class=\"dim\">// " + each + "  (C# throws away the decimal part)</span>\n" +
      "int left = " + cookies + " % " + kids + ";   <span class=\"dim\">// " + left + "  (the remainder)</span>\n" +
      "<span class=\"dim\">// Dart: " + cookies + " / " + kids + " = " + (Number.isInteger(dart) ? dart + ".0" : dart) + "</span>";
  };
  c.addEventListener("input", draw);
  k.addEventListener("input", draw);
  draw();
}

function shapeSorter(stage) {
  const values = [
    { code: "3", type: "int" }, { code: "2.5", type: "double" }, { code: "1.350m", type: "decimal" },
    { code: "'B'", type: "char" }, { code: '"Hi"', type: "string" }, { code: "true", type: "bool" },
  ];
  const boxes = ["int", "double", "decimal", "bool", "char", "string"];
  const cast = (from, to) => "error CS0266: Cannot implicitly convert type '" + from + "' to '" + to + "'. An explicit conversion exists (are you missing a cast?)";
  const nope = (from, to) => "error CS0029: Cannot implicitly convert type '" + from + "' to '" + to + "'";
  function judge(v, box) {
    if (v.type === box) return ["good", "Fits! A " + box + " box holds exactly this."];
    const t = v.type;
    if (t === "int" && (box === "double" || box === "decimal")) return ["good", "Fits automatically: int → " + box + " is a safe pour (implicit conversion), nothing is lost."];
    if (t === "int" && box === "char") return ["bad", cast("int", "char")];
    if (t === "double" && box === "decimal") return ["bad", "error CS0664: Literal of type double cannot be implicitly converted to type 'decimal'; use an 'M' suffix. Write 2.5m."];
    if (t === "double" && (box === "int" || box === "char")) return ["bad", cast("double", box) + " The decimal part would be lost, so C# wants you to decide."];
    if (t === "decimal" && (box === "int" || box === "double" || box === "char")) return ["bad", cast("decimal", box)];
    if (t === "char" && (box === "int" || box === "double" || box === "decimal")) return ["warn", "Surprise: it compiles, but the box gets 66, the character's number code. Real code almost never wants this."];
    return ["bad", nope(t, box)];
  }
  let picked = values[0];
  stage.innerHTML =
    '<div class="control">1. Pick a value:</div><div class="pick" data-p="v">' +
    values.map((v, i) => '<button class="btn" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(v.code) + "</button>").join("") + "</div>" +
    '<div class="control">2. Drop it into a box:</div><div class="pick" data-p="b">' +
    boxes.map((b) => '<button class="btn" data-b="' + b + '">' + b + "</button>").join("") + "</div>" +
    '<div class="codebox"></div><div class="verdict">Pick a value, then a box.</div>';
  const verdict = $(".verdict", stage), code = $(".codebox", stage);
  const vRow = $('[data-p="v"]', stage), bRow = $('[data-p="b"]', stage);
  const showCode = (box) => { code.textContent = (box || "____") + " x = " + picked.code + ";"; };
  vRow.addEventListener("click", (e) => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    picked = values[+i];
    vRow.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b === e.target)));
    showCode();
    verdict.className = "verdict";
    verdict.textContent = "Now pick a box for " + picked.code + ".";
  });
  bRow.addEventListener("click", (e) => {
    const box = e.target.dataset.b;
    if (!box) return;
    const [kind, msg] = judge(picked, box);
    showCode(box);
    verdict.className = "verdict " + kind;
    verdict.textContent = (kind === "good" ? "✅ " : kind === "warn" ? "⚠️ " : "❌ ") + msg;
    if (kind === "bad") { verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake"); }
  });
  showCode();
}

function twoMachines(stage) {

    '<label class="check"><input type="checkbox" data-t="discard" checked> has _ arm</label>' +

  const lightCases = [["red"], ["yellow"], ["green"], ["flashing", "off"]];
  const lightOut = ["Stop", "Slow down", "Go", "Drive carefully"];
  function drawStatement(hit) {
    let lines = ["switch (light)", "{"];
    lightCases.forEach((vals, i) => {
      const cls = hit === i ? "hit" : hit !== undefined ? "miss" : "";
      vals.forEach((v) => lines.push('<span class="' + cls + '">    case "' + v + '":</span>'));
      lines.push('<span class="' + cls + '">        Console.WriteLine("' + lightOut[i] + '"); break;</span>');
    });

      const cls = hit === -1 ? "hit" : hit !== undefined ? "miss" : "";
      lines.push('<span class="' + cls + '">    default:</span>', '<span class="' + cls + '">        Console.WriteLine("Unknown light"); break;</span>');
    }
    lines.push("}");
    sCode.innerHTML = lines.join("\n");
  }
  function arms() {
    return [
      { pats: ["A", "B"], out: "Great job!" },
      { pats: typo ? ["B", "D"] : ["C", "D"], out: "You passed." },
      { pats: ["F"], out: "Try again." },
    ];
  }
  function drawExpression(hit) {
    const list = arms();
    let lines = ["string comment = grade switch", "{"];
    list.forEach((a, i) => {
      const cls = hit === i ? "hit" : hit !== undefined ? "miss" : "";
      lines.push('<span class="' + cls + '">    ' + a.pats.map((p) => "'" + p + "'").join(" or ") + ' => "' + a.out + '",</span>');
    });
    if (hasDiscard) {

    lines.push("};");

    else if (hasDiscard) {
      drawExpression(-1);
      eOut.innerHTML = 'comment = "Invalid"' + (typo && g === "C" ? '\n<span class="bad">⚠ A C student sees "Invalid". The _ arm hid the missing \'C\' case. _ is a safety net, not a fix.</span>' : "");
    } else {
      drawExpression(null);
      eOut.innerHTML = '<span class="bad">Unhandled exception. System.Runtime.CompilerServices.SwitchExpressionException:\nNon-exhaustive switch expression failed to match its input.\nUnmatched value was ' + g + ".</span>";

    }
  });
  stage.addEventListener("change", (e) => {

    if (t === "default") { hasDefault = e.target.checked; drawStatement(); sOut.innerHTML = '<span class="dim">Press a button.</span>'; }

    }
  });
  drawStatement();
  drawExpression();
}

function guessGame(stage) {
  let inside = false, secret, attempts, low, high, done, log;
  const pickSecret = () => 1 + Math.floor(Math.random() * 100);
  stage.innerHTML =
    '<div class="control">The line <code>secretNumber = Random.Shared.Next(1, 101);</code> goes:</div>' +
    '<div class="pick"><button class="btn" data-v="above" aria-pressed="true">above the loop (runs once)</button><button class="btn" data-v="inside" aria-pressed="false">inside the loop (every guess)</button></div>' +
    '<div class="control"><label for="gg-in">Your guess:</label><input id="gg-in" type="text" value="50" autocomplete="off">' +
    '<div class="btn-row"><button class="btn primary" data-a="guess">Guess</button><button class="btn" data-a="mid">Middle guess</button><button class="btn" data-a="new">New game</button></div></div>' +
    '<div class="term" style="max-height: 16em; overflow-y: auto"></div><div class="verdict"></div>';
  const term = $(".term", stage), verdict = $(".verdict", stage), inp = $("#gg-in", stage);
  function start() {
    secret = pickSecret(); attempts = 0; low = 1; high = 100; done = false;
    log = ["I'm thinking of a number between 1 and 100."];
    verdict.className = "verdict"; verdict.textContent = "";
    draw();
  }
  function draw() { term.innerHTML = log.join("\n"); term.scrollTop = term.scrollHeight; }
  function guess() {
    if (done) return;
    const s = inp.value.trim();
    log.push("Your guess: " + esc(s));
    if (!/^-?\d+$/.test(s)) {
      log.push('<span class="bad">That\'s not a number. Try again.</span>');
      draw(); return;
    }
    const g = +s;
    attempts++;
    if (inside) {
      const old = secret;
      secret = pickSecret();
      if (secret !== old) log.push('<span class="dim">(the loop ran the Random line again: the secret quietly changed from ' + old + " to " + secret + ")</span>");
    }
    if (g > secret) { log.push("Too high!"); high = Math.min(high, g - 1); }
    else if (g < secret) { log.push("Too low!"); low = Math.max(low, g + 1); }
    else {
      done = true;
      log.push('<span class="good">' + (attempts === 1 ? "🎯 First try! Amazing!" : "🎉 Correct! You got it in " + attempts + " attempts.") + "</span>");
      verdict.className = inside ? "verdict warn" : "verdict good";
      verdict.textContent = inside ? "You won, but only by luck: the secret kept changing. Move the Random line above the loop." : "✅ The secret was picked once and stayed " + secret + " for the whole game.";
    }
    if (!done && low > high) {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ The clues contradict each other (it must be above " + (low - 1) + " and below " + (high + 1) + "). The secret is being overwritten on every guess.";
      verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake");
    }
    draw();
    inp.select();
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.v) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      inside = btn.dataset.v === "inside";
      start();
    }
    if (btn.dataset.a === "guess") guess();
    if (btn.dataset.a === "mid") { inp.value = String(Math.floor((Math.max(low, 1) + Math.min(Math.max(high, low), 100)) / 2)); guess(); }
    if (btn.dataset.a === "new") start();
  });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") guess(); });
  start();
}

function guardCorridor(stage) {
  let secret, attempts, done, log, checkExit = true;
  stage.innerHTML =
    '<div class="control">After the loop:</div>' +
    '<div class="pick"><button class="btn" data-v="check" aria-pressed="true">check the exit reason first</button><button class="btn" data-v="nocheck" aria-pressed="false">always print Correct!</button></div>' +
    '<div class="cookies"></div>' +
    '<div class="control"><label for="gc-in">Your guess:</label><input id="gc-in" type="text" value="abc" autocomplete="off">' +
    '<div class="btn-row"><button class="btn primary" data-a="guess">Enter</button><button class="btn" data-a="new">New game</button></div></div>' +
    '<div class="term" style="max-height: 14em; overflow-y: auto"></div><div class="verdict"></div>';
  const guards = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage), inp = $("#gc-in", stage);
  const GUARDS = [
    ["Guard 0", 'input == "q"', "break 🚪"],
    ["Guard 1", "!int.TryParse", "continue"],
    ["Guard 2", "< 1 || > 100", "continue"],
    ["Inside", "attempts++", "high / low"],
  ];
  function drawGuards(hit, kind) {
    guards.innerHTML = GUARDS.map((g, n) => {
      const on = n === hit;
      const style = on ? (kind === "pass" ? "color:var(--ok)" : kind === "exit" ? "color:var(--bad)" : "color:var(--warn)") : "opacity:.6";
      return '<div style="' + style + '"><small>' + g[0] + "</small><span><code>" + esc(g[1]) + "</code><br><small>" + (on ? (kind === "pass" ? "✅ passed every guard" : "🛑 " + g[2]) : g[2]) + "</small></span></div>";
    }).join("");
  }
  function draw() { term.innerHTML = log.join("\n"); term.scrollTop = term.scrollHeight; }
  function start() {
    secret = 1 + Math.floor(Math.random() * 100); attempts = 0; done = false;
    log = ["I'm thinking of a number between 1 and 100."];
    drawGuards(-1); draw();
    verdict.className = "verdict"; verdict.textContent = "Try abc, 500, a few numbers, then q.";
  }
  function afterLoop(won) {
    done = true;
    if (won || !checkExit) {
      log.push('<span class="' + (won ? "good" : "bad") + '">' + (attempts === 1 ? "🎯 First try! Amazing!" : "🎉 Correct! You got it in " + attempts + " attempts.") + "</span>");
    }
    if (won) {
      verdict.className = "verdict good";
      verdict.textContent = "Exit reason: won. guessNumber == secretNumber is true, so Correct! is right.";
    } else if (checkExit) {
      verdict.className = "verdict good";
      verdict.textContent = "Exit reason: quit (break). guessNumber == secretNumber is false, so the if after the loop skips Correct!.";
    } else {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ The player quit, but the code after the loop doesn't know why the loop ended, so it says Correct! anyway. Check the exit reason first.";
      verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake");
    }
  }
  function guess() {
    if (done) return;
    const s = inp.value.trim();
    log.push("Your guess: " + esc(s));
    if (s === "q") {
      log.push("The number was " + secret + ".");
      drawGuards(0, "exit"); afterLoop(false);
    } else if (!/^-?\d+$/.test(s)) {
      log.push('<span class="bad">That\'s not a number. Try again.</span>');
      drawGuards(1, "skip");
      verdict.className = "verdict warn";
      verdict.textContent = (s === "Q" ? '"Q" is not "q" (case-sensitive), and it\'s not a number. ' : "") + "Guard 1 sends it back with continue. attempts stays " + attempts + ".";
    } else if (+s < 1 || +s > 100) {
      log.push('<span class="bad">Please guess between 1 and 100.</span>');
      drawGuards(2, "skip");
      verdict.className = "verdict warn";
      verdict.textContent = "Guard 2 catches it before attempts++, so it isn't counted. attempts stays " + attempts + ".";
    } else {
      attempts++;
      drawGuards(3, "pass");
      const g = +s;
      if (g > secret) log.push("Too high!");
      else if (g < secret) log.push("Too low!");
      if (g === secret) afterLoop(true);
      else { verdict.className = "verdict"; verdict.textContent = "Passed every guard: attempts is now " + attempts + "."; }
    }
    draw();
    inp.select();
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.v) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));

    if (btn.dataset.a === "new") start();
  });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") guess(); });
  start();
}

    '<div class="term"></div><div class="verdict"></div>';

  const W = [2.5, 12, 0.8, 15.5, 7];

    for (let i = 0; i < calls; i++) html += '<span class="' + (i === call ? "hit" : "") + '">PrintLabel("' + CITIES[i] + '");</span>\n';
    html += "\nvoid PrintLabel(string city)\n{\n";
    for (let j = 0; j < lines; j++) html += '<span class="' + (call >= 0 && j === line ? "hit" : "") + '">    ' + BODY[j] + "</span>\n";
    code.innerHTML = html + "}";
  }
  function setup() {
    clearInterval(timer);
    c.nextElementSibling.textContent = c.value; l.nextElementSibling.textContent = l.value;
    drawCode(-1, -1); term.textContent = "";
    verdict.className = "verdict"; verdict.textContent = "Predict first: how many lines will be printed?";
  }
  function run() {
    setup();
    const calls = +c.value, lines = +l.value;
    let call = 0, line = 0, out = [];
    timer = setInterval(() => {
      drawCode(call, line);
      out.push(OUT[line](CITIES[call]));
      term.textContent = out.join("\n");
      line++;
      if (line === lines) { line = 0; call++; }
      if (call === calls) {
        clearInterval(timer);
        setTimeout(() => drawCode(-1, -1), 400);
        verdict.className = "verdict good";
        verdict.textContent = calls + " calls × " + lines + " lines = " + calls * lines + " lines. Every call runs the WHOLE method body.";
      }
    }, 380);
  }
  c.addEventListener("input", setup); l.addEventListener("input", setup);
  stage.addEventListener("click", (e) => { const btn = e.target.closest("button"); if (btn && btn.dataset.a === "run") run(); });
  setup();
}

function argumentFlow(stage) {

  stage.innerHTML =
    '<div class="control">What do you write?</div>' +

    '<div class="codebox"></div><div class="term"></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function draw() {
    const swap = pick === "swap", inner = pick === "method" ? ["PrintReceipt", "PrintReceipt"] : ["city", "cost"];
    code.innerHTML =
      '<span class="hit">PrintReceipt(' + (swap ? '2, "Salmiya"' : '"Salmiya", 2') + ");</span>   <span class=\"dim\">// arguments</span>\n" +
      (swap ? '             ✗        ✗' : "                ↓       ↓") + "\n" +
      'void PrintReceipt(string <span class="hit">city</span>, double <span class="hit">cost</span>)   <span class="dim">// parameters</span>\n{\n' +
      '    Console.WriteLine($"City: {' + inner[0] + '}");\n' +
      '    Console.WriteLine($"Shipping: {' + inner[1] + '} KD");\n}';
    verdict.classList.remove("shake");
    if (pick === "params") {
      term.innerHTML = '<span class="good">City: Salmiya\nShipping: 2 KD</span>';
      verdict.className = "verdict good";
      verdict.textContent = '"Salmiya" fills city, 2 fills cost. Inside the method you use the PARAMETER names.';
    } else if (pick === "method") {
      term.innerHTML = '<span class="bad">City: System.Action`2[System.String,System.Double]\nShipping: System.Action`2[System.String,System.Double] KD</span>';
      verdict.className = "verdict bad";
      verdict.textContent = "That's the method's NAME, not a value. C# prints \"this is a method\". Use city and cost.";
      void verdict.offsetWidth; verdict.classList.add("shake");
    } else {
      term.innerHTML = '<span class="bad">error CS1503: Argument 1: cannot convert from \'int\' to \'string\'</span>';
      verdict.className = "verdict bad";
      verdict.textContent = "Arguments go in the SAME order as the parameters: first the string, then the double.";
      void verdict.offsetWidth; verdict.classList.add("shake");
    }
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn || !btn.dataset.k) return;

function weightGate(stage) {
  let op = ">";
  stage.innerHTML =
    '<div class="control"><label for="wg-w">Parcel weight</label><input id="wg-w" type="range" min="0" max="20" step="0.5" value="12"><output></output></div>' +
    '<div class="control">Rule:</div><div class="pick"><button class="btn" data-op=">" aria-pressed="true">weight &gt; 10</button><button class="btn" data-op=">=" aria-pressed="false">weight &gt;= 10</button></div>' +
    '<div class="codebox"></div><div class="term"></div><div class="verdict"></div>';
  const w = $("#wg-w", stage), code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function draw() {
    const kg = +w.value, heavy = op === ">" ? kg > 10 : kg >= 10;
    w.nextElementSibling.textContent = kg + " kg";
    code.innerHTML =
      "bool IsHeavy(double weight)\n{\n" +
      '    <span class="hit">if (' + kg + " " + esc(op) + " 10)</span>   <span class=\"dim\">// " + (heavy ? "true" : "false") + "</span>\n    {\n" +

    verdict.className = "verdict" + (kg === 10 ? " warn" : "");
    verdict.textContent = kg === 10
      ? "Boundary value! 10 " + op + " 10 is " + heavy + ". Flip the rule and watch the answer change."

  w.addEventListener("input", draw);
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");

function elseTrap(stage) {
  let broken = false;
  stage.innerHTML =
    '<div class="control"><label for="et-w">Parcel weight</label><input id="et-w" type="range" min="1" max="50" step="0.5" value="4.5"><output></output></div>' +
    '<div class="pick"><button class="btn" data-b="0" aria-pressed="true">else { ... }</button><button class="btn" data-b="1" aria-pressed="false">else IsHeavy(...); { ... }</button></div>' +
    '<div class="codebox"></div><div class="term"></div><div class="verdict"></div>';
  const w = $("#et-w", stage), code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function draw() {
    const kg = +w.value, heavy = kg > 10;
    w.nextElementSibling.textContent = kg + " kg";
    const vanRuns = heavy, bikeRuns = broken ? true : !heavy;
    code.innerHTML =
      "if (IsHeavy(" + kg + "))   <span class=\"dim\">// " + heavy + "</span>\n{\n" +
      '    <span class="' + (vanRuns ? "hit" : "miss") + '">Console.WriteLine("' + kg + ' kg: van");</span>\n}\n' +
      (broken ? 'else IsHeavy(' + kg + ');   <span class="dim">// ; ends the else here</span>\n' : "else\n") +
      "{\n" + '    <span class="' + (bikeRuns ? "hit" : "miss") + '">Console.WriteLine("' + kg + ' kg: bike");</span>\n}';
    const lines = [];
    if (vanRuns) lines.push(kg + " kg: van");
    if (bikeRuns) lines.push(kg + " kg: bike");
    const wrong = broken && heavy;
    term.innerHTML = '<span class="' + (wrong ? "bad" : "good") + '">' + lines.join("\n") + "</span>";
    verdict.classList.remove("shake");
    if (!broken) {
      verdict.className = "verdict good";
      verdict.textContent = "Exactly one block runs: van if true, bike if false.";
    } else if (!heavy) {
      verdict.className = "verdict warn";
      verdict.textContent = "Looks right… by accident. Slide the weight above 10 kg.";
    } else {
      verdict.className = "verdict bad";
      verdict.textContent = "The { } block is standalone and ALWAYS runs. else takes no condition and no ;";
      void verdict.offsetWidth; verdict.classList.add("shake");
    }
  }
  w.addEventListener("input", draw);
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn || !btn.dataset.b) return;
    stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
    broken = btn.dataset.b === "1"; draw();
  });
  draw();
}

function photocopyRef(stage) {
  let useRef = false;
  stage.innerHTML =
    '<div class="pick"><button class="btn" data-r="0" aria-pressed="true">photocopy (no ref)</button><button class="btn" data-r="1" aria-pressed="false">original (ref)</button></div>' +
    '<div class="codebox"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">Call AddBonus</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const r = () => (useRef ? '<span class="hit">ref </span>' : "");
  function setup() {
    code.innerHTML =
      "void AddBonus(" + r() + "int points)\n{\n    points = points + 10;\n}\n\n" +
      "int myPoints = 5;\nAddBonus(" + r() + "myPoints);\n" +
      'Console.WriteLine($"Outside: {myPoints}");';
    term.textContent = "";
    verdict.className = "verdict";
    verdict.textContent = "Predict first: what does Outside print?";
  }
  function run() {
    setup();
    term.innerHTML = '<span class="dim">' + (useRef ? "→ the ORIGINAL myPoints goes in\n" : "→ a COPY of 5 goes in\n") +
      (useRef ? "→ myPoints becomes 15" : "→ the copy becomes 15, then is thrown away") + "</span>";
    setTimeout(() => {
      term.innerHTML += '\n<span class="good">Outside: ' + (useRef ? 15 : 5) + "</span>";
      verdict.className = "verdict good";
      verdict.textContent = useRef
        ? "ref (in BOTH places) passes by reference: the method changed the caller's variable."

function outBox(stage) {
  let forget = false;
  stage.innerHTML =
    '<div class="control"><label for="ob-w">Weight</label><input id="ob-w" type="range" min="-5" max="20" step="0.5" value="4"><output></output></div>' +
    '<div class="control"><label><input id="ob-f" type="checkbox"> forget <code>fee = 0;</code> on the bad path</label></div>' +
    '<div class="codebox"></div><div class="term"></div><div class="verdict"></div>';
  const w = $("#ob-w", stage), f = $("#ob-f", stage), code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function draw() {
    const kg = +w.value, bad = kg <= 0;
    forget = f.checked;
    w.nextElementSibling.textContent = kg + " kg";
    const cls = (onBad) => (bad === onBad ? "hit" : "miss");
    code.innerHTML =
      "bool TryGetFee(double weight, out double fee)\n{\n" +
      "    if (" + kg + " &lt;= 0)   <span class=\"dim\">// " + bad + "</span>\n    {\n" +
      (forget ? '        <span class="dim">// fee = 0;   ← forgotten</span>\n' : '        <span class="' + cls(true) + '">fee = 0;</span>\n') +
      '        <span class="' + cls(true) + '">return false;</span>\n    }\n' +
      '    <span class="' + cls(false) + '">fee = weight * 0.5;</span>\n' +
      '    <span class="' + cls(false) + '">return true;</span>\n}';
    verdict.classList.remove("shake");
    if (forget) {
      term.innerHTML = '<span class="bad">error CS0177: The out parameter \'fee\' must be assigned before control leaves the current method</span>';
      verdict.className = "verdict bad";
      verdict.textContent = "Build failed for EVERY weight: the compiler checks every path, not just the one you run.";
      void verdict.offsetWidth; verdict.classList.add("shake");
      return;
    }
    term.innerHTML = '<span class="good">' + (bad ? "Invalid weight" : "Fee: " + kg * 0.5 + " KD") + "</span>";
    verdict.className = "verdict good";
    verdict.textContent = bad
      ? "Returned false (bad input), and the out box still holds fee = 0."
      : "Returned true (it worked), and the out box holds " + kg + " × 0.5 = " + kg * 0.5 + ".";
  }
  w.addEventListener("input", draw); f.addEventListener("change", draw);
  draw();
}

function overloadDoors(stage) {
  const calls = [
    { label: 'GetFee(4)', args: 1, city: null },
    { label: 'GetFee(4, "Jahra")', args: 2, city: "Jahra" },
    { label: 'GetFee(4, "Hawalli")', args: 2, city: "Hawalli" },
  ];
  let pick = 0;
  stage.innerHTML =
    '<div class="pick">' + calls.map((c, i) => '<button class="btn" data-c="' + i + '" aria-pressed="' + (i === 0) + '"><code>' + esc(c.label) + "</code></button>").join("") + "</div>" +
    '<div class="codebox"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">Call</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function draw(lit1, lit2) {
    const c1 = lit1 ? "hit" : "dim", c2 = lit2 ? "hit" : "dim";
    code.innerHTML =
      '<span class="' + c1 + '">// Door 1: (int boxes)\npublic static int GetFee(int boxes)\n{\n    int fee = boxes * 2;\n    return fee;\n}</span>\n\n' +
      '<span class="' + c2 + '">// Door 2: (int boxes, string city)\npublic static int GetFee(int boxes, string city)\n{\n    int fee = GetFee(boxes);\n    if (city == "Jahra") return fee + 3;\n    else return fee;\n}</span>';
  }
  function reset() {
    draw(false, false);
    term.textContent = "";
    verdict.className = "verdict";
    verdict.textContent = "Predict first: which door matches " + calls[pick].label + ", and what does it return?";
  }
  function run() {
    const c = calls[pick];
    reset();
    if (c.args === 1) {
      draw(true, false);
      term.innerHTML = '<span class="dim">1 int argument → Door 1 matches\n4 * 2 = 8</span>\n<span class="good">8</span>';
      verdict.className = "verdict good";
      verdict.textContent = "One int argument, so overload resolution picks Door 1.";
      return;
    }
    draw(false, true);
    term.innerHTML = '<span class="dim">int + string → Door 2 matches</span>';
    setTimeout(() => {
      draw(true, true);
      term.innerHTML += '<span class="dim">\nDoor 2 calls GetFee(boxes) → 1 argument → Door 1\n4 * 2 = 8</span>';
    }, 700);
    setTimeout(() => {
      const fee = c.city === "Jahra" ? 11 : 8;
      term.innerHTML += '<span class="dim">\nBack in Door 2: city is ' + c.city + (c.city === "Jahra" ? " → 8 + 3 = 11" : " → keep 8") + '</span>\n<span class="good">' + fee + "</span>";
      verdict.className = "verdict good";
      verdict.textContent = "Door 2 ran first (2 arguments), then asked Door 1 for the box fee. * 2 lives in one place only.";
    }, 1400);
  }
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.c) {
      pick = +b.dataset.c;
      stage.querySelectorAll("[data-c]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      reset();
    } else if (b.dataset.a === "run") run();
  });
  reset();
}

function argumentSlots(stage) {
  const calls = [
    { label: 'PrintDelivery("Jahra")', city: ["Jahra", "position 1"], days: null },
    { label: 'PrintDelivery("Salmiya", 1)', city: ["Salmiya", "position 1"], days: ["1", "position 2"] },
    { label: 'PrintDelivery(days: 5, city: "Hawalli")', city: ["Hawalli", "by name city:"], days: ["5", "by name days:"], named: true },
    { label: "PrintDelivery(days: 5)", city: null, days: ["5", "by name days:"], named: true },
  ];
  let pick = 0, timers = [];
  stage.innerHTML =
    '<div class="pick">' + calls.map((c, i) => '<button class="btn" data-c="' + i + '" aria-pressed="' + (i === 0) + '"><code>' + esc(c.label) + "</code></button>").join("") + "</div>" +
    '<div class="codebox">public static void PrintDelivery(string city, int days = 2)\n{\n    Console.WriteLine($"Delivery to {city} in {days} days");\n}</div>' +
    '<div class="chain"><div class="door false" data-s="city"><span>string city</span><span class="tag">empty</span></div>' +
    '<div class="door false" data-s="days"><span>int days = 2</span><span class="tag">empty</span></div></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">Call</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const slot = (k) => $('[data-s="' + k + '"]', stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const fill = (k, text, on) => { slot(k).className = "door " + (on ? "open" : "false"); $(".tag", slot(k)).textContent = text; };
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    fill("city", "empty", false); fill("days", "empty", false);
    term.textContent = "";
    verdict.className = "verdict";
    verdict.textContent = "Predict first: what goes into each slot for " + calls[pick].label + "?";
  }
  function run() {
    const c = calls[pick];
    reset();
    const order = c.named ? ["days", "city"] : ["city", "days"];
    order.forEach((k, i) => timers.push(setTimeout(() => {
      if (c[k]) fill(k, c[k][0] + "  ← " + c[k][1], true);
      else if (k === "days") fill("days", "2  ← default value", false);
      else fill("city", "missing!", false);
    }, 600 * (i + 1))));
    timers.push(setTimeout(() => {
      if (!c.city) {
        term.innerHTML = '<span class="bad">error CS7036: There is no argument given that corresponds to the required parameter \'city\'</span>';
        verdict.className = "verdict bad";
        verdict.textContent = "city has no default, so it is a required parameter. A default only helps optional parameters.";
        return;
      }
      const days = c.days ? c.days[0] : "2";
      term.innerHTML = '<span class="good">Delivery to ' + esc(c.city[0]) + " in " + days + " days</span>";
      verdict.className = "verdict good";
      verdict.textContent = c.named ? "Named arguments are matched by name, so the order at the call site doesn't matter."
        : c.days ? "Positional arguments: first value to the first slot, second to the second. 1 replaces the default."
        : "Nothing was passed for days, so the default value 2 from the method header was used.";
    }, 1500));
  }
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.c) {
      pick = +b.dataset.c;
      stage.querySelectorAll("[data-c]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      reset();
    } else if (b.dataset.a === "run") run();
  });
  reset();
}

function calcPipeline(stage) {
  let timers = [];
  stage.innerHTML =
    '<div class="control"><label for="cp-a">First</label><input id="cp-a" type="text" value="10" autocomplete="off">' +
    '<label for="cp-o">Operator</label><input id="cp-o" type="text" value="/" autocomplete="off" style="width:4em">' +
    '<label for="cp-b">Second</label><input id="cp-b" type="text" value="0" autocomplete="off"></div>' +
    '<div class="chain">' +
    '<div class="door false" data-s="valid"><span>Calc.IsValidOperator(op)</span><span class="tag">waiting</span></div>' +
    '<div class="door false" data-s="zero"><span>if (op == "/" &amp;&amp; b == 0)</span><span class="tag">waiting</span></div>' +
    '<div class="door false" data-s="arm"><span>result = op switch { ... }</span><span class="tag">waiting</span></div>' +
    '<div class="door false" data-s="ret"><span>return ? · out double result</span><span class="tag">waiting</span></div></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">Calculate</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const slot = (k) => $('[data-s="' + k + '"]', stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const set = (k, text, on) => { slot(k).className = "door " + (on ? "open" : "false"); $(".tag", slot(k)).textContent = text; };
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    ["valid", "zero", "arm", "ret"].forEach((k) => set(k, "waiting", false));
    term.textContent = "";
    say("", "Pick the numbers and the operator. Predict the full line, then press Calculate.");
  }
  function run() {
    reset();
    const aText = $("#cp-a", stage).value.trim(), op = $("#cp-o", stage).value.trim(), bText = $("#cp-b", stage).value.trim();
    const num = /^-?\d+(\.\d+)?$/;
    if (!num.test(aText) || !num.test(bText)) {
      term.innerHTML = '<span class="bad">That\'s not a number. Try again.</span>';
      say("warn", "double.TryParse returned false, so the loop hit continue before any method was called.");
      return;
    }
    const a = +aText, b = +bText;
    const steps = [];
    const valid = ["+", "-", "*", "/"].includes(op);
    steps.push(() => set("valid", valid ? "true ✓" : "false ✗", valid));
    if (!valid) {
      steps.push(() => { term.innerHTML = '<span class="bad">Unknown operator. Try again.</span>'; say("warn", "IsValidOperator returned false, so !false is true: the guard runs and the loop continues."); });
    } else if (op === "/" && b === 0) {
      steps.push(() => set("zero", "true → stop here", true));
      steps.push(() => set("ret", "false · result = 0", false));
      steps.push(() => { term.innerHTML = '<span class="bad">Cannot divide by zero</span>'; say("good", "Try pattern failure: return false and give out its default value 0, like TryParse."); });
    } else {
      const r = op === "+" ? a + b : op === "-" ? a - b : op === "*" ? a * b : a / b;
      steps.push(() => set("zero", "false → carry on", false));
      steps.push(() => set("arm", op === "/" ? "_ => a / b" : '"' + op + '" => a ' + op + " b", true));
      steps.push(() => set("ret", "true · result = " + r, true));
      steps.push(() => { term.innerHTML = '<span class="good">' + esc(a) + " " + esc(op) + " " + esc(b) + " = " + r + "</span>"; say("good", "Try pattern success: return true and the answer comes back through out double result."); });
    }
    steps.forEach((f, i) => timers.push(setTimeout(f, 550 * (i + 1))));
  }
  stage.addEventListener("click", (e) => { if (e.target.closest('[data-a="run"]')) run(); });
  stage.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input")) run(); });
  reset();
}
