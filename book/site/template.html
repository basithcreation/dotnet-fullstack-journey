<style>
/* Layout: a study notebook. Chapter list on the left (a drawer on phones), one reading column on the right.

  --bad: #b8342d;

  --warn-soft: #fbf0d9;
  --type: #1f6fb2;

}

    --accent: #a594ff; --accent-ink: #11131d; --accent-soft: #252046; --highlight: #3a3418;
    --ok: #5fd39a; --ok-soft: #173326; --bad: #ff8a80; --bad-soft: #3a1d1c; --warn: #e8b85a; --warn-soft: #3a2e14;
    --type: #7fb8f0; --code-bg: #1d2031; --term-bg: #0b0d16; --term-fg: #e6e8f2; --term-dim: #8a90ac;
    --term-bad: #ff8a80; --term-ok: #7be0a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11131d; --sheet: #171a27; --ink: #e6e8f2; --muted: #9aa0bc; --line: #2a2e44;
  --accent: #a594ff; --accent-ink: #11131d; --accent-soft: #252046; --highlight: #3a3418;

<header class="topbar">
  <button class="btn menu-btn" id="menuBtn" aria-controls="toc" aria-expanded="false">Chapters</button>
  <a class="brand" href="#home">Flutter <span>→</span> .NET</a>
  <span class="day-chip" id="dayChip"></span>
</header>
<div class="layout">
  <nav class="toc" id="toc" aria-label="Chapters"></nav>
  <main id="main"><div class="column" id="view"></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const CHAPTERS = /*__CHAPTERS__*/[];
const JOURNEY = /*__JOURNEY__*/{};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hashFor = (id) => "ch-" + id.replace(".", "-");
const hex7 = () => Array.from({ length: 7 }, () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");

/* ---------------- navigation ---------------- */
function renderToc(activeId) {
  const byPhase = groupByPhase();
  let html = '<a class="home-link" href="#home"' + (activeId ? "" : ' aria-current="page"') + ">Home: my progress</a>";
  for (const [phase, list] of byPhase) {
    html += "<h3>Phase " + phase + ": " + esc(list[0].phaseName) + "</h3>";
    for (const ch of list) {
      html += '<a href="#' + hashFor(ch.id) + '"' + (ch.id === activeId ? ' aria-current="page"' : "") +
        '><span class="num">' + ch.id + "</span><span>" + esc(ch.title) + "</span></a>";
    }
  }
  $("#toc").innerHTML = html;
}

function groupByPhase() {
  const map = new Map();
  for (const ch of CHAPTERS) {
    if (!map.has(ch.phase)) map.set(ch.phase, []);
    map.get(ch.phase).push(ch);
  }
  return map;
}

function route() {
  const h = location.hash.slice(1);
  const ch = h.startsWith("ch-") ? CHAPTERS.find((c) => hashFor(c.id) === h) : null;
  if (ch) renderChapter(ch); else renderHome();
  closeMenu();
  window.scrollTo(0, 0);
  try { localStorage.setItem("lastView", h); } catch (e) {}
}

function closeMenu() { $("#toc").classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }

function scoreClass(score, max) {
  const r = score / max;
  return r >= 0.7 ? "score-high" : r >= 0.5 ? "score-mid" : "score-low";
}

    '<p class="lead">First-try score for every quiz, out of 5.</p>' +

  html += '<section class="home-section"><h2>Day by day</h2><p class="lead">What I learned and built each day. Newest first.</p><ol class="timeline">';

    html += '<li><div class="when"><b>Day ' + d.day + "</b><span>" + d.weekday + " " + fmt(d.date) + "</span></div><div>" +

function quizChart(quizzes) {
  const W = 640, H = 240, left = 34, right = 10, top = 14, bottom = 58;
  const plotW = W - left - right, plotH = H - top - bottom;
  const slot = plotW / quizzes.length, barW = Math.min(36, slot * 0.6);
  const y = (v) => top + plotH - (v / 5) * plotH;
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Quiz scores by day">';
  for (let t = 0; t <= 5; t++) {
    svg += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (left - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">' + t + "</text>";
  }
  let prevDay = null;
  quizzes.forEach((q, i) => {
    const cx = left + slot * i + slot / 2;
    const color = q.score / q.max >= 0.7 ? "var(--ok)" : q.score / q.max >= 0.5 ? "var(--warn)" : "var(--bad)";
    svg += '<rect x="' + (cx - barW / 2) + '" y="' + y(q.score) + '" width="' + barW + '" height="' + (y(0) - y(q.score)) + '" rx="4" fill="' + color + '"><title>' + esc(q.name) + ": " + q.score + "/5</title></rect>" +
      '<text x="' + cx + '" y="' + (y(q.score) - 5) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono, monospace">' + q.score + "</text>";
    if (q.day !== prevDay) {
      svg += '<text x="' + cx + '" y="' + (H - bottom + 18) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">Day ' + q.day + "</text>";
      prevDay = q.day;
    }
    const short = q.name.replace(/ quiz$/i, "");
    svg += '<text x="' + cx + '" y="' + (H - bottom + 34) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Bricolage Grotesque, sans-serif">' + esc(short.length > 14 ? short.slice(0, 13) + "…" : short) + "</text>";
  });
  return svg + "</svg>";
}

const SECTION_KIND = { "🧸": "lkg", "💻": "real", "🎯": "dart", "🧪": "examples", "🐞": "errors", "🏢": "team", "📋": "summary", "📝": "quiz" };

function renderChapter(ch) {
  renderToc(ch.id);
  const view = $("#view");
  const body = window.marked ? marked.parse(ch.md.replace(/^# .+\n/, "")) : "<pre>" + esc(ch.md) + "</pre>";
  view.innerHTML = '<article class="chapter"><header class="chapter-head"><span class="eyebrow">Chapter ' + ch.id +
    " · Phase " + ch.phase + ": " + esc(ch.phaseName) + "</span><h1>" + esc(ch.title) + "</h1></header><div class=\"chapter-body\"></div></article>";
  const holder = $(".chapter-body", view);
  holder.innerHTML = body;

  // the "> Learned: ..." line right under the title
  const first = holder.firstElementChild;
  if (first && first.tagName === "BLOCKQUOTE") first.classList.add("meta");

  // wrap each h2 and what follows it in a <section>
  let current = null;
  for (const node of [...holder.childNodes]) {
    if (node.nodeType === 1 && node.tagName === "H2") {
      current = document.createElement("section");
      const kind = SECTION_KIND[[...node.textContent.trim()][0]];
      if (kind) current.className = kind;
      holder.insertBefore(current, node);
    }
    if (current) current.appendChild(node);
  }

  holder.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });

  holder.querySelectorAll("pre code").forEach((el) => {
    const lang = ((el.className.match(/language-(\w+)/) || [])[1] || "").toLowerCase();
    if (window.hljs && lang && hljs.getLanguage(lang)) hljs.highlightElement(el);
  });

  holder.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (/\.md(#.*)?$/.test(href)) {
      const name = href.split("/").pop().replace(/#.*$/, "");
      const target = CHAPTERS.find((c) => c.file.endsWith(name));
      if (target) a.setAttribute("href", "#" + hashFor(target.id));
    } else if (/^https?:/.test(href)) {
      a.target = "_blank";
      a.rel = "noopener";
    }
  });

  // 🎬 notes become playable animations
  let n = 0;
  holder.querySelectorAll("p").forEach((p) => {
    if (!p.textContent.trim().startsWith("🎬")) return;
    const make = (WIDGETS[ch.id] || [])[n++];
    const fig = document.createElement("figure");
    fig.className = "anim";
    fig.innerHTML = '<div class="anim-tag">🎬 ' + (make ? "Try it" : "Animation idea") + '</div><div class="anim-stage"></div>' +
      "<figcaption>" + p.innerHTML.replace(/^🎬\s*<strong>Animation idea:<\/strong>\s*/, "") + "</figcaption>";
    p.replaceWith(fig);
    const stage = $(".anim-stage", fig);
    if (make) make(stage); else stage.remove();
  });

  const i = CHAPTERS.indexOf(ch);
  const prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  const pager = document.createElement("nav");
  pager.className = "pager";
  pager.innerHTML =
    (prev ? '<a href="#' + hashFor(prev.id) + '"><small>← Chapter ' + prev.id + "</small><b>" + esc(prev.title) + "</b></a>" : "<span></span>") +
    (next ? '<a class="next" href="#' + hashFor(next.id) + '"><small>Chapter ' + next.id + " →</small><b>" + esc(next.title) + "</b></a>" : "");
  $(".chapter", view).appendChild(pager);
}

function lapCounter(stage) {
  let start, op, end, inc, i, phase, laps, checks, out, done;
  stage.innerHTML =
    '<div class="control"><label for="lc-s">Start</label><input id="lc-s" type="range" min="0" max="5" value="1"><output></output></div>' +
    '<div class="control"><label for="lc-e">End</label><input id="lc-e" type="range" min="1" max="8" value="5"><output></output>' +
    '<label class="check"><input id="lc-o" type="checkbox" checked> use <b>&lt;=</b> (off: <b>&lt;</b>)</label></div>' +
    '<div class="control"><label for="lc-k">Step</label><input id="lc-k" type="range" min="1" max="3" value="1"><output></output></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next step</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const s = $("#lc-s", stage), e = $("#lc-e", stage), o = $("#lc-o", stage), k = $("#lc-k", stage);
  const code = $(".codebox", stage), track = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  const pass = () => (op === "<=" ? i <= end : i < end);
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    code.innerHTML =
      "for (" + L("init", "int i = " + start) + "; " + L("check", "i " + op.replace("<", "&lt;") + " " + end) + "; " +
      L("step", inc === 1 ? "i++" : "i += " + inc) + ")\n{\n" + L("body", '    Console.WriteLine($"Lap {i}");') + "\n}";
  }
  function drawTrack() {
    track.innerHTML = "<div><small>Laps</small><span>" + ("🏃".repeat(laps) || "<small>none yet</small>") + "</span></div>" +
      "<div><small>i</small><span><small>" + (phase === "init" ? "–" : i) + "</small></span></div>" +
      "<div><small>Checks</small><span><small>" + checks + "</small></span></div>";
  }
  function reset() {
    start = +s.value; end = +e.value; inc = +k.value; op = o.checked ? "<=" : "<";
    s.nextElementSibling.textContent = start; e.nextElementSibling.textContent = end; k.nextElementSibling.textContent = inc;
    phase = "init"; laps = 0; checks = 0; out = []; done = false;
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode(); drawTrack();
    say("", "Press Next step. Watch the order: initializer, condition, body, iterator.");
  }
  function step() {
    if (done) return;
    if (phase === "init") {
      i = start; phase = "check"; drawCode("init");
      say("", "① Initializer: i = " + i + ". This runs only once.");
    } else if (phase === "check") {
      checks++; drawCode("check");
      if (pass()) { phase = "body"; say("good", "② Condition: " + i + " " + op + " " + end + " is true, so the body runs."); }
      else {
        done = true;
        say("warn", "② Condition: " + i + " " + op + " " + end + " is false, so the loop exits. " + laps + " lap" + (laps === 1 ? "" : "s") + ", " + checks + " checks: always one check more than laps." +
          (op === "<" ? " Tick <= to include " + end + " (off-by-one)." : ""));
      }
    } else if (phase === "body") {
      laps++; out.push("Lap " + i); phase = "step"; drawCode("body");
      say("good", "Body: prints Lap " + i + ". The body uses i BEFORE the iterator changes it.");
    } else {
      i += inc; phase = "check"; drawCode("step");
      say("", "③ Iterator: i is now " + i + ". Back to the condition.");
    }
    drawTrack();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 100) step(); }
    if (a === "reset") reset();
  });
  [s, e, k].forEach((x) => x.addEventListener("input", reset));
  o.addEventListener("change", reset);
  reset();
}

function piggyBank(stage) {
  let inside, plusOne, i, total, out, done, coins;
  stage.innerHTML =
    '<div class="control"><label class="check"><input id="pb-in" type="checkbox"> move <b>int total = 0;</b> inside the loop</label>' +
    '<label class="check"><input id="pb-one" type="checkbox"> <b>total += 1</b> instead of <b>+= i</b></label></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next iteration</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const inBox = $("#pb-in", stage), oneBox = $("#pb-one", stage);
  const code = $(".codebox", stage), bank = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    const add = plusOne ? "total += 1;" : "total += i;";
    code.innerHTML = [
      inside ? null : L("decl", "int total = 0;"),
      "for (int i = 1; i &lt;= 4; i++)",
      "{",
      inside ? L("decl", "    int total = 0;") : null,
      L("body", "    " + add),
      "}",
      L("print", 'Console.WriteLine($"Total: {total}");'),
    ].filter((x) => x !== null).join("\n");
  }
  function drawBank() {
    bank.innerHTML = "<div><small>Coins in</small><span>" + (coins.map((c) => "🪙" + c).join(" ") || "<small>empty</small>") + "</span></div>" +
      "<div><small>Bank</small><span>🐷 <small>total = " + total + "</small></span></div>";
  }
  function reset() {
    inside = inBox.checked; plusOne = oneBox.checked;
    i = 1; total = 0; out = []; done = false; coins = [];
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode("decl"); drawBank();
    say(inside ? "warn" : "", inside
      ? "The piggy bank is now born INSIDE the loop. (Real C# won't even build this. Step through to see why.)"
      : "The piggy bank (accumulator) is ready BEFORE the loop. Press Next iteration.");
  }
  function step() {
    if (done) return;
    if (i <= 4) {
      if (inside) { total = 0; coins = []; }
      const coin = plusOne ? 1 : i;
      coins.push(coin); total += coin;
      drawCode("body");
      say(inside ? "warn" : "good", inside
        ? "i = " + i + ": a NEW empty piggy bank, then +" + coin + ", so total = " + total + ". It resets every iteration and can never grow."
        : "i = " + i + ": old total " + (total - coin) + " + " + coin + " = " + total + "." + (plusOne ? " Adding 1 only counts the iterations." : ""));
      i++;
    } else {
      done = true; drawCode("print");
      if (inside) {
        term.innerHTML = '<span class="bad">error CS0103: The name \'total\' does not exist in the current context</span>';
        say("bad", "total died at the } of the loop, so the print line can't see it. Two reasons, one rule: declare the accumulator BEFORE the loop.");
      } else {
        out.push("Total: " + total);
        term.textContent = out.join("\n");
        say(plusOne ? "warn" : "good", plusOne
          ? "Total: 4. With += 1 the bank counted the laps instead of summing 1 + 2 + 3 + 4. Use += i."
          : "Total: 10. Declared before, updated inside, printed after.");
      }
    }
    drawBank();
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 20) step(); }
    if (a === "reset") reset();
  });
  inBox.addEventListener("change", reset);
  oneBox.addEventListener("change", reset);
  reset();
}

function sdkPipeline(stage) {
  const steps = [
    { zone: 0, text: "You write C# in Program.cs. Right now it's only text." },
    { zone: 1, text: "dotnet build: the SDK's compiler turns your code into an app file (.dll). Only developers need the SDK." },
    { zone: 2, text: "The user runs the app. The CLR (runtime) is the engine that makes it run. Users only need the runtime." },
  ];
  let i = 0;
  stage.innerHTML =
    '<div class="zones three">' +
    '<div class="zone"><h5>You<small>developer</small></h5><div class="item">Program.cs</div></div>' +
    '<div class="zone"><h5>SDK<small>toolbox</small></h5><div class="item">dotnet build</div><div class="item">→ app.dll</div></div>' +
    '<div class="zone"><h5>CLR<small>engine</small></h5><div class="item">runs app.dll</div><div class="item">for the user</div></div>' +
    '</div><div class="verdict"></div><div class="btn-row"><button class="btn primary">Next step</button></div>';
  const zones = stage.querySelectorAll(".zone"), verdict = $(".verdict", stage), btn = $(".btn", stage);
  const show = () => {
    zones.forEach((z, k) => z.classList.toggle("active", k === steps[i].zone));
    verdict.textContent = "Step " + (i + 1) + " of 3: " + steps[i].text;
    btn.textContent = i === steps.length - 1 ? "Start again" : "Next step";
  };
  btn.addEventListener("click", () => { i = (i + 1) % steps.length; show(); });
  show();
}

function cookieDivision(stage) {
  stage.innerHTML =
    '<div class="control"><label for="ck-c">Cookies</label><input id="ck-c" type="range" min="0" max="20" value="10"><output></output></div>' +
    '<div class="control"><label for="ck-k">Kids</label><input id="ck-k" type="range" min="1" max="6" value="3"><output></output></div>' +
    '<div class="cookies"></div><div class="term"></div>';
  const c = $("#ck-c", stage), k = $("#ck-k", stage), box = $(".cookies", stage), term = $(".term", stage);
  const draw = () => {
    const cookies = +c.value, kids = +k.value, each = Math.floor(cookies / kids), left = cookies % kids;
    c.nextElementSibling.textContent = cookies;
    k.nextElementSibling.textContent = kids;
    let html = "";
    for (let i = 1; i <= kids; i++) html += "<div><small>Kid " + i + "</small><span>" + ("🍪".repeat(each) || "<small>none</small>") + "</span></div>";
    html += "<div><small>Plate</small><span>" + ("🍪".repeat(left) || "<small>empty</small>") + "</span></div>";
    box.innerHTML = html;
    const dart = cookies / kids;
    term.innerHTML =
      "int each = " + cookies + " / " + kids + ";   <span class=\"dim\">// " + each + "  (C# throws away the decimal part)</span>\n" +
      "int left = " + cookies + " % " + kids + ";   <span class=\"dim\">// " + left + "  (the remainder)</span>\n" +
      "<span class=\"dim\">// Dart: " + cookies + " / " + kids + " = " + (Number.isInteger(dart) ? dart + ".0" : dart) + "</span>";
  };
  c.addEventListener("input", draw);
  k.addEventListener("input", draw);
  draw();
}

function gitAlbum(stage) {
  const st = { mod: new Set(), staged: new Set(), commits: [], pushed: 0 };
  stage.innerHTML =
    '<div class="zones">' +
    '<div class="zone" data-z="desk"><h5>Desk<small>working directory</small></h5><div class="list"></div></div>' +
    '<div class="zone" data-z="box"><h5>Box<small>staging area</small></h5><div class="list"></div></div>' +
    '<div class="zone" data-z="album"><h5>Album<small>local repo</small></h5><div class="list"></div></div>' +
    '<div class="zone" data-z="cloud"><h5>Cloud<small>GitHub</small></h5><div class="list"></div></div>' +
    "</div>" +
    '<div class="btn-row"><button class="btn" data-a="edit1">Edit Program.cs</button><button class="btn" data-a="edit2">Edit README.md</button>' +
    '<button class="btn primary" data-a="add">git add .</button><button class="btn primary" data-a="commit">git commit</button><button class="btn primary" data-a="push">git push</button></div>' +
    '<div class="term"><span class="dim">$ git status</span>\nnothing to commit, working tree clean</div>';
  const term = $(".term", stage), zone = (z) => $('[data-z="' + z + '"]', stage);
  const flash = (z) => { stage.querySelectorAll(".zone").forEach((el) => el.classList.toggle("active", el.dataset.z === z)); };
  const draw = () => {
    $(".list", zone("desk")).innerHTML = ["Program.cs", "README.md"].map((f) =>
      '<div class="item' + (st.mod.has(f) ? " mod" : "") + '">' + f + (st.mod.has(f) ? " (modified)" : "") + "</div>").join("");
    $(".list", zone("box")).innerHTML = [...st.staged].map((f) => '<div class="item staged">' + f + "</div>").join("");
    const row = (c) => '<div class="item"><b>' + c.id + "</b> " + esc(c.msg) + "</div>";
    $(".list", zone("album")).innerHTML = [...st.commits].reverse().map(row).join("");
    $(".list", zone("cloud")).innerHTML = st.commits.slice(0, st.pushed).reverse().map(row).join("");
  };
  stage.querySelector(".btn-row").addEventListener("click", (e) => {
    const a = e.target.dataset.a;
    if (!a) return;
    if (a === "edit1" || a === "edit2") {
      const f = a === "edit1" ? "Program.cs" : "README.md";
      st.mod.add(f);
      flash("desk");

function shapeSorter(stage) {
  const values = [
    { code: "3", type: "int" }, { code: "2.5", type: "double" }, { code: "1.350m", type: "decimal" },
    { code: "'B'", type: "char" }, { code: '"Hi"', type: "string" }, { code: "true", type: "bool" },
  ];
  const boxes = ["int", "double", "decimal", "bool", "char", "string"];
  const cast = (from, to) => "error CS0266: Cannot implicitly convert type '" + from + "' to '" + to + "'. An explicit conversion exists (are you missing a cast?)";
  const nope = (from, to) => "error CS0029: Cannot implicitly convert type '" + from + "' to '" + to + "'";
  function judge(v, box) {
    if (v.type === box) return ["good", "Fits! A " + box + " box holds exactly this."];
    const t = v.type;
    if (t === "int" && (box === "double" || box === "decimal")) return ["good", "Fits automatically: int → " + box + " is a safe pour (implicit conversion), nothing is lost."];
    if (t === "int" && box === "char") return ["bad", cast("int", "char")];
    if (t === "double" && box === "decimal") return ["bad", "error CS0664: Literal of type double cannot be implicitly converted to type 'decimal'; use an 'M' suffix. Write 2.5m."];
    if (t === "double" && (box === "int" || box === "char")) return ["bad", cast("double", box) + " The decimal part would be lost, so C# wants you to decide."];
    if (t === "decimal" && (box === "int" || box === "double" || box === "char")) return ["bad", cast("decimal", box)];
    if (t === "char" && (box === "int" || box === "double" || box === "decimal")) return ["warn", "Surprise: it compiles, but the box gets 66, the character's number code. Real code almost never wants this."];
    return ["bad", nope(t, box)];
  }
  let picked = values[0];
  stage.innerHTML =
    '<div class="control">1. Pick a value:</div><div class="pick" data-p="v">' +
    values.map((v, i) => '<button class="btn" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(v.code) + "</button>").join("") + "</div>" +
    '<div class="control">2. Drop it into a box:</div><div class="pick" data-p="b">' +
    boxes.map((b) => '<button class="btn" data-b="' + b + '">' + b + "</button>").join("") + "</div>" +
    '<div class="codebox"></div><div class="verdict">Pick a value, then a box.</div>';
  const verdict = $(".verdict", stage), code = $(".codebox", stage);
  const vRow = $('[data-p="v"]', stage), bRow = $('[data-p="b"]', stage);
  const showCode = (box) => { code.textContent = (box || "____") + " x = " + picked.code + ";"; };
  vRow.addEventListener("click", (e) => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    picked = values[+i];
    vRow.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b === e.target)));
    showCode();
    verdict.className = "verdict";
    verdict.textContent = "Now pick a box for " + picked.code + ".";
  });
  bRow.addEventListener("click", (e) => {
    const box = e.target.dataset.b;
    if (!box) return;
    const [kind, msg] = judge(picked, box);
    showCode(box);
    verdict.className = "verdict " + kind;
    verdict.textContent = (kind === "good" ? "✅ " : kind === "warn" ? "⚠️ " : "❌ ") + msg;
    if (kind === "bad") { verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake"); }
  });
  showCode();
}

    let lines = ["switch (light)", "{"];

    }

    sCode.innerHTML = lines.join("\n");
  }
  function arms() {
    return [
      { pats: ["A", "B"], out: "Great job!" },

      const cls = hit === i ? "hit" : hit !== undefined ? "miss" : "";

  const b = $("#pl-b", stage), s = $("#pl-s", stage), code = $(".codebox", stage), plate = $(".cookies", stage);
  const term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function drawCode(hl) {
    const L = (k, t) => '<span class="' + (hl === k ? "hit" : "") + '">' + t + "</span>";
    code.innerHTML = [
      "int bites = " + start + ";",
      L("check", "while (bites > 0)" + (stray ? " ;" : "")),
      "{",
      L("body", '    Console.WriteLine($"Eating... {bites} bites left");'),
      L("body", "    bites--;"),
      "}",
      L("after", 'Console.WriteLine("Plate empty! Go play");'),
    ].join("\n");
  }
  function drawPlate() {
    plate.innerHTML = "<div><small>Plate</small><span>" + ("🍪".repeat(Math.max(bites, 0)) || "<small>empty</small>") + "</span></div>" +
      "<div><small>Round</small><span><small>" + round + "</small></span></div>";
  }
  function reset() {
    start = +b.value; stray = s.checked;
    bites = start; round = 0; out = []; done = false; inBlock = false;
    b.nextElementSibling.textContent = start;
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode(); drawPlate();
    say("", stray ? "The ; ends the while early. The { } block is no longer the loop body. Press Next step." : "Press Next step to check the condition.");
  }
  function step() {
    if (done) return;
    if (inBlock) {
      out.push("Eating... " + bites + " bites left"); bites--;
      out.push("Plate empty! Go play"); done = true; drawCode("after");
      say("warn", "The loop body was the empty ;, so the { } block ran once on its own (and bites even went to " + bites + "). Then the next line ran.");
    } else if (bites > 0) {
      round++;
      if (stray) {
        drawCode("check");
        say("bad", "Round " + round + ": " + bites + " > 0 is true. The body is the empty ;, so nothing happens and bites stays " + bites + ". The condition can never become false: infinite loop.");
        if (round >= 8) { done = true; say("bad", "💥 The app hangs: round " + round + " and counting, bites is still " + bites + ". In a real terminal you press Ctrl+C. Fix: delete the ;"); }
      } else {
        out.push("Eating... " + bites + " bites left"); bites--;
        drawCode("body");
        say("good", "Round " + round + ": " + (bites + 1) + " > 0 is true, so the body runs. bites is now " + bites + ".");
      }
    } else {
      drawCode("check");
      if (stray) { inBlock = true; say("", "Check: " + bites + " > 0 is false, so the (empty) loop ends. Next: the { } block that was cut off from the loop."); }
      else {
        out.push("Plate empty! Go play"); done = true; drawCode("after");
        say(round === 0 ? "warn" : "good", "Check: 0 > 0 is false, so C# jumps past the }. " + (round === 0 ? "Zero iterations: the body never ran." : "The body ran " + round + " times, and \"Eating... 0\" never printed."));
      }
    }
    drawPlate();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (e) => {
    const a = e.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 50) step(); }
    if (a === "reset") reset();
  });
  b.addEventListener("input", reset);
  s.addEventListener("change", reset);
  reset();
}

function rollUntilSix(stage) {
  let start = 0, after = false, force = false;
  stage.innerHTML =
    '<div class="control">rolls starts at:</div><div class="pick" data-p="start"><button class="btn" data-v="0" aria-pressed="true">int rolls = 0;</button><button class="btn" data-v="1" aria-pressed="false">int rolls = 1;</button></div>' +
    '<div class="control">rolls++ goes:</div><div class="pick" data-p="order"><button class="btn" data-v="before" aria-pressed="true">before the print</button><button class="btn" data-v="after" aria-pressed="false">after the print</button></div>' +
    '<label class="check"><input type="checkbox" data-t="force"> force a 6 (hard-code Next(6, 7) to test the first-try branch)</label>' +
    '<div class="codebox"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">dotnet run</button></div>' +
    '<div class="term"><span class="dim">Press dotnet run.</span></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function drawCode() {
    const inc = "    rolls++;";
    code.textContent = [
      "int rolls = " + start + ";",
      "int dice = 7;",
      "while (dice != 6)",
      "{",
      after ? null : inc,
      "    dice = Random.Shared.Next(" + (force ? "6, 7);   // TEST ONLY" : "1, 7);"),
      '    Console.WriteLine($"Roll {rolls}: {dice}");',
      after ? inc : null,
      "}",
      'if (rolls == 1) Console.WriteLine("Lucky! First try!");',
      'else Console.WriteLine($"🎉 Got a 6 after {rolls} rolls!");',
    ].filter((l) => l !== null).join("\n");
  }
  function run() {
    let rolls = start, dice = 7, guard = 0;
    const lines = [], labels = [];
    while (dice !== 6 && guard++ < 200) {
      if (!after) rolls++;
      dice = force ? 6 : 1 + Math.floor(Math.random() * 6);
      lines.push("Roll " + rolls + ": " + dice);
      labels.push(rolls);
      if (after) rolls++;
    }
    lines.push(rolls === 1 ? "Lucky! First try!" : "🎉 Got a 6 after " + rolls + " rolls!");
    term.textContent = lines.join("\n");
    const real = labels.length, first = labels[0], last = labels[real - 1];
    const problems = [];
    if (first !== 1) problems.push("the labels start at Roll " + first);
    if (rolls !== real) problems.push("the total says " + rolls + " but there were " + real + " rolls");
    if (problems.length) {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ Off-by-one error: " + problems.join(", and ") + ". Count first, then print.";
      verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake");
    } else {
      verdict.className = "verdict good";
      verdict.textContent = "✅ Labels start at 1, and the last label (" + last + ") = the total (" + rolls + ")." + (force ? " Now un-tick \"force a 6\": always revert a hard-coded test value." : "");
    }
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const row = btn.parentElement.dataset.p;
    if (row) {
      btn.parentElement.querySelectorAll(".btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      if (row === "start") start = +btn.dataset.v; else after = btn.dataset.v === "after";
      drawCode();
      term.innerHTML = '<span class="dim">Press dotnet run.</span>';
      verdict.className = "verdict"; verdict.textContent = "";
    }
    if (btn.dataset.a === "run") run();
  });
  stage.addEventListener("change", (e) => { if (e.target.dataset.t === "force") { force = e.target.checked; drawCode(); } });
  drawCode();
}

function pinDoor(stage) {
  const PIN = 4321;
  let outside = false, tries = 0, badCounted = 0, open = false, log = [];
  stage.innerHTML =
    '<div class="control">tries++ goes:</div><div class="pick"><button class="btn" data-v="in" aria-pressed="true">inside the number check</button><button class="btn" data-v="out" aria-pressed="false">before the number check</button></div>' +
    '<div class="codebox"></div>' +
    '<div class="control"><label for="pd-in">Enter PIN:</label><input id="pd-in" type="text" value="abc" autocomplete="off">' +
    '<div class="btn-row"><button class="btn primary" data-a="enter">Enter</button><button class="btn" data-a="reset">Reset door</button></div></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage), inp = $("#pd-in", stage);
  function drawCode() {
    const inc = outside ? "    tries++;" : "        tries++;";
    code.textContent = [
      "while (pin != 4321)",
      "{",
      outside ? inc : null,
      "    if (int.TryParse(input, out pin))",
      "    {",
      outside ? null : inc,
      '        if (pin != 4321) Console.WriteLine("Wrong PIN.");',
      "    }",
      '    else Console.WriteLine("Digits only, please.");',
      "}",
      'Console.WriteLine($"Unlocked after {tries} tries.");',
    ].filter((l) => l !== null).join("\n");
  }
  function draw() {
    term.innerHTML = log.length ? log.join("\n") : '<span class="dim">Try: abc, then 1111, then 4321.</span>';
  }
  function reset() {
    tries = 0; badCounted = 0; open = false; log = [];
    verdict.className = "verdict"; verdict.textContent = "";
    draw();
  }
  function enter() {
    if (open) return;
    const s = inp.value.trim();
    const ok = /^-?\d+$/.test(s);
    if (outside) { tries++; if (!ok) badCounted++; }
    log.push("Enter PIN: " + esc(s));
    if (ok) {
      if (!outside) tries++;
      if (+s !== PIN) log.push("Wrong PIN.");
    } else {
      log.push('<span class="bad">Digits only, please.</span>');
    }
    if (ok && +s === PIN) {
      open = true;
      log.push('<span class="good">🚪 Unlocked after ' + tries + " tries.</span>");
      if (badCounted) {
        verdict.className = "verdict bad";
        verdict.textContent = "❌ " + badCounted + " invalid input" + (badCounted > 1 ? "s were" : " was") + " counted as a try. Move tries++ inside the number check.";
      } else {
        verdict.className = "verdict good";
        verdict.textContent = "✅ Only real numbers were counted: " + tries + " tries.";
      }
    }
    draw();
    inp.select();
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.v) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      outside = btn.dataset.v === "out";
      drawCode(); reset();
    }
    if (btn.dataset.a === "enter") enter();
    if (btn.dataset.a === "reset") reset();
  });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") enter(); });
  drawCode(); draw();
}

function guessGame(stage) {
  let inside = false, secret, attempts, low, high, done, log;
  const pickSecret = () => 1 + Math.floor(Math.random() * 100);
  stage.innerHTML =
    '<div class="control">The line <code>secretNumber = Random.Shared.Next(1, 101);</code> goes:</div>' +
    '<div class="pick"><button class="btn" data-v="above" aria-pressed="true">above the loop (runs once)</button><button class="btn" data-v="inside" aria-pressed="false">inside the loop (every guess)</button></div>' +
    '<div class="control"><label for="gg-in">Your guess:</label><input id="gg-in" type="text" value="50" autocomplete="off">' +
    '<div class="btn-row"><button class="btn primary" data-a="guess">Guess</button><button class="btn" data-a="mid">Middle guess</button><button class="btn" data-a="new">New game</button></div></div>' +
    '<div class="term" style="max-height: 16em; overflow-y: auto"></div><div class="verdict"></div>';
  const term = $(".term", stage), verdict = $(".verdict", stage), inp = $("#gg-in", stage);
  function start() {
    secret = pickSecret(); attempts = 0; low = 1; high = 100; done = false;
    log = ["I'm thinking of a number between 1 and 100."];
    verdict.className = "verdict"; verdict.textContent = "";
    draw();
  }
  function draw() { term.innerHTML = log.join("\n"); term.scrollTop = term.scrollHeight; }
  function guess() {
    if (done) return;
    const s = inp.value.trim();
    log.push("Your guess: " + esc(s));
    if (!/^-?\d+$/.test(s)) {
      log.push('<span class="bad">That\'s not a number. Try again.</span>');
      draw(); return;
    }
    const g = +s;
    attempts++;
    if (inside) {
      const old = secret;
      secret = pickSecret();
      if (secret !== old) log.push('<span class="dim">(the loop ran the Random line again: the secret quietly changed from ' + old + " to " + secret + ")</span>");
    }
    if (g > secret) { log.push("Too high!"); high = Math.min(high, g - 1); }
    else if (g < secret) { log.push("Too low!"); low = Math.max(low, g + 1); }
    else {
      done = true;
      log.push('<span class="good">' + (attempts === 1 ? "🎯 First try! Amazing!" : "🎉 Correct! You got it in " + attempts + " attempts.") + "</span>");
      verdict.className = inside ? "verdict warn" : "verdict good";
      verdict.textContent = inside ? "You won, but only by luck: the secret kept changing. Move the Random line above the loop." : "✅ The secret was picked once and stayed " + secret + " for the whole game.";
    }
    if (!done && low > high) {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ The clues contradict each other (it must be above " + (low - 1) + " and below " + (high + 1) + "). The secret is being overwritten on every guess.";
      verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake");
    }
    draw();
    inp.select();
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.v) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      inside = btn.dataset.v === "inside";
      start();
    }
    if (btn.dataset.a === "guess") guess();
    if (btn.dataset.a === "mid") { inp.value = String(Math.floor((Math.max(low, 1) + Math.min(Math.max(high, low), 100)) / 2)); guess(); }
    if (btn.dataset.a === "new") start();
  });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") guess(); });
  start();
}
