mes (`10-random`, `11-roll-until-six`) |\n| `git add` with one folder twice, another folder missing | Typed `11-roll-until-six` twice and forgot `10-random` | `git status` showed `10-random/` still **untracked** ✅, so I added it before committing |\n| Extra folder `11-ro11l-until-six` with only `obj` inside | A typo created a **stray build folder** | `Remove-Item -Recurse -Force` (read the path twice before Enter) |\n| Practice code typed into the **project's** `Program.cs` | Wrong file open | Cut it out (the project file must only hold the game), paste it into the lesson folder |\n| Changed `tries = 0` to `1`, then `2`, when asked \"why is it 2?\" | Thought \"explain why\" meant \"it's wrong\". It wasn't! | Don't change code until you know **why** it does what it does. Trace first |\n| `guessNumber = Random.Shared.Next(1, 101);` inside the loop | `Random` **overwrote** the player's guess, so typing `42` didn't stop the loop | The player types the guess, `Random` only picks the secret, once, above the loop |\n| Two variables for one guess (`guessNumber` and `inputNumber`) | The `while` checked one, `out` wrote into the other | One variable: `out guessNumber` |\n| Counter called `randomNumber` | The name didn't match what it holds | Renamed with **F2** to `numberOfAttempts` |\n| First-try win printed **two** lines | The 🎉 line was outside any `else`, so it always ran | Put it inside `else` |\n| Only tested one path of the bonus | \"It works for 2 attempts\" ≠ \"it works for 1 attempt\" | **Test every path** |\n| ` I'm thinking...` printed with a space in front | A space inside the quotes | Delete it: `\"I'm thinking...\"` |\n| README said \"tested with 50\" and \"max is 100\" | Not true (it was 42, and the max passed is 101) | Write only what's accurate |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| door that keeps asking | **input validation loop** | \"Wrap the `TryParse` in a validation loop.\" |\n| an `if` inside an `if` | **nested `if`** | \"The range check is a nested `if` inside the parse check.\" |\n| bad input not counted | **rejected input** / **invalid input** | \"Invalid input is rejected and doesn't count as an attempt.\" |\n| the random line wiped my guess | **overwrite** a variable | \"The random call was overwriting the user's guess.\" |\n| picked once at the top | **initialized once**, before the loop | \"The secret is initialized once, so it stays constant for the whole game.\" |\n| fixed number for testing | **hard-coded** test value | \"I hard-coded the secret to 42 to test the logic.\" |\n| try every road | **test every path / branch** | \"Did you test the first-try branch?\" |\n| good names | **meaningful variable names** | \"Rename `randomNumber`, it's not random.\" |\n| F2 | **Rename Symbol**, a **refactoring** | \"Use Rename Symbol so every reference changes.\" |\n| neat blank lines | **formatting** / **code style** | \"`else` goes on the line right after the `}`.\" |\n| guess the middle | **binary search** | \"Binary search finds it in 7 tries or fewer.\" |\n| project front page | **README** (written in **Markdown**) | \"Add a README with how to run it.\" |\n| Git couldn't find my path | **pathspec** error | \"The add failed, my pathspec had a typo.\" |\n| leftover `obj` folder | **build output** / **stray build folder** | \"That's just build output, it's gitignored.\" |\n| `git add .` | **stage all changes** | \"I staged everything because the working tree only had this change.\" |\n| saved on my PC, not GitHub | **local commits**, **ahead of the remote** | \"I'm 2 commits ahead, let me push.\" |\n\n---\n\n## 📋 Summary\n\n- **Input validation loop:** `while` + `TryParse` + a **nested `if`**. Bad input goes to the `else` and isn't counted\n- Put the counter **inside** the success branch, and **count it, then show it**\n- A line **above** the loop runs **once**. A line **inside** the loop runs **every iteration**\n- The secret is picked **once**. The guess comes from the **player**. Never let `Random` overwrite input\n- `if` / `else` = **one** path. A line after an `if` with no `else` **always** runs\n- Test with a **hard-coded** value, test **every** path, then switch to random\n- **Meaningful names** (F2 to rename) and clean **formatting**\n- README: honest, accurate, with a real example run\n\n---\n\n## 📝 Quiz\n\n1. You type `abc`, `7`, `9` into the PIN lock (correct PIN `9`). What's `tries` at the end, and why?\n2. What goes wrong if you put `int secretNumber = Random.Shared.Next(1, 101);` **inside** the `while` loop?\n3. Why does the guessing loop not need a final `else` for \"correct\"?\n4. This prints **two** lines on a first-try win. Why?\n   ```csharp\n   if (numberOfAttempts == 1)\n   {\n       Console.WriteLine(\"First try!\");\n   }\n   Console.WriteLine($\"Correct in {numberOfAttempts} attempts.\");\n   ```\n5. The `TryParse` fails and sets `guessNumber` to `0`. Why is that safe in this game? When would it **not** be safe?\n\n<details>\n<summary>Answers<\/summary>\n\n1. **2**. `abc` fails `TryParse`, goes to the `else`, and `tries++` never runs for it. `7` and `9` are counted.\n2. A new secret is picked on **every** guess, so the clues (\"too high\", \"too low\") are about a number that keeps changing. (Declaring it inside also puts it **out of scope** for the `while (...)` check, which gives **CS0103**.)\n3. When the guess equals the secret, nothing needs to print **inside** the loop: the `while` check becomes false, the loop ends, and the success message **after** the loop prints.\n4. The second `Console.WriteLine` is not inside an `else`, so it runs every time, even after \"First try!\". Put it in an `else`.\n5. The secret is from 1 to 100, so it's **never 0**, and a failed parse can never accidentally \"win\". It would **not** be safe if 0 could be a correct answer: then typing `abc` would end the loop.\n\n<\/details>\n"}, {"id": "1.8", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/08-for-loop.md", "title": "The for loop", "md": "# Chapter 1.8: The for loop\n\n> Learned: Tue 13 Oct 2026 · Code: `lessons/phase-01/13-for-loop`, `14-times-table`\n\n---\n\n## 🧸 LKG story\n\n**The teacher says: \"Run around the playground 5 times.\"**\n\nYou count on your fingers:\n\n1. **Start:** one finger up. You do this **once**, before the first lap.\n2. **Check:** \"Is my count 5 or less?\" Yes → run a lap.\n3. **After each lap:** put up one more finger.\n4. Check again… When the check says **no**, you stop.\n\nA `while` loop is \"keep going **until something happens**\". You don't know how many rounds it will take (like guessing a secret number).\nA `for` loop is \"do it **this many times**\". You **know the count** before you start.\n\n**The piggy bank:** to add up all your pocket money, you need **one** piggy bank that sits on the shelf for the whole week. If you buy a **new, empty** piggy bank every day, you'll never save anything. The piggy bank must be ready **before** the week starts.\n\n🎬 **Animation idea:** a running track with a lap counter and three dials: Start, Check and Step. Press \"Next step\" and the matching part of the `for` line lights up in order: start (only once), check, body (the runner does a lap and the number prints), step, check… A check counter shows that the condition is checked one time more than the body runs. Changing `<=` to `<` shows an off-by-one: one lap goes missing.\n\n---\n\n## 💻 Real explanation\n\n### 1. The `for` loop\n\n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine($\"Lap {i}\");\n}\n```\n\nThe `( )` holds **3 parts**, separated by `;`:\n\n| Part | Code | When it runs | Real term |\n|---|---|---|---|\n| ① Start | `int i = 1` | **once**, before everything | **initializer** |\n| ② Check | `i <= 5` | **before every** iteration | **condition** |\n| ③ Step | `i++` | **after every** iteration | **iterator** |\n\n**The order:** ① → ② → body → ③ → ② → body → ③ → ② … until ② is `false`.\n\n`i` is the **loop counter** (or **loop variable**). By habit it's called `i` (for \"index\").\n\n⚠️ Two words that look alike:\n- **iteration** = **one trip** around the loop\n- **iterator** = the **step part** (`i++`)\n\n### 2. A `for` is a `while` with everything on one line\n\nThese two do exactly the same thing:\n\n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine($\"Lap {i}\");\n}\n```\n\n```csharp\nint i = 1;               // ① initializer\nwhile (i <= 5)           // ② condition\n{\n    Console.WriteLine($\"Lap {i}\");\n    i++;                 // ③ iterator\n}\n```\n\n`for` keeps the 3 counter parts **together**, so it's harder to forget `i++` (in a `while`, forgetting it means an **infinite loop**).\n\n**When to use which:**\n\n| You know the count before you start? | Use | Example I built |\n|---|---|---|\n| Yes (\"10 rows\", \"5 laps\") | `for` | Times Table |\n| No (\"until the guess is right\") | `while` | Number Guessing Game |\n\n### 3. Counting down and other steps\n\nThe iterator doesn't have to be `i++`:\n\n```csharp\nfor (int i = 5; i >= 1; i--)\n{\n    Console.WriteLine(i);\n}\nConsole.WriteLine(\"🚀 Liftoff!\");\n```\n```\n5\n4\n3\n2\n1\n🚀 Liftoff!\n```\n\n```csharp\nfor (int i = 2; i <= 10; i += 3)\n{\n    Console.Write($\"{i} \");\n}\n```\n```\n2 5 8\n```\n\n### 4. Tracing: the body runs **before** the iterator\n\nThe **first** time the body runs, `i` still has its **initializer** value. That's why the code above prints **2** first, not 5.\n\n| `i` at the check | `i <= 10`? | Prints | `i` after `i += 3` |\n|---|---|---|---|\n| 2 | true | `2` | 5 |\n| 5 | true | `5` | 8 |\n| 8 | true | `8` | 11 |\n| 11 | **false** | nothing, the loop exits | – |\n\nCount the checks: the body ran **3** times, and the condition was checked **4** times.\n\n> A loop with **N** iterations checks its condition **N + 1** times. The extra check is the `false` one that ends the loop.\n\n**The most common style** starts at **0** and uses `<`:\n\n```csharp\nfor (int i = 0; i < 3; i++)   // i = 0, 1, 2 → runs 3 times\n{\n    Console.WriteLine(\"Hi\");\n}\n```\n\nYou'll see this one everywhere once we reach arrays (they start counting at 0).\n\n### 5. Off-by-one: `<` vs `<=`\n\n```csharp\nfor (int i = 10; i > 4; i -= 2)  { Console.Write($\"{i} \"); }   // 10 8 6\nfor (int i = 10; i >= 4; i -= 2) { Console.Write($\"{i} \"); }   // 10 8 6 4\n```\n\n`4 > 4` is **false**, so 4 is **not** printed. `4 >= 4` is **true**, so it is.\nA loop that runs **one time too many or too few** has an **off-by-one error**. `<` vs `<=` (or `>` vs `>=`) decides it.\n\n### 6. Scope: `i` dies at the `}`\n\n```csharp\nfor (int i = 1; i <= 3; i++)\n{\n    Console.WriteLine(i);\n}\nConsole.WriteLine(i);   // ❌ CS0103: The name 'i' does not exist in the current context\n```\n\nA variable lives only inside the `{ }` (or the `for ( )`) where it was **declared**. That's its **scope**.\n\n### 7. The accumulator: adding things up\n\nTo add things up in a loop, you need a variable that is **declared before** the loop and **updated inside** it.\n\n```csharp\nint total = 0;             // the piggy bank: declared BEFORE the loop\n\nfor (int i = 1; i <= 4; i++)\n{\n    total += i;            // same as: total = total + i\n}\n\nConsole.WriteLine($\"Total: {total}\");\n```\n```\nTotal: 10\n```\n\nTrace it as **old total + i**. Each row starts from the row above:\n\n| `i` | `total` before | `total + i` | `total` after |\n|---|---|---|---|\n| 1 | 0 | 0 + 1 | 1 |\n| 2 | 1 | 1 + 2 | 3 |\n| 3 | 3 | 3 + 3 | 6 |\n| 4 | 6 | 6 + 4 | 10 |\n\n`total` is called an **accumulator**. `+=` is the **compound assignment operator**.\n\n⚠️ `total += 1` and `total += i` look alike, but they're very different:\n- `total += 1` adds **one** each time → **counts** the iterations (1, 2, 3, 4 → **4**)\n- `total += i` adds **the counter** → **sums** them (1, 3, 6, 10 → **10**)\n\n**Why \"before the loop\"?** Two reasons:\n\n```csharp\nfor (int i = 1; i <= 4; i++)\n{\n    int total = 0;     // ❌ a NEW empty piggy bank every iteration\n    total += i;\n}\nConsole.WriteLine($\"Total: {total}\");   // ❌ CS0103: total doesn't exist out here\n```\n\n1. It **resets to 0** on every iteration, so it can never grow.\n2. It **dies at the `}`**, so you can't print it after the loop (**CS0103**).\n\n🎬 **Animation idea:** a piggy bank on a shelf and a coin chute. Each iteration a coin with the value of `i` drops in, and the total under the bank grows: 1, 3, 6, 10. A switch moves `int total = 0;` inside the loop: now a brand-new empty piggy bank appears every round, the old one vanishes, and at the end the print line turns red with \"CS0103: The name 'total' does not exist\". A second switch changes `+= i` to `+= 1`, and the coins all become 1s, so the total only counts the laps.\n\n### 8. Full example: Times Table (with a guard clause)\n\n```csharp\nConsole.Write(\"Which times table? \");\nstring? input = Console.ReadLine();\n\nif (!int.TryParse(input, out int number))\n{\n    Console.WriteLine(\"That's not a number.\");\n    return;\n}\n\nint sum = 0;\nfor (int i = 1; i <= 10; i++)\n{\n    int answer = number * i;\n    Console.WriteLine($\"{number} x {i} = {answer}\");\n    sum += answer;\n}\nConsole.WriteLine($\"Sum of all answers: {sum}\");\n```\n```\nWhich times table? 7\n7 x 1 = 7\n7 x 2 = 14\n...\n7 x 10 = 70\nSum of all answers: 385\n```\n```\nWhich times table? hello\nThat's not a number.\n```\n\nTwo new things in it:\n\n- **`!`** is the **logical NOT operator**: it flips `true` ↔ `false`. `TryParse` returns `false` for `hello`, and `!` turns that into `true`, so the error block runs.\n- **`return;`** ends the program right there. This is an **early return**. An `if` at the top that checks for bad input and returns early is called a **guard clause**. Without the `return`, the program would print the error **and then** carry on with `number = 0`, printing `0 x 1 = 0` … `Sum of all answers: 0`.\n\nNote that `answer` is declared **inside** the loop, and that's fine: it's only needed for one iteration. `sum` is declared **outside**, because it must survive all 10.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| `for` loop | `for (int i = 1; i <= 5; i++) { ... }` | **exactly the same** |\n| `var` counter | `for (var i = 0; i < 3; i++)` | `for (var i = 0; i < 3; i++)` |\n| Print inside | `print('Lap $i');` | `Console.WriteLine($\"Lap {i}\");` |\n| `+=`, `-=`, `++`, `--` | yes | yes |\n| `!` (NOT) | `if (!isValid)` | `if (!isValid)` |\n| Guard clause | `if (number == null) { print('Not a number'); return; }` | `if (!int.TryParse(...)) { ...; return; }` |\n| Loop variable after the loop | out of scope | out of scope (**CS0103**) |\n\n```dart\n// Dart\nfor (int i = 5; i >= 1; i--) {\n  print(i);\n}\nprint('🚀 Liftoff!');\n```\n```csharp\n// C#\nfor (int i = 5; i >= 1; i--)\n{\n    Console.WriteLine(i);\n}\nConsole.WriteLine(\"🚀 Liftoff!\");\n```\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| Expected `Total: 10`, got `Total: 4` | Typed `total += 1` (the number one) instead of `total += i` (the letter i) | `+= i` to **sum**; `+= 1` only **counts** |\n| **CS0103** \"The name 'total' does not exist in the current context\" | `int total = 0;` was moved **inside** the loop, so it died at the `}` | Declare the accumulator **before** the loop |\n| Times Table: no \"Sum of all answers\" line, but I said \"done\" | The sum was **calculated** but never **printed** | Add the `WriteLine` **after** the loop's `}`. \"Done\" = my output matches the **expected** output line by line |\n| `That is not a number` → `This is not a number` | Retyped the spec's text instead of copying it | **Copy-paste** exact text from the spec: `That's not a number.` |\n| Quiz: thought `for (int i = 0; i < 3; i++)` prints 2 times | Forgot that `i = 0` is also a trip | 0, 1, 2 = **3** times (4 checks) |\n| Quiz: thought `for (int i = 2; ...; i += 3)` prints 5 first | Thought the iterator runs first | The **body runs before the iterator**: the first value is the **initializer** (2) |\n| Trace said \"4 > 4 false, stop\" but my answer still listed 4 | Wrote the output from memory, not from the table's print column | The output = **only** the rows where the body ran |\n| Called `i++` the \"iteration\" | **Iteration** = one trip; **iterator** = the step part | ① initializer, ② condition, ③ **iterator** |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| run this many times | **`for` loop** / counting loop | \"We know the count up front, so use a `for` loop.\" |\n| ① start | **initializer** | \"The initializer runs only once.\" |\n| ② check | **condition** | \"The condition is checked before every iteration.\" |\n| ③ step | **iterator** | \"The iterator is `i += 3`, so it skips.\" |\n| one trip around | **iteration** | \"On the third iteration, `i` is 8.\" |\n| `i` | **loop counter** / **loop variable** | \"Don't use the loop counter after the loop, it's out of scope.\" |\n| the piggy bank | **accumulator** | \"Initialize the accumulator before the loop, otherwise it resets on every iteration.\" |\n| `+=` | **compound assignment operator** | \"Use `sum += answer` instead of `sum = sum + answer`.\" |\n| one too many / too few | **off-by-one error** | \"`4 > 4` is false, so it's an off-by-one, use `>=`.\" |\n| where a variable lives | **scope** | \"CS0103 means it's out of scope, declare it before the block.\" |\n| `!` | **logical NOT operator** | \"`!` negates the TryParse result.\" |\n| bad input check at the top + `return` | **guard clause** + **early return** | \"Add a guard clause, so the happy path isn't nested in an `else`.\" |\n| the extra false check | the **final evaluation** of the condition | \"The condition is evaluated once more than the body runs.\" |\n\n---\n\n## 📋 Summary\n\n- `for (initializer; condition; iterator) { body }`\n- Order: initializer (**once**) → condition → **body** → iterator → condition → …\n- The first body run uses the **initializer** value\n- N iterations = **N + 1** condition checks\n- `for` when you **know the count**, `while` when you loop **until** something happens\n- `<` vs `<=` decides the last value: watch for **off-by-one**\n- The loop variable dies at the `}` (**scope**, **CS0103**)\n- **Accumulator:** declare **before** the loop, update **inside**, print **after**\n- `+= i` sums, `+= 1` counts\n- **Guard clause:** `if (!int.TryParse(...)) { ...; return; }` at the top\n\n---\n\n## 📝 Quiz\n\n1. Name the 3 parts of `for ( ___ ; ___ ; ___ )` with their real terms. Which one runs only once?\n2. How many times does this print `Hi`, and how many times is the condition checked?\n   ```csharp\n   for (int i = 0; i < 4; i++) { Console.WriteLine(\"Hi\"); }\n   ```\n3. What does this print?\n   ```csharp\n   for (int i = 1; i < 10; i += 4) { Console.Write($\"{i} \"); }\n   ```\n4. What's wrong here? Name the error and give two reasons it's a bad idea.\n   ```csharp\n   for (int i = 1; i <= 3; i++) { int sum = 0; sum += i; }\n   Console.WriteLine(sum);\n   ```\n5. In the Times Table, what would happen with input `hello` if you deleted the `return;`?\n\n<details>\n<summary>Answers<\/summary>\n\n1. **Initializer**, **condition**, **iterator**. The initializer runs only once.\n2. `i` = 0, 1, 2, 3 → **4** times `Hi`, and **5** checks (the 5th, `4 < 4`, is false).\n3. `1 5 9`. The next value, 13, fails `13 < 10`.\n4. `sum` is declared **inside** the loop. **CS0103**: `sum` doesn't exist after the `}`. And even without the error, it would **reset to 0** on every iteration. Declare it before the loop.\n5. It would print `That's not a number.` and then keep going with `number = 0`: `0 x 1 = 0` … `0 x 10 = 0`, `Sum of all answers: 0`.\n\n<\/details>\n"}];

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hashFor = (id) => "ch-" + id.replace(".", "-");
const hex7 = () => Array.from({ length: 7 }, () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");

/* ---------------- navigation ---------------- */
function renderToc(activeId) {
  const byPhase = groupByPhase();
  let html = '<a class="home-link" href="#home"' + (activeId ? "" : ' aria-current="page"') + ">Home: my progress</a>";
  for (const [phase, list] of byPhase) {
    html += "<h3>Phase " + phase + ": " + esc(list[0].phaseName) + "</h3>";
    for (const ch of list) {
      html += '<a href="#' + hashFor(ch.id) + '"' + (ch.id === activeId ? ' aria-current="page"' : "") +
        '><span class="num">' + ch.id + "</span><span>" + esc(ch.title) + "</span></a>";
    }
  }
  $("#toc").innerHTML = html;
}

function groupByPhase() {
  const map = new Map();
  for (const ch of CHAPTERS) {
    if (!map.has(ch.phase)) map.set(ch.phase, []);
    map.get(ch.phase).push(ch);
  }
  return map;
}

function route() {
  const h = location.hash.slice(1);
  const ch = h.startsWith("ch-") ? CHAPTERS.find((c) => hashFor(c.id) === h) : null;
  if (ch) renderChapter(ch); else renderHome();
  closeMenu();
  window.scrollTo(0, 0);
  try { localStorage.setItem("lastView", h); } catch (e) {}
}

const menuBtn = $("#menuBtn");
function closeMenu() { $("#toc").classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => {
  const open = $("#toc").classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
});

  const r = score / max;

}

      "</div></div></li>";

function quizChart(quizzes) {
  const W = 640, H = 240, left = 34, right = 10, top = 14, bottom = 58;
  const plotW = W - left - right, plotH = H - top - bottom;
  const slot = plotW / quizzes.length, barW = Math.min(36, slot * 0.6);
  const y = (v) => top + plotH - (v / 5) * plotH;
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Quiz scores by day">';
  for (let t = 0; t <= 5; t++) {
    svg += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (left - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">' + t + "</text>";
  }
  let prevDay = null;
  quizzes.forEach((q, i) => {
    const cx = left + slot * i + slot / 2;
    const color = q.score / q.max >= 0.7 ? "var(--ok)" : q.score / q.max >= 0.5 ? "var(--warn)" : "var(--bad)";
    svg += '<rect x="' + (cx - barW / 2) + '" y="' + y(q.score) + '" width="' + barW + '" height="' + (y(0) - y(q.score)) + '" rx="4" fill="' + color + '"><title>' + esc(q.name) + ": " + q.score + "/5</title></rect>" +
      '<text x="' + cx + '" y="' + (y(q.score) - 5) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono, monospace">' + q.score + "</text>";
    if (q.day !== prevDay) {
      svg += '<text x="' + cx + '" y="' + (H - bottom + 18) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">Day ' + q.day + "</text>";
      prevDay = q.day;
    }
    const short = q.name.replace(/ quiz$/i, "");
    svg += '<text x="' + cx + '" y="' + (H - bottom + 34) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Bricolage Grotesque, sans-serif">' + esc(short.length > 14 ? short.slice(0, 13) + "…" : short) + "</text>";
  });
  return svg + "</svg>";
}

function renderChapter(ch) {
  renderToc(ch.id);
  const view = $("#view");
  const body = window.marked ? marked.parse(ch.md.replace(/^# .+\n/, "")) : "<pre>" + esc(ch.md) + "</pre>";
  view.innerHTML = '<article class="chapter"><header class="chapter-head"><span class="eyebrow">Chapter ' + ch.id +
    " · Phase " + ch.phase + ": " + esc(ch.phaseName) + "</span><h1>" + esc(ch.title) + "</h1></header><div class=\"chapter-body\"></div></article>";
  const holder = $(".chapter-body", view);
  holder.innerHTML = body;

  // the "> Learned: ..." line right under the title
  const first = holder.firstElementChild;
  if (first && first.tagName === "BLOCKQUOTE") first.classList.add("meta");

  // wrap each h2 and what follows it in a <section>
  let current = null;
  for (const node of [...holder.childNodes]) {
    if (node.nodeType === 1 && node.tagName === "H2") {
      current = document.createElement("section");
      const kind = SECTION_KIND[[...node.textContent.trim()][0]];
      if (kind) current.className = kind;
      holder.insertBefore(current, node);
    }
    if (current) current.appendChild(node);
  }

  holder.querySelectorAll("table").forEach((t) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });

  holder.querySelectorAll("pre code").forEach((el) => {
    const lang = ((el.className.match(/language-(\w+)/) || [])[1] || "").toLowerCase();
    if (window.hljs && lang && hljs.getLanguage(lang)) hljs.highlightElement(el);
  });

  holder.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (/\.md(#.*)?$/.test(href)) {
      const name = href.split("/").pop().replace(/#.*$/, "");
      const target = CHAPTERS.find((c) => c.file.endsWith(name));
      if (target) a.setAttribute("href", "#" + hashFor(target.id));
    } else if (/^https?:/.test(href)) {
      a.target = "_blank";
      a.rel = "noopener";
    }
  });

  // 🎬 notes become playable animations
  let n = 0;
  holder.querySelectorAll("p").forEach((p) => {
    if (!p.textContent.trim().startsWith("🎬")) return;
    const make = (WIDGETS[ch.id] || [])[n++];
    const fig = document.createElement("figure");
    fig.className = "anim";
    fig.innerHTML = '<div class="anim-tag">🎬 ' + (make ? "Try it" : "Animation idea") + '</div><div class="anim-stage"></div>' +
      "<figcaption>" + p.innerHTML.replace(/^🎬\s*<strong>Animation idea:<\/strong>\s*/, "") + "</figcaption>";
    p.replaceWith(fig);
    const stage = $(".anim-stage", fig);
    if (make) make(stage); else stage.remove();
  });

  const i = CHAPTERS.indexOf(ch);
  const prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  const pager = document.createElement("nav");
  pager.className = "pager";
  pager.innerHTML =
    (prev ? '<a href="#' + hashFor(prev.id) + '"><small>← Chapter ' + prev.id + "</small><b>" + esc(prev.title) + "</b></a>" : "<span></span>") +
    (next ? '<a class="next" href="#' + hashFor(next.id) + '"><small>Chapter ' + next.id + " →</small><b>" + esc(next.title) + "</b></a>" : "");
  $(".chapter", view).appendChild(pager);
}

function lapCounter(stage) {
  let start, op, end, inc, i, phase, laps, checks, out, done;
  stage.innerHTML =
    '<div class="control"><label for="lc-s">Start</label><input id="lc-s" type="range" min="0" max="5" value="1"><output></output></div>' +
    '<div class="control"><label for="lc-e">End</label><input id="lc-e" type="range" min="1" max="8" value="5"><output></output>' +
    '<label class="check"><input id="lc-o" type="checkbox" checked> use <b>&lt;=</b> (off: <b>&lt;</b>)</label></div>' +
    '<div class="control"><label for="lc-k">Step</label><input id="lc-k" type="range" min="1" max="3" value="1"><output></output></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next step</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const s = $("#lc-s", stage), e = $("#lc-e", stage), o = $("#lc-o", stage), k = $("#lc-k", stage);
  const code = $(".codebox", stage), track = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  const pass = () => (op === "<=" ? i <= end : i < end);
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    code.innerHTML =
      "for (" + L("init", "int i = " + start) + "; " + L("check", "i " + op.replace("<", "&lt;") + " " + end) + "; " +
      L("step", inc === 1 ? "i++" : "i += " + inc) + ")\n{\n" + L("body", '    Console.WriteLine($"Lap {i}");') + "\n}";
  }
  function drawTrack() {
    track.innerHTML = "<div><small>Laps</small><span>" + ("🏃".repeat(laps) || "<small>none yet</small>") + "</span></div>" +
      "<div><small>i</small><span><small>" + (phase === "init" ? "–" : i) + "</small></span></div>" +
      "<div><small>Checks</small><span><small>" + checks + "</small></span></div>";
  }
  function reset() {
    start = +s.value; end = +e.value; inc = +k.value; op = o.checked ? "<=" : "<";
    s.nextElementSibling.textContent = start; e.nextElementSibling.textContent = end; k.nextElementSibling.textContent = inc;
    phase = "init"; laps = 0; checks = 0; out = []; done = false;
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode(); drawTrack();
    say("", "Press Next step. Watch the order: initializer, condition, body, iterator.");
  }
  function step() {
    if (done) return;
    if (phase === "init") {
      i = start; phase = "check"; drawCode("init");
      say("", "① Initializer: i = " + i + ". This runs only once.");
    } else if (phase === "check") {
      checks++; drawCode("check");
      if (pass()) { phase = "body"; say("good", "② Condition: " + i + " " + op + " " + end + " is true, so the body runs."); }
      else {
        done = true;
        say("warn", "② Condition: " + i + " " + op + " " + end + " is false, so the loop exits. " + laps + " lap" + (laps === 1 ? "" : "s") + ", " + checks + " checks: always one check more than laps." +
          (op === "<" ? " Tick <= to include " + end + " (off-by-one)." : ""));
      }
    } else if (phase === "body") {
      laps++; out.push("Lap " + i); phase = "step"; drawCode("body");
      say("good", "Body: prints Lap " + i + ". The body uses i BEFORE the iterator changes it.");
    } else {
      i += inc; phase = "check"; drawCode("step");
      say("", "③ Iterator: i is now " + i + ". Back to the condition.");
    }
    drawTrack();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 100) step(); }
    if (a === "reset") reset();
  });
  [s, e, k].forEach((x) => x.addEventListener("input", reset));
  o.addEventListener("change", reset);
  reset();
}

function piggyBank(stage) {
  let inside, plusOne, i, total, out, done, coins;
  stage.innerHTML =
    '<div class="control"><label class="check"><input id="pb-in" type="checkbox"> move <b>int total = 0;</b> inside the loop</label>' +
    '<label class="check"><input id="pb-one" type="checkbox"> <b>total += 1</b> instead of <b>+= i</b></label></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next iteration</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const inBox = $("#pb-in", stage), oneBox = $("#pb-one", stage);
  const code = $(".codebox", stage), bank = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    const add = plusOne ? "total += 1;" : "total += i;";
    code.innerHTML = [
      inside ? null : L("decl", "int total = 0;"),
      "for (int i = 1; i &lt;= 4; i++)",
      "{",
      inside ? L("decl", "    int total = 0;") : null,
      L("body", "    " + add),
      "}",
      L("print", 'Console.WriteLine($"Total: {total}");'),
    ].filter((x) => x !== null).join("\n");
  }
  function drawBank() {
    bank.innerHTML = "<div><small>Coins in</small><span>" + (coins.map((c) => "🪙" + c).join(" ") || "<small>empty</small>") + "</span></div>" +
      "<div><small>Bank</small><span>🐷 <small>total = " + total + "</small></span></div>";
  }
  function reset() {
    inside = inBox.checked; plusOne = oneBox.checked;
    i = 1; total = 0; out = []; done = false; coins = [];
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode("decl"); drawBank();
    say(inside ? "warn" : "", inside
      ? "The piggy bank is now born INSIDE the loop. (Real C# won't even build this. Step through to see why.)"
      : "The piggy bank (accumulator) is ready BEFORE the loop. Press Next iteration.");
  }
  function step() {
    if (done) return;
    if (i <= 4) {
      if (inside) { total = 0; coins = []; }
      const coin = plusOne ? 1 : i;
      coins.push(coin); total += coin;
      drawCode("body");
      say(inside ? "warn" : "good", inside
        ? "i = " + i + ": a NEW empty piggy bank, then +" + coin + ", so total = " + total + ". It resets every iteration and can never grow."
        : "i = " + i + ": old total " + (total - coin) + " + " + coin + " = " + total + "." + (plusOne ? " Adding 1 only counts the iterations." : ""));
      i++;
    } else {
      done = true; drawCode("print");
      if (inside) {
        term.innerHTML = '<span class="bad">error CS0103: The name \'total\' does not exist in the current context</span>';
        say("bad", "total died at the } of the loop, so the print line can't see it. Two reasons, one rule: declare the accumulator BEFORE the loop.");
      } else {
        out.push("Total: " + total);
        term.textContent = out.join("\n");
        say(plusOne ? "warn" : "good", plusOne
          ? "Total: 4. With += 1 the bank counted the laps instead of summing 1 + 2 + 3 + 4. Use += i."
          : "Total: 10. Declared before, updated inside, printed after.");
      }
    }
    drawBank();
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 20) step(); }
    if (a === "reset") reset();
  });
  inBox.addEventListener("change", reset);
  oneBox.addEventListener("change", reset);
  reset();
}

    '<div class="zone" data-z="desk"><h5>Desk<small>working directory</small></h5><div class="list"></div></div>' +

    "</div>" +

    '<button class="btn primary" data-a="add">git add .</button><button class="btn primary" data-a="commit">git commit</button><button class="btn primary" data-a="push">git push</button></div>' +
    '<div class="term"><span class="dim">$ git status</span>\nnothing to commit, working tree clean</div>';

    $(".list", zone("box")).innerHTML = [...st.staged].map((f) => '<div class="item staged">' + f + "</div>").join("");
    const row = (c) => '<div class="item"><b>' + c.id + "</b> " + esc(c.msg) + "</div>";
    $(".list", zone("album")).innerHTML = [...st.commits].reverse().map(row).join("");

      if (!st.staged.size) {
        term.innerHTML = '<span class="dim">$ git commit -m "..."</span>\n' + (st.mod.size ? 'no changes added to commit (use "git add")' : "nothing to commit, working tree clean");

function shapeSorter(stage) {
  const values = [
    { code: "3", type: "int" }, { code: "2.5", type: "double" }, { code: "1.350m", type: "decimal" },
    { code: "'B'", type: "char" }, { code: '"Hi"', type: "string" }, { code: "true", type: "bool" },
  ];
  const boxes = ["int", "double", "decimal", "bool", "char", "string"];
  const cast = (from, to) => "error CS0266: Cannot implicitly convert type '" + from + "' to '" + to + "'. An explicit conversion exists (are you missing a cast?)";
  const nope = (from, to) => "error CS0029: Cannot implicitly convert type '" + from + "' to '" + to + "'";
  function judge(v, box) {
    if (v.type === box) return ["good", "Fits! A " + box + " box holds exactly this."];
    const t = v.type;
    if (t === "int" && (box === "double" || box === "decimal")) return ["good", "Fits automatically: int → " + box + " is a safe pour (implicit conversion), nothing is lost."];
    if (t === "int" && box === "char") return ["bad", cast("int", "char")];
    if (t === "double" && box === "decimal") return ["bad", "error CS0664: Literal of type double cannot be implicitly converted to type 'decimal'; use an 'M' suffix. Write 2.5m."];
    if (t === "double" && (box === "int" || box === "char")) return ["bad", cast("double", box) + " The decimal part would be lost, so C# wants you to decide."];
    if (t === "decimal" && (box === "int" || box === "double" || box === "char")) return ["bad", cast("decimal", box)];
    if (t === "char" && (box === "int" || box === "double" || box === "decimal")) return ["warn", "Surprise: it compiles, but the box gets 66, the character's number code. Real code almost never wants this."];
    return ["bad", nope(t, box)];
  }
  let picked = values[0];
  stage.innerHTML =
    '<div class="control">1. Pick a value:</div><div class="pick" data-p="v">' +
    values.map((v, i) => '<button class="btn" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(v.code) + "</button>").join("") + "</div>" +
    '<div class="control">2. Drop it into a box:</div><div class="pick" data-p="b">' +
    boxes.map((b) => '<button class="btn" data-b="' + b + '">' + b + "</button>").join("") + "</div>" +
    '<div class="codebox"></div><div class="verdict">Pick a value, then a box.</div>';
  const verdict = $(".verdict", stage), code = $(".codebox", stage);
  const vRow = $('[data-p="v"]', stage), bRow = $('[data-p="b"]', stage);
  const showCode = (box) => { code.textContent = (box || "____") + " x = " + picked.code + ";"; };
  vRow.addEventListener("click", (e) => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    picked = values[+i];
    vRow.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b === e.target)));
    showCode();
    verdict.className = "verdict";
    verdict.textContent = "Now pick a box for " + picked.code + ".";
  });
  bRow.addEventListener("click", (e) => {
    const box = e.target.dataset.b;
    if (!box) return;
    const [kind, msg] = judge(picked, box);
    showCode(box);
    verdict.className = "verdict " + kind;
    verdict.textContent = (kind === "good" ? "✅ " : kind === "warn" ? "⚠️ " : "❌ ") + msg;
    if (kind === "bad") { verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake"); }
  });
  showCode();
}

function twoMachines(stage) {

  const lightCases = [["red"], ["yellow"], ["green"], ["flashing", "off"]];
  const lightOut = ["Stop", "Slow down", "Go", "Drive carefully"];
  function drawStatement(hit) {
    let lines = ["switch (light)", "{"];
    lightCases.forEach((vals, i) => {

      vals.forEach((v) => lines.push('<span class="' + cls + '">    case "' + v + '":</span>'));
      lines.push('<span class="' + cls + '">        Console.WriteLine("' + lightOut[i] + '"); break;</span>');
    });

      const cls = hit === -1 ? "hit" : hit !== undefined ? "miss" : "";
      lines.push('<span class="' + cls + '">    default:</span>', '<span class="' + cls + '">        Console.WriteLine("Unknown light"); break;</span>');
    }
    lines.push("}");
    sCode.innerHTML = lines.join("\n");
  }
  function arms() {
    return [
      { pats: ["A", "B"], out: "Great job!" },
      { pats: typo ? ["B", "D"] : ["C", "D"], out: "You passed." },
      { pats: ["F"], out: "Try again." },
    ];
  }
  function drawExpression(hit) {
    const list = arms();
    let lines = ["string comment = grade switch", "{"];
    list.forEach((a, i) => {
      const cls = hit === i ? "hit" : hit !== undefined ? "miss" : "";
      lines.push('<span class="' + cls + '">    ' + a.pats.map((p) => "'" + p + "'").join(" or ") + ' => "' + a.out + '",</span>');
    });
    if (hasDiscard) {
      const cls = hit === -1 ? "hit" : hit !== undefined ? "miss" : "";

    lines.push("};");

  });

    if (i >= 0) { drawExpression(i); eOut.innerHTML = "comment = \"" + list[i].out + "\""; }
    else if (hasDiscard) {
      drawExpression(-1);
      eOut.innerHTML = 'comment = "Invalid"' + (typo && g === "C" ? '\n<span class="bad">⚠ A C student sees "Invalid". The _ arm hid the missing \'C\' case. _ is a safety net, not a fix.</span>' : "");
    } else {
      drawExpression(null);
      eOut.innerHTML = '<span class="bad">Unhandled exception. System.Runtime.CompilerServices.SwitchExpressionException:\nNon-exhaustive switch expression failed to match its input.\nUnmatched value was ' + g + ".</span>";
      eOut.classList.remove("shake"); void eOut.offsetWidth; eOut.classList.add("shake");

  });
  stage.addEventListener("change", (e) => {

    }
  });
  drawStatement();
  drawExpression();
}

      out.push("Eating... " + bites + " bites left"); bites--;
      out.push("Plate empty! Go play"); done = true; drawCode("after");
      say("warn", "The loop body was the empty ;, so the { } block ran once on its own (and bites even went to " + bites + "). Then the next line ran.");
    } else if (bites > 0) {
      round++;
      if (stray) {
        drawCode("check");
        say("bad", "Round " + round + ": " + bites + " > 0 is true. The body is the empty ;, so nothing happens and bites stays " + bites + ". The condition can never become false: infinite loop.");
        if (round >= 8) { done = true; say("bad", "💥 The app hangs: round " + round + " and counting, bites is still " + bites + ". In a real terminal you press Ctrl+C. Fix: delete the ;"); }
      } else {
        out.push("Eating... " + bites + " bites left"); bites--;
        drawCode("body");
        say("good", "Round " + round + ": " + (bites + 1) + " > 0 is true, so the body runs. bites is now " + bites + ".");
      }
    } else {
      drawCode("check");
      if (stray) { inBlock = true; say("", "Check: " + bites + " > 0 is false, so the (empty) loop ends. Next: the { } block that was cut off from the loop."); }
      else {
        out.push("Plate empty! Go play"); done = true; drawCode("after");
        say(round === 0 ? "warn" : "good", "Check: 0 > 0 is false, so C# jumps past the }. " + (round === 0 ? "Zero iterations: the body never ran." : "The body ran " + round + " times, and \"Eating... 0\" never printed."));
      }
    }
    drawPlate();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (e) => {
    const a = e.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 50) step(); }
    if (a === "reset") reset();
  });
  b.addEventListener("input", reset);
  s.addEventListener("change", reset);
  reset();
}

function rollUntilSix(stage) {
  let start = 0, after = false, force = false;
  stage.innerHTML =
    '<div class="control">rolls starts at:</div><div class="pick" data-p="start"><button class="btn" data-v="0" aria-pressed="true">int rolls = 0;</button><button class="btn" data-v="1" aria-pressed="false">int rolls = 1;</button></div>' +
    '<div class="control">rolls++ goes:</div><div class="pick" data-p="order"><button class="btn" data-v="before" aria-pressed="true">before the print</button><button class="btn" data-v="after" aria-pressed="false">after the print</button></div>' +
    '<label class="check"><input type="checkbox" data-t="force"> force a 6 (hard-code Next(6, 7) to test the first-try branch)</label>' +
    '<div class="codebox"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">dotnet run</button></div>' +
    '<div class="term"><span class="dim">Press dotnet run.</span></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function drawCode() {
    const inc = "    rolls++;";
    code.textContent = [
      "int rolls = " + start + ";",
      "int dice = 7;",
      "while (dice != 6)",
      "{",
      after ? null : inc,
      "    dice = Random.Shared.Next(" + (force ? "6, 7);   // TEST ONLY" : "1, 7);"),
      '    Console.WriteLine($"Roll {rolls}: {dice}");',
      after ? inc : null,
      "}",
      'if (rolls == 1) Console.WriteLine("Lucky! First try!");',
      'else Console.WriteLine($"🎉 Got a 6 after {rolls} rolls!");',
    ].filter((l) => l !== null).join("\n");
  }
  function run() {
    let rolls = start, dice = 7, guard = 0;
    const lines = [], labels = [];
    while (dice !== 6 && guard++ < 200) {
      if (!after) rolls++;
      dice = force ? 6 : 1 + Math.floor(Math.random() * 6);
      lines.push("Roll " + rolls + ": " + dice);
      labels.push(rolls);
      if (after) rolls++;
    }
    lines.push(rolls === 1 ? "Lucky! First try!" : "🎉 Got a 6 after " + rolls + " rolls!");
    term.textContent = lines.join("\n");
    const real = labels.length, first = labels[0], last = labels[real - 1];
    const problems = [];
    if (first !== 1) problems.push("the labels start at Roll " + first);
    if (rolls !== real) problems.push("the total says " + rolls + " but there were " + real + " rolls");
    if (problems.length) {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ Off-by-one error: " + problems.join(", and ") + ". Count first, then print.";
      verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake");
    } else {
      verdict.className = "verdict good";
      verdict.textContent = "✅ Labels start at 1, and the last label (" + last + ") = the total (" + rolls + ")." + (force ? " Now un-tick \"force a 6\": always revert a hard-coded test value." : "");
    }
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const row = btn.parentElement.dataset.p;
    if (row) {
      btn.parentElement.querySelectorAll(".btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      if (row === "start") start = +btn.dataset.v; else after = btn.dataset.v === "after";
      drawCode();
      term.innerHTML = '<span class="dim">Press dotnet run.</span>';
      verdict.className = "verdict"; verdict.textContent = "";
    }
    if (btn.dataset.a === "run") run();
  });
  stage.addEventListener("change", (e) => { if (e.target.dataset.t === "force") { force = e.target.checked; drawCode(); } });
  drawCode();
}

function pinDoor(stage) {
  const PIN = 4321;
  let outside = false, tries = 0, badCounted = 0, open = false, log = [];
  stage.innerHTML =
    '<div class="control">tries++ goes:</div><div class="pick"><button class="btn" data-v="in" aria-pressed="true">inside the number check</button><button class="btn" data-v="out" aria-pressed="false">before the number check</button></div>' +
    '<div class="codebox"></div>' +
    '<div class="control"><label for="pd-in">Enter PIN:</label><input id="pd-in" type="text" value="abc" autocomplete="off">' +
    '<div class="btn-row"><button class="btn primary" data-a="enter">Enter</button><button class="btn" data-a="reset">Reset door</button></div></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage), inp = $("#pd-in", stage);
  function drawCode() {
    const inc = outside ? "    tries++;" : "        tries++;";
    code.textContent = [
      "while (pin != 4321)",
      "{",
      outside ? inc : null,
      "    if (int.TryParse(input, out pin))",
      "    {",
      outside ? null : inc,
      '        if (pin != 4321) Console.WriteLine("Wrong PIN.");',
      "    }",
      '    else Console.WriteLine("Digits only, please.");',
      "}",
      'Console.WriteLine($"Unlocked after {tries} tries.");',
    ].filter((l) => l !== null).join("\n");
  }
  function draw() {
    term.innerHTML = log.length ? log.join("\n") : '<span class="dim">Try: abc, then 1111, then 4321.</span>';
  }
  function reset() {
    tries = 0; badCounted = 0; open = false; log = [];
    verdict.className = "verdict"; verdict.textContent = "";
    draw();
  }
  function enter() {
    if (open) return;
    const s = inp.value.trim();
    const ok = /^-?\d+$/.test(s);
    if (outside) { tries++; if (!ok) badCounted++; }
    log.push("Enter PIN: " + esc(s));
    if (ok) {
      if (!outside) tries++;
      if (+s !== PIN) log.push("Wrong PIN.");
    } else {
      log.push('<span class="bad">Digits only, please.</span>');
    }
    if (ok && +s === PIN) {
      open = true;
      log.push('<span class="good">🚪 Unlocked after ' + tries + " tries.</span>");
      if (badCounted) {
        verdict.className = "verdict bad";
        verdict.textContent = "❌ " + badCounted + " invalid input" + (badCounted > 1 ? "s were" : " was") + " counted as a try. Move tries++ inside the number check.";
      } else {
        verdict.className = "verdict good";
        verdict.textContent = "✅ Only real numbers were counted: " + tries + " tries.";
      }
    }
    draw();
    inp.select();
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.v) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      outside = btn.dataset.v === "out";
      drawCode(); reset();
    }
    if (btn.dataset.a === "enter") enter();
    if (btn.dataset.a === "reset") reset();
  });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") enter(); });
  drawCode(); draw();
}

function guessGame(stage) {
  let inside = false, secret, attempts, low, high, done, log;
  const pickSecret = () => 1 + Math.floor(Math.random() * 100);
  stage.innerHTML =
    '<div class="control">The line <code>secretNumber = Random.Shared.Next(1, 101);</code> goes:</div>' +
    '<div class="pick"><button class="btn" data-v="above" aria-pressed="true">above the loop (runs once)</button><button class="btn" data-v="inside" aria-pressed="false">inside the loop (every guess)</button></div>' +
    '<div class="control"><label for="gg-in">Your guess:</label><input id="gg-in" type="text" value="50" autocomplete="off">' +
    '<div class="btn-row"><button class="btn primary" data-a="guess">Guess</button><button class="btn" data-a="mid">Middle guess</button><button class="btn" data-a="new">New game</button></div></div>' +
    '<div class="term" style="max-height: 16em; overflow-y: auto"></div><div class="verdict"></div>';
  const term = $(".term", stage), verdict = $(".verdict", stage), inp = $("#gg-in", stage);
  function start() {
    secret = pickSecret(); attempts = 0; low = 1; high = 100; done = false;
    log = ["I'm thinking of a number between 1 and 100."];
    verdict.className = "verdict"; verdict.textContent = "";
    draw();
  }
  function draw() { term.innerHTML = log.join("\n"); term.scrollTop = term.scrollHeight; }
  function guess() {
    if (done) return;
    const s = inp.value.trim();
    log.push("Your guess: " + esc(s));
    if (!/^-?\d+$/.test(s)) {
      log.push('<span class="bad">That\'s not a number. Try again.</span>');
      draw(); return;
    }
    const g = +s;
    attempts++;
    if (inside) {
      const old = secret;
      secret = pickSecret();
      if (secret !== old) log.push('<span class="dim">(the loop ran the Random line again: the secret quietly changed from ' + old + " to " + secret + ")</span>");
    }
    if (g > secret) { log.push("Too high!"); high = Math.min(high, g - 1); }
    else if (g < secret) { log.push("Too low!"); low = Math.max(low, g + 1); }
    else {
      done = true;
      log.push('<span class="good">' + (attempts === 1 ? "🎯 First try! Amazing!" : "🎉 Correct! You got it in " + attempts + " attempts.") + "</span>");
      verdict.className = inside ? "verdict warn" : "verdict good";
      verdict.textContent = inside ? "You won, but only by luck: the secret kept changing. Move the Random line above the loop." : "✅ The secret was picked once and stayed " + secret + " for the whole game.";
    }
    if (!done && low > high) {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ The clues contradict each other (it must be above " + (low - 1) + " and below " + (high + 1) + "). The secret is being overwritten on every guess.";
      verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake");
    }
    draw();
    inp.select();
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.v) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      inside = btn.dataset.v === "inside";
      start();
    }
    if (btn.dataset.a === "guess") guess();
    if (btn.dataset.a === "mid") { inp.value = String(Math.floor((Math.max(low, 1) + Math.min(Math.max(high, low), 100)) / 2)); guess(); }
    if (btn.dataset.a === "new") start();
  });
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") guess(); });
  start();
}
