<script>
const CHAPTERS = [{"id": "0.1", "phase": 0, "phaseName": "Meet .NET + Git", "file": "phase-00/01-meet-dotnet.md", "title": "Meet .NET and your first program", "md": "# Chapter 0.1: Meet .NET and your first program\n\n> Learned: Tue 6 Oct 2026 · Code: `projects/00-greeting-cli`, `lessons/phase-00/notes.md`\n\n---\n\n## 🧸 LKG story\n\n.NET is a **big toy box** from Microsoft. Inside are toys that can become websites, APIs, desktop apps, games and mobile apps.\n\n**C#** is the **language** you speak to the toys. You tell them what to do in C#.\n\nThere are two helpers:\n- The **SDK** is the **toolbox for the builder** (you, the developer). It has tools to create and build apps.\n- The **CLR** is the **engine** inside the toy. It makes the app run on the user's computer.\n\n🎬 **Animation idea:** a developer opens a toolbox (SDK) and builds a toy car. The car drives away on its own, powered by an engine labelled CLR. A user who only *plays* with the car never sees the toolbox.\n\n---\n\n## 💻 Real explanation\n\n| Word | What it really is |\n|---|---|\n| **.NET** | The **platform**: runtime + libraries + tools. Free, open source, runs on Windows, Linux and Mac. |\n| **C#** | The **programming language** you write. (.NET also supports F# and VB, but C# is the main one.) |\n| **SDK** (Software Development Kit) | What **developers** install: the compiler, the `dotnet` command, templates. |\n| **Runtime** / **CLR** (Common Language Runtime) | What **users** need to *run* the app. It runs your compiled code, manages memory (garbage collection), and more. |\n| **.NET Framework** | The **old**, Windows-only version (up to 4.8). Don't learn it for new work. |\n| **Modern .NET** | .NET 5, 6, 7, 8, 9, 10... We use **.NET 10 (LTS** = Long-Term Support, supported for 3 years). |\n\nMy setup: .NET SDK 10.0.401, VS Code, Visual Studio 2026, Git 2.53.\n\n### The three commands you use every day\n\n```\ndotnet new console -o my-app    // create a new console project in folder my-app\ndotnet run                      // build + run the project\ndotnet build                    // only build (check for errors), don't run\n```\n\n### What's inside a project\n\n```\nmy-app/\n├── my-app.csproj   ← project settings (like pubspec.yaml)\n├── Program.cs      ← your code\n├── bin/            ← built app (generated, never commit)\n└── obj/            ← temporary build files (generated, never commit)\n```\n\nThe `.csproj` file holds:\n- `TargetFramework`: which .NET version (`net10.0`)\n- `OutputType`: `Exe` = a program you can run\n- `Nullable`: `enable` = warn me about possible nulls\n- Package references (later): the libraries you add\n\n### Your first program\n\nModern C# uses **top-level statements**: you write code directly in `Program.cs`, without wrapping it in a `class` and a `Main` method.\n\n```csharp\nConsole.WriteLine(\"What is your name?\");\nstring? name = Console.ReadLine();\nConsole.WriteLine($\"Hello {name}!\");\n```\n\n- `Console.WriteLine(...)`: print a line of text\n- `Console.ReadLine()`: wait for the user to type and press Enter. It returns `string?` (text that **may be null**)\n- `$\"Hello {name}!\"`: **string interpolation**. Put a variable inside `{ }` in a `$` string.\n\n### Text → number: `int.Parse`\n\n`ReadLine` always gives you **text**. To do math, convert it:\n\n```csharp\nstring? birthYearText = Console.ReadLine();\nint birthYear = int.Parse(birthYearText);\nint age = DateTime.Now.Year - birthYear;\nConsole.WriteLine($\"Hello {name}! You are {age} years old.\");\n```\n\n`DateTime.Now.Year` gives the current year from the computer clock.\n(`int.Parse` crashes on bad input like `abc`. Chapter 1.2 shows the safe way: `TryParse`.)\n\n### Math operators\n\n| Operator | Meaning | Example | Result |\n|---|---|---|---|\n| `+` | add | `7 + 2` | `9` |\n| `-` | subtract | `7 - 2` | `5` |\n| `*` | multiply | `7 * 2` | `14` |\n| `/` | divide | `7 / 2` | `3` ⚠️ |\n| `%` | remainder (modulo) | `7 % 2` | `1` |\n\n⚠️ **Integer division:** when both numbers are `int`, C# **throws away the decimal part**: `10 / 3` is `3`, not `3.33`. To get decimals, use a decimal type: `10.0 / 3` → `3.333...`\n\n🎬 **Animation idea:** 10 cookies shared by 3 kids. Each kid gets 3 cookies (`10 / 3`), and 1 cookie is left on the plate (`10 % 3`).\n\n### Exit code\nWhen a program finishes, it returns an **exit code**. `0` = success. Visual Studio shows this in the Output window (\"exited with code 0\").\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart / Flutter | C# / .NET |\n|---|---|---|\n| Project file | `pubspec.yaml` | `.csproj` |\n| Create | `dart create` / `flutter create` | `dotnet new console` |\n| Run | `dart run` / `flutter run` | `dotnet run` |\n| Entry point | `void main() { }` | top-level statements (or `static void Main()`) |\n| Print | `print('Hi')` | `Console.WriteLine(\"Hi\")` |\n| Read input | `stdin.readLineSync()` → `String?` | `Console.ReadLine()` → `string?` |\n| Interpolation | `'Hi $name'` / `'${a + b}'` | `$\"Hi {name}\"` / `$\"{a + b}\"` |\n| Text → int | `int.parse('5')` | `int.Parse(\"5\")` |\n| `10 / 3` | `3.333...` (always a double) | `3` (int ÷ int = int) |\n| Whole-number division | `10 ~/ 3` → `3` | `10 / 3` → `3` |\n\n---\n\n## 🐞 Errors and lessons from my code\n\n| What happened | Why | Lesson |\n|---|---|---|\n| Named a variable `age` but stored the birth year (2000) in it | The name lied about the content | Names must describe what's inside: `birthYear` |\n| Left lots of old code commented out in `Program.cs` | \"Dead code\" makes files hard to read | Delete it. Keep notes in `lessons/`, Git remembers old versions |\n| `2030 - DateTime.Now.Year` with `2030` typed directly | A **magic number**: nobody knows what 2030 means | Give it a name: `const int TargetYear = 2030;` |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| toy box | **platform** / **framework** | \"We're on .NET 10, the current LTS.\" |\n| builder's toolbox | **SDK** | \"Install the .NET 10 SDK to build the project.\" |\n| engine | **runtime** / **CLR** | \"The server only needs the runtime, not the SDK.\" |\n| settings file | **project file** (`.csproj`) | \"Add the package reference to the csproj.\" |\n| generated folders | **build output** / **build artifacts** (`bin/`, `obj/`) | \"Don't commit bin and obj.\" |\n| code straight in Program.cs | **top-level statements** | \"It's a minimal console app with top-level statements.\" |\n| `$\"Hi {x}\"` | **string interpolation** | \"Use interpolation instead of `+`.\" |\n| unnamed number | **magic number** | \"Extract that magic number into a constant.\" |\n\n---\n\n## 📋 Summary\n\n- **.NET** = platform, **C#** = language, **SDK** = developer tools, **CLR** = engine that runs the app\n- `dotnet new console`, `dotnet run`, `dotnet build`\n- `.csproj` ≈ `pubspec.yaml`; never commit `bin/` and `obj/`\n- `Console.WriteLine` prints, `Console.ReadLine` reads text (`string?`)\n- `int.Parse` turns text into a number (it crashes on bad input)\n- `int / int` = whole number (`10 / 3 = 3`); `%` gives the remainder\n\n---\n\n## 📝 Quiz\n\n1. What is the difference between the SDK and the CLR?\n2. Which two folders should never be committed, and why?\n3. What does `10 / 3` give in C#? And in Dart?\n4. What does `17 % 5` give?\n5. What type does `Console.ReadLine()` return, and what does the `?` mean?\n\n<details>\n<summary>Answers<\/summary>\n\n1. The **SDK** is for developers, to create and build apps. The **CLR** (runtime) is the engine that runs the app. Users only need the runtime.\n2. `bin/` and `obj/`. They are **generated** every time you build, so they're not your source code. They're big and change all the time.\n3. C#: `3` (int ÷ int throws away the decimal part). Dart: `3.3333333333333335` (Dart's `/` always gives a double).\n4. `2` (17 = 5 × 3 + **2**)\n5. `string?`, which is text that **may be null** (for example, when there is no more input).\n\n<\/details>\n"}, {"id": "0.2", "phase": 0, "phaseName": "Meet .NET + Git", "file": "phase-00/02-git-basics.md", "title": "Git basics, a time machine for code", "md": "# Chapter 0.2: Git basics, a time machine for code\n\n> Learned: Tue 6 Oct 2026 · Repo: https://github.com/basithcreation/dotnet-fullstack-journey\n\n---\n\n## 🧸 LKG story\n\nGit is a **photo album** for your code.\n\n- 📝 You work on your files at your **desk**.\n- 📦 You put the pages you want in the photo into a **box**.\n- 📸 You take a **photo** of the box and write a caption under it.\n- ☁️ You upload the album to **GitHub** so it's safe, and so others can see it.\n\nIf you break something tomorrow, you open the album and go back to yesterday's photo.\n\n🎬 **Animation idea:** a desk with papers → some papers move into a box (`git add`) → a camera flash (`git commit`) → the photo lands in an album → the album flies up into a cloud (`git push`).\n\n---\n\n## 💻 Real explanation\n\n| LKG | Real term | Command |\n|---|---|---|\n| desk | **working directory** (your files right now) | (just edit files) |\n| box | **staging area** (what goes into the next commit) | `git add` |\n| photo + caption | **commit** + **commit message** | `git commit -m \"...\"` |\n| album on your PC | **local repository** (the hidden `.git` folder) | `git init` |\n| album in the cloud | **remote repository** (GitHub) | `git push` |\n\n### First-time setup of a project\n\n```\ngit init                          // start a new repo in this folder\ngit add .                         // stage all files\ngit commit -m \"Add greeting CLI\"  // take the first photo\ngit remote add origin <url>       // connect to the GitHub repo\ngit push -u origin main           // upload (-u: remember this remote for next time)\n```\n\nAfter that, the daily loop is:\n```\ngit status                  // what changed?\ngit add <files>             // put them in the box\ngit commit -m \"message\"     // take the photo\ngit push                    // upload\n```\n\n### `.gitignore`: what Git should NOT save\n\nA `.gitignore` file lists files and folders Git must ignore. For .NET, create it with:\n```\ndotnet new gitignore\n```\nIt already ignores `bin/`, `obj/`, `.vs/` and other generated files.\n\n`git status --untracked-files=all` shows **every** new file, so you can check nothing unwanted slips in.\n\n### README\n\n`README.md` is the **front page** of your repo on GitHub. It's written in **Markdown**:\n```markdown\n# Project title\nShort description.\n\n## How to run\n    dotnet run\n```\n\n### Important ideas\n\n- A **commit is a local snapshot** of all your staged files. It's **not** only a message, and it's **not** on GitHub until you `push`.\n- Git only saves what you **commit**. Edits you didn't commit can be lost, so **commit often**.\n- The warning `LF will be replaced by CRLF` is about invisible line-ending characters (Windows vs Linux). It's **harmless**.\n- Use your **personal** email in Git for your own portfolio, not your work email: `git config --global user.email \"you@example.com\"`\n\n---\n\n## 🎯 Dart comparison\n\nGit is the same for every language. The only difference is the ignore file:\n\n| Flutter | .NET |\n|---|---|\n| Ignore `build/`, `.dart_tool/` | Ignore `bin/`, `obj/`, `.vs/` |\n| `flutter create` makes a `.gitignore` for you | `dotnet new gitignore` |\n\n---\n\n## 🐞 Errors and lessons from my repo\n\n| What happened | Lesson |\n|---|---|\n| Commit message `Imporve READMR` (2 typos) and `Complete pjase 0` | Read your message before pressing Enter. Typos stay in the history forever. |\n| Git was using my **work** email | Changed it to the personal email for my portfolio |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| photo album | **repository** (repo) | \"Clone the repo and run it.\" |\n| photo | **commit** | \"Commit small and often.\" |\n| box | **staging area** | \"Stage only what belongs in this commit.\" |\n| upload | **push** | \"Push your branch when you're done.\" |\n| GitHub copy | **remote** (`origin`) | \"Is it pushed to origin?\" |\n| ignore list | **.gitignore** | \"Add the bin folder to .gitignore.\" |\n\n---\n\n## 📋 Summary\n\n- Desk → box → photo → cloud = edit → `git add` → `git commit` → `git push`\n- `git status` tells you what changed. Check it often.\n- `.gitignore` keeps `bin/` and `obj/` out of the repo\n- A commit is a **local** snapshot. Push to put it on GitHub.\n- Commit often: Git can only bring back what you committed\n\n---\n\n## 📝 Quiz\n\n1. What is the difference between `git commit` and `git push`?\n2. You edited a file but didn't commit it, and then your laptop died. Can Git bring the edit back?\n3. What does `git add` do?\n4. Which command creates a .NET `.gitignore`?\n5. Is the warning \"LF will be replaced by CRLF\" a problem?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `commit` takes a snapshot **on your PC**. `push` uploads your commits **to GitHub**.\n2. No. Git only saves what you **commit**. That's why we commit often.\n3. It puts files into the **staging area** (the box), so they go into the next commit.\n4. `dotnet new gitignore`\n5. No. It's only about invisible line-ending characters (Windows uses CRLF, Linux/Mac use LF). Git converts them automatically.\n\n<\/details>\n"}, {"id": "1.1", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/01-data-types.md", "title": "Data types, what can go in the box", "md": "# Chapter 1.1: Data types, what can go in the box\n\n> Learned: Wed 7 Oct 2026 · Code: `lessons/phase-01/01-data-types`, `02-cafe-bill`\n\n---\n\n## 🧸 LKG story\n\nA **variable** is a **box with a label**. The label is the name. But every box also has a **shape**, and only things of that shape fit inside:\n\n- A box for **whole numbers** (3, 28, -5) can't hold 2.5.\n- A box for **money** must be exact, without losing a single fils.\n- A box for **yes/no** holds only `true` or `false`.\n- A box for **one letter** holds exactly one character.\n- A box for **text** holds words and sentences.\n\nThe shape of the box is the **data type**.\n\n🎬 **Animation idea:** a shape-sorter toy. A round number `2.5` tries to go into the square \"int\" hole and bounces off. `3` drops straight in.\n\n---\n\n## 💻 Real explanation\n\n```csharp\nint age = 28;\n```\nreads as: *\"Make a box named `age` that holds only whole numbers (`int`), and put 28 in it.\"*\n\n### The six basic types\n\n| Type | Holds | Example | Notes |\n|---|---|---|---|\n| `int` | whole numbers | `int days = 3;` | about ±2.1 billion |\n| `double` | decimal numbers (approximate) | `double height = 172.8;` | fast, for science/measurements |\n| `decimal` | decimal numbers (**exact**) | `decimal price = 1.350m;` | **use for money**, needs the `m` suffix |\n| `bool` | `true` / `false` | `bool isWeekend = false;` | |\n| `char` | **one** character | `char tableLetter = 'C';` | **single** quotes |\n| `string` | text | `string name = \"Fatima\";` | **double** quotes |\n\n### Why `decimal` for money? The `0.1 + 0.2` problem\n\n```csharp\ndouble a = 0.1;\ndouble b = 0.2;\nConsole.WriteLine($\"double : {a + b}\");    // double : 0.30000000000000004\n\ndecimal c = 0.1m;\ndecimal d = 0.2m;\nConsole.WriteLine($\"decimal : {c + d}\");   // decimal : 0.3\n```\n\n`double` stores numbers in **binary** (base 2), and `0.1` can't be written exactly in binary, just like 1/3 can't be written exactly in decimal (0.3333...). So a tiny error appears. That's fine for a distance or a temperature, but **never** for money: tiny errors add up over thousands of bills.\n\n`decimal` stores numbers in **base 10**, the way we write money, so `0.1` is exactly `0.1`.\n\n🎬 **Animation idea:** two cashiers. The \"double\" cashier gives change of 0.30000000000000004 KWD and the customer looks confused. The \"decimal\" cashier gives exactly 0.300.\n\n### Safe and unsafe conversions (\"pouring\")\n\nThink of pouring water from one cup into another:\n- **Small cup → big cup** is **safe**, nothing spills: `int` → `decimal` or `int` → `double` happens **automatically** (**implicit conversion**).\n- `decimal` ↔ `double` is **not** automatic: they store numbers in different ways, so C# makes you decide.\n\n```csharp\nint days = 3;\ndecimal dailyFee = 0.750m;\ndecimal fee = days * dailyFee;            // int is converted to decimal automatically ✅\nConsole.WriteLine($\"Fee: {fee:F3} KWD\");  // Fee: 2.250 KWD\n```\n\n### Formatting money: `:F3`\n\nKuwaiti dinar has 3 decimal places (1 KWD = 1000 fils), so use `:F3`:\n```csharp\ndecimal total = 4.8m;\nConsole.WriteLine($\"{total:F3} KWD\");   // 4.800 KWD\n```\nAlways write the number. `:F` alone uses the PC's region settings, so it may show 2 digits on one computer and 3 on another.\n\n### `Console.Write` vs `Console.WriteLine`\n- `Console.WriteLine(\"Hi\")` prints and then moves to a **new line**\n- `Console.Write(\"Name: \")` prints and **stays on the same line** (good for questions)\n\n### Naming in C#\n- Local variables: **camelCase**: `totalBillAmount`, `latteQuantity`\n- Constants, methods and classes: **PascalCase**: `MaxDailyFee`\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| Whole number | `int` (64-bit) | `int` (32-bit). `long` is the 64-bit one |\n| Decimal | `double` | `double` |\n| Exact money type | ❌ none built in (use a package or store fils as `int`) | ✅ `decimal` |\n| Yes/no | `bool` | `bool` |\n| Text | `String` (capital S) | `string` (small s) |\n| One character | ❌ no char type (a String of length 1) | `char` with `'A'` |\n| Quotes | `'text'` or `\"text\"` | `\"text\"` for strings, `'A'` only for one char |\n\n⚠️ The two biggest Dart habits to break: `String` → `string`, and `'text'` → `\"text\"`.\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error | Why | Fix |\n|---|---|---|\n| Wrote `String` | Dart habit | C# uses `string` |\n| `'text'` → error CS1012 \"Too many characters in character literal\" | Single quotes are only for **one** `char` | Use `\"text\"` |\n| `decimal price = 1.35;` → error CS0664 | `1.35` without `m` is a `double` | `1.35m` |\n| Output `x1.000 cakes` | Used `:F3` on a quantity | `:F3` only on **money** |\n| Output `Fee: 0.750` with no currency | Didn't read the output like a customer | `Fee: 0.750 KWD` |\n| Renamed a variable by hand and the build broke twice | Missed one place | Use **F2** (rename) in VS Code |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| box | **variable** | \"Store the result in a variable called `wholeHours`.\" |\n| shape of the box | **data type** | \"Use `decimal` as the type for money.\" |\n| safe pour | **implicit conversion** | \"int to decimal is an implicit conversion.\" |\n| tiny error in double | **floating-point precision error** | \"Don't use double for money, you'll get rounding errors.\" |\n| `:F3` | **format specifier** | \"Format money with F3.\" |\n| `m` after a number | **literal suffix** | \"Add the m suffix, it's a decimal literal.\" |\n\n---\n\n## 📋 Summary\n\n- `int` whole numbers · `double` approximate decimals · `decimal` exact (money, `m`) · `bool` · `char` `'A'` · `string` `\"text\"`\n- `0.1 + 0.2` in double = `0.30000000000000004`, in decimal = `0.3`\n- `int` → `decimal`/`double` is automatic. `decimal` ↔ `double` is not.\n- Money: `decimal` + `:F3` + the currency in the text\n- camelCase for variables, PascalCase for constants\n\n---\n\n## 📝 Quiz\n\n1. Which type would you use for a product price in KWD, and why?\n2. What's wrong with `char letter = \"B\";`?\n3. What does `0.1 + 0.2` print with `double`?\n4. Is `decimal fee = 3 * 0.250m;` OK? Why?\n5. What does `Console.WriteLine($\"{2.5m:F3}\");` print?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `decimal`, because it's **exact**. `double` gives tiny rounding errors that add up.\n2. `\"B\"` is a `string` (double quotes). A `char` needs single quotes: `'B'`.\n3. `0.30000000000000004`\n4. Yes. `3` is an `int`, and int → decimal is a safe **implicit conversion**.\n5. `2.500`\n\n<\/details>\n"}, {"id": "1.2", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/02-var-const-conversion.md", "title": "var, const, conversion, Parse and TryParse", "md": "# Chapter 1.2: var, const, conversion, Parse and TryParse\n\n> Learned: Wed 7 Oct 2026 · Code: `lessons/phase-01/03-parse-tryparse`, `04-parking-meter`\n\n---\n\n## 🧸 LKG story\n\n- **`var`**: you put a toy in a box, and the box **looks at the toy and takes its shape**. After that, the shape is **locked**.\n- **`const`**: a **rule painted on the wall**. \"Parking costs 0.250 per hour.\" Nobody can change it while the program runs.\n- **Cast `(int)`**: **scissors**. `2.75` → cut off the `.75` → `2`. It cuts, it does **not** round.\n- **`Parse`**: a **strict teacher**. Give them `\"abc\"` instead of a number and they **scream and stop the class** (crash).\n- **`TryParse`**: a **polite teacher**. Give them `\"abc\"` and they calmly say *\"No, that's not a number\"* (`false`) and write `0`.\n\n🎬 **Animation idea:** two teachers receive a paper saying \"abc\". The Parse teacher explodes 💥 (the program crashes). The TryParse teacher shakes their head, holds up a sign saying `false`, and writes `0` on the board.\n\n---\n\n## 💻 Real explanation\n\n### `var`: the type is inferred\n```csharp\nvar exactHeight = 172.8;     // C# sees 172.8 → the type is double\nvar count = 5;               // int\nvar name = \"Basith\";         // string\n```\n- The type is decided **once**, from the value, and then it's **locked**: `count = \"hi\";` is an error.\n- `var` **must** have a value: `var x;` is an error (CS0818). C# can't guess a type from nothing.\n\n### `const`: values that never change\n```csharp\nconst int CurrentYear = 2026;\nconst decimal PerHourRate = 0.250m;\n```\n- The value must be known **when you write the code** (not from user input or the clock).\n- Name constants in **PascalCase**.\n- Using constants instead of raw numbers removes **magic numbers**.\n\n### Casting: `(int)value` cuts\n```csharp\ndouble averageStayHours = 2.75;\nint wholeHours = (int)averageStayHours;   // 2  (cut, not rounded)\n```\n- This is an **explicit conversion**: you're telling C# *\"I know I'll lose the decimal part, do it anyway\"*.\n- The syntax is `(int)value`, **not** `int(value)`.\n\n### `Parse`: text → number, crashes on bad input\n```csharp\nint year = int.Parse(\"2000\");   // 2000 ✅\nint bad  = int.Parse(\"abc\");    // 💥 FormatException: the program crashes\n```\nAlso, with `string? input = Console.ReadLine();`, the call `int.Parse(input)` gives warning **CS8604** (\"possible null reference argument\"), because `input` might be null.\n\n### `TryParse`: the safe way\n```csharp\nConsole.Write(\"Enter your birth year: \");\nstring? input = Console.ReadLine();\n\nbool isNumber = int.TryParse(input, out int birthYear);\nConsole.WriteLine($\"valid number? {isNumber}\");\nConsole.WriteLine($\"Birth year: {birthYear}\");\n```\n| Input | `isNumber` | `birthYear` |\n|---|---|---|\n| `\"2000\"` | `true` | `2000` |\n| `\"abc\"` | `false` | `0` |\n| `\"2.5\"` | `false` | `0` (an int can't hold 2.5) |\n| (null) | `false` | `0`, with **no** warning |\n\n- It returns a **bool**: did it work?\n- The number comes out through **`out int birthYear`**: an **out parameter**. It creates the variable right there.\n- It **never crashes**, and it handles null, so there's no CS8604 warning.\n\n### TryParse **refuses**, cast **cuts**: two different tools\n| | Input `2.75` | What it does |\n|---|---|---|\n| `int.TryParse(\"2.75\", out int a)` | `false`, `a = 0` | **refuses**: \"this text is not a whole number\" |\n| `(int)2.75m` | `2` | **cuts** off the decimal part |\n\n### `string?`: may be null\nThe `?` means \"this can be null\". `Console.ReadLine()` returns `string?` because there might be no input at all.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| Inferred type | `var x = 5;` | `var x = 5;` (same idea) |\n| Never changes | `const` (compile-time) / `final` (set once) | `const` (compile-time). `readonly` comes later |\n| Strict parse | `int.parse('abc')` → throws | `int.Parse(\"abc\")` → throws |\n| Safe parse | `int.tryParse('abc')` → returns `null` | `int.TryParse(\"abc\", out int n)` → returns `false`, `n = 0` |\n| double → int | `2.75.toInt()` → `2` (cuts) | `(int)2.75` → `2` (cuts) |\n| May be null | `String?` | `string?` |\n\nMain difference: Dart's `tryParse` returns `int?` (null on failure). C#'s `TryParse` returns a `bool` and gives the number through `out`.\n\n---\n\n## 🐞 Errors I actually hit\n\n| Mistake | Why it's wrong | Fix |\n|---|---|---|\n| `var x;` | `var` needs a value to know the type (CS0818) | `var x = 0;` or `int x;` |\n| `int(2.75)` | Wrong cast syntax | `(int)2.75` |\n| Gave the same \"why\" for TryParse and cast | They're different tools | TryParse **refuses** (false, 0). Cast **cuts** (2) |\n| Couldn't explain why Parse warns on `input` | `ReadLine` returns `string?` | Parse can't handle null → CS8604. TryParse can. |\n| Used `double` for VAT | VAT is money | `decimal` |\n| Said \"fixed\" without running the code | — | Always `dotnet run` before saying \"done\" |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| box takes the toy's shape | **type inference** (`var`) | \"The compiler infers the type, it's still strongly typed.\" |\n| rule on the wall | **constant** (`const`) | \"Make the rate a constant, don't hard-code it.\" |\n| scissors | **cast** / **explicit conversion**, which **truncates** | \"The cast truncates, it doesn't round.\" |\n| TryParse refuses | **parsing fails**, returns `false` | \"If parsing fails, show an error and return.\" |\n| `out int x` | **out parameter** | \"TryParse gives the value through an out parameter.\" |\n| may be empty | **nullable** type | \"ReadLine returns a nullable string.\" |\n| crash | **exception** (`FormatException`) | \"Parse throws a FormatException on bad input.\" |\n\n---\n\n## 📋 Summary\n\n- `var` = the type is inferred and locked, and it must have a value\n- `const` = a fixed value known when you write the code, PascalCase\n- `(int)2.75` = `2` (cuts, never rounds)\n- `Parse` crashes on bad input. `TryParse` returns `true`/`false` + the value through `out` (0 on failure)\n- Use `TryParse` for user input, always\n\n---\n\n## 📝 Quiz\n\n1. Why is `var total;` an error?\n2. What does `(int)9.99` give?\n3. `int.TryParse(\"12a\", out int n)`: what is returned, and what is `n`?\n4. Why does `int.Parse(input)` show a warning when `input` is `string?`?\n5. Can a `const` get its value from `Console.ReadLine()`? Why?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `var` decides the type from the value. With no value, it can't decide.\n2. `9`. The cast cuts the decimal part, it doesn't round to 10.\n3. It returns `false`, and `n` is `0`.\n4. `input` may be null, and `Parse` can't handle null (warning CS8604, possible null reference).\n5. No. A `const` value must be known **when you write the code**. User input only exists when the program runs.\n\n<\/details>\n"}, {"id": "1.3", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/03-if-else.md", "title": "if / else, making decisions", "md": "# Chapter 1.3: if / else, making decisions\n\n> Learned: Thu 8 Oct 2026 · Code: `lessons/phase-01/05-if-else`, `06-parking-meter-v2`\n\n---\n\n## 🧸 LKG story\n\nAn `if` is a **traffic light**: if it's green, go; else, stop.\n\nAn `if / else if / else` chain is a **row of doors**. You walk along and go through the **first door that opens**. Once you're through, you **don't try the other doors**.\n\nA **guard** is a **security guard at the entrance**: \"No ticket? Stop. Go home.\" (`return;`). Only good visitors get inside.\n\n**Scope** is a **room**: a toy made inside a room (`{ }`) disappears when you leave the room (`}`). If you need the toy later, make it **before** you enter the room.\n\n🎬 **Animation idea:** a character walks along 3 doors labelled `>= 100`, `<= 0`, `else`. The first door that opens swallows them, and the other doors fade away.\n\n---\n\n## 💻 Real explanation\n\n### Comparison operators\n| Operator | Meaning | `5 ? 5` |\n|---|---|---|\n| `==` | equal | `5 == 5` → true |\n| `!=` | not equal | `5 != 5` → false |\n| `>` | greater than | `5 > 5` → **false** (the edge is out) |\n| `>=` | greater or equal | `5 >= 5` → **true** (the edge is in) |\n| `<` `<=` | less than / less or equal | |\n\n⚠️ `=` **saves** a value (assignment). `==` **checks** a value (comparison).\n\n### Logical operators\n| | Meaning | Example |\n|---|---|---|\n| `&&` | AND (both must be true) | `temp >= 30 && temp <= 40` |\n| `\\|\\|` | OR (at least one is true) | `answer == \"y\" \\|\\| answer == \"Y\"` |\n| `!` | NOT (flip it) | `!isWeekend` |\n\nText comparison counts capitals: `\"Y\" == \"y\"` is **false**.\n\n### if / else if / else\n```csharp\nif (temperature <= 0)\n{\n    Console.WriteLine(\"Ice 🧊\");\n}\nelse if (temperature >= 100)\n{\n    Console.WriteLine(\"Steam ♨️\");\n}\nelse\n{\n    Console.WriteLine(\"Liquid water\");\n}\n```\nChecked **top to bottom**. The **first true one wins**, and the rest are skipped.\n\n### Guard clause + early return\nCheck the bad cases **first**, and stop with `return;`. Then the rest of the code only deals with good input (the **happy path**).\n```csharp\nif (!int.TryParse(input, out int totalHours))\n{\n    Console.WriteLine(\"Please enter whole hours.\");\n    return;                 // stop the program here\n}\n\nif (totalHours < 0)\n{\n    Console.WriteLine(\"Hours can't be negative.\");\n    return;\n}\n```\n`TryParse` returns a bool, so it goes straight into the `if`. `!` means \"if it did NOT work\".\n\n### Scope: born inside `{ }`, dies at `}`\n```csharp\nif (true)\n{\n    string msg = \"Hi\";\n}\nConsole.WriteLine(msg);    // ❌ CS0103: The name 'msg' does not exist\n```\nFix: **declare the variable before the block**, and only change it inside.\n\n### The \"factory line\": calculate once, adjust, print once\n```csharp\ndecimal fee = totalHours * PerHourRate;        // 1. base fee\n\nif (residentAnswer == \"y\" || residentAnswer == \"Y\")\n{\n    fee = fee * ResidentDiscount;              // 2. discount (0.5 = 50% off)\n}\n\nif (fee > MaxDailyFee)\n{\n    fee = MaxDailyFee;                         // 3. cap (maximum limit)\n}\n\nConsole.WriteLine($\"Fee: {fee:F3} KWD\");      // 4. print once\n```\n- One variable, each `if` changes it, one print at the end, so **no repeated code**.\n- A variable can change: `fee = fee * 0.5m` (no type the second time).\n- 50% off = **× 0.5**. Multiplying by less than 1 makes it smaller.\n- Discount first or cap first? That's a **business rule**. Ask the business, then write a comment.\n\n🎬 **Animation idea:** a factory conveyor belt. A box labelled `fee` passes a \"discount machine\" (it shrinks only for residents), then a \"cap machine\" (it gets cut down if too tall), then the printer.\n\n### Boundary testing\nAlways test the **edge numbers**: if the rule is \"max 24 hours\", test 23, **24** and 25. Most bugs live at the edges (`>` vs `>=`).\n\n### Two habits\n- **Save (Ctrl+S) before `dotnet run`**. Run only sees the saved file.\n- **Shift+Alt+F** formats the file.\n\n---\n\n## 🎯 Dart comparison\n\nAlmost everything is **the same** as Dart: `if / else if / else`, `== != > < >= <=`, `&& || !`, `return;`, block scope.\n\n| Small differences | Dart | C# |\n|---|---|---|\n| `if (x = 5)` | error | error too (CS0029, can't convert int to bool). C# protects you |\n| Safe parse in an `if` | `final n = int.tryParse(s); if (n == null) return;` | `if (!int.TryParse(s, out int n)) { return; }` |\n\n---\n\n## 🐞 Errors I actually hit\n\n| Mistake | What happened | Lesson |\n|---|---|---|\n| Forgot `return;` in a guard | Printed \"Max 24 hours\" **and then kept going** | Every guard ends with `return;` |\n| `(int)PerHourRate` | `0.250` became `0`, so every fee was 0 | Money stays `decimal`, never cast to int |\n| Used `TryParse` to check `y`/`n` | TryParse is only for numbers | Compare text with `==` |\n| Created `fee` inside `if` and `else` | Had to write the math + print twice | Born outside, change inside |\n| `fee * PerHourRate` again inside the print | Calculated twice | Once the box has a value, print the box |\n| Discount `0.125` | Treated the discount as a new rate | A discount is a **multiplier** (× 0.5) |\n| `isKuwaiti` held text | `is...` names are for bools only | `residentAnswer` |\n| Ran before saving | Saw an old result | Ctrl+S first |\n| Quiz: `else if (marks >= 90)` under `>= 50` | 95 printed \"Pass\" | Put the most specific check **first** |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| traffic light question | **condition** / **boolean expression** | \"The condition is always false.\" |\n| row of doors | **if-else chain**, evaluated **top to bottom** | \"Put the most specific check first.\" |\n| security guard | **guard clause** / **early return** | \"Add a guard clause for negative hours.\" |\n| good path after guards | **happy path** | \"After the guards, the rest is the happy path.\" |\n| room `{ }` | **code block** / **scope** | \"`fee` is out of scope there.\" |\n| edge number | **boundary value** | \"Test the boundary values: 0, 24 and 25.\" |\n| `>` instead of `>=` | **off-by-one error** | \"Looks like an off-by-one at 24.\" |\n| cap | **upper limit**; **clamping** | \"Clamp the fee to MaxDailyFee.\" |\n| same code twice | **duplication** → **DRY** | \"Pull the print out of the if/else.\" |\n| discount before cap | **business rule** | \"Confirm the business rule with the product owner.\" |\n\n---\n\n## 📋 Summary\n\n- `=` saves, `==` checks. `>` excludes the edge, `>=` includes it.\n- `&&` both, `||` either, `!` not. Capitals count in text.\n- if-else chains: top to bottom, first match wins\n- Guard clause: check bad input first, then `return;`\n- Scope: declare before the block, change inside\n- Factory line: calculate once, adjust with `if`s, print once\n- Test the boundary values\n\n---\n\n## 📝 Quiz\n\n1. `int age = 18;` Is `age > 18` true or false?\n2. What does this print for `marks = 95`, and how do you fix it?\n   ```csharp\n   if (marks >= 50) Console.WriteLine(\"Pass\");\n   else if (marks >= 90) Console.WriteLine(\"Excellent\");\n   ```\n3. Why do guard clauses end with `return;`?\n4. You need `total` after an `if` block, but you create it inside. What error do you get, and what's the fix?\n5. What is `\"Y\" == \"y\"`?\n\n<details>\n<summary>Answers<\/summary>\n\n1. False. `>` doesn't include the edge, and 18 is not greater than 18.\n2. \"Pass\". The first true condition wins. Fix: check `>= 90` **first**.\n3. To **stop** the program after the error message. Without it, the code keeps going with bad input.\n4. CS0103 (\"the name does not exist\"). Declare `total` **before** the block and only change it inside.\n5. `false`, because capital and small letters are different.\n\n<\/details>\n"}, {"id": "1.4", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/04-switch.md", "title": "switch and switch expressions", "md": "# Chapter 1.4: switch and switch expressions\n\n> Learned: Sat 10 Oct 2026 · Code: `lessons/phase-01/07-switch`, `08-grade-calculator`\n\n---\n\n## 🧸 LKG story\n\n**switch statement = a vending machine that does jobs.** You press button A1 and it drops chips. B2 drops juice. Any other button: \"Invalid\". It doesn't ask \"is it A1? no... is it B2? no...\" the way an if-else chain does. It looks up your button and does that job.\n\n**switch expression = a price list on the wall.** You look up an item and **get a value back**, which you keep in a box (a variable).\n\nThe big difference:\n- A machine that only **does jobs** can do **nothing** when you press a wrong button. No harm done.\n- A price list **must give you an answer**. If your item isn't on the list, it has nothing to give, and it **breaks** (crash). That's why the compiler wants a \"for everything else\" line (`_`).\n\n🎬 **Animation idea:** two machines side by side. Press an unknown button on the \"statement\" machine: a light blinks and nothing happens. Press an unknown button on the \"expression\" machine: it shakes, sparks fly, and the screen says `SwitchExpressionException`. Then a worker adds a sticker \"`_` = everything else\", and the machine calmly gives an answer.\n\n---\n\n## 💻 Real explanation\n\n### 1. The switch statement (`case` / `break`)\n\nUse it when you compare **one variable** against exact values, and each case **does something**.\n\n```csharp\nstring light = \"red\";\n\nswitch (light)\n{\n    case \"red\":\n        Console.WriteLine(\"Stop\");\n        break;\n    case \"yellow\":\n        Console.WriteLine(\"Slow down\");\n        break;\n    case \"green\":\n        Console.WriteLine(\"Go\");\n        break;\n    case \"flashing\":            // stacked cases: many values, one job\n    case \"off\":\n        Console.WriteLine(\"Drive carefully\");\n        break;\n    default:\n        Console.WriteLine(\"Unknown light\");\n        break;\n}\n```\n| Part | Meaning |\n|---|---|\n| `switch (light)` | the value we check |\n| `case \"red\":` | \"if light == \"red\"\" |\n| `break;` | stop here and leave the switch. **Required** at the end of every case (or `return;`) |\n| stacked cases | empty `case` labels on top of each other share one job |\n| `default:` | runs when no case matches (like the last `else`). **Optional** |\n\nText matching is exact: `\"Red\"` does **not** match `case \"red\"`.\n\n### 2. The switch expression (`=>`)\n\nUse it when you want to **get a value back**.\n\n```csharp\nint day = 6;\n\nstring dayType = day switch\n{\n    1 or 2 or 3 or 4 or 5 => \"Work day\",\n    6 or 7                => \"Weekend\",\n    _                     => \"Invalid day\"\n};\n```\n| Part | Meaning |\n|---|---|\n| `day switch { }` | the variable comes **before** `switch` |\n| `=>` | \"gives\": `6 or 7 => \"Weekend\"` reads \"6 or 7 gives Weekend\" |\n| `or` | many values, one result (**or pattern**) |\n| `_` | \"anything else\" (**discard pattern**) |\n| `,` after each line, `};` at the end | |\n\n**Ranges with relational patterns:**\n```csharp\nint temp = 35;\n\nstring feel = temp switch\n{\n    >= 40 => \"Very hot\",\n    >= 25 => \"Warm\",\n    >= 10 => \"Cool\",\n    _     => \"Cold\"\n};\n\nConsole.WriteLine(feel);    // Warm\n```\nTest results: 45 → Very hot, 25 → Warm (the edge is included), 24 → Cool, 5 → Cold.\n\nThe Day 3 rule still applies: **top to bottom, first match wins**. Put the biggest number first.\n\n### 3. The compiler protects you (better than if-else!)\n\n**Wrong order = build error.** Put `>= 10` at the top:\n```csharp\n>= 10 => \"Cool\",\n>= 40 => \"Very hot\",   // ❌ CS8510: The pattern is unreachable\n>= 25 => \"Warm\",       // ❌ CS8510\n```\nEvery number ≥ 40 is also ≥ 10, so those arms can **never** run. The program won't even build.\nWith if-else, the same mistake gives a **wrong answer silently** (95 → \"Pass\").\n\n**Missing values = warning, then a crash.** A `char` can hold about 65,000 different characters. If your switch expression doesn't cover all of them:\n```\nwarning CS8509: The switch expression does not handle all possible values\nof its input type (it is not exhaustive).\n```\nIf a value comes in that no arm matches, the program **crashes at runtime**:\n```\nUnhandled exception. System.Runtime.CompilerServices.SwitchExpressionException:\nNon-exhaustive switch expression failed to match its input.\nUnmatched value was C.\n   at Program.<Main>$(String[] args) in ...\\Program.cs:line 22\n```\nFix: add a `_ => ...` arm at the end. But first check that **no real case is missing**.\n\n### 4. Statement vs expression: which one?\n\n| | switch **statement** | switch **expression** |\n|---|---|---|\n| Purpose | **does** something | **returns** a value |\n| Syntax | `case X:` ... `break;` | `X => value,` |\n| Many values | stacked cases | `or` |\n| Ranges (`>= 90`) | possible (`case >= 90:`) but rarely used | natural ✅ |\n| Must cover every value? | No: with no match, it just skips | Yes: warning CS8509, crash at runtime |\n| \"Everything else\" | `default:` | `_` |\n\nIn modern code, the **expression** is preferred when you're choosing a value. You'll still see the statement a lot in older company code.\n\n### 5. Full example: Grade Calculator\n\n```csharp\nConsole.Write(\"Enter your mark (0-100): \");\nstring? input = Console.ReadLine();\n\nif (!int.TryParse(input, out int mark))\n{\n    Console.WriteLine(\"Please enter a number.\");\n    return;\n}\nif (mark < 0 || mark > 100)\n{\n    Console.WriteLine(\"Marks must be between 0 and 100.\");\n    return;\n}\n\nchar grade = mark switch\n{\n    >= 90 => 'A',\n    >= 75 => 'B',\n    >= 60 => 'C',\n    >= 50 => 'D',\n    _     => 'F'\n};\n\nstring gradeComment = \"\";          // declared BEFORE the switch (scope!)\n\nswitch (grade)\n{\n    case 'A':\n    case 'B':\n        gradeComment = \"Great job!\";\n        break;\n    case 'C':\n    case 'D':\n        gradeComment = \"You passed.\";\n        break;\n    case 'F':\n        gradeComment = \"Try again.\";\n        break;\n    default:\n        gradeComment = \"Unknown grade\";\n        break;\n}\n\nConsole.WriteLine($\"Marks: {mark} | Grade: {grade} | {gradeComment}\");\n```\n\n| Input | Output |\n|---|---|\n| `abc` | Please enter a number. |\n| `-5` / `101` | Marks must be between 0 and 100. |\n| `100` / `90` | Grade: A \\| Great job! |\n| `89` | Grade: B \\| Great job! |\n| `50` | Grade: D \\| You passed. |\n| `49` / `0` | Grade: F \\| Try again. |\n\n### Reading an error message\n`Program.cs(5,5): error CS0163` means **line 5, column 5**. The compiler tells you exactly where to look.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart 3 | C# |\n|---|---|---|\n| Statement `break` | not needed | **required** (CS0163) |\n| Fall-through from a case with code | not allowed | not allowed |\n| Expression syntax | `switch (day) { ... }` | `day switch { ... }` (variable first) |\n| Many values | `6 \\|\\| 7 =>` | `6 or 7 =>` |\n| Anything else | `_` | `_` (same) |\n| Ranges | `>= 90 =>` | `>= 90 =>` (same) |\n| Not exhaustive | **compile error** | **warning** (CS8509) + crash at runtime |\n\n```dart\n// Dart 3\nvar dayType = switch (day) { 6 || 7 => 'Weekend', _ => 'Work day' };\n```\n```csharp\n// C#\nvar dayType = day switch { 6 or 7 => \"Weekend\", _ => \"Work day\" };\n```\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| **CS0163** \"Control cannot fall through from one case label\" | Removed `break;` after `\"Stop\"` | Every case ends with `break;` |\n| **CS8510** \"The pattern is unreachable\" | Put `>= 10` above `>= 40` | Biggest / most specific first |\n| **CS0103** \"The name 'A' does not exist\" | Wrote `A or B` without quotes, so C# looked for a **variable** named A | `'A' or 'B'` (a char needs single quotes) |\n| **CS8509** not exhaustive + crash on 65 | Typo `'B' or 'D'` instead of `'C' or 'D'`, so `'C'` had no arm | Fix the typo, then add `_` as a safety net |\n| Added `_ => \"Invalid\"` and 65 printed \"Invalid\" | `_` hid the missing case | `_` is a **safety net**, not a fix |\n| `<= 50 => 'F'` after `>= 50 => 'D'` | 50 matched both (it worked only because the first match wins) | Use `_` for \"everything else\" |\n| Range guard without `return;` | Printed the error, then a grade too | Every guard ends with `return;` |\n| `mark <= 0 \\|\\| mark >= 100` | Refused valid marks 0 and 100 | `mark < 0 \\|\\| mark > 100` |\n| Only tested 90 | The `'C'` bug stayed hidden | **Test every branch** |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| vending machine (does jobs) | **switch statement** | \"A switch statement is fine here, each case just prints.\" |\n| price list (gives a value) | **switch expression** | \"Turn that into a switch expression, it'll be shorter.\" |\n| each `case \"red\":` | **case label**; `default:` = **default case** | \"Add a default case.\" |\n| sliding into the next case | **fall-through** | \"C# doesn't allow fall-through.\" |\n| each `pattern => value` line | **arm** | \"That arm is unreachable.\" |\n| `>= 90` | **relational pattern** | |\n| `6 or 7` | **or pattern** | |\n| `_` | **discard pattern** | \"Add a discard arm at the end.\" |\n| covers every value | **exhaustive** | \"The switch isn't exhaustive, it can throw at runtime.\" |\n| line that can never run | **unreachable code** | |\n| crash while running | **exception**; the `at ...` lines are the **stack trace** | \"Send me the stack trace.\" |\n| yellow message | **warning** (it still builds) vs red **error** (it doesn't) | \"Don't ignore warnings.\" |\n| long if-else → switch | **refactor** | \"This if-else chain is long, let's refactor it to a switch expression.\" |\n\n---\n\n## 📋 Summary\n\n- **Statement** = does jobs: `case X:` + `break;`, stacked cases, optional `default:`\n- **Expression** = returns a value: `x switch { pattern => value, _ => ... };`\n- Patterns: exact values, `or`, relational `>= 90`, discard `_`\n- Order matters (first match wins). A wrong order in an expression → CS8510 build error\n- An expression must be **exhaustive**, or you get CS8509 and a runtime crash\n- `char` values need single quotes. Test **every** branch.\n\n---\n\n## 📝 Quiz\n\n1. What happens when you build this?\n   ```csharp\n   string s = n switch { > 5 => \"Big\", > 10 => \"Huge\", _ => \"Small\" };\n   ```\n2. What error do you get if a `case` has code but no `break;`?\n3. Why does a switch expression need `_`, while a switch statement doesn't need `default`?\n4. Fix: `char grade = mark switch { >= 50 => \"P\", _ => \"F\" }`\n5. Your teammate has 6 `else if`s that all check `day == 1`, `day == 2`... What do you suggest, using team words?\n\n<details>\n<summary>Answers<\/summary>\n\n1. It **doesn't build**: CS8510. `> 10` is unreachable, because `> 5` already catches every number above 10.\n2. **CS0163**, \"Control cannot fall through from one case label to another\".\n3. An expression must **return a value**. With no match, it has nothing to return, so it crashes. A statement only **does jobs**. With no match, it just skips.\n4. `char grade = mark switch { >= 50 => 'P', _ => 'F' };` (single quotes for char, and a `;` at the end)\n5. \"This if-else chain checks the same variable every time. Let's **refactor** it to a **switch expression**.\"\n\n<\/details>\n"}, {"id": "1.5", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/05-git-clean-history-undo.md", "title": "Git, clean history and undo", "md": "# Chapter 1.5: Git, clean history and undo\n\n> Learned: Sat 10 Oct 2026 · Builds on [Chapter 0.2](../phase-00/02-git-basics.md)\n\n---\n\n## 🧸 LKG story\n\nRemember the **photo album**: desk (your files) → box (staged) → photo (commit) → cloud (GitHub).\n\nToday's new skills:\n- **Look before you shoot:** check what's on the desk and in the box before you take the photo.\n- **Good captions:** a caption should tell anyone what's in the photo.\n- **Undo:**\n  - Scribbled on a page? **Swap it** for the page from the last photo (`git restore`).\n  - Put the wrong page in the box? **Take it out** (`git restore --staged`).\n  - Last photo was bad and **nobody has seen it yet**? **Retake it** (`git commit --amend`).\n  - Bad photo already **shared with friends**? You can't tear it out of their albums, so you add a **new photo that undoes it** (`git revert`).\n\n🎬 **Animation idea:** four short scenes, one per undo tool. For `revert`, show the album growing: photo 5 \"Add bad file\", then photo 6 \"Revert: Add bad file\", with the bad file vanishing from the desk while both photos stay in the album.\n\n---\n\n## 💻 Real explanation\n\n### 1. Look before you commit\n\n| Command | Shows |\n|---|---|\n| `git status` | **which** files changed. Red = not staged, green = staged, **untracked** = new files Git has never seen |\n| `git diff` | **what** changed inside files, line by line. `-` red = removed, `+` green = added |\n| `git diff <file>` | the same, for one file |\n| `git log --oneline` | the history, one line per commit |\n| `git log --oneline -3` | only the last 3 commits |\n| `git show --stat HEAD` | which files are in the **last** commit |\n\n- `git diff` doesn't show untracked files: there's no old version to compare with.\n- A changed line shows as the **whole old line removed** + the **whole new line added**.\n- **HEAD** = the commit you're on now (the latest photo).\n- If you see `:` or `~` at the bottom, you're in the **pager**. Press **q** to quit.\n\n### 2. Good commit messages\n\n**Rules:**\n1. Start with a **verb**, in **present tense**: `Add`, `Fix`, `Update`, `Remove`, `Rename`\n2. Say **what** changed, not when (\"Day 3\" doesn't help anyone)\n3. Short: about 50 characters, starting with a capital letter\n4. One topic per commit: **atomic commits**\n\n**The test:** the message should finish the sentence *\"If applied, this commit will ___\"*.\n✅ *\"If applied, this commit will* **Add switch lessons and grade calculator exercise***\"*\n\n| Verb | When | Example |\n|---|---|---|\n| Add | something new | `Add login page` |\n| Fix | a bug | `Fix crash when marks is 65` |\n| Update | changed something existing | `Update README with run steps` |\n| Remove | deleted something | `Remove unused test lines` |\n| Rename | changed a name | `Rename isKuwaiti to residentAnswer` |\n\n| ❌ Bad | ✅ Good |\n|---|---|\n| `Day:3 if/else, parking meter v2` | `Add parking meter v2 with guards and cap` |\n| `Updated Roadmap switch class is finish so the check box is ticked` | `Update roadmap: switch done` |\n| `fixed stuff` | `Fix missing return in grade guard` |\n\nAlways put the message in **quotes**: `git commit -m \"Add switch lessons\"`. Without quotes, Git may open the **Vim** editor. To escape Vim and cancel: press **Esc**, type **`:cq`**, press **Enter**.\n\n### 3. The four undo tools\n\n| Situation | Command | Your edits |\n|---|---|---|\n| I messed up my edits, throw them away | `git restore <file>` | **deleted** ⚠️ (no Ctrl+Z!) |\n| I staged the wrong file | `git restore --staged <file>` | **kept**, just unstaged ✅ |\n| My last commit is wrong and **not pushed** | `git commit --amend -m \"new message\"` | replaces the last commit |\n| ...and I only forgot a file | `git add <file>` then `git commit --amend --no-edit` | keeps the message |\n| A commit is wrong and **already pushed** | `git revert <commit-id> --no-edit` | adds a **new** commit that undoes it |\n\n**Amend makes a new commit ID** every time (`0436b38` → `b85ff63` → `717580a`). It throws the old photo away and makes a new one. That's why:\n\n> ⚠️ **Golden rule: never amend a commit you have already pushed.** Your teammates have the old ID, and their history won't match yours. Use `revert` instead.\n\n**Revert in action:**\n```\n64f8e6f Revert \"Add git practice file\"   ← new commit that undoes it\n2ebab8f Add git practice file            ← the bad commit is still in history\n```\nNothing is erased. The history tells the honest story: \"I did X, then I undid X.\"\n\n### 4. A pushed typo? Leave it.\n`b59b86c Update roadmap: swich done` was already pushed, so we **left it**. A small typo in history is fine. Rewriting shared history is worse.\n\n---\n\n## 🎯 Dart comparison\n\nGit works the same for every language. Nothing changes between Flutter and .NET here.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | What happened | Lesson |\n|---|---|---|\n| Only ran `git add` on 08, not 07 | The commit had 2 files instead of 4 | Check `git status` (all green?) **before** committing, and `git show --stat HEAD` after |\n| Commit message without quotes | Vim opened and I got stuck | Always `-m \"...\"`. Escape Vim with Esc → `:cq` |\n| `Updated ...` | Past tense | `Update ...` (present tense) |\n| Very long message with the \"why\" | 65 characters | Short: say *what* changed |\n| `swich`, `pratice`, `pjase`, `Imporve READMR` | Typos stay in history forever | Read the message before Enter |\n| Thought `restore --staged` deleted my comment | VS Code hadn't refreshed | `--staged` **never** deletes edits |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| desk | **working directory** / **working tree** | \"Your working tree is clean.\" |\n| box | **staging area** (index) | \"Stage only the files for this change.\" |\n| latest photo | **HEAD** | \"`git show HEAD` shows the last commit.\" |\n| one topic per photo | **atomic commit** | \"Split that into smaller, atomic commits.\" |\n| retake the last photo | **amend** | \"Don't amend pushed commits.\" |\n| take out of the box | **unstage** | \"I staged the bin folder by mistake, let me unstage it.\" |\n| throw away edits | **discard changes** | \"Discard your local changes and pull again.\" |\n| new photo that undoes | **revert** | \"That commit broke the build, let's revert it.\" |\n| `:` scroll screen | **pager** | \"Press q to quit the pager.\" |\n| rewriting pushed commits | **rewriting history** | \"Never rewrite shared history.\" |\n\n---\n\n## 📋 Summary\n\n- Before every commit: `git status` + `git diff`. After: `git show --stat HEAD`\n- Messages: verb first, present tense, short, one topic, in quotes\n- `restore` = throw away edits · `restore --staged` = unstage (edits kept)\n- `commit --amend` = fix the last commit, **only if it's not pushed**\n- `revert <id>` = safely undo any commit, even a pushed one\n\n---\n\n## 📝 Quiz\n\n1. What's the difference between `git restore file` and `git restore --staged file`?\n2. You pushed a commit with a bug. Amend or revert? Why?\n3. Rewrite this message: `fixed the bug where grade C crashed`\n4. Why does `git diff` show nothing for a brand-new file?\n5. You committed, but forgot one file. The commit isn't pushed. What 2 commands fix it and keep the message?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `restore` **deletes** your edits (back to the last commit). `restore --staged` only takes the file out of the staging area. Your edits stay.\n2. **Revert.** The commit is pushed, so others may have it. Amend rewrites history (a new ID) and breaks their copy. Revert adds a new commit that undoes it.\n3. `Fix crash for grade C` (verb first, present tense, short)\n4. The file is **untracked**. Git has no old version to compare it with.\n5. `git add <file>` then `git commit --amend --no-edit`\n\n<\/details>\n"}, {"id": "1.6", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/06-while-random.md", "title": "while loops and Random", "md": "# Chapter 1.6: while loops and Random\n\n> Learned: Sun 11 Oct 2026 · Code: `lessons/phase-01/09-while-loop`, `10-random`, `11-roll-until-six`\n\n---\n\n## 🧸 LKG story\n\n**A `while` loop is mom saying: \"While the plate is not empty, keep eating.\"**\n\n- You look at the plate. Food is still there? Take one bite.\n- Look again. Still food? Another bite.\n- Look again. Empty! **Stop**, and go play.\n\nMom checks **before every bite**. If the plate was already empty at the start, you eat **zero** bites.\n\nAnd if you never actually take a bite, the plate never gets empty, and you sit there **forever**. That's an infinite loop.\n\n**`Random` is a lucky-draw box** with balls numbered 1 to 6 inside. Close your eyes and pull one out: you can't know which number comes next. But you **do** know it's always between 1 and 6.\n\n🎬 **Animation idea:** a plate with 3 cookies and a \"check\" light. Each round the light asks \"bites > 0?\", turns green, a bite disappears, and the counter goes down. At 0 the light turns red and the child runs off to play. A switch adds a stray `;` after the `while`: now the child just stares at the plate, the round counter spins faster and faster, and the screen says \"the program hangs, press Ctrl+C\".\n\n---\n\n## 💻 Real explanation\n\n### 1. The `while` loop\n\nA **`while` loop** repeats its body **as long as a condition is `true`**.\n\n```csharp\nwhile (condition)\n{\n    // body: runs again and again while the condition is true\n}\n```\n\n- The condition is checked **before each round**. One round is called an **iteration**.\n- When the condition becomes `false`, C# jumps past the `}` and continues with the next line.\n- Something inside the body **must change** the condition. Otherwise the loop never stops: an **infinite loop**.\n\n```csharp\nint bites = 3;\n\nwhile (bites > 0)\n{\n    Console.WriteLine($\"Eating... {bites} bites left\");\n    bites--;   // bites = bites - 1\n}\n\nConsole.WriteLine(\"Plate empty! Go play\");\n```\n\nOutput:\n```\nEating... 3 bites left\nEating... 2 bites left\nEating... 1 bites left\nPlate empty! Go play\n```\n\n### 2. Tracing a loop (dry run)\n\n**Tracing** means following the code step by step on paper, like the computer does.\n\n| Round | `bites` at the check | `bites > 0`? | Prints | `bites` after `bites--` |\n|---|---|---|---|---|\n| 1 | 3 | true | Eating... 3 bites left | 2 |\n| 2 | 2 | true | Eating... 2 bites left | 1 |\n| 3 | 1 | true | Eating... 1 bites left | 0 |\n| 4 | 0 | **false** | nothing, the body is skipped | – |\n\n\"Eating... 0\" never prints: when `bites` is 0, the check `0 > 0` is false, so the loop stops **before** the body runs. \"Plate empty!\" is **outside** the loop, so it prints exactly once.\n\n### 3. Zero iterations\n\n```csharp\nint bites = 0;\nwhile (bites > 0) { ... }        // the first check is 0 > 0 → false\n```\nOutput: only `Plate empty! Go play`.\n\n> A `while` loop checks **first**. If the condition is false at the start, the body runs **zero times**.\n\n### 4. `Random`: random numbers\n\n```csharp\nint dice = Random.Shared.Next(1, 7);   // 1, 2, 3, 4, 5 or 6\n```\n\n| Part | Meaning |\n|---|---|\n| `Random` | a **class** in .NET that makes random numbers |\n| `Random.Shared` | a ready-made generator that .NET gives you (no need to create one) |\n| `.Next(min, max)` | a **method** that returns a random `int` |\n| `min` | **included** (inclusive lower bound) |\n| `max` | **excluded** (exclusive upper bound) |\n\n⚠️ `Next(1, 7)` gives 1 to **6**, never 7. For 1 to 100, write `Next(1, 101)`.\n🧠 Memory trick: **\"the max is the door, you stop before the door.\"** 🚪\n\nThe output is **non-deterministic**: it changes every run. But you can still predict the **shape** of the output:\n\n```csharp\nint rolls = 1;\nwhile (rolls <= 3)\n{\n    int dice = Random.Shared.Next(1, 7);\n    Console.WriteLine($\"Roll {rolls}: you got {dice}\");\n    rolls++;\n}\n```\nThree real runs:\n```\nRoll 1: you got 1      Roll 1: you got 4      Roll 1: you got 1\nRoll 2: you got 5      Roll 2: you got 6      Roll 2: you got 6\nRoll 3: you got 5      Roll 3: you got 4      Roll 3: you got 5\n```\nWhat is always true: exactly 3 lines, labels 1-2-3, every number between 1 and 6, and repeats are possible (5, 5).\n\n### 5. Loop **until** something happens (sentinel loop)\n\nSometimes you don't know how many rounds you need. You keep going **until** something happens.\n\n```csharp\nstring? answer = \"\";                      // 1. declare BEFORE the loop, with a starting value\n\nwhile (answer != \"yes\")                   // 2. keep going while it's NOT what we want\n{\n    Console.Write(\"Are you ready? (yes/no): \");\n    answer = Console.ReadLine();          // 3. update INSIDE the loop\n}\n\nConsole.WriteLine(\"Let's go\");\n```\n```\nAre you ready? (yes/no): no\nAre you ready? (yes/no): Yes\nAre you ready? (yes/no): YES\nAre you ready? (yes/no): yes\nLet's go\n```\n`\"YES\" != \"yes\"` is true, because string comparison is **case-sensitive**, so the loop runs again.\n\nThree rules:\n1. **Declare before the loop.** The condition is outside the `{ }`, so it can only see variables declared outside (**scope**).\n2. **The starting value must make the condition true**, so the loop runs at least once.\n3. **Update inside the loop**, or it's an infinite loop.\n\n### 6. Full example: Roll Until Six\n\n```csharp\nint rolls = 0;     // zero rolls before we start\nint dice = 7;      // not 6, so the loop runs at least once (a real dice never gives 7)\n\nwhile (dice != 6)\n{\n    rolls++;                               // count first...\n    dice = Random.Shared.Next(1, 7);       // no \"int\" here: dice is already declared\n    Console.WriteLine($\"Roll {rolls}: {dice}\");   // ...then print\n}\n\nif (rolls == 1)\n{\n    Console.WriteLine(\"Lucky! First try!\");\n}\nelse\n{\n    Console.WriteLine($\"🎉 Got a 6 after {rolls} rolls!\");\n}\n```\n```\nRoll 1: 5\nRoll 2: 3\nRoll 3: 1\nRoll 4: 3\nRoll 5: 5\nRoll 6: 4\nRoll 7: 1\nRoll 8: 6\n🎉 Got a 6 after 8 rolls!\n```\nAnd once, with no tricks at all:\n```\nRoll 1: 6\nLucky! First try!\n```\n\n**Testing a random program:** a first-try 6 only happens about 1 time in 6. To test that branch on purpose, **temporarily hard-code** the value: `Random.Shared.Next(6, 7)` always gives 6. Test, then **revert** it.\n\n🎬 **Animation idea:** a dice table with a roll button and a tally board. A switch moves `rolls++` to **after** the print: now the labels start at \"Roll 0\" or the final total is one too high, and a red arrow points at the mismatch between the last roll label and the 🎉 number. Move it back, and the two numbers line up with a green tick. A \"force a 6\" button shows the hard-code testing trick.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| `while` loop | `while (i <= 3) { ... }` | **exactly the same** |\n| Stray `;` after `while (...)` | empty loop body too | empty loop body + warning **CS0642** |\n| Random number | `import 'dart:math';` then `Random().nextInt(6) + 1` | `Random.Shared.Next(1, 7)`, no import, no `+1` |\n| Max excluded? | yes, `nextInt(6)` gives 0–5 | yes, `Next(1, 7)` gives 1–6 |\n| String compare | case-sensitive | case-sensitive |\n\n```dart\n// Dart\nimport 'dart:math';\nint dice = Random().nextInt(6) + 1;   // 1..6\n```\n```csharp\n// C#\nint dice = Random.Shared.Next(1, 7);  // 1..6\n```\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| **CS0117** \"'Console' does not contain a definition for 'Writeline'\" | C# is **case-sensitive**: `Writeline` ≠ `WriteLine` | Capital **L**: `WriteLine` |\n| **CS0642** \"Possible mistaken empty statement\", then the program **hung** | `while (bites > 0) ;` The `;` became the loop body (do nothing), so `bites` never changed → **infinite loop** | Never put `;` after `while (...)`, `if (...)`, `switch (...)`. Press **Ctrl+C** to stop a hung program |\n| Same CS0642, now at `(4,5)` | **Moved** the `;` to the next line instead of deleting it. C# ignores lines and spaces | **Delete** it, so `{` comes right after `)` |\n| Edited but ran the old code | Didn't save (white dot ● on the tab) | **Ctrl+S** before `dotnet run` |\n| Loop ran exactly 5 times, not \"until a 6\" | `while (rolls <= 5)`: the loop was controlled by the counter, not the dice | `while (dice != 6)` |\n| `dice` declared inside the loop | The `while (...)` check is outside the `{ }`, so it can't see it (it would be **CS0103**) | Declare `dice` **before** the loop; inside, write `dice = ...` without `int` |\n| `\"Got a {}\"` printed literally | No `$` and no variable inside `{ }` | `$\"Got a 6 after {rolls} rolls!\"` |\n| **Off-by-one**: 2 rolls but \"after 3 rolls\" (or labels starting at \"Roll 0\") | `rolls++` ran **after** the print | Start at `rolls = 0` and **increment before** the print |\n| Quiz: thought `x = 5; while (x < 3)` prints 4, 5 | Forgot the **first check**: `5 < 3` is false | Zero iterations: only the line after the loop prints |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| merry-go-round | **loop** | \"Wrap that in a loop instead of copying it 3 times.\" |\n| one round | **iteration** | \"On the third iteration, `bites` is 1.\" |\n| the check at the top | **loop condition** | \"The loop condition is never false, so it hangs.\" |\n| the code inside `{ }` | **loop body** | \"Move `rolls++` to the top of the loop body.\" |\n| never stops | **infinite loop**; the app **hangs** | \"The app hung because of an infinite loop.\" |\n| the lonely `;` | **empty statement** / **stray semicolon** | \"There's a stray semicolon after the `while`.\" |\n| body never runs | **zero iterations** | \"If the list is empty, the loop runs zero iterations.\" |\n| loop until \"yes\" | **sentinel loop** / loop until a condition is met | \"Use a sentinel loop until the user types yes.\" |\n| the variable the loop checks | **loop control variable** | \"`dice` is the loop control variable.\" |\n| add 1 / take away 1 | **increment** `++` / **decrement** `--` | \"Increment the counter before you print it.\" |\n| counter one too big | **off-by-one error** | \"It's an off-by-one error: I incremented after printing.\" |\n| lucky-draw box | **random number generator** (`Random`) | \"Use `Random.Shared`, don't create a new `Random` each time.\" |\n| `min` / `max` of `Next` | **inclusive lower bound** / **exclusive upper bound** | \"`Next(1, 101)` returns 1 to 100, the upper bound is exclusive.\" |\n| different every run | **non-deterministic** | \"Random output is non-deterministic, so test the range, not the exact value.\" |\n| capitals count | **case-sensitive** | \"String comparison is case-sensitive by default.\" |\n| force the dice to 6 | **hard-code** a value to test an **edge case**, then **revert** | \"I hard-coded 6 to test the first-try branch.\" |\n| follow the code on paper | **tracing** / **dry run** | \"Let's trace the loop with `bites = 3`.\" |\n\n---\n\n## 📋 Summary\n\n- `while (condition) { body }`: the condition is checked **before** every iteration\n- If it's false at the start, the body runs **zero** times\n- Something in the body **must** change the condition, or you get an **infinite loop** (Ctrl+C to stop)\n- **Never** put `;` right after `while (...)` (CS0642)\n- `Random.Shared.Next(min, max)`: `min` included, `max` **excluded**\n- Sentinel loop: declare **before** the loop, a starting value that makes the condition **true**, update **inside**\n- Counters: **increment before** you use the value, or you get an **off-by-one** error\n- Test random code by **hard-coding** the value for a moment, then revert\n\n---\n\n## 📝 Quiz\n\n1. What does this print? Why?\n   ```csharp\n   int x = 5;\n   while (x < 3) { Console.WriteLine(x); x++; }\n   Console.WriteLine(\"End\");\n   ```\n2. You want a random number from 1 to 10. `Next(1, 10)` or `Next(1, 11)`? What's wrong with the other one?\n3. This program hangs. What's the bug, and what's its real name?\n   ```csharp\n   int count = 1;\n   while (count <= 3) { Console.WriteLine(count); }\n   ```\n4. What's wrong here, and which build error do you expect?\n   ```csharp\n   while (dice != 6) { int dice = Random.Shared.Next(1, 7); }\n   ```\n5. Your counter said \"3 rolls\" when there were only 2. Explain it to your team lead in one sentence.\n\n<details>\n<summary>Answers<\/summary>\n\n1. Only `End`. The first check is `5 < 3` → false, so the body runs **zero** times.\n2. `Next(1, 11)`. The max is **exclusive**, so `Next(1, 10)` only gives 1 to 9.\n3. `count` never changes (no `count++`), so `1 <= 3` is true forever: an **infinite loop**.\n4. `dice` is declared **inside** the loop, but the `while (dice != 6)` check is **outside** the `{ }`. It's out of scope: **CS0103** \"The name 'dice' does not exist in the current context\". Declare it before the loop.\n5. \"It was an **off-by-one error**: I incremented the counter after printing, so the total was one too high. I fixed it by incrementing before the print.\"\n\n<\/details>\n"}, {"id": "1.7", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/07-guessing-game.md", "title": "Validation loops and the Number Guessing Game", "md": "# Chapter 1.7: Validation loops and the Number Guessing Game\n\n> Learned: Mon 12 Oct 2026 · Code: `lessons/phase-01/12-pin-lock`, `projects/01-number-guessing-game`\n\n---\n\n## 🧸 LKG story\n\n**A validation loop is a door with a PIN pad.**\n\nYou stand at the door and type a PIN. The door keeps asking **until** the PIN is right.\n\n- You type **letters** → the door beeps: \"Digits only!\" That try **doesn't count**, and it asks again.\n- You type a **wrong number** → \"Wrong PIN.\" That **counts** as a try, and it asks again.\n- You type the **right number** → the door opens. 🚪\n\nThe door does **two checks, one inside the other**: first \"is it a number at all?\", and only then \"is it the right number?\"\n\n**The guessing game is the same door with a twist.** Instead of \"Wrong PIN\", the door gives you a clue: \"Too high!\" or \"Too low!\"\n\n🎬 **Animation idea:** a door with a PIN pad and a tally board. The child types `abc`: the pad flashes red, says \"Digits only\", and the tally does **not** move. They type `1111`: \"Wrong PIN\", and the tally goes up to 1. They type `4321`: the door swings open and the board says \"Unlocked after 2 tries\". A switch moves `tries++` **outside** the number check: now `abc` also adds a tally mark, and the total becomes 3.\n\n---\n\n## 💻 Real explanation\n\n### 1. The input validation loop\n\nAn **input validation loop** keeps asking until the input is **valid** (a number) **and** correct. Inside it, there's a **nested `if`**: an `if` inside another `if`.\n\n```csharp\nint correctPin = 4321;\nint pin = 0;      // starting value that makes the loop condition TRUE\nint tries = 0;    // nothing counted yet\n\nwhile (pin != correctPin)\n{\n    Console.Write(\"Enter PIN: \");\n    string? input = Console.ReadLine();\n\n    if (int.TryParse(input, out pin))      // outer: is it a number?\n    {\n        tries++;                           // only real numbers count\n        if (pin != correctPin)             // inner: is it wrong?\n        {\n            Console.WriteLine(\"Wrong PIN.\");\n        }\n    }\n    else\n    {\n        Console.WriteLine(\"Digits only, please.\");\n    }\n}\n\nConsole.WriteLine($\"Unlocked after {tries} tries.\");\n```\n\nOutput:\n```\nEnter PIN: abc\nDigits only, please.\nEnter PIN: 1111\nWrong PIN.\nEnter PIN: 4321\nUnlocked after 2 tries.\n```\n\nWhy **2** tries and not 3? `abc` fails `TryParse`, so it goes to the `else`, and `tries++` never runs for it. Only `1111` and `4321` are counted.\n\nKey points:\n- `out pin` writes **straight into the loop's variable**, so the `while` check sees the new value next time.\n- `tries++` sits **inside the outer `if`**, so bad input isn't counted.\n- When the right PIN comes in, the inner `if` is false (nothing prints), the `while` check is false, and the loop ends.\n- 🔍 When `TryParse` **fails**, it sets `pin` to `0`. That's safe here because the PIN is never 0, but always ask yourself: \"what if the variable becomes 0?\"\n\n### 2. Where a line lives decides how many times it runs\n\nC# runs the file **top to bottom**. A line **above** the loop runs **once**. A line **inside** the loop runs **every iteration**.\n\n```csharp\nint secretNumber = Random.Shared.Next(1, 101);   // above the loop → picked ONCE\n\nwhile (guessNumber != secretNumber)\n{\n    // everything here runs again for every guess\n}\n```\n\n- In **one game**, the secret stays the same for every guess.\n- In the **next `dotnet run`**, the program starts fresh, so you get a new secret.\n\nIf the `Random` line goes **inside** the loop, it **overwrites** a variable on every round. On my first try, I wrote this:\n\n```csharp\nif (int.TryParse(input, out guessNumber))\n{\n    guessNumber = Random.Shared.Next(1, 101);   // ❌ overwrites the player's guess\n}\n```\n\nTrace it with the input `42`:\n\n| Line | `guessNumber` after it |\n|---|---|\n| `int.TryParse(input, out guessNumber)` | 42 (the player's guess) |\n| `guessNumber = Random.Shared.Next(1, 101);` | 73 (random, **the 42 is lost**) |\n| `while (guessNumber != secretNumber)` | `73 != 42` → true → keeps looping |\n\n> The **computer** picks the **secret**. The **player** types the **guess**. `Random` never touches the guess.\n\n🎬 **Animation idea:** the guessing game, playable. A switch moves the line `secretNumber = Random...` **above** the loop or **inside** it. Above: the secret hides behind a curtain and stays the same, and the clues lead you to it. Inside: every time you guess, the curtain shuffles and a new secret appears, so \"Too high\" and \"Too low\" stop making sense. A \"middle guess\" button shows the binary search trick: 50, then 25 or 75, and so on, finding any number in 7 guesses or fewer.\n\n### 3. Three cases: too high, too low, correct\n\n```csharp\nif (int.TryParse(input, out guessNumber))\n{\n    numberOfAttempts++;\n\n    if (guessNumber > secretNumber)\n    {\n        Console.WriteLine(\"Too high!\");\n    }\n    else if (guessNumber < secretNumber)\n    {\n        Console.WriteLine(\"Too low!\");\n    }\n}\n```\n\nThere are 3 cases, but \"equal\" prints **nothing** inside the loop: the loop simply ends, and the message after the loop prints. So there's no final `else`.\n\n### 4. `if` / `else` = one path, not both\n\n```csharp\nif (numberOfAttempts == 1)\n{\n    Console.WriteLine(\"🎯 First try! Amazing!\");\n}\nelse\n{\n    Console.WriteLine($\"🎉 Correct! You got it in {numberOfAttempts} attempts.\");\n}\n```\n\nWithout the `else`, the 🎉 line is **outside** any branch, so it runs **every time**. On a first-try win, **both** lines printed. With `if` / `else`, you walk exactly **one** path.\n\n### 5. Testing with a hard-coded secret\n\nA random secret is hard to test, because you don't know the answer. So:\n\n1. Start with `int secretNumber = 42;`\n2. Test **every path**: letters, too high, too low, correct, first try.\n3. **Then** switch to `Random.Shared.Next(1, 101)` and play for real.\n\nTest plan with secret `42`:\n\n| Input | Expected |\n|---|---|\n| `abc` | That's not a number. Try again. (not counted) |\n| `50` | Too high! |\n| `25` | Too low! |\n| `42` | 🎉 Correct! You got it in 3 attempts. |\n| `42` (as the first guess, in a new run) | 🎯 First try! Amazing! |\n\n### 6. The full project\n\n```csharp\nConsole.WriteLine(\"I'm thinking of a number between 1 and 100.\");\n\nint secretNumber = Random.Shared.Next(1, 101);\nint guessNumber = 0;\nint numberOfAttempts = 0;\n\nwhile (guessNumber != secretNumber)\n{\n    Console.Write(\"Your guess: \");\n    string? input = Console.ReadLine();\n    if (int.TryParse(input, out guessNumber))\n    {\n        numberOfAttempts++;\n        if (guessNumber > secretNumber)\n        {\n            Console.WriteLine(\"Too high!\");\n        }\n        else if (guessNumber < secretNumber)\n        {\n            Console.WriteLine(\"Too low!\");\n        }\n    }\n    else\n    {\n        Console.WriteLine(\"That's not a number. Try again.\");\n    }\n}\n\nif (numberOfAttempts == 1)\n{\n    Console.WriteLine(\"🎯 First try! Amazing!\");\n}\nelse\n{\n    Console.WriteLine($\"🎉 Correct! You got it in {numberOfAttempts} attempts.\");\n}\n```\n\nA real game:\n```\nI'm thinking of a number between 1 and 100.\nYour guess: 42\nToo high!\nYour guess: 10\nToo low!\nYour guess: 25\nToo high!\nYour guess: 20\nToo high!\nYour guess: 18\nToo high!\nYour guess: 15\nToo high!\nYour guess: 12\nToo low!\nYour guess: 14\n🎉 Correct! You got it in 8 attempts.\n```\n\n🧠 **Binary search trick:** always guess the **middle** of what's left (50, then 25 or 75, ...). Each guess cuts the possibilities in half, so you find any number from 1 to 100 in **7 guesses or fewer**.\n\n### 7. Clean code: names and formatting\n\n- **Meaningful names:** the counter was first called `randomNumber`, but nothing about it was random. `numberOfAttempts` says what it **holds**. In VS Code, click a name and press **F2** to rename it everywhere at once.\n- **Formatting rules:**\n  - `}` and `else` go **together**, with no blank line between them (they're one statement).\n  - The end of one block and the start of a new block get **one** blank line (for example, the game loop, then the result `if`).\n\n### 8. The README\n\nA **README.md** is the front page of a project on GitHub, written in **Markdown**: `#` for headings, `-` for bullets, three backticks for code blocks. Preview it in VS Code with **Ctrl+Shift+V**.\n\nWrite only what is **true**. My first draft said the secret was tested with 50 (it was 42) and that \"the max is 100\" (the max I pass is 101, and it's exclusive). An interviewer could ask about any line.\n\n### 9. Git practice of the day\n\n- `fatal: pathspec '...' did not match any files`: the path given to `git add` doesn't exist. When one path fails, Git stages **nothing**, so just fix it and try again.\n- `git add .` stages **everything** in the folder. It's fine **only** when `git status` shows nothing but the files for this commit. Check `git status` before **and** after.\n- `Your branch is ahead of 'origin/main' by 2 commits` = 2 **local commits** that are not on GitHub yet. `git push` sends them.\n- A folder with only `obj` or `bin` inside is **build output**, not code. `.gitignore` already ignores it, and it's safe to delete.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| Try to read a number | `int? n = int.tryParse(input);` (returns `null` if it fails) | `int.TryParse(input, out n)` (returns `bool`, the number goes into `n`) |\n| Check if it worked | `if (n != null)` | `if (int.TryParse(...))` |\n| When it fails | `n` is `null` | `n` is `0` |\n| Random 1 to 100 | `Random().nextInt(100) + 1` | `Random.Shared.Next(1, 101)` |\n| Pick once at the top | `final secret = ...;` | `int secretNumber = ...;` (above the loop) |\n| Nested `if`, `else if` | same | same |\n\n```dart\n// Dart\nfinal secret = Random().nextInt(100) + 1;\nint? guess;\nwhile (guess != secret) {\n  guess = int.tryParse(stdin.readLineSync() ?? '');\n  if (guess == null) { print(\"That's not a number.\"); continue; }\n  // ...\n}\n```\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| `fatal: pathspec 'lessons/phase-01/atomic' did not match any files` | Typed the word \"atomic\" into a blank meant for a **folder name** | Use the real folder na
