e files for this commit. Check `git status` before **and** after.\n- `Your branch is ahead of 'origin/main' by 2 commits` = 2 **local commits** that are not on GitHub yet. `git push` sends them.\n- A folder with only `obj` or `bin` inside is **build output**, not code. `.gitignore` already ignores it, and it's safe to delete.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| Try to read a number | `int? n = int.tryParse(input);` (returns `null` if it fails) | `int.TryParse(input, out n)` (returns `bool`, the number goes into `n`) |\n| Check if it worked | `if (n != null)` | `if (int.TryParse(...))` |\n| When it fails | `n` is `null` | `n` is `0` |\n| Random 1 to 100 | `Random().nextInt(100) + 1` | `Random.Shared.Next(1, 101)` |\n| Pick once at the top | `final secret = ...;` | `int secretNumber = ...;` (above the loop) |\n| Nested `if`, `else if` | same | same |\n\n```dart\n// Dart\nfinal secret = Random().nextInt(100) + 1;\nint? guess;\nwhile (guess != secret) {\n  guess = int.tryParse(stdin.readLineSync() ?? '');\n  if (guess == null) { print(\"That's not a number.\"); continue; }\n  // ...\n}\n```\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| `fatal: pathspec 'lessons/phase-01/atomic' did not match any files` | Typed the word \"atomic\" into a blank meant for a **folder name** | Use the real folder names (`10-random`, `11-roll-until-six`) |\n| `git add` with one folder twice, another folder missing | Typed `11-roll-until-six` twice and forgot `10-random` | `git status` showed `10-random/` still **untracked** ✅, so I added it before committing |\n| Extra folder `11-ro11l-until-six` with only `obj` inside | A typo created a **stray build folder** | `Remove-Item -Recurse -Force` (read the path twice before Enter) |\n| Practice code typed into the **project's** `Program.cs` | Wrong file open | Cut it out (the project file must only hold the game), paste it into the lesson folder |\n| Changed `tries = 0` to `1`, then `2`, when asked \"why is it 2?\" | Thought \"explain why\" meant \"it's wrong\". It wasn't! | Don't change code until you know **why** it does what it does. Trace first |\n| `guessNumber = Random.Shared.Next(1, 101);` inside the loop | `Random` **overwrote** the player's guess, so typing `42` didn't stop the loop | The player types the guess, `Random` only picks the secret, once, above the loop |\n| Two variables for one guess (`guessNumber` and `inputNumber`) | The `while` checked one, `out` wrote into the other | One variable: `out guessNumber` |\n| Counter called `randomNumber` | The name didn't match what it holds | Renamed with **F2** to `numberOfAttempts` |\n| First-try win printed **two** lines | The 🎉 line was outside any `else`, so it always ran | Put it inside `else` |\n| Only tested one path of the bonus | \"It works for 2 attempts\" ≠ \"it works for 1 attempt\" | **Test every path** |\n| ` I'm thinking...` printed with a space in front | A space inside the quotes | Delete it: `\"I'm thinking...\"` |\n| README said \"tested with 50\" and \"max is 100\" | Not true (it was 42, and the max passed is 101) | Write only what's accurate |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| door that keeps asking | **input validation loop** | \"Wrap the `TryParse` in a validation loop.\" |\n| an `if` inside an `if` | **nested `if`** | \"The range check is a nested `if` inside the parse check.\" |\n| bad input not counted | **rejected input** / **invalid input** | \"Invalid input is rejected and doesn't count as an attempt.\" |\n| the random line wiped my guess | **overwrite** a variable | \"The random call was overwriting the user's guess.\" |\n| picked once at the top | **initialized once**, before the loop | \"The secret is initialized once, so it stays constant for the whole game.\" |\n| fixed number for testing | **hard-coded** test value | \"I hard-coded the secret to 42 to test the logic.\" |\n| try every road | **test every path / branch** | \"Did you test the first-try branch?\" |\n| good names | **meaningful variable names** | \"Rename `randomNumber`, it's not random.\" |\n| F2 | **Rename Symbol**, a **refactoring** | \"Use Rename Symbol so every reference changes.\" |\n| neat blank lines | **formatting** / **code style** | \"`else` goes on the line right after the `}`.\" |\n| guess the middle | **binary search** | \"Binary search finds it in 7 tries or fewer.\" |\n| project front page | **README** (written in **Markdown**) | \"Add a README with how to run it.\" |\n| Git couldn't find my path | **pathspec** error | \"The add failed, my pathspec had a typo.\" |\n| leftover `obj` folder | **build output** / **stray build folder** | \"That's just build output, it's gitignored.\" |\n| `git add .` | **stage all changes** | \"I staged everything because the working tree only had this change.\" |\n| saved on my PC, not GitHub | **local commits**, **ahead of the remote** | \"I'm 2 commits ahead, let me push.\" |\n\n---\n\n## 📋 Summary\n\n- **Input validation loop:** `while` + `TryParse` + a **nested `if`**. Bad input goes to the `else` and isn't counted\n- Put the counter **inside** the success branch, and **count it, then show it**\n- A line **above** the loop runs **once**. A line **inside** the loop runs **every iteration**\n- The secret is picked **once**. The guess comes from the **player**. Never let `Random` overwrite input\n- `if` / `else` = **one** path. A line after an `if` with no `else` **always** runs\n- Test with a **hard-coded** value, test **every** path, then switch to random\n- **Meaningful names** (F2 to rename) and clean **formatting**\n- README: honest, accurate, with a real example run\n\n---\n\n## 📝 Quiz\n\n1. You type `abc`, `7`, `9` into the PIN lock (correct PIN `9`). What's `tries` at the end, and why?\n2. What goes wrong if you put `int secretNumber = Random.Shared.Next(1, 101);` **inside** the `while` loop?\n3. Why does the guessing loop not need a final `else` for \"correct\"?\n4. This prints **two** lines on a first-try win. Why?\n   ```csharp\n   if (numberOfAttempts == 1)\n   {\n       Console.WriteLine(\"First try!\");\n   }\n   Console.WriteLine($\"Correct in {numberOfAttempts} attempts.\");\n   ```\n5. The `TryParse` fails and sets `guessNumber` to `0`. Why is that safe in this game? When would it **not** be safe?\n\n<details>\n<summary>Answers<\/summary>\n\n1. **2**. `abc` fails `TryParse`, goes to the `else`, and `tries++` never runs for it. `7` and `9` are counted.\n2. A new secret is picked on **every** guess, so the clues (\"too high\", \"too low\") are about a number that keeps changing. (Declaring it inside also puts it **out of scope** for the `while (...)` check, which gives **CS0103**.)\n3. When the guess equals the secret, nothing needs to print **inside** the loop: the `while` check becomes false, the loop ends, and the success message **after** the loop prints.\n4. The second `Console.WriteLine` is not inside an `else`, so it runs every time, even after \"First try!\". Put it in an `else`.\n5. The secret is from 1 to 100, so it's **never 0**, and a failed parse can never accidentally \"win\". It would **not** be safe if 0 could be a correct answer: then typing `abc` would end the loop.\n\n<\/details>\n"}, {"id": "1.8", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/08-for-loop.md", "title": "The for loop", "md": "# Chapter 1.8: The for loop\n\n> Learned: Tue 13 Oct 2026 · Code: `lessons/phase-01/13-for-loop`, `14-times-table`\n\n---\n\n## 🧸 LKG story\n\n**The teacher says: \"Run around the playground 5 times.\"**\n\nYou count on your fingers:\n\n1. **Start:** one finger up. You do this **once**, before the first lap.\n2. **Check:** \"Is my count 5 or less?\" Yes → run a lap.\n3. **After each lap:** put up one more finger.\n4. Check again… When the check says **no**, you stop.\n\nA `while` loop is \"keep going **until something happens**\". You don't know how many rounds it will take (like guessing a secret number).\nA `for` loop is \"do it **this many times**\". You **know the count** before you start.\n\n**The piggy bank:** to add up all your pocket money, you need **one** piggy bank that sits on the shelf for the whole week. If you buy a **new, empty** piggy bank every day, you'll never save anything. The piggy bank must be ready **before** the week starts.\n\n🎬 **Animation idea:** a running track with a lap counter and three dials: Start, Check and Step. Press \"Next step\" and the matching part of the `for` line lights up in order: start (only once), check, body (the runner does a lap and the number prints), step, check… A check counter shows that the condition is checked one time more than the body runs. Changing `<=` to `<` shows an off-by-one: one lap goes missing.\n\n---\n\n## 💻 Real explanation\n\n### 1. The `for` loop\n\n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine($\"Lap {i}\");\n}\n```\n\nThe `( )` holds **3 parts**, separated by `;`:\n\n| Part | Code | When it runs | Real term |\n|---|---|---|---|\n| ① Start | `int i = 1` | **once**, before everything | **initializer** |\n| ② Check | `i <= 5` | **before every** iteration | **condition** |\n| ③ Step | `i++` | **after every** iteration | **iterator** |\n\n**The order:** ① → ② → body → ③ → ② → body → ③ → ② … until ② is `false`.\n\n`i` is the **loop counter** (or **loop variable**). By habit it's called `i` (for \"index\").\n\n⚠️ Two words that look alike:\n- **iteration** = **one trip** around the loop\n- **iterator** = the **step part** (`i++`)\n\n### 2. A `for` is a `while` with everything on one line\n\nThese two do exactly the same thing:\n\n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n    Console.WriteLine($\"Lap {i}\");\n}\n```\n\n```csharp\nint i = 1;               // ① initializer\nwhile (i <= 5)           // ② condition\n{\n    Console.WriteLine($\"Lap {i}\");\n    i++;                 // ③ iterator\n}\n```\n\n`for` keeps the 3 counter parts **together**, so it's harder to forget `i++` (in a `while`, forgetting it means an **infinite loop**).\n\n**When to use which:**\n\n| You know the count before you start? | Use | Example I built |\n|---|---|---|\n| Yes (\"10 rows\", \"5 laps\") | `for` | Times Table |\n| No (\"until the guess is right\") | `while` | Number Guessing Game |\n\n### 3. Counting down and other steps\n\nThe iterator doesn't have to be `i++`:\n\n```csharp\nfor (int i = 5; i >= 1; i--)\n{\n    Console.WriteLine(i);\n}\nConsole.WriteLine(\"🚀 Liftoff!\");\n```\n```\n5\n4\n3\n2\n1\n🚀 Liftoff!\n```\n\n```csharp\nfor (int i = 2; i <= 10; i += 3)\n{\n    Console.Write($\"{i} \");\n}\n```\n```\n2 5 8\n```\n\n### 4. Tracing: the body runs **before** the iterator\n\nThe **first** time the body runs, `i` still has its **initializer** value. That's why the code above prints **2** first, not 5.\n\n| `i` at the check | `i <= 10`? | Prints | `i` after `i += 3` |\n|---|---|---|---|\n| 2 | true | `2` | 5 |\n| 5 | true | `5` | 8 |\n| 8 | true | `8` | 11 |\n| 11 | **false** | nothing, the loop exits | – |\n\nCount the checks: the body ran **3** times, and the condition was checked **4** times.\n\n> A loop with **N** iterations checks its condition **N + 1** times. The extra check is the `false` one that ends the loop.\n\n**The most common style** starts at **0** and uses `<`:\n\n```csharp\nfor (int i = 0; i < 3; i++)   // i = 0, 1, 2 → runs 3 times\n{\n    Console.WriteLine(\"Hi\");\n}\n```\n\nYou'll see this one everywhere once we reach arrays (they start counting at 0).\n\n### 5. Off-by-one: `<` vs `<=`\n\n```csharp\nfor (int i = 10; i > 4; i -= 2)  { Console.Write($\"{i} \"); }   // 10 8 6\nfor (int i = 10; i >= 4; i -= 2) { Console.Write($\"{i} \"); }   // 10 8 6 4\n```\n\n`4 > 4` is **false**, so 4 is **not** printed. `4 >= 4` is **true**, so it is.\nA loop that runs **one time too many or too few** has an **off-by-one error**. `<` vs `<=` (or `>` vs `>=`) decides it.\n\n### 6. Scope: `i` dies at the `}`\n\n```csharp\nfor (int i = 1; i <= 3; i++)\n{\n    Console.WriteLine(i);\n}\nConsole.WriteLine(i);   // ❌ CS0103: The name 'i' does not exist in the current context\n```\n\nA variable lives only inside the `{ }` (or the `for ( )`) where it was **declared**. That's its **scope**.\n\n### 7. The accumulator: adding things up\n\nTo add things up in a loop, you need a variable that is **declared before** the loop and **updated inside** it.\n\n```csharp\nint total = 0;             // the piggy bank: declared BEFORE the loop\n\nfor (int i = 1; i <= 4; i++)\n{\n    total += i;            // same as: total = total + i\n}\n\nConsole.WriteLine($\"Total: {total}\");\n```\n```\nTotal: 10\n```\n\nTrace it as **old total + i**. Each row starts from the row above:\n\n| `i` | `total` before | `total + i` | `total` after |\n|---|---|---|---|\n| 1 | 0 | 0 + 1 | 1 |\n| 2 | 1 | 1 + 2 | 3 |\n| 3 | 3 | 3 + 3 | 6 |\n| 4 | 6 | 6 + 4 | 10 |\n\n`total` is called an **accumulator**. `+=` is the **compound assignment operator**.\n\n⚠️ `total += 1` and `total += i` look alike, but they're very different:\n- `total += 1` adds **one** each time → **counts** the iterations (1, 2, 3, 4 → **4**)\n- `total += i` adds **the counter** → **sums** them (1, 3, 6, 10 → **10**)\n\n**Why \"before the loop\"?** Two reasons:\n\n```csharp\nfor (int i = 1; i <= 4; i++)\n{\n    int total = 0;     // ❌ a NEW empty piggy bank every iteration\n    total += i;\n}\nConsole.WriteLine($\"Total: {total}\");   // ❌ CS0103: total doesn't exist out here\n```\n\n1. It **resets to 0** on every iteration, so it can never grow.\n2. It **dies at the `}`**, so you can't print it after the loop (**CS0103**).\n\n🎬 **Animation idea:** a piggy bank on a shelf and a coin chute. Each iteration a coin with the value of `i` drops in, and the total under the bank grows: 1, 3, 6, 10. A switch moves `int total = 0;` inside the loop: now a brand-new empty piggy bank appears every round, the old one vanishes, and at the end the print line turns red with \"CS0103: The name 'total' does not exist\". A second switch changes `+= i` to `+= 1`, and the coins all become 1s, so the total only counts the laps.\n\n### 8. Full example: Times Table (with a guard clause)\n\n```csharp\nConsole.Write(\"Which times table? \");\nstring? input = Console.ReadLine();\n\nif (!int.TryParse(input, out int number))\n{\n    Console.WriteLine(\"That's not a number.\");\n    return;\n}\n\nint sum = 0;\nfor (int i = 1; i <= 10; i++)\n{\n    int answer = number * i;\n    Console.WriteLine($\"{number} x {i} = {answer}\");\n    sum += answer;\n}\nConsole.WriteLine($\"Sum of all answers: {sum}\");\n```\n```\nWhich times table? 7\n7 x 1 = 7\n7 x 2 = 14\n...\n7 x 10 = 70\nSum of all answers: 385\n```\n```\nWhich times table? hello\nThat's not a number.\n```\n\nTwo new things in it:\n\n- **`!`** is the **logical NOT operator**: it flips `true` ↔ `false`. `TryParse` returns `false` for `hello`, and `!` turns that into `true`, so the error block runs.\n- **`return;`** ends the program right there. This is an **early return**. An `if` at the top that checks for bad input and returns early is called a **guard clause**. Without the `return`, the program would print the error **and then** carry on with `number = 0`, printing `0 x 1 = 0` … `Sum of all answers: 0`.\n\nNote that `answer` is declared **inside** the loop, and that's fine: it's only needed for one iteration. `sum` is declared **outside**, because it must survive all 10.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| `for` loop | `for (int i = 1; i <= 5; i++) { ... }` | **exactly the same** |\n| `var` counter | `for (var i = 0; i < 3; i++)` | `for (var i = 0; i < 3; i++)` |\n| Print inside | `print('Lap $i');` | `Console.WriteLine($\"Lap {i}\");` |\n| `+=`, `-=`, `++`, `--` | yes | yes |\n| `!` (NOT) | `if (!isValid)` | `if (!isValid)` |\n| Guard clause | `if (number == null) { print('Not a number'); return; }` | `if (!int.TryParse(...)) { ...; return; }` |\n| Loop variable after the loop | out of scope | out of scope (**CS0103**) |\n\n```dart\n// Dart\nfor (int i = 5; i >= 1; i--) {\n  print(i);\n}\nprint('🚀 Liftoff!');\n```\n```csharp\n// C#\nfor (int i = 5; i >= 1; i--)\n{\n    Console.WriteLine(i);\n}\nConsole.WriteLine(\"🚀 Liftoff!\");\n```\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| Expected `Total: 10`, got `Total: 4` | Typed `total += 1` (the number one) instead of `total += i` (the letter i) | `+= i` to **sum**; `+= 1` only **counts** |\n| **CS0103** \"The name 'total' does not exist in the current context\" | `int total = 0;` was moved **inside** the loop, so it died at the `}` | Declare the accumulator **before** the loop |\n| Times Table: no \"Sum of all answers\" line, but I said \"done\" | The sum was **calculated** but never **printed** | Add the `WriteLine` **after** the loop's `}`. \"Done\" = my output matches the **expected** output line by line |\n| `That is not a number` → `This is not a number` | Retyped the spec's text instead of copying it | **Copy-paste** exact text from the spec: `That's not a number.` |\n| Quiz: thought `for (int i = 0; i < 3; i++)` prints 2 times | Forgot that `i = 0` is also a trip | 0, 1, 2 = **3** times (4 checks) |\n| Quiz: thought `for (int i = 2; ...; i += 3)` prints 5 first | Thought the iterator runs first | The **body runs before the iterator**: the first value is the **initializer** (2) |\n| Trace said \"4 > 4 false, stop\" but my answer still listed 4 | Wrote the output from memory, not from the table's print column | The output = **only** the rows where the body ran |\n| Called `i++` the \"iteration\" | **Iteration** = one trip; **iterator** = the step part | ① initializer, ② condition, ③ **iterator** |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| run this many times | **`for` loop** / counting loop | \"We know the count up front, so use a `for` loop.\" |\n| ① start | **initializer** | \"The initializer runs only once.\" |\n| ② check | **condition** | \"The condition is checked before every iteration.\" |\n| ③ step | **iterator** | \"The iterator is `i += 3`, so it skips.\" |\n| one trip around | **iteration** | \"On the third iteration, `i` is 8.\" |\n| `i` | **loop counter** / **loop variable** | \"Don't use the loop counter after the loop, it's out of scope.\" |\n| the piggy bank | **accumulator** | \"Initialize the accumulator before the loop, otherwise it resets on every iteration.\" |\n| `+=` | **compound assignment operator** | \"Use `sum += answer` instead of `sum = sum + answer`.\" |\n| one too many / too few | **off-by-one error** | \"`4 > 4` is false, so it's an off-by-one, use `>=`.\" |\n| where a variable lives | **scope** | \"CS0103 means it's out of scope, declare it before the block.\" |\n| `!` | **logical NOT operator** | \"`!` negates the TryParse result.\" |\n| bad input check at the top + `return` | **guard clause** + **early return** | \"Add a guard clause, so the happy path isn't nested in an `else`.\" |\n| the extra false check | the **final evaluation** of the condition | \"The condition is evaluated once more than the body runs.\" |\n\n---\n\n## 📋 Summary\n\n- `for (initializer; condition; iterator) { body }`\n- Order: initializer (**once**) → condition → **body** → iterator → condition → …\n- The first body run uses the **initializer** value\n- N iterations = **N + 1** condition checks\n- `for` when you **know the count**, `while` when you loop **until** something happens\n- `<` vs `<=` decides the last value: watch for **off-by-one**\n- The loop variable dies at the `}` (**scope**, **CS0103**)\n- **Accumulator:** declare **before** the loop, update **inside**, print **after**\n- `+= i` sums, `+= 1` counts\n- **Guard clause:** `if (!int.TryParse(...)) { ...; return; }` at the top\n\n---\n\n## 📝 Quiz\n\n1. Name the 3 parts of `for ( ___ ; ___ ; ___ )` with their real terms. Which one runs only once?\n2. How many times does this print `Hi`, and how many times is the condition checked?\n   ```csharp\n   for (int i = 0; i < 4; i++) { Console.WriteLine(\"Hi\"); }\n   ```\n3. What does this print?\n   ```csharp\n   for (int i = 1; i < 10; i += 4) { Console.Write($\"{i} \"); }\n   ```\n4. What's wrong here? Name the error and give two reasons it's a bad idea.\n   ```csharp\n   for (int i = 1; i <= 3; i++) { int sum = 0; sum += i; }\n   Console.WriteLine(sum);\n   ```\n5. In the Times Table, what would happen with input `hello` if you deleted the `return;`?\n\n<details>\n<summary>Answers<\/summary>\n\n1. **Initializer**, **condition**, **iterator**. The initializer runs only once.\n2. `i` = 0, 1, 2, 3 → **4** times `Hi`, and **5** checks (the 5th, `4 < 4`, is false).\n3. `1 5 9`. The next value, 13, fails `13 < 10`.\n4. `sum` is declared **inside** the loop. **CS0103**: `sum` doesn't exist after the `}`. And even without the error, it would **reset to 0** on every iteration. Declare it before the loop.\n5. It would print `That's not a number.` and then keep going with `number = 0`: `0 x 1 = 0` … `0 x 10 = 0`, `Sum of all answers: 0`.\n\n<\/details>\n"}, {"id": "1.9", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/09-do-while.md", "title": "do-while, the loop that runs at least once", "md": "# Chapter 1.9: do-while, the loop that runs at least once\n\n> Learned: Wed 14 Oct 2026 · Code: `lessons/phase-01/15-do-while`, `16-times-table-v2`\n\n---\n\n## 🧸 LKG story\n\n**The restaurant waiter.**\n\nAt a restaurant, the waiter **serves your first plate**, and only **then** asks: *\"Do you want more?\"*\n\n- Yes → another plate, then he asks again\n- No → he stops\n\nYou always get **at least one plate**, because the question comes **after** the food.\n\nA `while` loop is a different waiter. He stands at the **door** and asks *\"Do you want food?\"* before you even sit down. If you say no, you get **zero** plates.\n\n🎬 **Animation idea:** two waiters side by side. The \"while\" waiter stands at the door with a question bubble *before* the table, and the \"do-while\" waiter carries a plate straight to the table and asks *after* it lands. A switch sets the answer to \"no\" from the start: the while table stays empty (0 plates), the do-while table gets exactly 1 plate. A counter under each table shows how many times the body ran.\n\n---\n\n## 💻 Real explanation\n\n### 1. The shape\n\n```csharp\ndo\n{\n    // body\n} while (condition);   // ← this semicolon is REQUIRED\n```\n\n- The **body runs first**, and the **condition is checked at the bottom**.\n- So the body always runs **at least once**.\n- `while` is a **pre-test loop**: it checks first, so it can run **0** times.\n- `do-while` is a **post-test loop**: it checks after, so it runs **1 or more** times.\n\n⚠️ The `;` after `while (...)`:\n- In a `do-while`, it's **required**. That line is the **end** of the loop.\n- In a normal `while`, a `;` after `while (...)` is the **CS0642** bug: it becomes an empty loop body (Chapter 1.6).\n\n### 2. while vs do-while, side by side\n\n```csharp\nint x = 10;\n\nwhile (x < 5)\n{\n    Console.WriteLine(\"while ran\");\n}\n\ndo\n{\n    Console.WriteLine(\"do-while ran\");\n} while (x < 5);\n\nConsole.WriteLine(\"end\");\n```\n```\ndo-while ran\nend\n```\n\n`10 < 5` is false both times. The `while` checks **before** the body, so the body never runs. The `do-while` runs the body, **then** checks, then stops.\n\n**Which one to pick:**\n\n| Can the loop need to run **zero** times? | Use | Example |\n|---|---|---|\n| Yes (e.g. a list of orders that might be empty) | `while` | Print today's orders: no orders → print nothing |\n| No, it must run at least once | `do-while` | Show a menu; ask the user for input |\n\n### 3. The scope trap: declare before `do`\n\nThe condition sits **outside** the `{ }`, after the closing brace. A variable born **inside** the braces dies at the `}`, so the condition can't see it:\n\n```csharp\ndo\n{\n    Console.Write(\"Type yes: \");\n    string? answer = Console.ReadLine();   // born inside { }\n} while (answer != \"yes\");                 // ❌ CS0103: The name 'answer' does not exist\n```\n\n**Fix:** **declare** the variable **before** the `do`, and only **assign** it inside:\n\n```csharp\nstring? answer;                    // declared outside\ndo\n{\n    Console.Write(\"Type yes: \");\n    answer = Console.ReadLine();   // assigned inside (no \"string?\" here)\n} while (answer != \"yes\");         // ✅ can see it\nConsole.WriteLine(\"Thanks!\");\n```\n```\nType yes: no\nType yes: no\nType yes: yes\nThanks!\n```\n\nTwo words that sound alike:\n- **declare** = create the box: `string? answer;`\n- **initialize** = give the box its **first** value: `string? answer = \"\";`\n\n### 4. No more dummy values\n\nIn the PIN lock (`12-pin-lock`), the `while` version needed a fake starting value:\n\n```csharp\nint pin = 0;                  // 0 is a dummy, only there so the first check can run\nwhile (pin != correctPin) { ... }\n```\n\nWith `do-while`, the body runs first and gives the variable a **real** value **before** the first check. No dummy needed.\n\n### 5. A `bool` flag\n\n`int.TryParse` **returns** `true` or `false`. You can save that answer in a `bool` variable and use it later:\n\n```csharp\nbool isAdult = age >= 18;                       // true or false, saved\nbool ok = int.TryParse(\"abc\", out int value);   // ok = false\n```\n\nA `bool` variable that remembers yes/no is called a **flag**.\n\n**Name the flag honestly.** Its name must say what `true` means:\n- ✅ `ok = int.TryParse(...)` → `true` means \"the input is OK\"\n- ❌ `ok = !int.TryParse(...)` → `true` means \"the input is **bad**\", but the name says \"ok\". Anyone reading `if (ok)` will think of the good case.\n\nAnd `if (ok == true)` is the same as `if (ok)`. The `== true` adds nothing.\n\n### 6. Full example: Times Table v2 (ask until valid)\n\nVersion 1 (Chapter 1.8) **quit** on bad input with `return;`. Version 2 **asks again** until it gets a number:\n\n```csharp\nstring? input;\nint number;\nbool ok;\n\ndo\n{\n    Console.Write(\"Which times table? \");\n    input = Console.ReadLine();\n    ok = int.TryParse(input, out number);\n    if (!ok)\n    {\n        Console.WriteLine(\"That's not a number.\");\n    }\n} while (!ok);\n\nint sum = 0;\nfor (int i = 1; i <= 10; i++)\n{\n    int answer = number * i;\n    Console.WriteLine($\"{number} x {i} = {answer}\");\n    sum += answer;\n}\nConsole.WriteLine($\"Sum of all answers: {sum}\");\n```\n```\nWhich times table? abc\nThat's not a number.\nWhich times table? hi\nThat's not a number.\nWhich times table? 7\n7 x 1 = 7\n7 x 2 = 14\n...\n7 x 10 = 70\nSum of all answers: 385\n```\n\nRead the loop out loud: *\"save whether it's ok; if not ok, complain; keep asking while not ok.\"*\n\nNotes:\n- `int number;` has **no** `= 0`. `out number` gives it a real value.\n- `out number`, not `out int number`: `number` is already declared above, so we don't declare it again.\n- TryParse is called **once** per iteration. The flag remembers the result, so the `if` and the `while` don't call it again.\n\n🎬 **Animation idea:** a door with a keypad. The student types anything into a text box and presses Enter. A small \"ok\" light shows the flag: green for a number, red otherwise. On red, a speech bubble says \"That's not a number.\" and the arrow loops back up to \"Which times table?\". On green, the arrow goes down past `while (!ok)` and the first rows of the times table print.\n\n---\n\n## 🎯 Dart comparison\n\n| | Dart | C# |\n|---|---|---|\n| do-while | `do { ... } while (x < 5);` | **exactly the same** |\n| `;` at the end | required | required |\n| Variable in the condition | must be declared before `do` | must be declared before `do` (**CS0103** otherwise) |\n| Parse a number | `int? n = int.tryParse(input);` → `null` if bad | `bool ok = int.TryParse(input, out int n);` → `false` if bad |\n\n```dart\n// Dart\nint? number;\ndo {\n  stdout.write('Which times table? ');\n  number = int.tryParse(stdin.readLineSync() ?? '');\n  if (number == null) print(\"That's not a number.\");\n} while (number == null);\n```\n\nDart's `tryParse` returns **null** for bad input. C#'s `TryParse` returns a **bool** and puts the number in the `out` variable.\n\n---\n\n## 🐞 Errors I actually hit\n\n| Error / mistake | Why | Fix |\n|---|---|---|\n| Output was only `end` (no \"do-while ran\") | Typed `while (x < 5)` at the **start** of the second loop instead of `do`, so it was a pre-test loop | A do-while **starts with `do`** |\n| **CS0103** \"The name 'answer' does not exist in the current context\" at `(19,10)` | `answer` was declared **inside** the `{ }`, and the `while (...)` line is outside | Declare before `do`, assign inside. `(19,10)` = line 19, column 10 |\n| `using System.Formats.Asn1;` appeared at the top | Accepted an auto-complete suggestion by mistake | Delete unused `using` lines |\n| \"That's not a number.\" printed **once, after** the valid number | I put `{ Console.WriteLine(...); }` **after** `} while (...);`. The `;` ends the loop, so that `{ }` was a **standalone block** that ran once at the end | Everything that repeats goes **between `do {` and `}`**. Nothing comes after `while (...);` |\n| `ok = number;` | `ok` is a `bool`, `number` is an `int`. You can't put a number in a yes/no box (it would be **CS0029**) | `ok = int.TryParse(input, out number);` |\n| `ok = !int.TryParse(...)` + `if (ok == true)` + TryParse again in the `while` | It worked, but the flag's name lied, `== true` was extra, and TryParse ran twice | `ok = int.TryParse(...)`, `if (!ok)`, `while (!ok)` |\n| Quiz: called \"declare it at the top\" \"initialize it\" | Declare = create the box; initialize = first value | Declare before `do`, assign inside |\n| Quiz: said `while (x < 5);` before a `{ }` is an error | It's a **warning** (CS0642), and it compiles | False → the `{ }` runs once on its own; true → infinite loop, the app hangs |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| serve first, ask after | **`do-while` loop** | \"Use a do-while here, because we have to ask the user at least once.\" |\n| check first | **pre-test loop** (`while`, `for`) | \"A while is pre-test, so it can run zero times.\" |\n| check after | **post-test loop** (`do-while`) | \"A do-while is post-test, so the body runs at least once.\" |\n| create the box | **declare** a variable | \"Declare `cmd` before the `do` so the condition can see it.\" |\n| give the first value | **initialize** a variable | \"You don't need to initialize it, `out` assigns it.\" |\n| fake starting value | **dummy value** / **placeholder value** | \"With a do-while you don't need a dummy value.\" |\n| a yes/no box | **flag** (a `bool` variable) | \"Store the TryParse result in a flag, then use it in the loop condition.\" |\n| ask until the input is good | **input validation loop** (the \"ask until valid\" pattern) | \"Wrap the prompt in a do-while validation loop.\" |\n| `{ }` not attached to anything | **standalone block** | \"That's a standalone block, it's not part of the loop.\" |\n| a `using` line nobody needs | **unused using directive** | \"Remove the unused using, the analyzer flags it.\" |\n\n---\n\n## 📋 Summary\n\n- `do { body } while (condition);`: the body runs first, the check is at the bottom\n- Runs **at least once** (post-test). A `while` can run **zero** times (pre-test)\n- The `;` at the end is **required**\n- Variables used in the condition must be **declared before `do`**, otherwise **CS0103**\n- Nothing that should repeat goes after `while (...);`\n- **Flag:** `bool ok = int.TryParse(...)`. Name it after what `true` means. Use `if (!ok)`, not `if (ok == false)`\n- Use `do-while` for \"ask until valid\" and menus. Use `while` when zero runs is possible\n\n---\n\n## 📝 Quiz\n\n1. How many times does the body run, and what does it print?\n   ```csharp\n   int n = 5;\n   do\n   {\n       Console.WriteLine(n);\n       n++;\n   } while (n < 3);\n   ```\n2. What does this print?\n   ```csharp\n   int k = 1;\n   do\n   {\n       k *= 2;\n   } while (k < 10);\n   Console.WriteLine(k);\n   ```\n3. This doesn't compile. Give the error code and the fix.\n   ```csharp\n   do\n   {\n       Console.Write(\"Command: \");\n       string? cmd = Console.ReadLine();\n   } while (cmd != \"exit\");\n   ```\n4. `while` or `do-while`? (a) Show a menu until the user picks \"Quit\". (b) Print every order in a list that might be empty.\n5. What's the difference between `} while (x < 5);` at the end of a do-while and `while (x < 5);` at the start of a normal while?\n\n<details>\n<summary>Answers<\/summary>\n\n1. **Once**. It prints `5`. The body runs first, then `6 < 3` is false.\n2. `16`. k goes 2 (true), 4 (true), 8 (true), 16 (false → stop). The loop stops only **after** k passes the limit, because the check is at the bottom.\n3. **CS0103**: `cmd` is declared inside the `{ }`, so the `while` line can't see it. Declare `string? cmd;` before `do`, and write `cmd = Console.ReadLine();` inside.\n4. (a) `do-while`: the menu must show at least once. (b) `while`: with zero orders it must print nothing. A do-while would try to print an order before checking.\n5. In a do-while, that line **ends** the loop and the `;` is required. In a normal while, the `;` becomes an empty body (warning **CS0642**): if the condition is false, the `{ }` below runs once on its own; if it's true, it's an infinite loop and the app hangs.\n\n<\/details>\n"}, {"id": "1.10", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/10-break-continue.md", "title": "break and continue", "md": "# Chapter 1.10: break and continue\n\n> Learned: Wed 14 Oct 2026 · Code: `lessons/phase-01/17-break-continue`\n\n---\n\n## 🧸 LKG story\n\n**`break` is the cinema.** You're watching a 2-hour movie, and after 30 minutes your manager calls: *\"Come to the office now!\"* You **walk out of the cinema immediately**. You don't watch the rest of the movie.\n\n**`continue` is the playlist.** A song you don't like comes on. You press **\"Next\"**. That **one** song is skipped, but the **playlist keeps playing**.\n\n🎬 **Animation idea:** a row of numbered boxes 1 to 10 on a conveyor belt, with a switch for `break` / `continue` and a slider for the \"trigger\" number. Press \"Next step\" and each box slides under a printer that stamps its number into the output. With `continue`, the trigger box gets a ⏭️ and slides past without a stamp, and the belt keeps going. With `break`, the belt stops at the trigger box with a 🚪, the remaining boxes turn grey, and \"after the loop\" prints.\n\n---\n\n## 💻 Real explanation\n\n### 1. `break`: leave the loop now\n\n`break` **exits the loop immediately**. The rest of the body is skipped, the condition isn't checked again, and the program continues at the **first line after the loop**.\n\n```csharp\nfor (int i = 1; i <= 10; i++)\n{\n    if (i == 4)\n    {\n        break;              // jump out NOW\n    }\n    Console.WriteLine(i);\n}\nConsole.WriteLine(\"after the loop\");\n```\n```\n1\n2\n3\nafter the loop\n```\n\n5 to 10 never run. The loop doesn't **complete**, it is **exited early**.\n\nYou already met `break` in a `switch` (Chapter 1.4), where it ends a **case**. Inside a loop, it ends the **loop**.\n\nTypical use: **searching**. Once you've found what you need, stop looking.\n\n### 2. `continue`: skip this iteration\n\n`continue` **skips the rest of the body for this iteration only** and jumps to the next one:\n- in a `for` → it runs the iterator (`i++`), then checks the condition\n- in a `while` / `do-while` → it goes straight to the condition check\n\n```csharp\nfor (int i = 1; i <= 6; i++)\n{\n    if (i == 3)\n    {\n        continue;\n    }\n    Console.WriteLine(i);\n}\nConsole.WriteLine(\"done\");\n```\n```\n1\n2\n4\n5\n6\ndone\n```\n\nThe trace for `i = 3`:\n```\ni = 3 → if (i == 3) is true → continue\n      → Console.WriteLine(i) is SKIPPED\n      → i++ → i = 4 → the loop goes on\n```\n\n⚠️ In English, \"continue\" sounds like *\"carry on normally\"*. In C#, it means **\"go to the next round now\"**.\n\n### 3. Side by side\n\n| Keyword | Story | What stops | Same loop, trigger at `i == 2`, `i` from 1 to 5 |\n|---|---|---|---|\n| `break` | Leave the cinema | The **whole loop** | `1` |\n| `continue` | Skip one song | Only **this iteration** | `1 3 4 5` |\n\n**Memory trick:**\n- `break` = **break out** of the loop (stops **all**)\n- `continue` = **continue with the next** round (skips **one**)\n\n---\n\n## 🎯 Dart comparison\n\nExactly the same keywords and the same behaviour in Dart:\n\n```dart\n// Dart\nfor (var i = 1; i <= 6; i++) {\n  if (i == 3) continue;\n  if (i == 5) break;\n  print(i);\n}\n// 1 2 4\n```\n```csharp\n// C#\nfor (int i = 1; i <= 6; i++)\n{\n    if (i == 3) { continue; }\n    if (i == 5) { break; }\n    Console.WriteLine(i);\n}\n// 1 2 4\n```\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Predicted `break` at `i == 4` prints `1 2 3 5 6 7 8 9 10` | Thought `break` skips only one value | `break` leaves the **whole** loop → `1 2 3` |\n| Predicted `continue` at `i == 3` prints `1 2 3 4 5 6` | Read \"continue\" as the English word (\"carry on, nothing special\") | `continue` skips **the rest of this iteration** → 3 is not printed |\n| Said \"after the loop\" prints \"after the loop is completed\" | With `break`, the loop is **exited early**, not completed | The program jumps to the first line after the loop |\n\n(Funny detail: my `break` prediction was the exact output of `continue`.)\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| walk out of the cinema | **`break`** / **exit the loop early** | \"We break out of the loop as soon as we find a match, no need to check the rest.\" |\n| skip one song | **`continue`** / **skip to the next iteration** | \"If the input is invalid, we `continue` to skip it and ask again.\" |\n| `break`, `continue`, `return` | **jump statements** | \"Avoid too many jump statements in one loop, it gets hard to follow.\" |\n| stop searching when found | **early exit** | \"Add an early exit once the item is found.\" |\n\n---\n\n## 📋 Summary\n\n- `break` → leaves the **whole loop** now, and the program goes to the first line after the loop\n- `continue` → skips **the rest of this iteration**, then the loop goes on (in a `for`, the iterator still runs)\n- `break` also ends a `case` in a `switch`\n- Same keywords and behaviour in Dart\n\n---\n\n## 📝 Quiz\n\n1. What does this print?\n   ```csharp\n   for (int i = 1; i <= 5; i++)\n   {\n       if (i == 2) { break; }\n       Console.WriteLine(i);\n   }\n   ```\n2. And this?\n   ```csharp\n   for (int i = 1; i <= 5; i++)\n   {\n       if (i == 2) { continue; }\n       Console.WriteLine(i);\n   }\n   ```\n3. In a `for` loop, does `i++` still run after a `continue`?\n4. Which keyword would you use to stop searching a list once you find the item?\n5. What does this print?\n   ```csharp\n   int n = 0;\n   while (n < 6)\n   {\n       n++;\n       if (n % 2 == 0) { continue; }\n       Console.Write($\"{n} \");\n   }\n   ```\n   (`n % 2 == 0` means \"n is even\".)\n\n<details>\n<summary>Answers<\/summary>\n\n1. `1`. At `i == 2`, `break` leaves the loop.\n2. `1 3 4 5`. Only 2 is skipped.\n3. Yes. `continue` skips the rest of the **body**, then the iterator runs and the condition is checked.\n4. `break` (an **early exit**).\n5. `1 3 5`. The even numbers are skipped. Note that `n++` is **before** the `continue`. If it were after, `n` would get stuck at 2 → an infinite loop.\n\n<\/details>\n"}, {"id": "1.11", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/11-guard-clauses-loop-exits.md", "title": "Remainder, OR, guard clauses and loop exits (Guessing Game v1.1)", "md": "# Chapter 1.11: Remainder, OR, guard clauses and loop exits (Guessing Game v1.1)\n\n> Learned: Thu 15 Oct 2026 · Code: `projects/01-number-guessing-game` (v1.1)\n\n---\n\n## 🧸 LKG story\n\n**`%` is sharing sweets.** You have 7 sweets and 3 kids. Each kid gets 2, and **1 sweet is left over**. In C#, `7 / 3` is how many each kid gets (2), and `7 % 3` is **what is left over** (1).\n\n🎬 **Animation idea:** pick how many sweets and how many kids with two sliders. The sweets drop one by one into the kids' bowls, round after round. The sweets that can't make a full round stay in the middle and glow: that's the remainder. Below, `sweets / kids` and `sweets % kids` light up with the two answers.\n\n**Guard clauses are security guards at a door.** People queue to enter a party (the loop body). Guard 1 checks: *\"Is this a number?\"* If not, he sends that person away (`continue`), and the next person comes. Guard 2 checks: *\"Is it between 1 and 100?\"* Only the people who pass **every** guard get inside, where the real work happens (count the attempt, too high / too low). And one person can say *\"I'm going home\"* (`q`): they leave the **whole party** (`break`).\n\n🎬 **Animation idea:** a game console where you type a guess (try `abc`, `500`, `q`, or a number). The guess walks along a corridor of guards. The guard that catches it lights up red and the guess turns back (`continue`), or the `q` guard opens the exit door (`break`). A guess that passes every guard reaches the counter (`attempts++`) and gets \"Too high\" or \"Too low\". When the game ends, a sign shows the **exit reason**: 🎉 won or 🚪 quit, and only \"won\" prints \"Correct!\".\n\n---\n\n## 💻 Real explanation\n\n### 1. `%`: the remainder operator (modulo)\n\n| Code | Means | Result |\n|---|---|---|\n| `7 / 3` | how many each kid gets (whole numbers) | `2` |\n| `7 % 3` | how many are left over | `1` |\n| `6 % 3` | shares out exactly | `0` |\n| `10 % 4` | 10 sweets, 4 kids | `2` |\n| `2 % 5` | nobody gets one, all 2 are left over | `2` |\n\nThe most common use: **\"is it a multiple of…?\"**\n\n```csharp\nif (n % 2 == 0) Console.WriteLine(\"even\");\nif (n % 3 == 0) Console.WriteLine(\"multiple of 3\");\n```\n\n⚠️ The `%` in maths class (and the `%` button on Windows Calculator) means **percent**. In C#, `%` is **never** percent.\n\n### 2. Tracing a loop where the update comes before `continue`\n\n```csharp\nint i = 0;\nint sum = 0;\n\nwhile (i < 7)\n{\n    i++;\n    if (i % 3 == 0) continue;\n    sum += i;\n}\n\nConsole.WriteLine(sum);\n```\n```\n19\n```\n\n| Check | `i` after `i++` | `i % 3` | `continue`? | `sum` |\n|---|---|---|---|---|\n| 0 < 7 ✅ | 1 | 1 | no | 1 |\n| 1 < 7 ✅ | 2 | 2 | no | 3 |\n| 2 < 7 ✅ | 3 | **0** | **yes** | 3 |\n| 3 < 7 ✅ | 4 | 1 | no | 7 |\n| 4 < 7 ✅ | 5 | 2 | no | 12 |\n| 5 < 7 ✅ | 6 | **0** | **yes** | 12 |\n| 6 < 7 ✅ | **7** | 1 | no | **19** |\n| 7 < 7 ❌ | | | | stop |\n\nThree rules for every row:\n1. Work out `i % 3`. Is it `0`?\n2. If yes → `continue` → `sum` **doesn't change**\n3. If no → `sum = sum + i` (add `i`, not the remainder!)\n\nThe surprise is the last row: the condition checks `6 < 7`, **then** `i++` makes it 7, so 7 is still added. Check it a second way: 1 + 2 + 4 + 5 + 7 = 19 ✅.\n\n### 3. `||` (OR) and `&&` (AND)\n\n| `a` | `b` | `a \\|\\| b` | `a && b` |\n|---|---|---|---|\n| true | true | true | true |\n| true | false | **true** | false |\n| false | true | **true** | false |\n| false | false | false | false |\n\n- `||`: **one** true is enough\n- `&&`: **both** must be true\n\n```csharp\nint temperature = 40;\n\nif (temperature < 0 || temperature > 40)\n    Console.WriteLine(\"Danger! Stay inside.\");\nelse\n    Console.WriteLine(\"Weather is OK.\");\n```\n```\nWeather is OK.\n```\n\n40 > 40 is **false**: `>` means *strictly* greater. Use `>=` if the edge should count.\n\nOut of range vs in range are opposites:\n- out: `guess < 1 || guess > 100`\n- in: `guess >= 1 && guess <= 100`\n\n### 4. Guard clauses with `continue`\n\nBefore (v1.0), the loop body was a **staircase**:\n\n```csharp\nwhile (guessNumber != secretNumber)\n{\n    string? input = Console.ReadLine();\n    if (int.TryParse(input, out guessNumber))\n    {\n        numberOfAttempts++;\n        // too high / too low ...\n    }\n    else\n    {\n        Console.WriteLine(\"That's not a number. Try again.\");  // far away from its if\n    }\n}\n```\n\nAfter (v1.1), the **bad cases are thrown out first**, and the rest is flat:\n\n```csharp\nwhile (guessNumber != secretNumber)\n{\n    Console.Write(\"Your guess: \");\n    string? input = Console.ReadLine();\n\n    if (input == \"q\")\n    {\n        Console.WriteLine($\"The number was {secretNumber}.\");\n        break;\n    }\n\n    if (!int.TryParse(input, out guessNumber))\n    {\n        Console.WriteLine(\"That's not a number. Try again.\");\n        continue;\n    }\n\n    if (guessNumber < 1 || guessNumber > 100)\n    {\n        Console.WriteLine(\"Please guess between 1 and 100.\");\n        continue;\n    }\n\n    numberOfAttempts++;\n    if (guessNumber > secretNumber)\n        Console.WriteLine(\"Too high!\");\n    else if (guessNumber < secretNumber)\n        Console.WriteLine(\"Too low!\");\n}\n```\n\nThe **order of the guards matters**:\n1. `q` first. `q` is not a number, so if TryParse ran first it would say \"not a number\" and the game could never quit\n2. Not a number\n3. Out of range, **before** `numberOfAttempts++`, so `500` is not counted\n\nA guard uses the **opposite** test of what you keep: we keep valid numbers, so the guard checks `!int.TryParse(...)`.\n\n### 5. Comparing text with `==`\n\n```csharp\nif (input == \"q\") { ... }\n```\n\n- Text goes in **double quotes**. `'q'` (single quotes) is a `char`, a different type\n- It's **case-sensitive**: `\"Q\" == \"q\"` is `false`\n\n### 6. Two exits → check the exit reason\n\nWith a `break`, the loop can now end in **two** ways:\n\n| Reason | How | `guessNumber == secretNumber` |\n|---|---|---|\n| won 🎉 | the `while` condition became false | true |\n| quit 🚪 | `break` | false |\n\nAfter the loop, the code doesn't know **why** the loop ended. So check first:\n\n```csharp\nif (guessNumber == secretNumber)\n{\n    if (numberOfAttempts == 1)\n        Console.WriteLine(\"🎯 First try! Amazing!\");\n    else\n        Console.WriteLine($\"🎉 Correct! You got it in {numberOfAttempts} attempts.\");\n}\n```\n\nThe output of every path:\n\n```\nYour guess: abc\nThat's not a number. Try again.\nYour guess: 500\nPlease guess between 1 and 100.\nYour guess: 50\nToo low!\nYour guess: q\nThe number was 63.\n```\n\n```\nYour guess: 43\n🎉 Correct! You got it in 6 attempts.\n```\n\n---\n\n## 🎯 Dart comparison\n\nAll of this is the same in Dart: `%` is the remainder, `||` and `&&` work the same, `continue` and `break` work the same, and strings are compared with `==`.\n\n```dart\n// Dart\nif (input == 'q') break;                 // Dart strings can use single quotes\nfinal guess = int.tryParse(input ?? '');\nif (guess == null) continue;             // Dart's tryParse returns null on failure\n```\n```csharp\n// C#\nif (input == \"q\") break;                 // C# strings need double quotes\nif (!int.TryParse(input, out guessNumber)) continue;   // C#'s TryParse returns false\n```\n\nTwo small differences: Dart has `~/` for whole-number division (C# just uses `/` with two `int`s), and in Dart `'q'` is a string, but in C# `'q'` is a `char`.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Thought `7 % 3` meant divide, or percent | `%` means percent in maths class | `%` is the **remainder**: `7 % 3` = 1 |\n| Added the remainder to `sum` instead of `i` | Mixed up the yes/no test with the work | The remainder is only for the question. `sum += i` adds `i` |\n| Said the last row (`6 < 7`) doesn't run | Forgot that `i++` comes after the check | The check sees 6, the body works with 7 |\n| Used `break` for the range check → \"Correct! You got it in 0 attempts\" | `break` leaves the **whole** loop | Use `continue` to ask again |\n| Printed `{input}` in \"The number was …\" → `The number was q.` | `input` is what the player typed | Use `{secretNumber}` |\n| Deleted `break` because of **CS0162 Unreachable code detected** | The warning pointed at lines after `break` | Keep `break`, **move** the lines that come after it |\n| Moved the \"Correct!\" code inside the loop | \"Inside vs outside\" the loop | Code that runs **once at the end** goes after the loop's `}` |\n| `Q` said \"That's not a number\" | String comparison is case-sensitive | Accept only `q` for now (or check both later) |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| sweets left over | **modulo** / **remainder operator** (`%`) | \"Use `i % 2 == 0` to check if it's even.\" |\n| one true is enough | **logical OR** (`\\|\\|`) | \"Use `\\|\\|` to reject values outside the range.\" |\n| both must be true | **logical AND** (`&&`) | \"`x >= 1 && x <= 100` means it's in range.\" |\n| the right side isn't checked if the left is true | **short-circuit evaluation** | \"`\\|\\|` short-circuits.\" |\n| staircase of `if`s | **deeply nested code** | \"The nesting is too deep, can you flatten it?\" |\n| security guard | **guard clause** + **early `continue`** | \"Add a guard clause for invalid input so the happy path stays flat.\" |\n| lines after `break` | **unreachable code** / **dead code** (CS0162) | \"The compiler flagged dead code after the `break`.\" |\n| why did the loop stop? | **exit reason** | \"The loop has two exits, so check the exit reason before printing the result.\" |\n| `\"Q\"` ≠ `\"q\"` | **case-sensitive comparison** | \"The quit check is case-sensitive.\" |\n\n---\n\n## 📋 Summary\n\n- `%` gives the **remainder**: `x % n == 0` means x is a multiple of n\n- `||`: one true is enough. `&&`: both must be true. `>` excludes the edge, `>=` includes it\n- **Guard clauses** throw out bad input first with `continue`, so the loop body stays flat. The order of the guards matters\n- Compare text with `==` and double quotes. It's case-sensitive\n- A `break` gives the loop a second exit. After the loop, **check the exit reason** before printing a result\n- CS0162 = unreachable code: the lines after a `break` (or `continue`, `return`) in the same block never run\n\n---\n\n## 📝 Quiz\n\n1. What is `10 % 4`? And `9 % 3`?\n2. Which of `5`, `0`, `100`, `101` make `age < 1 || age > 100` true?\n3. In the game, why must the `q` check come **before** the TryParse check?\n4. What does this print?\n   ```csharp\n   for (int i = 1; i <= 5; i++)\n   {\n       if (i == 4) break;\n       if (i == 2) continue;\n       Console.WriteLine(i);\n   }\n   Console.WriteLine(\"done\");\n   ```\n5. After a loop that has a `break` inside, why can't we just print \"Correct!\"?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `2` (10 sweets, 4 kids, 2 left over) and `0`.\n2. `0` and `101`. `1` to `100` are in range, so both sides are false.\n3. `q` is not a number. If TryParse ran first, it would print \"That's not a number\" and `continue`, and the `q` check would never be reached.\n4. `1`, `3`, `done`. 2 is skipped by `continue`, the loop stops at 4 with `break`, and `done` runs after the loop.\n5. The loop can end in two ways: the player won, or the player quit with `break`. Check the **exit reason** first (`guessNumber == secretNumber`), otherwise quitting also prints \"Correct!\".\n\n<\/details>\n"}, {"id": "1.12", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/12-calculator-double-guards.md", "title": "double, Infinity and the && guard (Console Calculator v1)", "md": "# Chapter 1.12: double, Infinity and the && guard (Console Calculator v1)\n\n> Learned: Sat 17 Oct 2026 · Code: `lessons/phase-01/18-double-tryparse`, `projects/02-console-calculator` (v1)\n\n---\n\n## 🧸 LKG story\n\n**`int` holds whole sweets, `double` can hold half a sweet.** If you share 7 sweets between 2 kids with `int`, each kid gets 3 and the half sweet is thrown in the bin. With `double`, each kid gets 3.5.\n\n**Dividing by zero is asking \"share 10 sweets between 0 kids\".** `int` refuses loudly: the program crashes. `double` doesn't crash. It quietly answers **∞** (Infinity), which looks like a result but is useless to the user. So the calculator needs a guard that checks the second number **before** dividing.\n\n🎬 **Animation idea:** a division machine with two number boxes and an `int` / `double` switch. `7 / 2` in `int` mode drops 3 whole sweets per kid and the half sweet falls into a bin labelled \"decimals cut off\". In `double` mode the half sweet stays. Type `0` as the second number: `int` mode explodes (crash), `double` mode shows a glowing ∞. Then switch on the zero guard: a guard stops the 0 at the door with \"Cannot divide by zero\".\n\n**The operator guard is a door that only opens for 4 keys: `+`, `-`, `*`, `/`.** The door says: \"if this key is not `+` **and** not `-` **and** not `*` **and** not `/`, it's the wrong key\". If you write `||` instead of `&&`, the door says \"not `+` **or** not `-`\", and every key fails, even `+`, because `+` is not `-`.\n\n🎬 **Animation idea:** type an operator into a box and pick `&&` or `||`. Each part of the condition (`op != \"+\"`, `op != \"-\"`, ...) lights up true or false, then the whole condition lights up. With `&&`, only a wrong key like `%` is rejected. With `||`, even `+` is rejected and the door stays shut.\n\n---\n\n## 💻 Real explanation\n\n### 1. `int` division vs `double` division\n\n```csharp\nConsole.WriteLine(7 / 2);     // int ÷ int\nConsole.WriteLine(7.0 / 2);   // a double is involved\n```\n```\n3\n3.5\n```\n\nThe division happens **first**, then `WriteLine` prints what it gets:\n- `int ÷ int` → the result is an `int` → the decimals are **cut off** (truncation, not rounding)\n- if one side is a `double` → the result is a `double` → the decimals stay\n\nA calculator uses `double` so the user can type `2.5` **and** get `10 / 4 = 2.5`.\n\n### 2. `double.TryParse`\n\nExactly like `int.TryParse`, only the type changes:\n\n```csharp\nConsole.Write(\"Enter the price: \");\nstring? input = Console.ReadLine();\n\nif (double.TryParse(input, out double price))\n    Console.WriteLine($\"With delivery: {price + 1.5}\");\nelse\n    Console.WriteLine(\"That's not a number.\");\n```\n```\nEnter the price: 2.5\nWith delivery: 4\n\nEnter the price: abc\nThat's not a number.\n```\n\nThe `out` box must be a plain `double`. A `double?` box (which can also hold `null`) is a different type, and C# refuses it (CS1503, see the mistakes table).\n\n### 3. Dividing by zero with `double`\n\n```csharp\ndouble a = 10;\ndouble b = 0;\nConsole.WriteLine(a / b);\n```\n```\n∞\n```\n\n| Code | Result |\n|---|---|\n| `a / b` with two `int` variables, `b = 0` | crash: `DivideByZeroException` (writing `10 / 0` literally doesn't even compile: CS0020) |\n| `10.0 / 0` | `∞` (Infinity) |\n| `0.0 / 0` | `NaN` (Not a Number) |\n\n`double` doesn't warn you, so **you** add the guard. Only the **second** number (the divisor) matters. `2 / 10 = 0.2` is fine, only exactly `0` is a problem:\n\n```csharp\nif (secondNumber == 0)\n    Console.WriteLine(\"Cannot divide by zero.\");\nelse\n    Console.WriteLine($\"{firstNumber} / {secondNumber} = {firstNumber / secondNumber}\");\n```\n\n### 4. `switch` on a string\n\n`case` values can be text in **double quotes**. The match is **exact**: `\"+ \"` (with a space) is not `\"+\"`, and `\"s\"` is not `\"S\"`. Only **one** case runs, then `break` jumps out of the switch.\n\n```csharp\nswitch (op)\n{\n    case \"+\":\n        Console.WriteLine($\"{firstNumber} + {secondNumber} = {firstNumber + secondNumber}\");\n        break;\n    case \"-\":\n        Console.WriteLine($\"{firstNumber} - {secondNumber} = {firstNumber - secondNumber}\");\n        break;\n    // * and / ...\n    default:\n        Console.WriteLine(\"Unknown operator.\");\n        break;\n}\n```\n\n### 5. The operator guard: `&&`, not `||`\n\nCheck the operator **right after reading it**, so the user doesn't type the second number for nothing:\n\n```csharp\nstring? op = Console.ReadLine();\nif (op != \"+\" && op != \"-\" && op != \"*\" && op != \"/\")\n{\n    Console.WriteLine(\"Unknown operator. Try again.\");\n    continue;\n}\n```\n\nWhy `&&`? Write out the sides for `op = \"+\"`:\n\n| Condition | `\"+\" != \"+\"` | `\"+\" != \"-\"` | Result |\n|---|---|---|---|\n| `op != \"+\" && op != \"-\"` | false | true | **false** → `+` is accepted ✅ |\n| `op != \"+\" \\|\\| op != \"-\"` | false | true | **true** → `+` is \"unknown\" ❌ |\n\nWith `||`, every value is different from at least one of them, so the guard rejects everything.\n\nThe `default` case in the switch can't run any more (the guard catches bad operators first), but keep it as a **safety net** for when someone adds a new operator later.\n\n### 6. The whole calculator (v1)\n\n```csharp\nConsole.WriteLine(\"Simple Calculator (type q to quit)\");\n\nwhile (true)\n{\n    Console.Write(\"First Number: \");\n    string? input = Console.ReadLine();\n    if (input == \"q\")\n    {\n        Console.WriteLine(\"Goodbye!\");\n        break;\n    }\n    if (!double.TryParse(input, out double firstNumber))\n    {\n        Console.WriteLine(\"That's not a number. Try again.\");\n        continue;\n    }\n\n    Console.Write(\"Operator (+ - * /): \");\n    string? op = Console.ReadLine();\n    if (op != \"+\" && op != \"-\" && op != \"*\" && op != \"/\")\n    {\n        Console.WriteLine(\"Unknown operator. Try again.\");\n        continue;\n    }\n\n    Console.Write(\"Second number: \");\n    string? input2 = Console.ReadLine();\n    if (!double.TryParse(input2, out double secondNumber))\n    {\n        Console.WriteLine(\"That's not a number. Try again.\");\n        continue;\n    }\n\n    switch (op)\n    {\n        // + - * / as above, with the zero guard in \"/\"\n    }\n}\n```\n```\nSimple Calculator (type q to quit)\nFirst Number: 7\nOperator (+ - * /): -\nSecond number: 10\n7 - 10 = -3\nFirst Number: abc\nThat's not a number. Try again.\nFirst Number: 8\nOperator (+ - * /): /\nSecond number: 0\nCannot divide by zero\nFirst Number: q\nGoodbye!\n```\n\n`while (true)` is an **infinite loop with a break exit**: the loop never stops by itself, only `q` (with `break`) ends it.\n\n---\n\n## 🎯 Dart comparison\n\n```dart\n// Dart\nfinal price = double.tryParse(input ?? '');   // null when it fails\nif (price == null) { print('Not a number'); }\nprint(7 ~/ 2);   // 3   (~/ is whole-number division)\nprint(7 / 2);    // 3.5 (/ always gives a double in Dart)\nprint(10 / 0);   // Infinity, same as C# double\n```\n```csharp\n// C#\nif (!double.TryParse(input, out double price)) { Console.WriteLine(\"Not a number\"); }\nConsole.WriteLine(7 / 2);     // 3   (int ÷ int)\nConsole.WriteLine(7.0 / 2);   // 3.5\nConsole.WriteLine(10.0 / 0);  // ∞\n```\n\nThe big difference: in Dart, `/` **always** gives a decimal. In C#, `/` with two `int`s cuts off the decimals. Switch on a string works the same in both, but Dart strings can use single quotes.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| `while (firstNumber == secoundNumber)` → the loop ended after typing `5` | The loop compared numbers, so `5 == 0` was false | The loop should only stop on `q`: use `while (true)` + `break` |\n| **CS1503** `cannot convert from 'out double?' to 'out double'` (plus a strange `ReadOnlySpan<byte>` error) | The `out` box was declared as `double?` | Declare it inside: `out double firstNumber`. The second error disappears with the first |\n| **CS8600** warning on `string input = Console.ReadLine();` | `ReadLine()` can return `null` | `string? input` |\n| `break` in the operator guard → the whole calculator stopped | `break` leaves the loop | `continue` asks again |\n| Said `5 % 7` is \"false\" | `%` gives a number, never true/false | `5 % 7 = 5` (the left number is smaller, so all 5 are left over) |\n| Said `7 / 2` prints 3.5 | Forgot integer division | `int ÷ int` cuts off: 3 |\n| Said a switch prints two cases | Only one case runs | `\"+ \"` ≠ `\"+\"`, so only `default` runs |\n| Answered the `\\|\\|` question without writing the sides | Skipped the working out | Write each side: false \\|\\| true → true |\n| Wrote \"returns cannot divide by zero\" | Mixed up C#'s result with my own message | C# returns `∞`; \"Cannot divide by zero\" is the guard's message |\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| whole-sweet division | **integer division** / **truncation** | \"`7 / 2` is integer division, it truncates to 3.\" |\n| convert text to a decimal number | **parse as a double** | \"Parse the input as a double with `double.TryParse`.\" |\n| the number you divide by | **divisor** (and **dividend**) | \"The divisor must not be zero.\" |\n| ∞ | **Infinity** / **positive infinity** | \"Double doesn't throw on `/ 0`, it returns Infinity.\" |\n| \"not a number\" from `0.0 / 0` | **NaN** | \"Check for NaN before showing the result.\" |\n| loop forever until q | **infinite loop with a break exit** | \"It's a `while (true)` loop with a break on q.\" |\n| the case for everything else | **default case** / **safety net** | \"Keep the default case as a safety net.\" |\n| old code left in comments | **dead code** | \"Remove the dead code, Git remembers the old version.\" |\n\n---\n\n## 📋 Summary\n\n- `int ÷ int` cuts off the decimals (`7 / 2 = 3`). Use `double` when decimals matter\n- `double.TryParse(input, out double x)` works like `int.TryParse`. The `out` box must be a plain `double`\n- `double / 0` gives `∞` instead of crashing, so add a guard: `if (secondNumber == 0)`\n- `switch` can match strings: exact text, double quotes, only one case runs\n- \"Not any of these\" = `!=` joined with `&&`. With `||`, everything is rejected\n- Check each input right after reading it (guard + `continue`), so the user finds out straight away\n\n---\n\n## 📝 Quiz\n\n1. What do `7 / 2` and `7.0 / 2` print?\n2. Why does the calculator use `double` and not `int`?\n3. The user types `\"+ \"` (with a space). Which case runs in `switch (op) { case \"+\": ... default: ... }`?\n4. Does `op != \"+\" || op != \"-\"` reject `+`? Write out both sides.\n5. If you delete the zero guard, what does the calculator print for `8 / 0`?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `3` (integer division cuts off .5) and `3.5`.\n2. `double` can hold decimals from the user (`2.5`) and give decimal answers (`10 / 4 = 2.5`).\n3. `default`. `\"+ \"` is not exactly `\"+\"`: a space is a character too. (`Trim()` will fix this later.)\n4. Yes: `\"+\" != \"+\"` is false, `\"+\" != \"-\"` is true, and `false || true` is true, so `+` is called unknown. That's why the guard uses `&&`.\n5. `8 / 0 = ∞`. `double` doesn't crash, it returns Infinity.\n\n<\/details>\n"}, {"id": "1.13", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/13-arrays-foreach.md", "title": "Arrays and foreach", "md": "# Chapter 1.13: Arrays and foreach\n\n> Learned: Sat 17 Oct 2026 · Code: `lessons/phase-01/19-arrays`, `lessons/phase-01/20-parcel-weights`\n\n---\n\n## 🧸 LKG story\n\n**An array is one shelf with numbered slots.** Until now, one variable was one box with one value. A courier with 5 parcels would need `parcel1`, `parcel2`, `parcel3`... An array is **one name** for a whole shelf. The slots are numbered from **0**, so a shelf with 3 slots has slots 0, 1 and 2. Ask for slot 3 and the shelf falls over: the program crashes.\n\n🎬 **Animation idea:** a shelf with parcels labelled 12, 7 and 30 kg, and slot numbers 0, 1, 2 underneath. Type an index: the matching parcel lights up and `weights[i]` shows its value. Type 3 (or -1): the shelf shakes and a red `IndexOutOfRangeException` sign drops down. A `Length` badge always shows 3, and an arrow points at the last slot: `Length - 1`.\n\n**`foreach` is a postman walking along the shelf.** He picks up each parcel in turn, from the first to the last, without ever reading the slot numbers. He carries two things: a **running total** (he adds every parcel's weight) and a **tally sheet** (one mark for each heavy parcel). He only announces the results after the last parcel, outside the shelf.\n\n🎬 **Animation idea:** the postman steps along 5 parcels (2.5, 12, 0.8, 15.5, 7). Each step shows `parcelWeight`, the new `total`, and whether the heavy check is true. Pick what the `if` checks: `parcelWeight > 10` gives 2 heavy parcels; `total > 10` (the bug) wrongly marks 0.8 and 7 as heavy and ends with 4.\n\n---\n\n## 💻 Real explanation\n\n### 1. Creating and reading an array\n\n```csharp\nint[] weights = { 12, 7, 30 };   // 3 slots: index 0, 1, 2\n\nConsole.WriteLine(weights[0]);       // first\nConsole.WriteLine(weights[2]);       // last\nConsole.WriteLine(weights.Length);   // how many slots\n\nweights[1] = 9;                      // change slot 1\nConsole.WriteLine(weights[1]);\n```\n```\n12\n30\n3\n9\n```\n\n- An array holds **many values of the same type** (`int[]`, `double[]`, `string[]`)\n- Its **size is fixed** when it's created. There's no \"add\" (that's `List<T>`, next chapter)\n- The index goes from `0` to **`Length - 1`**. 5 slots → last index 4\n\n### 2. Out of range = crash\n\n```csharp\nConsole.WriteLine(weights[3]);\n```\n```\nUnhandled exception. System.IndexOutOfRangeException: Index was outside the bounds of the array.\n```\n\n`double / 0` quietly gave `∞`, but arrays are strict: a wrong index **throws an exception** and stops the program. C# also does the maths inside `[ ]` first: `weights[0 + 1 + 2 + 3 + 4]` is `weights[10]`, which crashes too.\n\n### 3. `foreach`: visit every element\n\n```csharp\nstring[] cities = { \"Hawalli\", \"Salmiya\", \"Farwaniya\" };\n\nforeach (string city in cities)\n{\n    Console.WriteLine($\"Delivering to {city}\");\n}\n```\n```\nDelivering to Hawalli\nDelivering to Salmiya\nDelivering to Farwaniya\n```\n\nEach round, `city` holds the **next element**. There's no index, so it can't go out of range, and it stops by itself after the last one.\n\n### 4. foreach + an accumulator + a counter\n\n```csharp\ndouble[] weights = { 2.5, 12, 0.8, 15.5, 7 };\n\ndouble total = 0;      // the adder: declared before the loop\nint heavyCount = 0;    // the counter: declared before the loop\n\nforeach (double parcelWeight in weights)\n{\n    total = total + parcelWeight;\n\n    if (parcelWeight > 10)\n    {\n        heavyCount++;\n    }\n}\n\nConsole.WriteLine($\"Total weight: {total} kg\");\nConsole.WriteLine($\"Heavy parcels (over 10 kg): {heavyCount}\");\n```\n```\nTotal weight: 37.8 kg\nHeavy parcels (over 10 kg): 2\n```\n\n| round | `parcelWeight` | `total` | `parcelWeight > 10`? | `heavyCount` |\n|---|---|---|---|---|\n| 1 | 2.5 | 2.5 | no | 0 |\n| 2 | 12 | 14.5 | yes | 1 |\n| 3 | 0.8 | 15.3 | no | 1 |\n| 4 | 15.5 | 30.8 | yes | 2 |\n| 5 | 7 | 37.8 | no | 2 |\n\nThree rules:\n1. Boxes that **collect** (total, count) are declared **before** the loop, or they'd restart at 0 every round\n2. The check is about **this** parcel (`parcelWeight`), not the running `total`\n3. The results are printed **after** the loop, once\n\n---\n\n## 🎯 Dart comparison\n\n```dart\n// Dart\nfinal cities = ['Hawalli', 'Salmiya', 'Farwaniya'];   // a growable List\ncities.add('Jahra');                                    // OK in Dart\nfor (final city in cities) { print('Delivering to $city'); }\n```\n```csharp\n// C#\nstring[] cities = { \"Hawalli\", \"Salmiya\", \"Farwaniya\" };   // a fixed-size array\n// cities.Add(\"Jahra\");  ← doesn't exist: arrays can't grow\nforeach (string city in cities) { Console.WriteLine($\"Delivering to {city}\"); }\n```\n\n`foreach (x in list)` is Dart's `for (var x in list)`. The big difference: a Dart `List` can grow, but a C# **array** can't. C#'s growable list is `List<T>`.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Predicted only the city names | Forgot the text in the `WriteLine` | Predict the **whole** line: `Delivering to Hawalli` |\n| Printed a hard-coded `\"Heavy parcels: 2\"` inside the loop | Wrote the expected answer instead of computing it | Count with `heavyCount++` and print `{heavyCount}` after the loop |\n| Named the loop box `totalWeight` | It holds **one** parcel each round, not the total | `parcelWeight`. Arrays get plural names: `weights` |\n| `total = weight[0 + 1 + 2 + 3 + 4];` → `IndexOutOfRangeException` | The maths runs first: `weight[10]` | In a `foreach`, use the loop box: `total = total + parcelWeight` |\n| `if (total > 10)` → 4 heavy parcels instead of 2 | Checked the running total, not this parcel | `if (parcelWeight > 10)` |\n\n✅ Win: both results were printed **after** the loop. The Day 8 / Day 9 \"inside vs outside the loop\" mistake didn't happen.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| shelf | **array** | \"Store the weights in a `double[]` array.\" |\n| slot number | **index** (zero-based) | \"Index 0 is the first element.\" |\n| one parcel on the shelf | **element** | \"The array has 5 elements.\" |\n| how many slots | **length** (`.Length`) | \"Loop until `Length - 1`.\" |\n| asking for a slot that isn't there | **index out of range** / **out of bounds** | \"That throws an IndexOutOfRangeException.\" |\n| a runtime crash | **exception** | \"The exception is unhandled, so the app stops.\" |\n| the postman walk | **iterate** / **loop over** with `foreach` | \"Iterate over the parcels with a foreach.\" |\n| running total | **accumulator** | \"Declare the accumulator before the loop.\" |\n| tally | **counter** | \"Increment the counter for each heavy parcel.\" |\n| fake fixed answer | **hard-coded value** | \"Don't hard-code the count, compute it.\" |\n\n---\n\n## 📋 Summary\n\n- An array (`int[]`, `double[]`, `string[]`) is one variable with many slots of the same type, fixed in size\n- Indexes go from `0` to `Length - 1`. Outside that range → `IndexOutOfRangeException`\n- `foreach (type item in array)` visits every element in order, with no index and no crash\n- Collect with boxes declared **before** the loop; print the results **after** it\n- Inside the loop, check the current element, not the running total\n\n---\n\n## 📝 Quiz\n\n1. An array has `Length` 5. What is its last index?\n2. `int[] a = { 4, 8, 15 };` What do `a[1]` and `a.Length` print?\n3. What happens with `a[3]`?\n4. Why must `total` be declared **before** the `foreach`, not inside it?\n5. In the parcel loop, why is `if (total > 10)` wrong?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `4` (`Length - 1`).\n2. `8` (index 1 is the second element) and `3`.\n3. The program crashes with `IndexOutOfRangeException`: the last index is 2.\n4. Inside the loop, `double total = 0;` would run every round and reset it to 0, and it couldn't be printed after the loop either (scope).\n5. `total` is the running sum, which passes 10 after the second parcel, so every later parcel looks \"heavy\" (4 instead of 2). The question is about each parcel: `parcelWeight > 10`.\n\n<\/details>\n"}, {"id": "1.14", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/14-list.md", "title": "Lists, an array that can grow", "md": "# Chapter 1.14: Lists, an array that can grow\n\n> Learned: Sun 18 Oct 2026 · Code: `lessons/phase-01/21-list`, `lessons/phase-01/22-delivery-queue`\n\n---\n\n## 🧸 LKG story\n\n**An array is an egg tray. A list is a shopping bag.** If you buy a tray for 4 eggs, it holds 4 eggs, no more and no less. A shopping bag is different: you keep putting things in (**Add**), you take things out (**Remove**), and at any moment you can ask \"how many are inside?\" (**Count**). The items in the bag still stand in a line, numbered from 0.\n\n🎬 **Animation idea:** a delivery bag with parcel tags KP101 to KP104. Buttons: \"Add parcel\", \"Deliver KP102\" (Remove), \"Deliver first\" and \"Reset\". After each click, the parcels slide to close the gap, their index numbers (0, 1, 2…) update, a `Count` badge changes, and the matching C# line appears in a terminal (`parcels.Add(\"KP105\");`, `parcels.Remove(\"KP102\");`). A side note shows that the parcel at index 1 is now a different one.\n\n---\n\n## 💻 Real explanation\n\n### 1. Create, add, count\n\n```csharp\nList<string> drivers = new List<string>();\n\ndrivers.Add(\"Ali\");\ndrivers.Add(\"Ravi\");\ndrivers.Add(\"Omar\");\nConsole.WriteLine($\"Drivers: {drivers.Count}\");\n```\n```\nDrivers: 3\n```\n\n- `List<string>` means \"a list that holds only strings\". The `<T>` part is the **type parameter**, so `List<T>` is a **generic** type. `List<int>` holds whole numbers, `List<double>` holds decimals\n- It starts **empty** and grows with every `Add`\n- Arrays use `.Length`; lists use **`.Count`**\n\n### 2. Remove, index, foreach\n\n```csharp\ndrivers.Remove(\"Ravi\");\nConsole.WriteLine($\"After remove: {drivers.Count}\");\nConsole.WriteLine($\"First driver: {drivers[0]}\");\n\nforeach (string driver in drivers)\n{\n    Console.WriteLine($\"- {driver}\");\n}\n```\n```\nAfter remove: 2\nFirst driver: Ali\n- Ali\n- Omar\n```\n\n- `Remove(\"Ravi\")` takes that item out, and everything after it **moves up one place**. Omar was at index 2; now he's at index 1\n- `[0]` still means the first item, and the list is **zero-based** like an array\n- `foreach` works exactly like it does with arrays\n\n### 3. Read before you remove\n\nIn the delivery queue, the parcel at index 1 was delivered. Printing it **before** removing it gives the right ID:\n\n```csharp\nConsole.WriteLine($\"Delivered: {parcels[1]}\");   // KP102\nparcels.Remove(\"KP102\");\nConsole.WriteLine($\"Next parcel: {parcels[0]}\");  // KP101\n```\n\nAfter the `Remove`, `parcels[1]` would be `KP103`.\n\n### 4. Array or list?\n\n| | Array `int[]` | List `List<int>` |\n|---|---|---|\n| Size | fixed when created | grows and shrinks |\n| How many | `.Length` | `.Count` |\n| Add / remove | ❌ | `.Add()` / `.Remove()` |\n| Index | `[0]` … `[Length - 1]` | `[0]` … `[Count - 1]` |\n\n**Rule:** use a list when the number of items **changes while the program runs**. Use an array when the size is fixed (7 days of the week, 12 months).\n\n---\n\n## 🎯 Dart comparison\n\n```dart\n// Dart\nList<String> cities = [];\ncities.add('Salmiya');\ncities.remove('Salmiya');\nprint(cities.length);\nfor (var c in cities) { print(c); }\n```\n```csharp\n// C#\nList<string> cities = new List<string>();\ncities.Add(\"Salmiya\");\ncities.Remove(\"Salmiya\");\nConsole.WriteLine(cities.Count);\nforeach (string c in cities) { Console.WriteLine(c); }\n```\n\nA Dart `List` is already growable, so C#'s `List<T>` will feel familiar. The differences are that C# method names start with a **capital letter** (`Add`, not `add`) and C# uses **`Count`** instead of `length`.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| `First driver: {drivers.Count}` printed `2` | Copied the line above and didn't change the part inside `{ }` | Read the label: \"First driver\" asks for `drivers[0]` |\n| Fixed the **wrong** line, so both lines were swapped | Changed \"After remove\" instead of \"First driver\" | Match each label to its code before saving |\n| Output had 6 lines instead of 7 | Ran the program before saving the last line | Ctrl+S, then `dotnet run` |\n| `$\"Still waiting: 3: {parcels.Count}\"` | A hand-typed `3` next to the real count | Only `{parcels.Count}`, so nothing is hard-coded |\n\n✅ Wins: all three predictions were right, and reading `parcels[1]` before the `Remove` was a smart move.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| shopping bag | **`List<T>`** | \"Use a `List<T>` when items get added or removed at runtime.\" |\n| egg tray | **array** | \"The size is fixed, so an array is fine here.\" |\n| the `<string>` part | **type parameter** / **generic** | \"It's a generic list of strings.\" |\n| put in / take out | **`Add`** / **`Remove`** | \"Remove the parcel once it's delivered.\" |\n| how many in the bag | **count** | \"Lists use `.Count`, arrays use `.Length`.\" |\n\n---\n\n## 📋 Summary\n\n- `List<T>` is a generic, growable list: `new List<string>()`\n- `.Add(x)` puts an item at the end, `.Remove(x)` takes it out, and later items move up\n- `.Count` is the number of items (arrays use `.Length`)\n- Indexes are zero-based: `[0]` to `[Count - 1]`\n- Use a list when the number of items changes while the program runs\n\n---\n\n## 📝 Quiz\n\n1. `List<int> stops` has 5, 8 and 2 added. What is `stops.Count`?\n2. Arrays use `.Length`. What do lists use?\n3. After `stops.Remove(8);`, what is `stops[1]`?\n4. When should you use a `List<T>` and not an array?\n5. What does `<int>` in `List<int>` mean?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `3`.\n2. `.Count`.\n3. `2`. The list is now 5, 2, so index 1 is 2.\n4. When the number of items changes while the program runs (items get added or removed).\n5. It's the **type parameter**: this list holds only `int` values. `List<T>` is a generic type.\n\n<\/details>\n"}, {"id": "1.15", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/15-methods-void-return.md", "title": "Methods, part 1 (void, parameters, return)", "md": "# Chapter 1.15: Methods, part 1 (void, parameters, return)\n\n> Learned: Sun 18 Oct 2026 · Code: `lessons/phase-01/23-methods`, `lessons/phase-01/24-shipping-cost`\n\n---\n\n## 🧸 LKG story\n\n**A method is \"make tea\".** Mum doesn't explain the boiling, the sugar and the milk every time. She says \"make tea\", and all the steps happen. \"Make tea\" is a **name** for a set of steps. Say the name three times, and all the steps happen three times.\n\n🎬 **Animation idea:** a method box `PrintLabel` with its lines inside, and a list of calls next to it. Sliders set how many calls (1–5) and how many lines are in the body (1–4). Press \"Run\": a pointer jumps from each call into the box, runs every line (the terminal fills up), and jumps back. A counter at the end shows `calls × lines = total lines`.\n\n**Parameters are empty cups. Arguments are what you pour in.** If you call \"make tea **with 2 sugars**\", the 2 goes into the method's `sugar` cup. Inside the method, you use the cup's **name** (`sugar`), not the name of the whole job.\n\n🎬 **Animation idea:** the call `PrintReceipt(\"Salmiya\", 2)` sits on top and the signature `void PrintReceipt(string city, double cost)` sits underneath. The arguments drop down into the matching parameter boxes. Below that, a pick: what goes in the `{ }`? Choosing `city` / `cost` prints `City: Salmiya` and `Shipping: 2 KD`. Choosing `PrintReceipt` prints `System.Action...`, and choosing the arguments in the wrong order shows a red CS1503.\n\n**A return method is a brother sent to the shop.** A `void` method goes, does the job, and comes back with nothing. A method with a **return type** comes back **holding something**, like a juice or a number, and you can store it.\n\n---\n\n## 💻 Real explanation\n\n### 1. A `void` method with one parameter\n\n```csharp\nPrintLabel(\"Salmiya\");\nPrintLabel(\"Jahra\");\nPrintLabel(\"Fahaheel\");\n\nvoid PrintLabel(string city)\n{\n    Console.WriteLine(\"----------\");\n    Console.WriteLine($\"To: {city}\");\n}\n```\n```\n----------\nTo: Salmiya\n----------\nTo: Jahra\n----------\nTo: Fahaheel\n```\n\n- You **define** the method once (at the bottom of `Program.cs`) and **call** it by name\n- `void` means \"does a job, gives nothing back\"\n- `string city` is a **parameter**: an input box. `\"Salmiya\"` is the **argument**: the value that goes into the box\n- Every call runs the **whole method body**: 3 calls × 2 lines = **6 lines**, not 4\n- C# method names use **PascalCase**: `PrintLabel`\n\n### 2. A method that returns a value\n\n```csharp\ndouble total = AddDeliveryFee(4.0);\nConsole.WriteLine($\"Total: {total} KD\");\nConsole.WriteLine($\"Big order: {AddDeliveryFee(10.0)} KD\");\n\ndouble AddDeliveryFee(double price)\n{\n    double fee = 1.5;\n    return price + fee;\n}\n```\n```\nTotal: 5.5 KD\nBig order: 11.5 KD\n```\n\n- The **return type** (`double`) replaces `void`\n- `return price + fee;` sends
