the result back to the line that called it, and the method stops there\n- You can **store** the return value (`double total = ...`) or use it straight away inside `{ }`\n\n### 3. More than one parameter\n\n```csharp\nvoid PrintStop(string driver, int stopNumber)\n{\n    Console.WriteLine($\"{driver} → stop {stopNumber}\");\n}\n\nPrintStop(\"Ali\", 3);\nPrintStop(\"Ravi\", 12);\n```\n```\nAli → stop 3\nRavi → stop 12\n```\n\nPut commas between the parameters and give each one its own type. The arguments go in the **same order**: `PrintStop(3, \"Ali\")` is a compile error (**CS1503**).\n\n### 4. One method, one job\n\n```csharp\ndouble salmiyaCost = CalculateShipping(4);\nPrintReceipt(\"Salmiya\", salmiyaCost);\n\ndouble jahraCost = CalculateShipping(10);\nPrintReceipt(\"Jahra\", jahraCost);\n\ndouble CalculateShipping(double weightKg)\n{\n    double fee = 0.5;            // 0.5 KD per kg\n    return weightKg * fee;\n}\n\nvoid PrintReceipt(string city, double cost)\n{\n    Console.WriteLine($\"City: {city}\");\n    Console.WriteLine($\"Shipping: {cost} KD\");\n}\n```\n```\nCity: Salmiya\nShipping: 2 KD\nCity: Jahra\nShipping: 5 KD\n```\n\n- `CalculateShipping` turns a **weight** into a **price** (4 × 0.5 = 2). It never prints\n- `PrintReceipt` only **shows** what it's given, using its own parameters `city` and `cost`\n- At the top: calculate, store, then pass the result on. This is called **single responsibility**\n\nHow the values travel:\n\n```\nPrintReceipt( \"Salmiya\" , salmiyaCost )      ← the call (arguments)\n                  ↓            ↓\nvoid PrintReceipt(string city, double cost)  ← the signature (parameters)\n```\n\n---\n\n## 🎯 Dart comparison\n\n```dart\n// Dart\nvoid printLabel(String city) { print('To: $city'); }\ndouble addDeliveryFee(double price) { return price + 1.5; }\n```\n```csharp\n// C#\nvoid PrintLabel(string city) { Console.WriteLine($\"To: {city}\"); }\ndouble AddDeliveryFee(double price) { return price + 1.5; }\n```\n\nThey're almost the same. The differences: C# uses **PascalCase** names (`PrintLabel`), lowercase `string`, and `Console.WriteLine` instead of `print`.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Predicted 4 lines for 3 `PrintLabel` calls | Thought the dashes print only once | Every call runs the **whole** body: 3 × 2 = 6 |\n| `return weightKg + fee;` for \"0.5 KD per kg\" | \"Per kg\" means multiply, not add | `return weightKg * fee;` |\n| Wrote `weightKg , fee` | Didn't know the multiply sign | `*` is multiply in C# and Dart (`+ - * /`) |\n| `{CalculateShipping}` / `{PrintReceipt}` printed `System.Action...` | Wrote the **method name** inside `{ }` | Use the **parameter names**: `{city}`, `{cost}` |\n| `PrintReceipt(\"Salmiya\", 4)` + warning CS8321 | Passed the weight as the cost, so `CalculateShipping` was never called | Calculate first: `double cost = CalculateShipping(4);` then pass `cost` |\n| `Totol` | Typo | Read the output before saying done |\n\n✅ Win: asking \"then what is the use of CalculateShipping?\" was exactly the right question. It led to the \"one method, one job\" step.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| \"make tea\" | **method** | \"Extract that repeated code into a method.\" |\n| say the name | **call** / **invoke** | \"Call `PrintReceipt` once per parcel.\" |\n| the steps inside `{ }` | **method body** | \"Every call executes the whole method body.\" |\n| brings nothing back | **`void`** | \"It's a void method, it only prints.\" |\n| comes back holding something | **return value** / **return type** | \"The method returns a `double`.\" |\n| empty cup | **parameter** | \"The method takes two parameters.\" |\n| what you pour in | **argument** | \"Pass the arguments in the right order.\" |\n| first line of a method | **method signature** | \"The signature is `double CalculateShipping(double weightKg)`.\" |\n| one method, one job | **single responsibility** | \"Keep calculation and printing in separate methods.\" |\n| a method in Program.cs | **local function** (CS8321 = never used) | \"The local function is never called.\" |\n\n---\n\n## 📋 Summary\n\n- A method is a named block of code: define once, call many times. Each call runs the whole body\n- `void` = no result; a return type + `return x;` = sends a value back and stops the method\n- Parameters are the boxes in the signature; arguments fill them, in the same order\n- Inside the method, use the **parameter names**\n- One method, one job: calculate in one, print in another\n\n---\n\n## 📝 Quiz\n\n1. What is the difference between a `void` method and a `double` method?\n2. In `PrintStop(\"Ali\", 3)`, which are the arguments? In `void PrintStop(string driver, int stopNumber)`, which are the parameters?\n3. Inside `PrintReceipt(string city, double cost)`, what does `Console.WriteLine($\"City: {city}\");` print for the call `PrintReceipt(\"Jahra\", 5)`?\n4. What happens with `PrintStop(3, \"Ali\")`?\n5. Why is it better to have `CalculateShipping` and `PrintReceipt` as two methods instead of one?\n\n<details>\n<summary>Answers<\/summary>\n\n1. A `void` method does a job and gives nothing back. A `double` method must `return` a `double`, which the caller can store or use.\n2. Arguments: `\"Ali\"` and `3`. Parameters: `driver` and `stopNumber`.\n3. `City: Jahra`.\n4. A compile error (CS1503): the first parameter needs a `string`, but it got an `int`.\n5. Each method has one job (single responsibility). You can reuse the calculation without printing, and change the receipt without touching the maths.\n\n<\/details>\n"}, {"id": "1.16", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/16-methods-bool-calling.md", "title": "Methods, part 2 (bool methods, else, a method that calls a method)", "md": "# Chapter 1.16: Methods, part 2 (bool methods, else, a method that calls a method)\n\n> Learned: Mon 19 Oct 2026 · Code: `lessons/phase-01/23-methods`, `lessons/phase-01/25-heavy-parcel`, `lessons/phase-01/26-delivery-vehicle`\n\n---\n\n## 🧸 LKG story\n\n**A `bool` method is a guard at the gate who only says \"yes\" or \"no\".** You show the guard a parcel, the guard checks the scale, and answers: \"Heavy? Yes.\" The guard doesn't load the van. The guard only answers the question.\n\n🎬 **Animation idea:** a parcel on a scale with a slider for its weight (0–20 kg). A switch picks the rule: `weight > 10` or `weight >= 10`. The code lights up the path it takes (`return true;` or `return false;`), and a van or a bike drives in. Stop exactly on 10 kg and flip the switch to see the **boundary value** change its answer.\n\n**A method that calls a method is a cashier using a calculator.** The manager asks the cashier for a bill. The cashier asks the calculator for the total, then prints the bill. The manager only talks to the cashier.\n\n**`else` has no question of its own.** It is the \"otherwise\" door. If you write a question after it, or close it with `;`, the door falls off, and the room behind it is open to everyone.\n\n🎬 **Animation idea:** two versions of the code side by side: the correct `else { ... }` and the broken `else IsHeavy(4.5); { ... }`. A slider sets the parcel weight. In the correct version, only one block lights up. In the broken one, the `{ }` block lights up **every time**, even for 50 kg, and prints \"bike\" for a heavy parcel.\n\n---\n\n## 💻 Real explanation\n\n### 1. Read the first line carefully\n\n```csharp\ndouble   AddDeliveryFee   (double price)\nreturn    method name      parameter\ntype                       (type + name)\n```\n\n- The `double` **before the name** is the **return type**: what the method **gives back**\n- The `double` **inside `( )`** is the **parameter type**: what the method **accepts**\n- The **parameter** is the **name**, `price`. `double` is only its type\n\n### 2. A method that returns `bool`\n\n```csharp\nbool IsAdult(int age)\n{\n    if (age >= 18)\n    {\n        return true;\n    }\n    return false;\n}\n\nConsole.WriteLine(IsAdult(25));\nConsole.WriteLine(IsAdult(12));\n```\n```\nTrue\nFalse\n```\n\n- `return` **stops the method right away**. For 25, `return true;` runs and `return false;` is never reached\n- C# prints `True` / `False` with a capital letter. In code you still write lowercase `true` / `false`\n\nA shorter way pros write the same method, because `age >= 18` already *is* `true` or `false`:\n\n```csharp\nbool IsAdult(int age)\n{\n    return age >= 18;\n}\n```\n\n### 3. Call a `bool` method inside an `if`\n\n```csharp\nif (IsAdult(15))\n{\n    Console.WriteLine(\"Can drive\");\n}\nelse\n{\n    Console.WriteLine(\"Too young\");\n}\n```\n```\nToo young\n```\n\nC# runs `IsAdult(15)` first, gets `false`, and then the `if` checks that `false`.\n\n### 4. Every check needs its own `if` / `else` pair\n\n```csharp\nbool IsHeavy(double weight)\n{\n    if (weight > 10)\n    {\n        return true;\n    }\n    return false;\n}\n\nif (IsHeavy(12))\n{\n    Console.WriteLine(\"12 kg: van\");\n}\nelse\n{\n    Console.WriteLine(\"12 kg: bike\");\n}\n// ...the same pair again for 4.5 and for 10\n```\n```\n12 kg: van\n4.5 kg: bike\n10 kg: bike\n```\n\n- The `10` inside `IsHeavy` is the **threshold** (the limit). `weight` is the parcel **being checked**\n- `10 > 10` is **false**, so exactly 10 kg goes by bike. That edge is called the **boundary value**. Testers always check it\n- `else` takes **no condition** and **no `;`**\n\n### 5. A method that calls another method\n\n```csharp\ndouble AddTax(double price)\n{\n    return price + 2;\n}\n\nvoid PrintBill(string item, double price)\n{\n    double total = AddTax(price);     // calls the other method\n    Console.WriteLine($\"{item}: {total} KD\");\n}\n\nPrintBill(\"Shoes\", 10);\nPrintBill(\"Bag\", 5);\n```\n```\nShoes: 12 KD\nBag: 7 KD\n```\n\nThe flow: `PrintBill(\"Shoes\", 10)` → `price` is 10 → `AddTax(10)` returns 12 → `total` is 12 → print.\n\n### 6. Methods remove repetition\n\nExercise 25 needed three big `if` / `else` blocks. With a method that calls `IsHeavy`, it's three one-line calls:\n\n```csharp\nvoid PrintVehicle(double weight)\n{\n    if (IsHeavy(weight))\n    {\n        Console.WriteLine($\"{weight} kg: van\");\n    }\n    else\n    {\n        Console.WriteLine($\"{weight} kg: bike\");\n    }\n}\n\nPrintVehicle(12);\nPrintVehicle(4.5);\nPrintVehicle(10);\n```\n```\n12 kg: van\n4.5 kg: bike\n10 kg: bike\n```\n\n- `PrintVehicle` passes its own parameter on: `IsHeavy(weight)`\n- Both methods have a parameter called `weight`. They are **two separate variables**, each living only inside its own method's `{ }` (its **scope**)\n- The threshold lives in **one place**. Change `10` to `15` in `IsHeavy`, and every caller follows\n\n---\n\n## 🎯 Dart comparison\n\n```dart\n// Dart\nbool isHeavy(double weight) => weight > 10;\n\nvoid printVehicle(double weight) {\n  if (isHeavy(weight)) {\n    print('$weight kg: van');\n  } else {\n    print('$weight kg: bike');\n  }\n}\n```\n```csharp\n// C#\nbool IsHeavy(double weight) => weight > 10;   // the same arrow style works in C#!\n\nvoid PrintVehicle(double weight)\n{\n    if (IsHeavy(weight)) Console.WriteLine($\"{weight} kg: van\");\n    else Console.WriteLine($\"{weight} kg: bike\");\n}\n```\n\nSame idea. Dart prints `true`; C# prints `True`.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Said `double` in `double AddDeliveryFee(...)` means \"accepts only double\" | Mixed up the two `double`s on line 1 | Before the name = **return type**. Inside `( )` = **parameter type** |\n| Said the parameter is `double` | `double` is only the type | The parameter is the **name**: `price` |\n| Only 1 line printed (`12 kg: van`) | No `else`, so `false` printed nothing | Add `else { ... }` for the \"bike\" line |\n| Wrote `else` first, then **deleted** it | Wasn't sure it was right | When unsure, **keep it and run it** |\n| `else IsHeavy(4.5);` then `{ ... }` | `else` takes no condition; the `;` ended it, so the block ran **always** | Each parcel gets its own `if (...) { } else { }` |\n| `AddTxt` instead of `AddTax` | Typo (it still worked, because it was the same both times) | Names are for humans, so spell them carefully |\n| Output `Shoes: 12`, no `KD` | Left ` KD` out of the string | Compare the line with the example |\n| No prediction before running exercise 25 | Rushed | Predict all lines first |\n\n✅ Wins: predicted the boundary (10 → bike) with the reason (`>` not `>=`); asked \"what is the base weight?\", which led to the word **threshold**; exercise 26 was perfect on the first try, with full-line predictions.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| the `double` before the name | **return type** | \"AddDeliveryFee returns a double.\" |\n| the `double` inside `( )` | **parameter type** | \"It takes the price as a double parameter.\" |\n| the yes/no guard | **`bool` method** / **predicate** | \"`IsHeavy` is a predicate, call it in the `if` condition.\" |\n| the limit | **threshold** | \"The heavy threshold is 10 kg.\" |\n| the exact edge | **boundary value** | \"Test the boundary value: is exactly 10 heavy?\" |\n| cashier uses a calculator | **calling a method from a method** | \"`PrintVehicle` calls `IsHeavy`.\" |\n| the door fell off | **empty statement** after `else ...;` | \"That `;` makes it an empty statement, so the block always runs.\" |\n\n---\n\n## 📋 Summary\n\n- Line 1 of a method: **return type**, name, then parameters (type + **name**)\n- A `bool` method answers yes/no; `return` stops the method right away\n- Call a `bool` method straight inside `if (...)`\n- `else` has no condition and no `;`\n- A method can call another method and use its return value\n- Keep the threshold in one method so one change updates every caller\n\n---\n\n## 📝 Quiz\n\n1. In `bool IsHeavy(double weight)`, what is the return type, and what is the parameter?\n2. What does `IsAdult(12)` return, and does the line `return false;` run for `IsAdult(25)`?\n3. Why did `else IsHeavy(4.5); { Console.WriteLine(\"4.5 kg: bike\"); }` print \"bike\" even though it was wrong?\n4. With `weight > 10`, is 10 kg heavy? What about with `weight >= 10`?\n5. Predict: `PrintBill(\"Bag\", 5);` when `AddTax` returns `price + 2`.\n\n<details>\n<summary>Answers<\/summary>\n\n1. Return type: `bool`. Parameter: `weight` (its type is `double`).\n2. `false`. No: `return true;` runs first and stops the method.\n3. `else` can't take a condition. The `;` ended the `else`, so the `{ }` became a standalone block that **always** runs.\n4. `10 > 10` is false → not heavy. `10 >= 10` is true → heavy.\n5. `Bag: 7 KD`.\n\n<\/details>\n"}, {"id": "1.17", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/17-ref-out.md", "title": "`ref` and `out` (and the Try pattern)", "md": "# Chapter 1.17: `ref` and `out` (and the Try pattern)\n\n> Learned: Mon 19 Oct 2026 · Code: `lessons/phase-01/23-methods`, `lessons/phase-01/27-parcel-fee`\n\n---\n\n## 🧸 LKG story\n\n**Pass by value is a photocopy.** You give your friend a photocopy of your homework. Your friend scribbles on it. Your original stays clean.\n\n**`ref` is the original.** This time you hand over your **original** homework. Whatever your friend writes, you see it too.\n\n🎬 **Animation idea:** a homework sheet that says `myPoints = 5`. A switch picks \"photocopy (no ref)\" or \"original (ref)\". Press \"Call AddBonus\": a sheet slides into the method, gets `+10` written on it, and comes back. With the photocopy, the copy says 15 and is thrown away, so the original still says 5. With `ref`, the original itself now says 15.\n\n**`out` is an empty box.** You hand someone an empty box and say \"put the answer in here\". It doesn't matter what was in it before. But they **must** put something in before they leave, at **every** door.\n\n🎬 **Animation idea:** `TryGetFee(weight, out fee)` with a weight slider from −5 to 20 kg. The code lights up the path it takes, the `fee` box fills up, and the `if` prints \"Fee: ... KD\" or \"Invalid weight\". A switch \"forget `fee = 0` on the bad path\" turns the build red with CS0177.\n\n---\n\n## 💻 Real explanation\n\n### 1. Pass by value (the default)\n\n```csharp\nvoid AddBonus(int points)\n{\n    points = points + 10;\n    Console.WriteLine($\"Inside: {points}\");\n}\n\nint myPoints = 5;\nAddBonus(myPoints);\nConsole.WriteLine($\"Outside: {myPoints}\");\n```\n```\nInside: 15\nOutside: 5\n```\n\nThe method gets a **copy** of the value. It changes the copy; the caller's `myPoints` stays 5.\n\n### 2. `ref`: pass by reference\n\n```csharp\nvoid AddBonus(ref int points)      // ref here\n{\n    points = points + 10;\n}\n\nint myPoints = 5;\nAddBonus(ref myPoints);            // and ref here\nConsole.WriteLine($\"Outside: {myPoints}\");\n```\n```\nOutside: 15\n```\n\n- `ref` goes in **both** places: the parameter and the call\n- The variable must **already have a value** before the call\n\n### 3. `out`: send back an extra result\n\n```csharp\nbool SplitPrice(double total, out double tax)\n{\n    tax = total * 0.1;      // the method MUST fill it\n    return total > 0;\n}\n\nbool ok = SplitPrice(50, out double myTax);   // declared right in the call\nConsole.WriteLine($\"{ok} {myTax}\");\n```\n```\nTrue 5\n```\n\n- The **`return`** gives one result (`ok`). The **`out`** gives another (`myTax`). They are **two separate results**\n- Experiment: change it to `return total > 51;` and the output is `False 5`. The `out` value is still filled\n\n| | `ref` | `out` |\n|---|---|---|\n| Caller must set a value first? | ✅ yes | ❌ no |\n| Method must set a value? | ❌ no | ✅ yes |\n| Used for | changing the caller's variable | sending back an extra result |\n\n### 4. You already knew `out`: `TryParse`\n\n```csharp\nif (int.TryParse(input, out int number))\n```\n\n`TryParse` **returns** `bool` (did it work?) and gives the number back through **`out`**. This is the **Try pattern**.\n\n### 5. Every `return` needs the `out` filled first\n\n```csharp\nbool TryGetFee(double weight, out double fee)\n{\n    if (weight <= 0)\n    {\n        fee = 0;            // filled before this return\n        return false;\n    }\n    fee = weight * 0.5;     // and before this one\n    return true;\n}\n\nif (TryGetFee(4, out double fee1))\n{\n    Console.WriteLine($\"Fee: {fee1} KD\");\n}\nelse\n{\n    Console.WriteLine(\"Invalid weight\");\n}\n\nif (TryGetFee(-2, out double fee2))\n{\n    Console.WriteLine($\"Fee: {fee2} KD\");\n}\nelse\n{\n    Console.WriteLine(\"Invalid weight\");\n}\n```\n```\nFee: 2 KD\nInvalid weight\n```\n\n- Forget `fee = 0;` on the bad path → **CS0177**: the out parameter must be assigned before control leaves the method\n- `true` means \"**it worked**\", just like `TryParse`\n- Each call needs a **new name** for its `out` variable (`fee1`, `fee2`)\n\n---\n\n## 🎯 Dart comparison\n\nDart has **no `ref` and no `out`** for numbers. In Dart you'd **return** the new value, or return two values together:\n\n```dart\n// Dart 3: return two values as a record\n(bool, double) tryGetFee(double weight) =>\n    weight <= 0 ? (false, 0) : (true, weight * 0.5);\n```\n\nIn C# the Try pattern with `out` is the classic way, and you'll see it everywhere in .NET (`int.TryParse`, `Dictionary.TryGetValue`).\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Predicted `50 5`, real output `True 5` | Worked out `true` correctly, then didn't use it; the line prints `{ok}`, not the total | For each `{ }`, ask \"which variable, which value?\" |\n| `bool TryGetFee(double weight out double fee)` | Missing comma | Parameters are separated by commas |\n| `return weight <= 0;` → \"Invalid weight\" for 4 | Backwards: it returned `true` for a **bad** weight | `true` = it worked. Use two paths: bad → `false`, good → `true` |\n| −2 kg gave `Fee: -1 KD` | No bad-weight path, so it always did `weight * 0.5` | Add `if (weight <= 0) { fee = 0; return false; }` |\n| `fee = 0.5;` on the bad path | Hidden bug: the output only says \"Invalid weight\", so the wrong fee never shows | Read the code, not only the output. The rule says `0` |\n| Pasted code in chat that didn't match the file | Typed it from memory | Paste what is really in the file |\n\n✅ Wins: predicted pass-by-value and `ref` correctly; **experimented** on my own (`total > 51`) and saw that `out` is filled even when the method returns `false`.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| photocopy | **pass by value** | \"`int` is passed by value, so the method only changes its copy.\" |\n| the original | **pass by reference** (`ref`) | \"Pass it by `ref` so the method changes the original.\" |\n| empty box | **`out` parameter** | \"`TryParse` gives the number back through an out parameter.\" |\n| fill it at every door | **definite assignment** (CS0177) | \"CS0177: the out parameter isn't assigned on every path.\" |\n| Try + bool + out | **Try pattern** | \"Use the Try pattern instead of throwing for bad input.\" |\n| looks right, value wrong | **silent bug** | \"The output looks fine but `fee` is 0.5, that's a silent bug.\" |\n\n---\n\n## 📋 Summary\n\n- By default a method gets a **copy** of an `int` / `double` (pass by value)\n- `ref` (in both places) lets the method change the caller's variable; the variable needs a value first\n- `out` sends back an extra result; the method must fill it before **every** `return`\n- Try pattern: return `bool` \"did it work?\" + the result through `out`, like `int.TryParse`\n\n---\n\n## 📝 Quiz\n\n1. Without `ref`, a method adds 10 to its `int` parameter. Does the caller's variable change? Why?\n2. Where do you write `ref`: in the method, in the call, or both?\n3. Which one needs a value **before** the call, `ref` or `out`?\n4. What does CS0177 mean?\n5. In the Try pattern, what does the `bool` return value mean, and where does the actual result come out?\n\n<details>\n<summary>Answers<\/summary>\n\n1. No. The method got a copy (pass by value).\n2. Both: `void AddBonus(ref int points)` and `AddBonus(ref myPoints)`.\n3. `ref`. With `out`, the method fills it.\n4. An `out` parameter wasn't assigned before a `return` (on some path).\n5. `true` = it worked, `false` = bad input. The result comes out through the `out` parameter.\n\n<\/details>\n"}, {"id": "1.18", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/18-overloading.md", "title": "Method overloading (one name, many parameter lists)", "md": "# Chapter 1.18: Method overloading (one name, many parameter lists)\n\n> Learned: Tue 20 Oct 2026 · Code: `lessons/phase-01/28-print-label`, `lessons/phase-01/29-box-fee`\n\n---\n\n## 🧸 LKG story\n\n**One \"Send\" button, different jobs.** At the KPOST counter there is one \"Send\" button. You can hand over **one parcel**, or **a parcel and a box count**. The staff looks at **what you hand over** and does the right job. You don't need a different button for each case.\n\nThat is overloading: **one method name**, and C# looks at **what you pass in** to decide which version runs.\n\n🎬 **Animation idea:** a counter with two doors, both labelled `GetFee`. Door 1 accepts `(int boxes)` and Door 2 accepts `(int boxes, string city)`. You pick the arguments (`4`, or `4` + `\"Jahra\"`, or `4` + `\"Hawalli\"`) and press \"Call\". The arguments slide toward the door whose shape matches and light it up. Door 2 then calls Door 1 for the box fee and adds 3 KD for Jahra.\n\n---\n\n## 💻 Real explanation\n\n### 1. Overloading = the same name, different parameters\n\n```csharp\nLabels.PrintLabel(\"Hawalli\");\nLabels.PrintLabel(\"Salmiya\", 3);\n\nstatic class Labels\n{\n    public static void PrintLabel(string city)\n    {\n        Console.WriteLine($\"Delivery to {city}\");\n    }\n\n    public static void PrintLabel(string city, int boxes)\n    {\n        Console.WriteLine($\"Delivery {boxes} boxes to {city}\");\n    }\n}\n```\n```\nDelivery to Hawalli\nDelivery 3 boxes to Salmiya\n```\n\n- The two methods differ in the **number** of parameters (1 vs 2)\n- The name + the parameter list is called the **method signature**. Overloads need **different signatures**\n- C# picks the overload that **matches the arguments**. This is called **overload resolution**. It does **not** pick by the order in the file\n\n### 2. Overloads need a class (not top-level local functions)\n\nIn a file with no class (**top-level statements**), a method like `PrintLabel` is really a **local function**, and **local functions can't be overloaded**:\n\n```\nerror CS0128: A local variable or function named 'PrintLabel' is already defined in this scope\nerror CS1501: No overload for method 'PrintLabel' takes 2 arguments\n```\n\nFix: put the methods in a **`static class`**, write `public static` in front of each one, and call them as `Labels.PrintLabel(...)`. (Classes come properly in Phase 2.)\n\n### 3. A different TYPE also counts\n\n```csharp\nPrices.Show(5);\nPrices.Show(2.75);\n\nstatic class Prices\n{\n    public static void Show(int amount)\n    {\n        Console.WriteLine($\"Whole price: {amount} KD\");\n    }\n\n    public static void Show(double amount)\n    {\n        Console.WriteLine($\"Exact price: {amount} KD\");\n    }\n}\n```\n```\nWhole price: 5 KD\nExact price: 2.75 KD\n```\n\n`5` is an `int`, so C# calls `Show(int)`. `2.75` (and `7.0`) has a decimal point, so it's a `double` and C# calls `Show(double)`.\n\n### 4. The return type does NOT count\n\n```csharp\npublic static int Get(int x) { return x; }\npublic static double Get(int x) { return x; }   // ❌\n```\n```\nerror CS0111: Type 'Bad' already defines a member called 'Get' with the same parameter types\n```\n\nBoth have the parameters `(int x)`. When you call `Get(3)`, C# can't tell which one you mean, because the **call looks the same**. Overloads must differ in **parameters** (count or types).\n\n### 5. One overload can call another (DRY)\n\n```csharp\nConsole.WriteLine(Fees.GetFee(4));\nConsole.WriteLine(Fees.GetFee(4, \"Jahra\"));\nConsole.WriteLine(Fees.GetFee(4, \"Hawalli\"));\n\nstatic class Fees\n{\n    public static int GetFee(int boxes)\n    {\n        int fee = boxes * 2;\n        return fee;\n    }\n\n    public static int GetFee(int boxes, string city)\n    {\n        int fee = GetFee(boxes);      // 1 argument → calls the first overload\n        if (city == \"Jahra\")\n        {\n            return fee + 3;\n        }\n        else\n        {\n            return fee;\n        }\n    }\n}\n```\n```\n8\n11\n8\n```\n\nTrace of `GetFee(4, \"Jahra\")`:\n1. 2 arguments, so **overload 2** runs first\n2. `GetFee(boxes)` has 1 argument, so it calls **overload 1**, which returns `4 * 2 =` `8`\n3. Back in overload 2: the city is Jahra, so it returns `8 + 3 =` `11`\n\n`* 2` lives in **one place only**. If the price per box changes, you change one line.\n\n---\n\n## 🎯 Dart comparison\n\nDart has **no overloading**. Two functions can't share a name, so in Dart you would use two names or optional parameters:\n\n```dart\nint getFee(int boxes, [String? city]) {\n  final fee = boxes * 2;\n  return city == 'Jahra' ? fee + 3 : fee;\n}\n```\n\nC# has both overloading **and** optional parameters (next chapter).\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| CS0128 + CS1501 on two `PrintLabel` methods | The first example (Claude's mistake) had no class, so they were local functions, which can't be overloaded | Put the methods in a `static class` with `public static` |\n| Called it a \"runtime error\" | The program never started; the compiler stopped it | That's a **compile-time error** |\n| Typed `Lables` (3 times) | It still ran because the spelling matched everywhere | Use **F2 rename** to fix every place at once |\n| `boxes = boxes * 2;` | The variable called `boxes` then held a fee in KD: the name lies | Use a new local: `int fee = boxes * 2;` |\n| `boxes * 2` written in both overloads | Duplicated logic | Overload 2 calls `GetFee(boxes)` |\n| Quiz: \"overloads must have the same return type\" | Backwards | The return type is **ignored**; only the parameters count |\n| Quiz: \"it runs from top to bottom\" | Thought C# picks by order in the file | C# picks the overload that **matches the arguments** |\n\n✅ Wins: predicted the two `PrintLabel` lines and `Whole price: 10 KD` with the reason (`10` is an `int`); all paths of exercise 29 correct on the first try, with the `else` kept.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| same button, different jobs | **method overloading** | \"`GetFee` has two overloads.\" |\n| name + parameter list | **method signature** | \"Two overloads can't have the same signature.\" |\n| C# picks the matching one | **overload resolution** | \"Overload resolution picked `Show(double)`.\" |\n| only return type differs | **CS0111** | \"Return type doesn't count, that's CS0111.\" |\n| methods with no class | **local functions** | \"Local functions can't be overloaded.\" |\n| changing the parameter box | **reassigning a parameter** | \"Don't reassign `boxes`, use a local `fee`.\" |\n| same code twice | **duplicated logic / DRY** | \"Call the other overload instead of repeating it.\" |\n| didn't build | **compile-time error** | \"It's a compile-time error, not a runtime one.\" |\n\n---\n\n## 📋 Summary\n\n| Rule | Example |\n|---|---|\n| Same name, different **number** of parameters | `PrintLabel(city)` / `PrintLabel(city, boxes)` |\n| Same name, different **types** | `Show(int)` / `Show(double)` |\n| Return type alone ❌ | `int Get(int)` / `double Get(int)` → CS0111 |\n| C# picks by **matching arguments** | `Show(7.0)` → `Show(double)` |\n| Overloads go in a class | `static class Fees { public static int GetFee(...) }` |\n| One overload can call another | `int fee = GetFee(boxes);` |\n\n---\n\n## 📝 Quiz\n\n1. What is method overloading, in one sentence?\n2. Can `int Total(int a, int b)` and `double Total(int a, int b)` live in the same class? Why?\n3. Which overload does `Prices.Show(7.0)` call?\n4. Why did two `PrintLabel` methods with no class give CS0128?\n5. In `GetFee(4, \"Jahra\")`, which overload runs first, and which one does it call?\n\n<details>\n<summary>Answers<\/summary>\n\n1. Several methods with the same name but different parameters (count or types); C# picks one by the arguments.\n2. No. Their parameters are the same, and the return type doesn't count (CS0111).\n3. `Show(double)`, because `7.0` has a decimal point.\n4. Without a class they are local functions, and local functions can't be overloaded.\n5. Overload 2 (two arguments) runs first; it calls overload 1 (`GetFee(boxes)`) for the box fee.\n\n<\/details>\n"}, {"id": "1.19", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/19-optional-named-parameters.md", "title": "Optional and named parameters", "md": "# Chapter 1.19: Optional and named parameters\n\n> Learned: Wed 21 Oct 2026 · Code: `lessons/phase-01/30-delivery-days`\n\n---\n\n## 🧸 LKG story\n\n**The tea shop.** At the tea shop, tea comes with **1 spoon of sugar** unless you ask for more. You can just say \"Tea for Ali\" and you get 1 spoon. Or you say \"Tea for Sara, 3 spoons.\"\n\nThat is an **optional parameter**: the method has a **default value**, and the caller only gives a value when they want something different.\n\n**Saying the label.** You can also say \"**sugar:** 2, **name:** Omar\". Because you said the label, the order doesn't matter. That is a **named argument**.\n\n🎬 **Animation idea:** the method `PrintDelivery(string city, int days = 2)` has two slots: `city` and `days` (with a grey \"2\" already sitting in it). You pick a call. The arguments fly into the slots: by **position** (first value → first slot) or by **label** (`days: 5` flies straight to the `days` slot, even when it is written first). An empty `days` slot keeps the grey default. A wrong call (`days` without a `city`) flashes red with the error code.\n\n---\n\n## 💻 Real explanation\n\n### 1. Optional parameter = a parameter with a default value\n\n```csharp\nShop.PrintReceipt(\"Ali\");\nShop.PrintReceipt(\"Sara\", 3);\n\nstatic class Shop\n{\n    public static void PrintReceipt(string name, int copies = 1)\n    {\n        Console.WriteLine($\"Receipt for {name}: {copies} copy\");\n    }\n}\n```\n```\nReceipt for Ali: 1 copy\nReceipt for Sara: 3 copy\n```\n\n- `int copies = 1` means: \"if nobody passes `copies`, use `1`\"\n- `name` has no default, so it is a **required parameter**\n- The default value is written in the **method header** (line 1 of the method)\n\n### 2. Named arguments = pass a value by its parameter name\n\n```csharp\nShop.PrintReceipt(copies: 2, name: \"Omar\");\n```\n```\nReceipt for Omar: 2 copy\n```\n\n- `copies:` and `name:` are the **parameter names** from the method header\n- C# matches each value by its **name**, so the order doesn't matter\n- Normal arguments are **positional arguments**: matched by their **place** (first value → first parameter)\n- Named arguments are written at the **call site** (the line that calls the method)\n\n### 3. Rule: optional parameters come LAST\n\n```csharp\npublic static void PrintReceipt(int copies = 1, string name)   // ❌\n```\n```\nerror CS1737: Optional parameters must appear after all required parameters\n```\n\nWhy: in `PrintReceipt(\"Omar\")`, C# fills parameters from the left. If the optional `copies` came first, C# couldn't tell where `\"Omar\"` should go.\n\nValid (one required, then two optional):\n\n```csharp\npublic static void SendSms(string phone, string text = \"Your parcel is ready\", int tries = 3)\n```\n\n### 4. You still must pass every required parameter\n\n```csharp\npublic static void Pack(string item, int boxes = 1) { ... }\n\nStore.Pack();   // ❌\n```\n```\nerror CS7036: There is no argument given that corresponds to the required parameter 'item' of 'Store.Pack(string, int)'\n```\n\n### 5. My exercise: delivery days\n\n```csharp\nCourier.PrintDelivery(\"Jahra\");\nCourier.PrintDelivery(\"Salmiya\", 1);\nCourier.PrintDelivery(days: 5, city: \"Hawalli\");\n\nstatic class Courier\n{\n    public static void PrintDelivery(string city, int days = 2)\n    {\n        Console.WriteLine($\"Delivery to {city} in {days} days\");\n    }\n}\n```\n```\nDelivery to Jahra in 2 days\nDelivery to Salmiya in 1 days\nDelivery to Hawalli in 5 days\n```\n\n1. Only the city → `days` uses its default `2`\n2. Positional → `1` replaces the default\n3. Named → order reversed, still correct\n\n---\n\n## 🎯 Dart comparison\n\n| Dart | C# |\n|---|---|\n| `void printReceipt(String name, [int copies = 1])` | `void PrintReceipt(string name, int copies = 1)` |\n| `void printReceipt({required String name, int copies = 1})` | the **same** C# method, the caller just writes names |\n| Named params are decided by the **function** (`{ }`) | Named args are decided by the **caller** |\n| `printReceipt(name: 'Omar', copies: 2)` | `PrintReceipt(name: \"Omar\", copies: 2)` |\n\nIn C# you don't mark anything special in the method. **Any** parameter can be passed by name.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Quiz: only said `item` is required | Forgot the other half of the question | Also say: `boxes` is optional, default `1` |\n| Quiz: mixed up where the default and the name go | Didn't know the words \"method header\" and \"call site\" | Default → **method header**. Name → **call** |\n| Predicted `Deliver to...`, code printed `Delivery to...` | Predicted from the task text, not from my own code | Read the exact text in the quotes before predicting |\n| Typed the first example into an old exercise (`29-box-fee`) | Wanted a quick place to try it | Fine, but don't commit it; `git restore <file>` brings the committed version back |\n\n✅ Wins: predicted the default (`1 copy`) and the named-argument line right; understood by myself that named arguments don't need the order; exercise 30 correct on all 3 calls on the first try.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| \"1 sugar unless you ask\" | **optional parameter** / **default value** | \"Make `days` optional with a default of 2.\" |\n| must always be passed | **required parameter** | \"`city` is required, so it comes first.\" |\n| optional before required | **CS1737** | \"Optional parameters go last, that's CS1737.\" |\n| forgot a required one | **CS7036** | \"`Pack()` gives CS7036, `item` is required.\" |\n| matched by its place | **positional argument** | \"Positional arguments follow the parameter order.\" |\n| \"sugar: 2\" with a label | **named argument** | \"Pass `days` as a named argument so it's readable.\" |\n| line 1 of the method | **method header** | \"The default lives in the method header.\" |\n| the line that uses it | **call site** | \"At the call site we pass `city:`.\" |\n\n---\n\n## 📋 Summary\n\n| Rule | Example |\n|---|---|\n| Default value in the header | `int days = 2` |\n| Leave it out → default is used | `PrintDelivery(\"Jahra\")` → 2 days |\n| Pass it → default is replaced | `PrintDelivery(\"Salmiya\", 1)` |\n| Named argument → any order | `PrintDelivery(days: 5, city: \"Hawalli\")` |\n| Optional parameters go **last** | otherwise CS1737 |\n| Required parameters must be passed | `Pack()` → CS7036 |\n\n---\n\n## 📝 Quiz\n\n1. In `Pack(string item, int boxes = 1)`, which parameter is required, which is optional, and what is the default?\n2. Is `void Pay(double amount = 5, string user)` valid? Why?\n3. What does `Store.Pack(boxes: 4, item: \"Shoes\");` print (`$\"{item}: {boxes} box\"`)?\n4. Where is a default value written, and where is a named argument written?\n5. What happens with `Store.Pack();`?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `item` is required; `boxes` is optional with default `1`.\n2. No. CS1737: optional parameters must come after all required ones.\n3. `Shoes: 4 box`. Named arguments are matched by name, not order.\n4. Default value → in the **method header**. Named argument → in the **call**.\n5. Compile error CS7036: the required parameter `item` has no argument.\n\n<\/details>\n"}, {"id": "1.20", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/20-calculator-v2-methods.md", "title": "Calculator v2, moving logic into methods (my own Try pattern)", "md": "# Chapter 1.20: Calculator v2, moving logic into methods (my own Try pattern)\n\n> Learned: Wed 21 Oct 2026 · Code: `projects/02-console-calculator` (v2)\n\n---\n\n## 🧸 LKG story\n\n**The front desk and the back office.** In v1 the calculator was one person doing everything at the front desk: taking the numbers, checking the operator, doing the maths, and shouting the answer.\n\nIn v2 the front desk (the `while` loop) only **takes the order and gives the answer**. The checking and the maths go to two helpers in the back office:\n\n- **`IsValidOperator`** checks the order: \"Is this `+ - * /`?\" → yes or no\n- **`TryCalculate`** works like `TryParse`: \"Did it work?\" → yes or no, **plus** the answer in an `out` box\n\n🎬 **Animation idea:** type a first number, an operator and a second number, then press \"Calculate\". The values travel from the loop into `IsValidOperator` (green ✓ or red ✗), then into `TryCalculate`. Inside it, the divide-by-zero door is checked first. Then the matching switch arm lights up. It returns a big `true` / `false` badge and drops the value into the `out result` box. The loop prints the line, or \"Cannot divide by zero\".\n\n---\n\n## 💻 Real explanation\n\n### 1. Step 1: a `bool` method replaces the long `&&` check\n\nv1:\n```csharp\nif (op != \"+\" && op != \"-\" && op != \"*\" && op != \"/\")\n```\n\nv2:\n```csharp\nif (!Calc.IsValidOperator(op))\n\nstatic class Calc\n{\n    public static bool IsValidOperator(string? op)\n    {\n        return op == \"+\" || op == \"-\" || op == \"*\" || op == \"/\";\n    }\n}\n```\n\n- The method answers the **positive** question \"is it valid?\", so it uses `==` with `||` (+ **or** - **or** ...)\n- The `!` at the call flips it: \"if **not** valid\"\n- Moving code into its own method is a **refactoring** called **extract method**\n\n### 2. Step 2: my own Try pattern\n\n```csharp\npublic static bool TryCalculate(double a, string? op, double b, out double result)\n{\n    if (op == \"/\" && b == 0)\n    {\n        result = 0;\n        return false;\n    }\n\n    result = op switch\n    {\n        \"+\" => a + b,\n        \"-\" => a - b,\n        \"*\" => a * b,\n        _ => a / b\n    };\n    return true;\n}\n```\n\nThe rules of the **Try pattern** (same as `double.TryParse`):\n\n| Case | Returns | `out result` |\n|---|---|---|\n| It worked | `true` | the answer |\n| It failed (divide by zero) | `false` | the **default** (`0`) |\n\nEvery path must give `result` a value before `return`, or you get **CS0177**.\n\n### 3. Step 3: the loop only does input and output\n\n```csharp\nif (!Calc.TryCalculate(firstNumber, op, secondNumber, out double result))\n{\n    Console.WriteLine(\"Cannot divide by zero\");\n    continue;\n}\nConsole.WriteLine($\"{firstNumber} {op} {secondNumber} = {result}\");\n```\n```\nFirst Number: 10\nOperator (+ - * /): *\nSecond number: 4\n10 * 4 = 40\nFirst Number: 10\nOperator (+ - * /): /\nSecond number: 0\nCannot divide by zero\n```\n\nThe 21-line `switch` statement became one `if` and one `WriteLine`. The output shows `*` now (v1 printed `x`), because the line prints `{op}`.\n\n### 4. Warning CS8509: the switch is not exhaustive\n\nWhen the last arm was `\"/\" => a / b`, the build said:\n\n```\nwarning CS8509: The switch expression does not handle all possible values of its input type (it is not exhaustive). For example, the pattern '\"\"' is not covered.\n```\n\nA `string` can be **any** text. If no arm matches, a switch expression **crashes at runtime**. The fix is the **discard pattern** `_` (\"anything else\") as the last arm. It is safe here because `IsValidOperator` already let only `+ - * /` through.\n\n---\n\n## 🎯 Dart comparison\n\nDart has no `out` parameters. In Dart you would return a nullable value or a record instead:\n\n```dart\ndouble? tryCalculate(double a, String op, double b) {\n  if (op == '/' && b == 0) return null;\n  return switch (op) {\n    '+' => a + b,\n    '-' => a - b,\n    '*' => a * b,\n    _ => a / b,\n  };\n}\n```\n\nC# can do that too (nullable types come next), but the `bool` + `out` Try pattern is the classic .NET style (`int.TryParse`, `Dictionary.TryGetValue`).\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| CS8509 warning | Last arm was `\"/\"`, so other strings weren't covered | Make the last arm `_ => a / b` |\n| `return true` on divide by zero, `return false` at the end | `true` / `false` swapped | Failed → `false`; worked → `true` |\n| `result = a;` on failure | Gives back `10` for `10 / 0`, which looks like a real answer | `result = 0;` (the default, like `TryParse`) |\n| Tested only the bad operator path | Output can hide bugs | Test every path: good, bad operator, divide by zero |\n| Typo `dicide` | Typing fast | Read the text in quotes before running |\n| Commented out the old `switch` | Wanted to keep it | Delete **dead code**; Git keeps the history |\n\n✅ Wins: all three `IsValidOperator` blanks right first time; fixed the swapped `true` / `false` from a hint; predicted `10 * 4 = 40` including the `*`; tested both paths in one run.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| moved code into a method | **extract method** / **refactoring** | \"I extracted the operator check into `IsValidOperator`.\" |\n| my own TryParse | **Try pattern** | \"`TryCalculate` follows the Try pattern.\" |\n| `0` on failure | **default value** of the `out` parameter | \"On failure it returns false and sets `result` to its default.\" |\n| `_` arm | **discard pattern** | \"Add a discard arm so the switch is exhaustive.\" |\n| switch doesn't cover all values | **not exhaustive** (CS8509) | \"CS8509: the switch expression isn't exhaustive.\" |\n| old code in comments | **dead code** | \"Please remove the dead code, it's in the Git history.\" |\n| stage everything | **`git add -A`** | \"Check `git status` before `git add -A`.\" |\n\n---\n\n## 📋 Summary\n\n| Piece | Job |\n|---|---|\n| `while` loop | read input, print output |\n| `Calc.IsValidOperator(op)` | `bool`: is it `+ - * /`? |\n| `Calc.TryCalculate(a, op, b, out result)` | `bool` \"did it work?\" + the answer through `out` |\n| `result = 0; return false;` | failure path (divide by zero) |\n| `_ => a / b` | discard arm, makes the switch exhaustive |\n\n---\n\n## 📝 Quiz\n\n1. Why does `IsValidOperator` use `==` and `||` while v1 used `!=` and `&&`?\n2. What should a Try method return, and put in `out`, when it fails?\n3. What does warning CS8509 mean, and how did I fix it?\n4. Why is `result = a;` on divide by zero a bad idea?\n5. What does `git add -A` stage?\n\n<details>\n<summary>Answers<\/summary>\n\n1. The method asks the positive question \"is it valid?\" (+ OR - OR * OR /). v1 asked \"is it NOT valid?\" (not + AND not - ...). The `!` at the call flips the method's answer.\n2. `false`, and the default value (`0` for numbers) in the `out` parameter.\n3. The switch expression is not exhaustive: some strings match no arm and would crash at runtime. Fix: a `_` discard arm at the end.\n4. `10 / 0` would hand back `10`, which looks like a real answer if someone forgets to check the `bool`.\n5. Every change in the whole repo: new, edited and deleted files.\n\n<\/details>\n"}, {"id": "1.21", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/21-string-helpers.md", "title": "String helpers (Trim, ToUpper, Contains, Replace, Split, IsNullOrWhiteSpace)", "md": "# Chapter 1.21: String helpers (Trim, ToUpper, Contains, Replace, Split, IsNullOrWhiteSpace)\n\n> Learned: Thu 22 Oct 2026 · Code: `lessons/phase-01/31-string-helpers`\n\n---\n\n## 🧸 LKG story\n\n**The cleaning toolbox.** A customer types their city into the app: `\"  hawalli  \"`. Extra spaces, small letters. Before we save it, we clean it with small tools from a toolbox: one cuts the spaces, one makes CAPITALS, one searches like **Ctrl + F**, one does **Find and Replace**, one cuts a string of beads at every comma.\n\n**The photocopy rule.** A tool never touches your original paper. It makes a **cleaned photocopy** and hands it back. If you don't pick up the copy, it goes in the bin, and your original is still messy. That is why strings are called **immutable**.\n\n🎬 **Animation idea:** a workbench with the original string on a sheet of paper. You pick a tool (`Trim`, `ToUpper`, `Contains`, `Replace`, `Split`, `IsNullOrWhiteSpace`). The tool makes a new sheet (or a `True`/`False` light, or a row of boxes for `Split`). The original sheet stays the same. A switch \"assign it back\" (`name = name.Trim()`) replaces the original with the copy.\n\n---\n\n## 💻 Real explanation\n\nString helpers are **string methods**: they are built into every `string`, and you call them with a dot (`city.Trim()`).\n\n### 1. `Trim`, `ToUpper`, `ToLower`\n\n```csharp\nstring city = \"  hawalli  \";\nConsole.WriteLine($\"[{city}]\");\nConsole.WriteLine($\"[{city.Trim()}]\");\nConsole.WriteLine($\"[{city.Trim().ToUpper()}]\");\nConsole.WriteLine($\"[{city}]\");\n```\n```\n[  hawalli  ]\n[hawalli]\n[HAWALLI]\n[  hawalli  ]\n```\n\n- `Trim()` removes spaces at the **start and end** (not in the middle)\n- `ToUpper()` → CAPITALS, `ToLower()` → small letters\n- `city.Trim().ToUpper()`: the first method gives a new string, and the second method runs on that one. This is called **method chaining**\n- The `[ ]` are only in the text so you can see where the spaces are\n- **Line 4:** `city` still has its spaces. Strings are **immutable**: every method returns a **new** string\n\nTo keep the cleaned value, **assign it back**:\n\n```csharp\nstring name = \"  Ali  \";\nname.Trim();            // ❌ the new string is thrown away\nname = name.Trim();     // ✅ name is now \"Ali\"\n```\n\n### 2. `Contains` (search, like Ctrl + F)\n\n```csharp\nstring note = \"Please deliver to Salmiya\";\nConsole.WriteLine(note.Contains(\"Salmiya\"));\nConsole.WriteLine(note.Contains(\"salmiya\"));\nConsole.WriteLine(note.ToLower().Contains(\"salmiya\"));\n```\n```\nTrue\nFalse\nTrue\n```\n\n- `Contains` returns a **`bool`**\n- It is **case-sensitive**: `S` and `s` are different letters\n- The fix: `ToLower()` first, then search with small letters\n- C# prints `True` / `False` with a capital letter (Dart prints `true` / `false`)\n\n### 3. `Replace` (Find and Replace)\n\n```csharp\nstring phone = \"965-5555-1234\";\nConsole.WriteLine(phone.Replace(\"-\", \"\"));\nConsole.WriteLine(phone.Replace(\"-\", \" \"));\nConsole.WriteLine(phone);\n```\n```\n96555551234\n965 5555 1234\n965-5555-1234\n```\n\n- `Replace(\"old\", \"new\")` changes **every** `\"old\"`\n- `\"\"` is an **empty string**, so replacing with `\"\"` deletes\n- `phone` itself doesn't change (immutable again)\n\n### 4. `Split` (cut into an array)\n\n```csharp\nstring cities = \"Hawalli,Salmiya,Jahra\";\nstring[] parts = cities.Split(\",\");\nConsole.WriteLine(parts.Length);\nConsole.WriteLine(parts[0]);\nforeach (string c in parts)\n{\n    Console.WriteLine($\"- {c}\");\n}\n```\n```\n3\nHawalli\n- Hawalli\n- Salmiya\n- Jahra\n```\n\n- `Split(\",\")` returns a **`string[]`** (an array). The `\",\"` is the **separator**\n- The separator itself is removed: there are no commas in the parts\n- `.Length` = how many parts, `[0]` = the first part\n\n### 5. `string.IsNullOrWhiteSpace` (is it really empty?)\n\n```csharp\nstring a = \"Omar\";\nstring b = \"\";\nstring d = \"   \";\nConsole.WriteLine(string.IsNullOrWhiteSpace(a));\nConsole.WriteLine(string.IsNullOrWhiteSpace(b));\nConsole.WriteLine(string.IsNullOrWhiteSpace(d));\n```\n```\nFalse\nTrue\nTrue\n```\n\n- `True` when the text is `null`, `\"\"` (**empty string**) or only spaces (**whitespace**)\n- **Different shape:** it's a **static method**, so you write `string.` first and put the text inside the brackets: `string.IsNullOrWhiteSpace(name)`, **not** `name.IsNullOrWhiteSpace()`. Same shape as `int.TryParse(...)`\n- Use it in a **guard clause** before saving input\n\n---\n\n## 🎯 Dart comparison\n\n| Dart | C# |\n|---|---|\n| `city.trim()` | `city.Trim()` |\n| `city.toUpperCase()` / `toLowerCase()` | `city.ToUpper()` / `ToLower()` |\n| `note.contains(\"x\")` | `note.Contains(\"x\")` |\n| `phone.replaceAll(\"-\", \"\")` | `phone.Replace(\"-\", \"\")` (replaces all) |\n| `cities.split(\",\")` → `List<String>` | `cities.Split(\",\")` → `string[]` (array) |\n| `name.trim().isEmpty` | `string.IsNullOrWhiteSpace(name)` |\n| prints `true` | prints `True` |\n\nBoth languages have immutable strings. In C# the method names start with a capital letter.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| **CS0136**: `string c = \"   \";` after `foreach (string c in parts)` | The name `c` was already used by the loop variable. C# doesn't allow the same name in the enclosing scope | Rename one of them (I used `d`). Better: names that say what's inside (`spaces`, `part`) |\n| Commented out all the old code to make the error go away | Didn't know what the error meant | Read the error code first. Dead code goes, Git keeps the history |\n| Predicted without the `[ ]` brackets | Didn't read the text in the quotes | Predict the **whole line**, everything inside `$\"...\"` |\n| Predicted `9655551234` (one 5 missing) and `195-...` | Copying slips | Join the parts one by one: `965` + `5555` + `1234` |\n| Quiz: \"`name.Trim();` is a typo\" | Knew \"immutable\" but not what happens to the new string | It's thrown away. Assign it back: `name = name.Trim();` |\n| Warm-up: said the default `= 2` goes at the call site | Header vs call site, again | Default → **method header**. The values you pass → **call site** |\n\n✅ Wins: understood immutable straight away (line 4 of the first example); `Contains` / case-sensitive right on a new example; `Split` 5 lines right; fixed CS0136 by myself; quiz 4.5/5.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| small tools on a string | **string methods** | \"Use the built-in string methods, don't write your own loop.\" |\n| the photocopy rule | **immutable** (methods return a **new** string) | \"Strings are immutable, so assign it back: `name = name.Trim()`.\" |\n| method after method | **method chaining** | \"`input.Trim().ToLower()` is fine, the chain reads left to right.\" |\n| capitals count | **case-sensitive** | \"`Contains` is case-sensitive, so lower both sides first.\" |\n| two quotes with nothing | **empty string** (`\"\"`) | \"Replace the dashes with an empty string.\" |\n| where `Split` cuts | **separator** (delimiter) | \"Split the line on the comma separator.\" |\n| only spaces | **whitespace** | \"Reject names that are null, empty or whitespace.\" |\n| `string.` first | **static method** (called on the type) | \"`IsNullOrWhiteSpace` is static, so call it on `string`.\" |\n| same name twice | **CS0136** (name used in an enclosing scope) | \"CS0136, `c` clashes with the loop variable, rename it.\" |\n\n---\n\n## 📋 Summary\n\n| Method | Returns | Example → result |\n|---|---|---|\n| `Trim()` | new `string` | `\"  Jahra \".Trim()` → `\"Jahra\"` |\n| `ToUpper()` / `ToLower()` | new `string` | `\"hawalli\".ToUpper()` → `\"HAWALLI\"` |\n| `Contains(\"x\")` | `bool` | `\"Fahaheel\".Contains(\"fah\")` → `False` |\n| `Replace(\"a\", \"b\")` | new `string` | `\"965-5555\".Replace(\"-\", \"\")` → `\"9655555\"` |\n| `Split(\",\")` | `string[]` | `\"A-B-C\".Split(\"-\").Length` → `3` |\n| `string.IsNullOrWhiteSpace(x)` | `bool` | `string.IsNullOrWhiteSpace(\"   \")` → `True` |\n\nThe original string never changes. Keep the result with `=`.\n\n---\n\n## 📝 Quiz\n\n1. What does `Console.WriteLine($\"[{\"  Jahra \".Trim()}]\");` print?\n2. `\"Fahaheel\".Contains(\"fah\")`: `True` or `False`? Why?\n3. `string name = \"  Ali  \"; name.Trim(); Console.WriteLine(name);` still prints the spaces. Why, and what is the fix?\n4. What does `Console.WriteLine(\"A-B-C\".Split(\"-\").Length);` print?\n5. Which is correct: `name.IsNullOrWhiteSpace()` or `string.IsNullOrWhiteSpace(name)`? Why?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `[Jahra]`\n2. `False`. `Contains` is case-sensitive: `F` and `f` are different.\n3. Strings are immutable. `Trim()` returns a new string, but nobody keeps it. Fix: `name = name.Trim();`\n4. `3`\n5. `string.IsNullOrWhiteSpace(name)`. It is a static method, called on the type `string`, and the text goes in as the argument.\n\n<\/details>\n"}, {"id": "1.22", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/22-nullable.md", "title": "Nullable types and the null operators (`?`, `??`, `?.`, `??=`)", "md": "# Chapter 1.22: Nullable types and the null operators (`?`, `??`, `?.`, `??=`)\n\n> Learned: Sat 24 Oct 2026 · Code: `lessons/phase-01/32-nullable`\n\n---\n\n## 🧸 LKG story\n\n**The empty box on the parcel form.** A KPOST parcel form has a box: \"Weight (kg): ___\". When the parcel is weighed, you write `12`. When it hasn't been weighed yet, the box stays **empty**. Empty is not `0`: a 0 kg parcel would be wrong. \"Not weighed yet\" is its own answer.\n\nIn C#, the empty box is **`null`**: no value at all.\n\nThe office has 3 rules for empty boxes:\n- **\"If the box is empty, use this instead\"** → `??`\n- **\"If the box is empty, don't even try\"** (you can't phone a sender who isn't there) → `?.`\n- **\"If the box is empty, fill it in. If it's already filled, don't touch it\"** → `??=`\n\n🎬 **Animation idea:** a row of boxes, some empty and some with a value. Pick an operator (`??`, `?.`, `??=`) and press Run. An empty box lights up and the backup value slides in; a full box keeps its value. Turn off the `?` in `?.` and the empty box explodes into a red `NullReferenceException`.\n\n---\n\n## 💻 Real explanation\n\n### 1. `int?`: a type that can be empty\n\nA normal `int` must **always** hold a number:\n\n```csharp\nint weight = null;   // ❌ error CS0037: Cannot convert null to 'int' because it is a non-nullable value type\n```\n\nAdd `?` to the type and it becomes a **nullable type**: \"an int, or null\".\n\n```csharp\nint? weight = null;\nConsole.WriteLine($\"[{weight}]\");\nConsole.WriteLine(weight.HasValue);\n\nweight = 12;\nConsole.WriteLine($\"[{weight}]\");\nConsole.WriteLine(weight.HasValue);\n```\n```\n[]\nFalse\n[12]\nTrue\n```\n\n- `null` inside `$\"...\"` prints **nothing** (an empty string). Dart prints the word `null`\n- `.HasValue` is a `bool`: `True` when there is a number\n- `string?` works the same way: a string that may be null. `Console.ReadLine()` returns a `string?`\n\n### 2. `??`: the backup value\n\n```csharp\nint? boxes = null;\nint total = boxes ?? 1;\nConsole.WriteLine($\"Boxes: {total}\");\n\nboxes = 4;\ntotal = boxes ?? 1;\nConsole.WriteLine($\"Boxes: {total}\");\n\nstring? driver = null;\nConsole.WriteLine($\"Driver: {driver ?? \"Not assigned\"}\");\n```\n```\nBoxes: 1\nBoxes: 4\nDriver: Not assigned\n```\n\n`a ?? b` means: use `a`, but if `a` is null, use `b`. Its real name is the **null-coalescing operator**, and `b` is the **default** (or **fallback**) value.\n\nYou can't put an `int?` straight into an `int`, because it might be empty:\n\n```csharp\nint total = boxes;        // ❌ error CS0266: Cannot implicitly convert type 'int?' to 'int'\nint total = boxes ?? 1;   // ✅ now it always gets a real number\n```\n\n### 3. `?.`: \"if it's null, don't even try\"\n\n```csharp\nstring? sender = null;\nConsole.WriteLine($\"[{sender?.ToUpper()}]\");\nConsole.WriteLine($\"[{sender?.ToUpper() ?? \"UNKNOWN\"}]\");\n\nsender = \"omar\";\nConsole.WriteLine($\"[{sender?.ToUpper()}]\");\n```\n```\n[]\n[UNKNOWN]\n[OMAR]\n```\n\n- `sender?.ToUpper()`: if `sender` is null, skip the method and give back `null`\n- without the `?`, `sender.ToUpper()` **crashes** with a **`NullReferenceException`**, the most common bug in C#. The editor warns you first with **CS8602: Dereference of a possibly null reference**\n- `?.` and `??` work well together: \"uppercase it if it exists, otherwise UNKNOWN\"\n- Real name: the **null-conditional operator**\n\n### 4. `??=`: \"fill it only if it's empty\"\n\n```csharp\nstring? area = null;\narea ??= \"Hawalli\";\narea ??= \"Jahra\";\nConsole.WriteLine(area);\n```\n```\nHawalli\n```\n\nThe second line fills the empty box. On the third line the box is already full, so `\"Jahra\"` is ignored. `area ??= \"Hawalli\";` is short for `if (area == null) { area = \"Hawalli\"; }`. Real name: the **null-coalescing assignment** operator.\n\n### `??` vs `??=`\n\n```csharp\nint? extra = null;\nint total = extra ?? 5;    // total = 5, extra is STILL null (it only reads)\nint total = extra ??= 5;   // total = 5, but extra is now 5 too (it writes)\n```\n\n`??` **reads** with a backup. `??=` **writes** into the box. Use `??` when you only need a value.\n\n---\n\n## 🎯 Dart comparison\n\nDart has the same null safety, with the same symbols:\n\n| Dart | C# |\n|---|---|\n| `int? weight = null;` | `int? weight = null;` |\n| `weight ?? 0` | `weight ?? 0` |\n| `user?.name` | `user?.Name` |\n| `area ??= 'Hawalli';` | `area ??= \"Hawalli\";` |\n| `weight != null` | `weight != null` or `weight.HasValue` |\n| prints `null` | prints nothing (empty string) |\n| prints `false` | prints `False` |\n\nOne difference: in Dart, using a nullable value the wrong way is a compile **error**. In C#, for strings and other reference types, it's a yellow **warning** (CS8600, CS8602), so the code still runs and can crash. Read the warnings!\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Predicted `[null]` for a null `int?` | Dart habit: Dart prints `null` | C# prints nothing: `[]` |\n| Wrote `false` / `Ture` | Dart prints small letters | C# prints `True` / `False` |\n| Predicted `1` and `4` instead of `Boxes: 1` | Predicted only the variable | Predict the **whole line** |\n| `branch = \"Main\";` instead of `branch ??= \"Main\";` | The output looked right because `branch` was null | Test with a value: `branch = \"Jahra\"` must stay `Jahra` |\n| Label `Driver:` on the phone line | Copy-paste slip | Read the label every time you copy a line |\n| Quiz: `int total = extra ??= 5;` | Mixed up `??` and `??=` | `??` reads, `??=` writes (it changed `extra` too) |\n\n✅ Wins: all 4 lines of the `?.` / `??=` example right, including \"`Jahra` is ignored\"; found the floor answer from the `boxes` example; tested both paths (null and not null); quiz 4.5/5.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| empty box | **null** | \"The weight is null until the parcel is scanned.\" |\n| a box that may be empty | **nullable type** (`int?`, `string?`) | \"Make `Weight` nullable, new parcels aren't weighed yet.\" |\n| \"use this instead\" | **null-coalescing operator** (`??`) | \"Use `??` to give it a default value.\" |\n| backup value | **default** / **fallback** value | \"The fallback is 'Not assigned'.\" |\n| \"don't even try\" | **null-conditional operator** (`?.`) | \"Use `?.` here or it throws when the sender is null.\" |\n| the crash | **`NullReferenceException`** | \"Production crashed with a NullReferenceException.\" |\n| the yellow warning | **CS8602**: dereference of a possibly null reference | \"Fix the CS8602 warnings before they become crashes.\" |\n| \"fill only if empty\" | **null-coalescing assignment** (`??=`) | \"`??=` sets the default only if it's still null.\" |\n| changes the variable | **mutates** / **side effect** | \"`??=` mutates the variable, `??` doesn't.\" |\n\n---\n\n## 📋 Summary\n\n| Code | Name | Means | Example → result |\n|---|---|---|---|\n| `int?` | nullable type | can be empty | `int? w = null;` |\n| `a ?? b` | null-coalescing | `a`, or `b` if `a` is null | `null ?? 1` → `1` |\n| `a?.M()` | null-conditional | call `M` only if `a` isn't null | `null?.ToUpper()` → `null` |\n| `a ??= b` | null-coalescing assignment | put `b` in `a` only if `a` is null | `area` is `\"Hawalli\"`, `area ??= \"Jahra\"` → stays `Hawalli` |\n\n---\n\n## 📝 Quiz\n\n1. Will `int age = null;` compile? If not, what's the fix?\n2. What does this print? `int? stock = null; Console.WriteLine($\"Stock: [{stock}]\");`\n3. What does `count` hold after `int? count = 7; count ??= 99;`?\n4. `string? city = null;` Which line can crash: A `city?.Trim() ?? \"none\"` or B `city.Trim()`? Why?\n5. Fill the blank so `total` is `5` when `extra` is null, without changing `extra`: `int total = extra ___ 5;`\n\n<details>\n<summary>Answers<\/summary>\n\n1. No, error CS0037. Fix: `int? age = null;`\n2. `Stock: []`\n3. `7`. `??=` doesn't touch a box that already has a value.\n4. B. `city` is null, so `.Trim()` throws a `NullReferenceException`. Line A uses `?.` (skip if null) and `??` (fallback).\n5. `??`. (`??=` would also set `extra` to 5.)\n\n<\/details>\n"}, {"id": "1.23", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/23-exceptions.md", "title": "Exceptions (`try`, `catch`, `finally`, `throw`)", "md": "# Chapter 1.23: Exceptions (`try`, `catch`, `finally`, `throw`)\n\n> Learned: Sat 24 Oct 2026 · Code: `lessons/phase-01/33-try-catch`\n\n---\n\n## 🧸 LKG story\n\n**The driver with a backup plan.** A driver tries to deliver a parcel, but the door is locked. A bad driver panics and **quits the whole route**. A good driver has a backup plan: \"If the door is locked, leave a note and go to the next house.\"\n\n- `try` = try to deliver\n- `catch` = if something goes wrong, do the backup plan\n- `finally` = whatever happens, **always** return the van keys at the end\n- `throw` = the driver **raises a hand**: \"I can't deliver this one, the address is wrong. STOP!\"\n\n🎬 **Animation idea:** a code block with a `try`, two `catch` blocks and a `finally`. Pick an input (a good number, `\"abc\"`, a bad index) and press Step. A cursor walks line by line; when an exception happens it **jumps** over the rest of the `try`, checks each `catch` from top to bottom, enters the first one that matches, then always visits `finally`.\n\n---\n\n## 💻 Real explanation\n\nAn **exception** is an error that happens while the program is **running** (at **runtime**), not when it compiles. If nobody catches it, the program **crashes**:\n\n```csharp\nint x = int.Parse(\"abc\");\n```\n```\nUnhandled exception. System.FormatException: The input string 'abc' was not in a correct format.\n```\n\n`int.TryParse` avoids this for numbers. But many things have no Try version (files, servers, databases). For those we use `try` / `catch`.\n\n### 1. `try` / `catch`\n\n```csharp\nConsole.WriteLine(\"Start\");\ntry\n{\n    int boxes = int.Parse(\"abc\");\n    Console.WriteLine($\"Boxes: {boxes}\");\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"That is not a number\");\n}\nConsole.WriteLine(\"End\");\n```\n```\nStart\nThat is not a number\nEnd\n```\n\n🔑 When an exception happens inside `try`, C# **jumps straight to `catch`**. The rest of the `try` is **skipped**, so `Boxes:` never prints. After the `catch`, the program carries on (`End`).\n\n### 2. Several `catch` blocks, `Exception ex` and `finally`\n\n```csharp\nint[] shelves = { 10, 20, 30 };\ntry\n{\n    Console.WriteLine(shelves[5]);\n    Console.WriteLine(\"Found it\");\n}\ncatch (FormatException)\n{\n    Console.WriteLine(\"Bad number\");\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"Problem: {ex.Message}\");\n}\nfinally\n{\n    Console.WriteLine(\"Shelf check done\");\n}\n```\n```\nProblem: Index was outside the bounds of the array.\nShelf check done\n```\n\n- There are many kinds of exception: `FormatException`, `IndexOutOfRangeException`, `NullReferenceException`, `DivideByZeroException`, ...\n- `Exception` is the **parent** of all of them, so `catch (Exception ex)` catches **any** exception\n- `ex` holds the details. `ex.Message` is the human sentence\n- C# checks the `catch` blocks **top to bottom** and runs only the **first** that matches. So: **specific first, `Exception` last**. The other order doesn't even compile:\n  `error CS0160: A previous catch clause already catches all exceptions of this or of a super type ('Exception')`\n- `finally` runs **always**, with or without an exception. Real apps close files and database connections there\n\n### 3. `throw`: raise your own exception\n\nC# thinks `-3` is a fine number. But a parcel can't weigh -3 kg. Only **you** know that rule, so you **throw**:\n\n```csharp\ntry\n{\n    Console.WriteLine(GetFee(2));\n    Console.WriteLine(GetFee(-3));\n    Console.WriteLine(GetFee(5));\n}\ncatch (ArgumentException ex)\n{\n    Console.WriteLine($\"Error: {ex.Message}\");\n}\n\nstatic double GetFee(double kg)\n{\n    if (kg <= 0)\n    {\n        throw new ArgumentException(\"Weight must be more than 0\");\n    }\n    return kg * 1.5;\n}\n```\n```\n3\nError: Weight must be more than 0\n```\n\n- `throw` stops the method right there (like `return`) and sends the problem up to the caller\n- `new ArgumentException(\"...\")` creates the exception. `ArgumentException` means \"the value you passed me is bad\"\n- `GetFee(5)` never runs: the jump to `catch` skipped it\n\n**Why not `return 0;`?** Because `0` looks like a **real** fee. The program carries on with 0 KD, nobody notices, and the company loses money: a **hidden bug**. `throw` makes the problem loud and stops it early. Team phrase: **fail fast**.\n\n### 4. `ex` vs `ex.Message`\n\n```csharp\nConsole.WriteLine($\"Error: {ex}\");          // type + message + stack trace\nConsole.WriteLine($\"Error: {ex.Message}\");  // only the message\n```\n```\nError: System.ArgumentException: Need at least 1 driver\n   at Program.<<Main>$>g__BoxesPerDriver|0_0(Int32 boxes, Int32 drivers) in ...\\Program.cs:line 87\n   at Program.<Main>$(String[] args) in ...\\Program.cs:line 65\nError: Need at least 1 driver\n```\n\nThe \"at ... line 87\" part is the **stack trace**: the list of methods the program was in, with line numbers (read it bottom to top). It's gold for developers, but never show it to users: it's ugly and it leaks your file paths. **Log the full exception, show the user only the message.**\n\n---\n\n## 🎯 Dart comparison\n\n| Dart | C# |\n|---|---|\n| `try { } on FormatException { }` | `try { } catch (FormatException) { }` |\n| `catch (e) { print(e); }` | `catch (Exception ex) { Console.WriteLine(ex.Message); }` |\n| `finally { }` | `finally { }` |\n| `throw ArgumentError('...');` | `throw new ArgumentException(\"...\");` (with `new`) |\n| `FormatException` from `int.parse` | `FormatException` from `int.Parse` |\n\nThe structure is the same. Dart uses `on Type`, C# uses `catch (Type)`.\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Guessed only `That is not a number` | Forgot the lines outside `try` | Predict **every** line: `Start`, ..., `End` |\n| Guessed `Weight must be more then 0` | Missed the `Error: ` part | Predict the whole line |\n| Typed `more then 0` | `then` (next) vs `than` (comparing) | `more than 0`. Users read error messages |\n| Printed `{ex}` → a stack trace on screen | `ex` is the whole object | `{ex.Message}`. Found it myself in test run 3 |\n| Named the result `totalBoxesAssigned` | It holds one driver's boxes, not the total | Names must say what's inside: `boxesEach` |\n| Quiz: \"`throw` is better than `return 0` because of the message\" | Missed the main reason | `0` looks like a real answer → hidden bug. **Fail fast** |\n\n✅ Wins: understood \"the rest of the `try` is skipped\" straight away; explained why the 2nd `catch` ran; `drivers <= 0` blocks negative numbers too; tested all 3 paths; quiz 4.5/5.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| a problem while running | **exception** (a **runtime** error) | \"`int.Parse` throws a `FormatException` on bad input.\" |\n| the backup plan | **catch** / **handle** an exception | \"We handle that exception, so the app doesn't crash.\" |\n| the crash | **unhandled exception** | \"It crashed with an unhandled exception.\" |\n| always return the keys | **`finally`** block | \"Put the cleanup in a `finally` block.\" |\n| the parent of all problems | **base class `Exception`** | \"Catch the specific exception first, `Exception` last.\" |\n| raise a hand | **throw** an exception | \"The method throws an `ArgumentException` on invalid input.\" |\n| check the input first | **validate** the input | \"Validate the weight and fail fast.\" |\n| stop early, loudly | **fail fast** | \"Don't return 0, fail fast so the bug can't hide.\" |\n| the \"at ... line\" list | **stack trace** | \"Log the stack trace, show the user only the message.\" |\n\n---\n\n## 📋 Summary\n\n| Keyword | Runs when | Remember |\n|---|---|---|\n| `try` | always (until an exception) | the rest of `try` is skipped after an exception |\n| `catch (SomeException)` | the exception matches | checked top to bottom; specific first, `Exception` last (CS0160) |\n| `catch (Exception ex)` | any exception | `ex.Message` = the human sentence |\n| `finally` | always | cleanup |\n| `throw new ArgumentException(\"...\")` | you decide the input is bad | stops the method like `return` |\n\n---\n\n## 📝 Quiz\n\n1. What's the output?\n   ```csharp\n   try { Console.WriteLine(\"A\"); int n = int.Parse(\"x\"); Console.WriteLine(\"B\"); }\n   catch (FormatException) { Console.WriteLine(\"C\"); }\n   Console.WriteLine(\"D\");\n   ```\n2. What's wrong with putting `catch (Exception ex)` **before** `catch (FormatException)`?\n3. No exception happens. Does `finally` run?\n4. A method gets `kg = -5`. Why is `throw new ArgumentException(...)` better than `return 0;`?\n5. Which property gives only the friendly text, without the stack trace: `ex.___`?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `A`, `C`, `D` (each on its own line). `B` is skipped.\n2. `Exception` catches everything, so the `FormatException` block could never run. C# refuses to compile it: CS0160.\n3. Yes, `finally` always runs.\n4. `0` looks like a real fee, so the bug hides and the program carries on with a wrong value. `throw` makes the problem loud and stops it early (fail fast).\n5. `ex.Message`\n\n<\/details>\n"}, {"id": "1.24", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/24-datetime.md", "title": "`DateTime` and `TimeSpan`", "md": "# Chapter 1.24: `DateTime` and `TimeSpan`\n\n> Learned: Sat 24 Oct 2026 · Code: `lessons/phase-01/34-datetime`\n\n---\n\n## 🧸 LKG story\n\n**The date stamp and the calendar.** Every parcel gets a **date stamp** when it's sent: \"24 Oct 2026, 2:30 PM\". KPOST promises \"delivered in 3 days\", so someone counts 3 days forward on the **calendar**. When the parcel arrives, someone counts the days **between** the two stamps.\n\n`DateTime` is the stamp + the calendar. `TimeSpan` is the \"how long between\" answer.\n\n🎬 **Animation idea:** a calendar page with a stamp on 24 Oct 2026. A slider says \"AddDays(n)\". As you slide, a second stamp moves forward day by day, the weekday name changes, and a ruler between the two stamps shows the `TimeSpan` (`.Days`). A format box (`dd MMM yyyy HH:mm`) shows how the same date looks with different format letters.\n\n---\n\n## 💻 Real explanation\n\n```csharp\nDateTime sent = new DateTime(2026, 10, 24, 14, 30, 0);\nConsole.WriteLine(sent.ToString(\"dd MMM yyyy HH:mm\"));\n\nDateTime due = sent.AddDays(3);\nConsole.WriteLine(due.ToString(\"dd MMM yyyy\"));\nConsole.WriteLine(due.DayOfWeek);\n\nTimeSpan wait = due - sent;\nConsole.WriteLine(wait.Days);\nConsole.WriteLine(DateTime.Now);\n```\n```\n24 Oct 2026 14:30\n27 Oct 2026\nTuesday\n3\n10/24/2026 5:34:04 PM\n```\n\n| Code | Meaning |\n|---|---|\n| `new DateTime(2026, 10, 24, 14, 30, 0)` | a fixed date: year, month, day, hour, minute, second |\n| `DateTime.Now` | the date and time on this PC right now (a property, no `()`) |\n| `.AddDays(3)` | a **new** date, 3 days later. `DateTime` is **immutable**, like a string: keep it with `due = due.AddDays(3);` |\n| `.ToString(\"dd MMM yyyy\")` | turn the date into text with a **format string** |\n| `.DayOfWeek` | `Monday`, `Tuesday`, ... |\n| `due - sent` | the gap between two dates: a **`TimeSpan`** (not a string, not an int) |\n| `wait.Days` | the number of whole days in the gap (just the number, no word \"days\") |\n\n### Format letters\n\n| Letter | Means | 24 Oct 2026, 14:30 → |\n|---|---|---|\n| `dd` | day | `24` |\n| `MM` | month as a number | `10` |\n| `MMM` | month as a short name | `Oct` |\n| `yyyy` | year | `2026` |\n| `HH` | hour (24-hour clock) | `14` |\n| `mm` | **minutes** (small m!) | `30` |\n\n⚠️ `MM` = month, `mm` = minutes. Mixing them up is a classic bug.\n\n**Why a format string?** Without one, the date uses the PC's **culture** (region settings). This PC is `en-US`, so `DateTime.Now` printed month first: `10/24/2026`. In Kuwait people read that as day/month and get confused. `\"dd MMM yyyy\"` looks the same on every PC.\n\n**The year rolls over by itself:**\n\n```csharp\nDateTime d = new DateTime(2026, 12, 31);\nConsole.WriteLine(d.AddDays(1).ToString(\"dd MMM yyyy\"));\n```\n```\n01 Jan 2027\n```\n\n---\n\n## 🎯 Dart comparison\n\n| Dart | C# |\n|---|---|\n| `DateTime.now()` | `DateTime.Now` (property, no `()`) |\n| `DateTime(2026, 10, 24)` | `new DateTime(2026, 10, 24)` |\n| `date.add(Duration(days: 3))` | `date.AddDays(3)` |\n| `Duration` | `TimeSpan` |\n| `due.difference(sent).inDays` | `(due - sent).Days` |\n| `DateFormat('dd MMM yyyy').format(d)` (the `intl` package) | `d.ToString(\"dd MMM yyyy\")` (built in) |\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| Guessed `3 days` for `wait.Days` | Thought it adds the word | `.Days` is just the number: `3` |\n| Quiz: said `due - sent` gives a `string` | Didn't know the type name yet | It's a **`TimeSpan`**, like Dart's `Duration` |\n| Quiz: \"immutable\" with no fix | Short answer | `sent.AddDays(2);` alone does nothing. Fix: `sent = sent.AddDays(2);` |\n\n✅ Wins: all 5 lines of the example right; `01 Jan 2027` year rollover right; `MM` vs `mm` right; quiz 4/5.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| the date stamp | **timestamp** | \"Save a timestamp when the shipment is created.\" |\n| how long between | **`TimeSpan`** | \"Subtract the dates to get a TimeSpan.\" |\n| the letters `dd MMM yyyy` | **format string** | \"Use a format string so it looks the same on every PC.\" |\n| region settings | **culture** (`en-US`, `ar-KW`) | \"The server culture is en-US, so the date printed month first.\" |\n| a new date, the old one stays | **immutable** | \"`DateTime` is immutable, assign the result of `AddDays`.\" |\n\n---\n\n## 📋 Summary\n\n| I want... | Write |\n|---|---|\n| now | `DateTime.Now` |\n| a fixed date | `new DateTime(2026, 10, 24)` |\n| 3 days later | `date.AddDays(3)` (keep it with `=`) |\n| nice text | `date.ToString(\"dd MMM yyyy HH:mm\")` |\n| the weekday | `date.DayOfWeek` |\n| days between | `(due - sent).Days` |\n\n---\n\n## 📝 Quiz\n\n1. In a format string, what's the difference between `MM` and `mm`?\n2. Does `sent` change after `sent.AddDays(2);`? Why?\n3. What does `new DateTime(2026, 12, 31).AddDays(1).ToString(\"dd MMM yyyy\")` give?\n4. `due - sent` gives you what type?\n5. How do you get the current date and time?\n\n<details>\n<summary>Answers<\/summary>\n\n1. `MM` = month (`10`), `mm` = minutes (`30`).\n2. No. `DateTime` is immutable: `AddDays` returns a new date that nobody keeps. Fix: `sent = sent.AddDays(2);`\n3. `01 Jan 2027`\n4. `TimeSpan`\n5. `DateTime.Now`\n\n<\/details>\n"}, {"id": "1.25", "phase": 1, "phaseName": "C# Bricks", "file": "phase-01/25-shipment-tracker.md", "title": "Project 03 Shipment Tracker (parallel lists, `IndexOf`, and a method that throws)", "md": "# Chapter 1.25: Project 03 Shipment Tracker (parallel lists, `IndexOf`, and a method that throws)\n\n> Built: Sat 24 Oct 2026 · Code: `projects/03-shipment-tracker` · The last project of Phase 1\n\n---\n\n## 🧸 LKG story\n\n**Four notebooks on one desk.** The courier office keeps 4 notebooks: tracking numbers, receiver names, statuses and dates. One shipment is written on **the same line number** in all 4 notebooks. To find Sara's parcel, you look up her tracking number in the first notebook, see it's on line 1, then read line 1 in the other 3 notebooks.\n\nIt works, but it's fragile: if someone forgets to write in one notebook, every line after it is wrong. (Phase 2 fixes this with a **class**: one card per shipment with all 4 facts on it.)\n\n🎬 **Animation idea:** 4 notebooks side by side. Press \"Add\" and a new row appears in all 4 at the same index, with an auto-generated `KP100x` number. Type a tracking number in the search box: a finger runs down the first notebook (`IndexOf`), stops at the index (or shows `-1`), and the same row lights up in the other 3. A switch changes the check from `index == -1` to `index <= 0`, so you can watch the first shipment wrongly say \"not found\".\n\n---\n\n## 💻 What the app does\n\n```\n=== KPOST Shipment Tracker ===\n 1) Add 2) List 3) Search 4) Mark delivered q) Quit\n\nChoose: 1\nReceiver name: Omar\nAdded KP1001\n 1) Add 2) List 3) Search 4) Mark delivered q) Quit\n\nChoose: 4\nTracking number: kp1001\nKP1001 marked as delivered\n 1) Add 2) List 3) Search 4) Mark delivered q) Quit\n\nChoose: 2\nKP1001 | Omar | Delivered | 24 Oct 2026 20:52\n 1) Add 2) List 3) Search 4) Mark delivered q) Quit\n\nChoose: 4\nTracking number: kp5555\nError: Shipment KP5555 not found\n```\n\n93 lines, using every Phase 1 tool: a `while` loop, `switch`, `List<T>`, a `for` loop with an index, a method, string helpers, `??`, `DateTime`, and `throw` + `try` / `catch`.\n\n### Step 1: 4 lists and the menu\n\n```csharp\nList<string> numbers = new List<string>();\nList<string> receivers = ne
