w List<string>();\nList<string> statuses = new List<string>();\nList<DateTime> createdTimes = new List<DateTime>();\n```\n\n- `List<string> numbers;` only **declares** the name. With no `= new List<string>()` there is no list behind it, and the first `Add` fails with **CS0165: Use of unassigned local variable**. The yellow warning **CS0168: declared but never used** was the early hint\n- The pattern: `TYPE name = new TYPE();` (the type is written twice)\n\nThe menu choice is cleaned in one line:\n\n```csharp\nstring choice = (Console.ReadLine() ?? \"\").Trim().ToLower();\n```\n\n`Console.ReadLine()` returns a `string?`, `?? \"\"` turns null into an empty string, then `Trim` and `ToLower`, so `Q` works like `q`. After `?? \"\"` it can never be null, so the type is `string`, not `string?`.\n\n### Step 2: add, with an auto-generated ID\n\n```csharp\nstring number = $\"KP{1001 + numbers.Count}\";\n```\n\n| Shipments already saved | `numbers.Count` | New number |\n|---|---|---|\n| none | 0 | KP1001 |\n| 1 | 1 | KP1002 |\n\nThen one `Add` per list, so the new shipment gets the same index everywhere. The time comes from `DateTime.Now`.\n\n### Step 3: list, with `for` (not `foreach`)\n\n```csharp\nfor (int i = 0; i < numbers.Count; i++)\n{\n    Console.WriteLine($\"{numbers[i]} | {receivers[i]} | {statuses[i]} | {createdTimes[i].ToString(\"dd MMM yyyy HH:mm\")}\");\n}\n```\n\nWe need the **same index** in all 4 lists, so we need `i`, and `foreach` has no index. Rule: **need the index → `for`**.\n\nMy first version was `for (int i = numbers.Count; i <= 2; i++)` with `[0]` inside. A trace showed 3 problems: start at **0**, stop at **`numbers.Count`** (not a fixed `2`), and use **`[i]`** (not `[0]`).\n\n### Step 4: search with `IndexOf`\n\n```csharp\nList<string> fruits = new List<string>();\nfruits.Add(\"apple\");\nfruits.Add(\"mango\");\nConsole.WriteLine(fruits.IndexOf(\"mango\"));   // 1\nConsole.WriteLine(fruits.IndexOf(\"grape\"));   // -1\n```\n\n`IndexOf` gives the index, or **`-1`** when it's not there (`-1` can never be a real index). It's case-sensitive, so the input is cleaned with `Trim().ToUpper()`, and `kp1002` finds `KP1002`.\n\n**The off-by-one bug:** I first wrote `if (index <= 0)` for \"not found\". The test with KP1002 passed, but a test with **KP1001** (index 0) said \"not found\". Index 0 is a valid index! Fix: `index < 0` (or, clearer, `index == -1`). Always test the **first** and the **last** item.\n\n### Step 5: mark delivered, with a method that throws\n\n\"Mark delivered\" needs the same search again, so the search moved into a method:\n\n```csharp\nstatic int FindIndex(List<string> list, string number)\n{\n    int found = list.IndexOf(number);\n    if (found == -1)\n    {\n        throw new ArgumentException($\"Shipment {number} not found\");\n    }\n    return found;\n}\n```\n\n- A `static` method can't see the lists at the top of the file, so the list is **passed in as a parameter**\n- The `switch` is wrapped in `try` / `catch (ArgumentException ex)`, so a wrong number prints `Error: ...` and the menu carries on instead of crashing\n- All the `case` blocks share **one scope**, so case 4 uses new names (`deliverNumber`, `deliverIndex`). Reusing `index` from case 3 would be **CS0128**\n\n---\n\n## 🎯 Dart comparison\n\n| Dart | C# |\n|---|---|\n| `List<String> numbers = [];` | `List<string> numbers = new List<string>();` |\n| `numbers.indexOf('KP1001')` → `-1` if missing | `numbers.IndexOf(\"KP1001\")` → `-1` if missing |\n| `stdin.readLineSync() ?? ''` | `Console.ReadLine() ?? \"\"` |\n| `for (var i = 0; i < list.length; i++)` | `for (int i = 0; i < list.Count; i++)` |\n\n---\n\n## 🐞 Mistakes I actually made\n\n| Mistake | Why | Fix |\n|---|---|---|\n| `List<string> numbers;` with no `new` | Declared the name only | `= new List<string>();` (warning CS0168 was the hint) |\n| `new {\"\"}` | Didn't know what goes after `new` | The type again + `()`: `new List<string>()` |\n| `string? choice` after `?? \"\"` | Copied the `?` from `ReadLine` | It can't be null any more, so `string` |\n| Forgot to print `Added KP1001` | Missed one task out of four | Compare the output with the expected output line by line |\n| `for (int i = numbers.Count; i <= 2; i++)` + `[0]` | Start, stop and row were all fixed values | `i = 0`, `i < numbers.Count`, `[i]` |\n| `if (index <= 0)` | Off-by-one: 0 is a real index | `index == -1` (or `< 0`) |\n| Committed the README but not `Program.cs` | Didn't check the \"files changed\" number | Read the commit summary: is it the number I expected? |\n\n✅ Wins: tested on my own and fixed the out-of-range crash; found the `<= 0` bug with one test; `FindIndex` + `try` / `catch` worked first time; the app never crashes on a wrong number.\n\n---\n\n## 🏢 Team words\n\n| Easy word | Real term | Team sentence |\n|---|---|---|\n| 4 notebooks, same line | **parallel lists** (or arrays) | \"Parallel lists are fragile, let's make a `Shipment` class.\" |\n| KP1001, KP1002, ... | **auto-generated ID** | \"The tracking number is auto-generated from the count.\" |\n| name only, no list yet | **declared but not initialized** | \"You declared it but never initialized it, add `new List<string>()`.\" |\n| `-1` = not there | **sentinel value** | \"`IndexOf` returns the sentinel -1 when the item isn't found.\" |\n| wrong by one at the edge | **off-by-one error** | \"Classic off-by-one, index 0 is valid.\" |\n| the answer I want to see | **expected output** vs **actual output** | \"The actual output is missing the 'Added' line.\" |\n| test the first and last | **edge cases** / **boundary values** | \"Test the edge cases: the first and the last shipment.\" |\n\n---\n\n## 📋 Summary\n\n| Need | Tool |\n|---|---|\n| store many shipments | 4 `List<T>`s, one shipment = one index |\n| a new tracking number | `$\"KP{1001 + numbers.Count}\"` |\n| print every row from all 4 lists | `for` with `i` |\n| find a tracking number | `IndexOf` → index or `-1` |\n| the same search in two places | a method (`FindIndex`) |\n| a wrong number shouldn't crash the app | the method throws, the loop catches |\n\n---\n\n## 📝 Quiz\n\n1. Why does the List menu use `for` instead of `foreach`?\n2. What does `IndexOf` return when the item isn't in the list?\n3. Why was `if (index <= 0)` a bug? Which test found it?\n4. `List<string> numbers;` then `numbers.Add(\"KP1001\");`. What's wrong?\n5. Why are 4 parallel lists fragile?\n\n<details>\n<summary>Answers<\/summary>\n\n1. We need the same index `i` in all 4 lists, and `foreach` has no index.\n2. `-1`\n3. Index 0 is a real index (the first shipment), so the first shipment was reported \"not found\". Searching for KP1001 found it.\n4. The list was only declared, never created. It needs `= new List<string>();` (otherwise error CS0165).\n5. One shipment is spread over 4 lists. If one `Add` is forgotten or one list is sorted, the indexes no longer line up and the data gets mixed up. A class keeps all the facts of one shipment together.\n\n<\/details>\n"}];

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hashFor = (id) => "ch-" + id.replace(".", "-");

/* ---------------- navigation ---------------- */
function renderToc(activeId) {
  const byPhase = groupByPhase();
  let html = '<a class="home-link" href="#home"' + (activeId ? "" : ' aria-current="page"') + ">Home: my progress</a>";
  for (const [phase, list] of byPhase) {
    html += "<h3>Phase " + phase + ": " + esc(list[0].phaseName) + "</h3>";
    for (const ch of list) {
      html += '<a href="#' + hashFor(ch.id) + '"' + (ch.id === activeId ? ' aria-current="page"' : "") +
        '><span class="num">' + ch.id + "</span><span>" + esc(ch.title) + "</span></a>";
    }
  }
  $("#toc").innerHTML = html;
}

function groupByPhase() {
  const map = new Map();
  for (const ch of CHAPTERS) {
    if (!map.has(ch.phase)) map.set(ch.phase, []);
    map.get(ch.phase).push(ch);
  }
  return map;
}

function route() {
  const h = location.hash.slice(1);
  const ch = h.startsWith("ch-") ? CHAPTERS.find((c) => hashFor(c.id) === h) : null;
  if (ch) renderChapter(ch); else renderHome();
  closeMenu();
  window.scrollTo(0, 0);
  try { localStorage.setItem("lastView", h); } catch (e) {}
}

const menuBtn = $("#menuBtn");
function closeMenu() { $("#toc").classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.addEventListener("click", () => {
  const open = $("#toc").classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
});

function quizChart(quizzes) {
  const W = 640, H = 240, left = 34, right = 10, top = 14, bottom = 58;
  const plotW = W - left - right, plotH = H - top - bottom;
  const slot = plotW / quizzes.length, barW = Math.min(36, slot * 0.6);
  const y = (v) => top + plotH - (v / 5) * plotH;
  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Quiz scores by day">';
  for (let t = 0; t <= 5; t++) {
    svg += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (left - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono, monospace">' + t + "</text>";
  }
  let prevDay = null;
  quizzes.forEach((q, i) => {
    const cx = left + slot * i + slot / 2;
    const color = q.score / q.max >= 0.7 ? "var(--ok)" : q.score / q.max >= 0.5 ? "var(--warn)" : "var(--bad)";
    svg += '<rect x="' + (cx - barW / 2) + '" y="' + y(q.score) + '" width="' + barW + '" height="' + (y(0) - y(q.score)) + '" rx="4" fill="' + color + '"><title>' + esc(q.name) + ": " + q.score + "/5</title></rect>" +
      '<text x="' + cx + '" y="' + (y(q.score) - 5) + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="JetBrains Mono, monospace">' + q.score + "</text>";
    if (q.day !== prevDay) {
      svg += '<text x="' + cx + '" y="' + (H - bottom + 18) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">Day ' + q.day + "</text>";
      prevDay = q.day;
    }
    const short = q.name.replace(/ quiz$/i, "");
    svg += '<text x="' + cx + '" y="' + (H - bottom + 34) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Bricolage Grotesque, sans-serif">' + esc(short.length > 14 ? short.slice(0, 13) + "…" : short) + "</text>";
  });
  return svg + "</svg>";
}

function lapCounter(stage) {
  let start, op, end, inc, i, phase, laps, checks, out, done;
  stage.innerHTML =
    '<div class="control"><label for="lc-s">Start</label><input id="lc-s" type="range" min="0" max="5" value="1"><output></output></div>' +
    '<div class="control"><label for="lc-e">End</label><input id="lc-e" type="range" min="1" max="8" value="5"><output></output>' +
    '<label class="check"><input id="lc-o" type="checkbox" checked> use <b>&lt;=</b> (off: <b>&lt;</b>)</label></div>' +
    '<div class="control"><label for="lc-k">Step</label><input id="lc-k" type="range" min="1" max="3" value="1"><output></output></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next step</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const s = $("#lc-s", stage), e = $("#lc-e", stage), o = $("#lc-o", stage), k = $("#lc-k", stage);
  const code = $(".codebox", stage), track = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  const pass = () => (op === "<=" ? i <= end : i < end);
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    code.innerHTML =
      "for (" + L("init", "int i = " + start) + "; " + L("check", "i " + op.replace("<", "&lt;") + " " + end) + "; " +
      L("step", inc === 1 ? "i++" : "i += " + inc) + ")\n{\n" + L("body", '    Console.WriteLine($"Lap {i}");') + "\n}";
  }
  function drawTrack() {
    track.innerHTML = "<div><small>Laps</small><span>" + ("🏃".repeat(laps) || "<small>none yet</small>") + "</span></div>" +
      "<div><small>i</small><span><small>" + (phase === "init" ? "–" : i) + "</small></span></div>" +
      "<div><small>Checks</small><span><small>" + checks + "</small></span></div>";
  }
  function reset() {
    start = +s.value; end = +e.value; inc = +k.value; op = o.checked ? "<=" : "<";
    s.nextElementSibling.textContent = start; e.nextElementSibling.textContent = end; k.nextElementSibling.textContent = inc;
    phase = "init"; laps = 0; checks = 0; out = []; done = false;
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode(); drawTrack();
    say("", "Press Next step. Watch the order: initializer, condition, body, iterator.");
  }
  function step() {
    if (done) return;
    if (phase === "init") {
      i = start; phase = "check"; drawCode("init");
      say("", "① Initializer: i = " + i + ". This runs only once.");
    } else if (phase === "check") {
      checks++; drawCode("check");
      if (pass()) { phase = "body"; say("good", "② Condition: " + i + " " + op + " " + end + " is true, so the body runs."); }
      else {
        done = true;
        say("warn", "② Condition: " + i + " " + op + " " + end + " is false, so the loop exits. " + laps + " lap" + (laps === 1 ? "" : "s") + ", " + checks + " checks: always one check more than laps." +
          (op === "<" ? " Tick <= to include " + end + " (off-by-one)." : ""));
      }
    } else if (phase === "body") {
      laps++; out.push("Lap " + i); phase = "step"; drawCode("body");
      say("good", "Body: prints Lap " + i + ". The body uses i BEFORE the iterator changes it.");
    } else {
      i += inc; phase = "check"; drawCode("step");
      say("", "③ Iterator: i is now " + i + ". Back to the condition.");
    }
    drawTrack();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 100) step(); }
    if (a === "reset") reset();
  });
  [s, e, k].forEach((x) => x.addEventListener("input", reset));
  o.addEventListener("change", reset);
  reset();
}

function piggyBank(stage) {
  let inside, plusOne, i, total, out, done, coins;
  stage.innerHTML =
    '<div class="control"><label class="check"><input id="pb-in" type="checkbox"> move <b>int total = 0;</b> inside the loop</label>' +
    '<label class="check"><input id="pb-one" type="checkbox"> <b>total += 1</b> instead of <b>+= i</b></label></div>' +
    '<div class="codebox"></div><div class="cookies"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next iteration</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const inBox = $("#pb-in", stage), oneBox = $("#pb-one", stage);
  const code = $(".codebox", stage), bank = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function drawCode(hl) {
    const L = (key, t) => '<span class="' + (hl === key ? "hit" : "") + '">' + t + "</span>";
    const add = plusOne ? "total += 1;" : "total += i;";
    code.innerHTML = [
      inside ? null : L("decl", "int total = 0;"),
      "for (int i = 1; i &lt;= 4; i++)",
      "{",
      inside ? L("decl", "    int total = 0;") : null,
      L("body", "    " + add),
      "}",
      L("print", 'Console.WriteLine($"Total: {total}");'),
    ].filter((x) => x !== null).join("\n");
  }
  function drawBank() {
    bank.innerHTML = "<div><small>Coins in</small><span>" + (coins.map((c) => "🪙" + c).join(" ") || "<small>empty</small>") + "</span></div>" +
      "<div><small>Bank</small><span>🐷 <small>total = " + total + "</small></span></div>";
  }
  function reset() {
    inside = inBox.checked; plusOne = oneBox.checked;
    i = 1; total = 0; out = []; done = false; coins = [];
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode("decl"); drawBank();
    say(inside ? "warn" : "", inside
      ? "The piggy bank is now born INSIDE the loop. (Real C# won't even build this. Step through to see why.)"
      : "The piggy bank (accumulator) is ready BEFORE the loop. Press Next iteration.");
  }
  function step() {
    if (done) return;
    if (i <= 4) {
      if (inside) { total = 0; coins = []; }
      const coin = plusOne ? 1 : i;
      coins.push(coin); total += coin;
      drawCode("body");
      say(inside ? "warn" : "good", inside
        ? "i = " + i + ": a NEW empty piggy bank, then +" + coin + ", so total = " + total + ". It resets every iteration and can never grow."
        : "i = " + i + ": old total " + (total - coin) + " + " + coin + " = " + total + "." + (plusOne ? " Adding 1 only counts the iterations." : ""));
      i++;
    } else {
      done = true; drawCode("print");
      if (inside) {
        term.innerHTML = '<span class="bad">error CS0103: The name \'total\' does not exist in the current context</span>';
        say("bad", "total died at the } of the loop, so the print line can't see it. Two reasons, one rule: declare the accumulator BEFORE the loop.");
      } else {
        out.push("Total: " + total);
        term.textContent = out.join("\n");
        say(plusOne ? "warn" : "good", plusOne
          ? "Total: 4. With += 1 the bank counted the laps instead of summing 1 + 2 + 3 + 4. Use += i."
          : "Total: 10. Declared before, updated inside, printed after.");
      }
    }
    drawBank();
  }
  stage.querySelector(".btn-row").addEventListener("click", (ev) => {
    const a = ev.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 20) step(); }
    if (a === "reset") reset();
  });
  inBox.addEventListener("change", reset);
  oneBox.addEventListener("change", reset);
  reset();
}

function shapeSorter(stage) {
  const values = [
    { code: "3", type: "int" }, { code: "2.5", type: "double" }, { code: "1.350m", type: "decimal" },
    { code: "'B'", type: "char" }, { code: '"Hi"', type: "string" }, { code: "true", type: "bool" },
  ];
  const boxes = ["int", "double", "decimal", "bool", "char", "string"];
  const cast = (from, to) => "error CS0266: Cannot implicitly convert type '" + from + "' to '" + to + "'. An explicit conversion exists (are you missing a cast?)";
  const nope = (from, to) => "error CS0029: Cannot implicitly convert type '" + from + "' to '" + to + "'";
  function judge(v, box) {
    if (v.type === box) return ["good", "Fits! A " + box + " box holds exactly this."];
    const t = v.type;
    if (t === "int" && (box === "double" || box === "decimal")) return ["good", "Fits automatically: int → " + box + " is a safe pour (implicit conversion), nothing is lost."];
    if (t === "int" && box === "char") return ["bad", cast("int", "char")];
    if (t === "double" && box === "decimal") return ["bad", "error CS0664: Literal of type double cannot be implicitly converted to type 'decimal'; use an 'M' suffix. Write 2.5m."];
    if (t === "double" && (box === "int" || box === "char")) return ["bad", cast("double", box) + " The decimal part would be lost, so C# wants you to decide."];
    if (t === "decimal" && (box === "int" || box === "double" || box === "char")) return ["bad", cast("decimal", box)];
    if (t === "char" && (box === "int" || box === "double" || box === "decimal")) return ["warn", "Surprise: it compiles, but the box gets 66, the character's number code. Real code almost never wants this."];
    return ["bad", nope(t, box)];
  }
  let picked = values[0];
  stage.innerHTML =
    '<div class="control">1. Pick a value:</div><div class="pick" data-p="v">' +
    values.map((v, i) => '<button class="btn" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + esc(v.code) + "</button>").join("") + "</div>" +
    '<div class="control">2. Drop it into a box:</div><div class="pick" data-p="b">' +
    boxes.map((b) => '<button class="btn" data-b="' + b + '">' + b + "</button>").join("") + "</div>" +
    '<div class="codebox"></div><div class="verdict">Pick a value, then a box.</div>';
  const verdict = $(".verdict", stage), code = $(".codebox", stage);
  const vRow = $('[data-p="v"]', stage), bRow = $('[data-p="b"]', stage);
  const showCode = (box) => { code.textContent = (box || "____") + " x = " + picked.code + ";"; };
  vRow.addEventListener("click", (e) => {
    const i = e.target.dataset.i;
    if (i === undefined) return;
    picked = values[+i];
    vRow.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b === e.target)));
    showCode();
    verdict.className = "verdict";
    verdict.textContent = "Now pick a box for " + picked.code + ".";
  });
  bRow.addEventListener("click", (e) => {
    const box = e.target.dataset.b;
    if (!box) return;
    const [kind, msg] = judge(picked, box);
    showCode(box);
    verdict.className = "verdict " + kind;
    verdict.textContent = (kind === "good" ? "✅ " : kind === "warn" ? "⚠️ " : "❌ ") + msg;
    if (kind === "bad") { verdict.classList.remove("shake"); void verdict.offsetWidth; verdict.classList.add("shake"); }
  });
  showCode();
}

  const input = $("#tt-in", stage), cut = $("#tt-cut", stage);

  function parse(s) {
    if (!/^\s*[+-]?\d+\s*$/.test(s)) return { error: "System.FormatException: The input string '" + s + "' was not in a correct format." };
    const n = BigInt(s.trim());
    if (n > 2147483647n || n < -2147483648n) return { error: "System.OverflowException: Value was either too large or too small for an Int32." };

  const lightOut = ["Stop", "Slow down", "Go", "Drive carefully"];

function plateLoop(stage) {
  let start = 3, stray = false, bites, round, out, done, inBlock;
  stage.innerHTML =
    '<div class="control"><label for="pl-b">Start bites</label><input id="pl-b" type="range" min="0" max="5" value="3"><output></output>' +

    '<div class="term"></div><div class="verdict"></div>';
  const b = $("#pl-b", stage), s = $("#pl-s", stage), code = $(".codebox", stage), plate = $(".cookies", stage);
  const term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function drawCode(hl) {
    const L = (k, t) => '<span class="' + (hl === k ? "hit" : "") + '">' + t + "</span>";
    code.innerHTML = [
      "int bites = " + start + ";",
      L("check", "while (bites > 0)" + (stray ? " ;" : "")),
      "{",
      L("body", '    Console.WriteLine($"Eating... {bites} bites left");'),
      L("body", "    bites--;"),
      "}",
      L("after", 'Console.WriteLine("Plate empty! Go play");'),
    ].join("\n");
  }
  function drawPlate() {
    plate.innerHTML = "<div><small>Plate</small><span>" + ("🍪".repeat(Math.max(bites, 0)) || "<small>empty</small>") + "</span></div>" +
      "<div><small>Round</small><span><small>" + round + "</small></span></div>";
  }
  function reset() {
    start = +b.value; stray = s.checked;
    bites = start; round = 0; out = []; done = false; inBlock = false;
    b.nextElementSibling.textContent = start;
    term.innerHTML = '<span class="dim">(output appears here)</span>';
    drawCode(); drawPlate();
    say("", stray ? "The ; ends the while early. The { } block is no longer the loop body. Press Next step." : "Press Next step to check the condition.");
  }
  function step() {
    if (done) return;
    if (inBlock) {
      out.push("Eating... " + bites + " bites left"); bites--;
      out.push("Plate empty! Go play"); done = true; drawCode("after");
      say("warn", "The loop body was the empty ;, so the { } block ran once on its own (and bites even went to " + bites + "). Then the next line ran.");
    } else if (bites > 0) {
      round++;
      if (stray) {
        drawCode("check");
        say("bad", "Round " + round + ": " + bites + " > 0 is true. The body is the empty ;, so nothing happens and bites stays " + bites + ". The condition can never become false: infinite loop.");
        if (round >= 8) { done = true; say("bad", "💥 The app hangs: round " + round + " and counting, bites is still " + bites + ". In a real terminal you press Ctrl+C. Fix: delete the ;"); }
      } else {
        out.push("Eating... " + bites + " bites left"); bites--;
        drawCode("body");
        say("good", "Round " + round + ": " + (bites + 1) + " > 0 is true, so the body runs. bites is now " + bites + ".");
      }
    } else {
      drawCode("check");
      if (stray) { inBlock = true; say("", "Check: " + bites + " > 0 is false, so the (empty) loop ends. Next: the { } block that was cut off from the loop."); }
      else {
        out.push("Plate empty! Go play"); done = true; drawCode("after");
        say(round === 0 ? "warn" : "good", "Check: 0 > 0 is false, so C# jumps past the }. " + (round === 0 ? "Zero iterations: the body never ran." : "The body ran " + round + " times, and \"Eating... 0\" never printed."));
      }
    }
    drawPlate();
    term.textContent = out.join("\n") || "(nothing printed yet)";
  }
  stage.querySelector(".btn-row").addEventListener("click", (e) => {
    const a = e.target.dataset.a;
    if (a === "step") step();
    if (a === "all") { let guard = 0; while (!done && guard++ < 50) step(); }
    if (a === "reset") reset();
  });
  b.addEventListener("input", reset);
  s.addEventListener("change", reset);
  reset();
}

function operatorGuard(stage) {
  let join = "&&";
  stage.innerHTML =
    '<div class="pick"><button class="btn" data-j="&&" aria-pressed="true">&amp;&amp; (and)</button><button class="btn" data-j="||" aria-pressed="false">|| (or)</button></div>' +
    '<div class="control"><label for="og-op">Operator</label><input id="og-op" type="text" value="+" maxlength="3" autocomplete="off"></div>' +
    '<div class="btn-row"><button class="btn" data-k="+">+</button><button class="btn" data-k="-">-</button><button class="btn" data-k="*">*</button><button class="btn" data-k="/">/</button><button class="btn" data-k="%">%</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const inp = $("#og-op", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const OPS = ["+", "-", "*", "/"];
  function draw() {
    const op = inp.value;
    const parts = OPS.map((o) => op !== o);
    const result = join === "&&" ? parts.every(Boolean) : parts.some(Boolean);
    const valid = OPS.includes(op);
    term.innerHTML =
      'if (op != "+" ' + esc(join) + ' op != "-" ' + esc(join) + ' op != "*" ' + esc(join) + ' op != "/")\n\n' +
      OPS.map((o, n) => '"' + esc(op) + '" != "' + o + '"   <span class="' + (parts[n] ? "good" : "bad") + '">' + parts[n] + "</span>").join("\n") +
      "\n\n" + parts.join(" " + esc(join) + " ") + "  →  <strong>" + result + "</strong>\n" +
      (result ? '<span class="bad">Unknown operator. Try again.</span>' : '<span class="good">Accepted, ask for the second number</span>');
    const right = result !== valid;
    verdict.className = right ? "verdict good" : "verdict bad";
    verdict.classList.remove("shake");
    if (join === "&&") {
      verdict.textContent = valid
        ? "One side is false (op is equal to " + op + "), and && needs ALL true, so the guard lets it in."
        : '"' + op + '" is different from all four, so every side is true and the guard rejects it.';
    } else {
      verdict.textContent = valid
        ? "❌ " + op + " is a real operator, but it's different from the other three, so at least one side is true, and || needs only one. With ||, every key is rejected."
        : "Rejected, but only by luck: with || even + is rejected. Try +.";
      if (valid) { void verdict.offsetWidth; verdict.classList.add("shake"); }
    }
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.j) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      join = btn.dataset.j;
    }
    if (btn.dataset.k) inp.value = btn.dataset.k;
    draw();
  });
  inp.addEventListener("input", draw);
  draw();
}

function postmanLoop(stage) {
  const W = [2.5, 12, 0.8, 15.5, 7];
  let check = "parcelWeight", round, total, heavy, marks;
  stage.innerHTML =
    '<div class="control">The <code>if</code> checks:</div>' +
    '<div class="pick"><button class="btn" data-c="parcelWeight" aria-pressed="true">parcelWeight &gt; 10</button><button class="btn" data-c="total" aria-pressed="false">total &gt; 10 (the bug)</button></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next parcel</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="cookies"></div><div class="term"></div><div class="verdict"></div>';
  const shelf = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const r1 = (x) => Math.round(x * 10) / 10;
  function draw() {
    shelf.innerHTML = W.map((w, n) => {
      const style = n === round - 1 ? "color:var(--ok)" : n < round ? "" : "opacity:.45";
      return '<div style="' + style + '"><small>' + (n === round - 1 ? "🚶 here" : n < round ? (marks[n] ? "✔ heavy" : "done") : "waiting") + "</small><span>📦 " + w + "</span></div>";
    }).join("");
    let html = '<span class="dim">double total = 0;  int heavyCount = 0;</span>\n';
    if (round > 0) {
      const w = W[round - 1], val = check === "total" ? total : w;
      html += "parcelWeight = " + w + "\ntotal = total + parcelWeight → " + r1(total) + "\n" +
        "if (" + check + " > 10) → " + r1(val) + ' > 10 → <span class="' + (val > 10 ? "good" : "dim") + '">' + (val > 10) + "</span>\nheavyCount = " + heavy;
    }
    if (round === W.length) {
      html += '\n\n<span class="good">Total weight: ' + r1(total) + " kg\nHeavy parcels (over 10 kg): " + heavy + "</span>";
    }
    term.innerHTML = html;
  }
  function reset() {
    round = 0; total = 0; heavy = 0; marks = [];
    draw();
    verdict.className = "verdict"; verdict.textContent = "Predict first: how many parcels are over 10 kg?";
  }
  function step() {
    if (round >= W.length) return;
    const w = W[round];
    total += w;
    const isHeavy = (check === "total" ? total : w) > 10;
    marks[round] = isHeavy;
    if (isHeavy) heavy++;
    round++;
    draw();
    verdict.classList.remove("shake");
    if (check === "total" && isHeavy && w <= 10) {
      verdict.className = "verdict bad";
      verdict.textContent = "❌ " + w + " kg is not heavy, but the running total (" + r1(total) + ") is over 10, so it's counted anyway.";
      void verdict.offsetWidth; verdict.classList.add("shake");
    } else if (round === W.length) {
      verdict.className = heavy === 2 ? "verdict good" : "verdict bad";
      verdict.textContent = heavy === 2 ? "Both prints run once, after the loop: 37.8 kg and 2 heavy parcels." : "4 heavy parcels is wrong: only 12 and 15.5 are over 10. Check parcelWeight, not total.";
    } else {
      verdict.className = "verdict";
      verdict.textContent = "The postman adds " + w + " to the total" + (isHeavy ? " and makes a tally mark." : ".");
    }
  }
  stage.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.c) {
      stage.querySelectorAll(".pick .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
      check = btn.dataset.c; reset();
    }
    if (btn.dataset.a === "step") step();
    if (btn.dataset.a === "all") { while (round < W.length) step(); }
    if (btn.dataset.a === "reset") reset();
  });
  reset();
}

function callCounter(stage) {

    '<div class="control"><label for="cc-l">Lines in body</label><input id="cc-l" type="range" min="1" max="4" value="2"><output></output></div>' +

    '<div class="term"></div><div class="verdict"></div>';
  const c = $("#cc-c", stage), l = $("#cc-l", stage), code = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  function drawCode(call, line) {
    const calls = +c.value, lines = +l.value;
    let html = "";
    for (let i = 0; i < calls; i++) html += '<span class="' + (i === call ? "hit" : "") + '">PrintLabel("' + CITIES[i] + '");</span>\n';
    html += "\nvoid PrintLabel(string city)\n{\n";
    for (let j = 0; j < lines; j++) html += '<span class="' + (call >= 0 && j === line ? "hit" : "") + '">    ' + BODY[j] + "</span>\n";
    code.innerHTML = html + "}";
  }
  function setup() {
    clearInterval(timer);
    c.nextElementSibling.textContent = c.value; l.nextElementSibling.textContent = l.value;
    drawCode(-1, -1); term.textContent = "";
    verdict.className = "verdict"; verdict.textContent = "Predict first: how many lines will be printed?";
  }
  function run() {
    setup();

function calcPipeline(stage) {
  let timers = [];
  stage.innerHTML =
    '<div class="control"><label for="cp-a">First</label><input id="cp-a" type="text" value="10" autocomplete="off">' +
    '<label for="cp-o">Operator</label><input id="cp-o" type="text" value="/" autocomplete="off" style="width:4em">' +
    '<label for="cp-b">Second</label><input id="cp-b" type="text" value="0" autocomplete="off"></div>' +
    '<div class="chain">' +
    '<div class="door false" data-s="valid"><span>Calc.IsValidOperator(op)</span><span class="tag">waiting</span></div>' +
    '<div class="door false" data-s="zero"><span>if (op == "/" &amp;&amp; b == 0)</span><span class="tag">waiting</span></div>' +
    '<div class="door false" data-s="arm"><span>result = op switch { ... }</span><span class="tag">waiting</span></div>' +
    '<div class="door false" data-s="ret"><span>return ? · out double result</span><span class="tag">waiting</span></div></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="run">Calculate</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const slot = (k) => $('[data-s="' + k + '"]', stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const set = (k, text, on) => { slot(k).className = "door " + (on ? "open" : "false"); $(".tag", slot(k)).textContent = text; };
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    ["valid", "zero", "arm", "ret"].forEach((k) => set(k, "waiting", false));
    term.textContent = "";
    say("", "Pick the numbers and the operator. Predict the full line, then press Calculate.");
  }
  function run() {
    reset();
    const aText = $("#cp-a", stage).value.trim(), op = $("#cp-o", stage).value.trim(), bText = $("#cp-b", stage).value.trim();
    const num = /^-?\d+(\.\d+)?$/;
    if (!num.test(aText) || !num.test(bText)) {
      term.innerHTML = '<span class="bad">That\'s not a number. Try again.</span>';
      say("warn", "double.TryParse returned false, so the loop hit continue before any method was called.");
      return;
    }
    const a = +aText, b = +bText;
    const steps = [];
    const valid = ["+", "-", "*", "/"].includes(op);
    steps.push(() => set("valid", valid ? "true ✓" : "false ✗", valid));
    if (!valid) {
      steps.push(() => { term.innerHTML = '<span class="bad">Unknown operator. Try again.</span>'; say("warn", "IsValidOperator returned false, so !false is true: the guard runs and the loop continues."); });
    } else if (op === "/" && b === 0) {
      steps.push(() => set("zero", "true → stop here", true));
      steps.push(() => set("ret", "false · result = 0", false));
      steps.push(() => { term.innerHTML = '<span class="bad">Cannot divide by zero</span>'; say("good", "Try pattern failure: return false and give out its default value 0, like TryParse."); });
    } else {
      const r = op === "+" ? a + b : op === "-" ? a - b : op === "*" ? a * b : a / b;
      steps.push(() => set("zero", "false → carry on", false));
      steps.push(() => set("arm", op === "/" ? "_ => a / b" : '"' + op + '" => a ' + op + " b", true));
      steps.push(() => set("ret", "true · result = " + r, true));
      steps.push(() => { term.innerHTML = '<span class="good">' + esc(a) + " " + esc(op) + " " + esc(b) + " = " + r + "</span>"; say("good", "Try pattern success: return true and the answer comes back through out double result."); });
    }
    steps.forEach((f, i) => timers.push(setTimeout(f, 550 * (i + 1))));
  }
  stage.addEventListener("click", (e) => { if (e.target.closest('[data-a="run"]')) run(); });
  stage.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("input")) run(); });
  reset();
}

    '<div class="pick">' + inputs.map((x, i) => '<button class="btn" data-i="' + i + '" aria-pressed="' + (i === 0) + '">input = <code>' + esc(x) + "</code></button>").join("") + "</div>" +
    '<div class="codebox"></div>' +
    '<div class="btn-row"><button class="btn primary" data-a="step">Next step</button><button class="btn" data-a="all">Run all</button><button class="btn" data-a="reset">Reset</button></div>' +
    '<div class="term"></div><div class="verdict"></div>';
  const box = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function draw(hl) {
    box.innerHTML = "string input = " + esc(inputs[pick]) + ";\n" + lines.map(([k, t]) => '<span class="' + (k === hl ? "hit" : "") + '">' + esc(t) + "</span>").join("\n");
  }
  function reset() {
    pos = 0; out = [];
    draw(); term.innerHTML = '<span class="dim">(output appears here)</span>';
    say("", "Predict the output, then press Next step. Watch where the highlight jumps.");
  }
  function step() {
    const path = plans[pick];
    if (pos >= path.length) return;
    const [k, printed, why] = path[pos++];
    draw(k);
    if (printed) out.push(printed);
    term.textContent = out.join("\n") || "(nothing printed yet)";
    say(why.startsWith("💥") ? "warn" : "good", why);
  }
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.i) {
      pick = +b.dataset.i;
      stage.querySelectorAll("[data-i]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      reset();
    }
    if (b.dataset.a === "step") step();
    if (b.dataset.a === "all") while (pos < plans[pick].length) step();
    if (b.dataset.a === "reset") reset();
  });
  reset();
}

function calendarStamp(stage) {
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const sent = new Date(2026, 9, 24, 14, 30, 0);
  stage.innerHTML =
    '<div class="control"><label for="cs-n">AddDays</label><input id="cs-n" type="range" min="0" max="75" value="3"><output></output></div>' +
    '<div class="control"><label for="cs-f">format</label><input id="cs-f" type="text" value="dd MMM yyyy HH:mm" autocomplete="off"></div>' +
    '<div class="codebox"></div><div class="cookies"></div><div class="term"></div><div class="verdict"></div>';
  const n = $("#cs-n", stage), f = $("#cs-f", stage), box = $(".codebox", stage), cards = $(".cookies", stage), term = $(".term", stage), verdict = $(".verdict", stage);
  const pad = (x) => String(x).padStart(2, "0");
  const fmt = (d, s) => s.replace(/yyyy|MMM|MM|dd|HH|mm/g, (t) => ({
    yyyy: d.getFullYear(), MMM: mon[d.getMonth()], MM: pad(d.getMonth() + 1), dd: pad(d.getDate()), HH: pad(d.getHours()), mm: pad(d.getMinutes()),
  })[t]);
  function draw() {
    const k = +n.value, due = new Date(sent);
    due.setDate(due.getDate() + k);
    n.nextElementSibling.textContent = k;
    const fs = f.value;
    box.textContent = "DateTime sent = new DateTime(2026, 10, 24, 14, 30, 0);\nDateTime due = sent.AddDays(" + k + ");\n" +
      'Console.WriteLine(due.ToString("' + fs + '"));\nConsole.WriteLine(due.DayOfWeek);\nTimeSpan wait = due - sent;\nConsole.WriteLine(wait.Days);';
    cards.innerHTML = "<div><small>sent</small><span>📮 " + esc(fmt(sent, "dd MMM")) + "</span></div><div><small>due</small><span>📦 " + esc(fmt(due, "dd MMM yyyy")) + "</span></div><div><small>wait.Days</small><span>" + k + "</span></div>";
    term.textContent = fmt(due, fs) + "\n" + days[due.getDay()] + "\n" + k;
    const noMonth = !/MM/.test(fs) && /mm/.test(fs) && !/HH/.test(fs);
    verdict.className = "verdict " + (noMonth ? "warn" : "good");
    verdict.textContent = noMonth ? "Careful: small mm is MINUTES, not the month. Use MM for the month." :
      due.getFullYear() > 2026 ? "The year rolled over by itself: AddDays knows the calendar." :
      "sent never changes: AddDays returns a NEW date (immutable). wait.Days is just a number.";
  }
  n.addEventListener("input", draw);
  f.addEventListener("input", draw);
  draw();
}

function fourNotebooks(stage) {
  const names = ["Omar", "Sara", "Ali", "Mona", "Yousef"];
  let numbers = [], receivers = [], statuses = [], buggy = false;
  stage.innerHTML =
    '<div class="btn-row"><button class="btn primary" data-a="add">Add shipment</button><button class="btn" data-a="clear">Clear</button></div>' +
    '<div class="control"><label for="fn-s">Search</label><input id="fn-s" type="text" value="kp1001" autocomplete="off"><button class="btn" data-a="find">Find</button></div>' +
    '<div class="pick"><button class="btn" data-a="bug" aria-pressed="false">Use the buggy check: <code>index &lt;= 0</code></button></div>' +
    '<div class="codebox"></div><div class="term"></div><div class="verdict"></div>';
  const box = $(".codebox", stage), term = $(".term", stage), verdict = $(".verdict", stage), s = $("#fn-s", stage);
  const say = (kind, text) => { verdict.className = "verdict " + kind; verdict.textContent = text; };
  function draw(hit) {
    let h = "index | numbers | receivers | statuses\n";
    if (!numbers.length) h += "(the lists are empty)";
    numbers.forEach((x, i) => {
      h += '<span class="' + (i === hit ? "hit" : "") + '">  ' + i + "   | " + x + "  | " + esc(receivers[i].padEnd(9)) + " | " + statuses[i] + "</span>\n";
    });
    box.innerHTML = h;
  }
  function add() {
    if (numbers.length >= names.length) { say("warn", "That's enough for the demo. Press Clear to start again."); return; }
    const count = numbers.length, number = "KP" + (1001 + count);
    numbers.push(number); receivers.push(names[count]); statuses.push("In transit");
    draw(count);
    term.textContent = 'string number = $"KP{1001 + numbers.Count}";   // Count = ' + count + "\nAdded " + number;
    say("good", "One shipment = the SAME index in every list. Each list got exactly one Add.");
  }
  function find() {
    const wanted = s.value.trim().toUpperCase();
    const index = numbers.indexOf(wanted);
    const notFound = buggy ? index <= 0 : index === -1;
    term.textContent = 'int index = numbers.IndexOf("' + wanted + '");   // ' + index + "\nif (index " + (buggy ? "<= 0" : "== -1") + ")   // " + (notFound ? "True" : "False");
    if (!notFound) {
      draw(index);
      say("good", "Found at index " + index + ": the same row lights up in every list. (IndexOf is case-sensitive, so the input was cleaned with ToUpper.)");
    } else if (index === 0) {
      draw(-1);
      say("warn", "Off-by-one bug! " + wanted + " IS at index 0, but <= 0 calls it not found. Turn the buggy check off.");
    } else {
      draw(-1);
      say("", "IndexOf gave -1, the sentinel for not found. FindIndex would throw: Shipment " + wanted + " not found.");
    }
  }
  stage.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const a = b.dataset.a;
    if (a === "add") add();
    if (a === "find") find();
    if (a === "bug") { buggy = !buggy; b.setAttribute("aria-pressed", buggy); if (numbers.length) find(); }
    if (a === "clear") { numbers = []; receivers = []; statuses = []; draw(); term.textContent = ""; say("", "Add a few shipments, then search for one."); }
  });
  draw();
  say("", "Add a few shipments, then search. Try kp1001 with the buggy check on.");
}
